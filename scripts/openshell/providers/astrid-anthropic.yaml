# OpenShell provider profile: Anthropic for Astrid's agent inside an OpenShell sandbox.
# Adapted from OpenShell's providers/anthropic.yaml (Apache-2.0). The sandbox only ever
# sees a placeholder; OpenShell's proxy swaps in the real key for requests to
# api.anthropic.com from Astrid's Bun binary, and for nothing else.
# Import and use:  scripts/openshell/astrid-openshell.sh provider anthropic
id: astrid-anthropic
display_name: Anthropic (Astrid sandbox)
description: Anthropic API for Astrid's agent in an OpenShell sandbox
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic API key (use a throwaway key with a spend cap)
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /sandbox/.local/share/astrid/versions/*/tools/bun/*/bun
