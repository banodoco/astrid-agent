# OpenShell provider profile: OpenAI for Astrid's agent inside an OpenShell sandbox.
# Adapted from OpenShell's providers/openai.yaml (Apache-2.0). The sandbox only ever
# sees a placeholder; OpenShell's proxy swaps in the real key for requests to
# api.openai.com from Astrid's Bun binary, and for nothing else.
# Import and use:  scripts/openshell/astrid-openshell.sh provider openai
id: astrid-openai
display_name: OpenAI (Astrid sandbox)
description: OpenAI API for Astrid's agent in an OpenShell sandbox
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key (use a throwaway key with a spend cap)
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /sandbox/.local/share/astrid/versions/*/tools/bun/*/bun
