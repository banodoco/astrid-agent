name: R51 direct journey dispatch
on:
  push:
    branches: ["venue/M-QUAL-R51-DIRECT-1"]
permissions:
  contents: write
  actions: read
jobs:
  journey:
    uses: ./.github/workflows/journey.yml
    with:
      candidate: '{"app":"36ff224e3c9ad862e3f807e2548b997a36799543","agent":"020877f12ea490308a9e5f9564c8f4a4bf77ede1","runtime":"47e5949465cb6f3afdfd1cb8a0e90009fd9d4020","pinokio":"89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4","manifest_sha256":"b78ae7e74188f6e0bbf01950b0d388d4cf36ea990c9bb574fd8aef57a8782777","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"}}'
      old_launcher_ref: 'bbba620e3d89eeff8021417f365e6ea584203105'
      stopped_path_agent_ref: '020877f12ea490308a9e5f9564c8f4a4bf77ede1'
      direct_only: true
      m4_4a_backend_only: false
      m4_5_enabled: false
      m4_5_only: false
      m4_4b_enabled: false
      m4_6_enabled: false
  publish:
    if: always()
    needs: [journey]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Collect authenticated job logs and row artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
          RESULT_ROOT: ${{ runner.temp }}/r51-results/runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 .github/scripts/r51-direct-collect.py
      - name: Publish results branch
        env:
          RESULTS_DIR: ${{ runner.temp }}/r51-results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan r51-results
          git rm -r -q --ignore-unmatch .
          cp -a "$RESULTS_DIR/runs" ./runs
          git add runs
          git commit -m "Publish R51 direct journey run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:refs/heads/venue-results/M-QUAL-R51-DIRECT-1
