          A2_SIDE: ${{ inputs.side }}
          A2_RANGE: ${{ inputs.group_range }}
          A2_PRIOR_FAILURE: ${{ inputs.prior_failure }}
          A2_SLOT: '1'
          A2_SHA: ${{ github.sha }}
          A2_DRIVER_OUTCOME: ${{ steps.slot01.outcome }}
