name: R12 A2 bounded range (called workflow)
on:
  workflow_call:
    inputs:
      side:
        required: true
        type: string
      group_range:
        required: true
        type: string
      prior_failure:
        required: true
        type: string
    outputs:
      safe_to_continue:
        value: ${{ jobs.compare.outputs.safe_to_continue }}
      has_failure:
        value: ${{ jobs.compare.outputs.has_failure }}
permissions:
  contents: read
jobs:
  compare:
    if: github.event_name == 'push' && github.repository == 'banodoco/astrid-agent' && github.ref == 'refs/heads/scratch/r12-a2-full-019-052-20261111' && github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      safe_to_continue: ${{ steps.checkpoint.outputs.safe_to_continue }}
      has_failure: ${{ steps.checkpoint.outputs.has_failure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Execute bounded group slot 1
        id: slot01
        env:
          A2_SIDE: ${{ inputs.side }}
          A2_RANGE: ${{ inputs.group_range }}
          A2_SLOT: '1'
          A2_BEFORE: ${{ github.event.before }}
          A2_REF: ${{ github.ref }}
          A2_SHA: ${{ github.sha }}
          A2_ATTEMPT: ${{ github.run_attempt }}
        run: python tools/r12-a2-ci/full_driver.py
      - name: Persist group receipt 1
        if: always() && steps.slot01.outputs.receipt_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r12-a2-${{ steps.slot01.outputs.group }}-${{ inputs.side }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.slot01.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Execute bounded group slot 2
        id: slot02
        env:
          A2_SIDE: ${{ inputs.side }}
          A2_RANGE: ${{ inputs.group_range }}
          A2_SLOT: '2'
