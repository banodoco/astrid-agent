          A2_SIDE: ${{ inputs.side }}
          A2_RANGE: ${{ inputs.group_range }}
          A2_PRIOR_FAILURE: ${{ inputs.prior_failure }}
          A2_SLOT: '1'
          A2_BEFORE: ${{ github.event.before }}
          A2_REF: ${{ github.ref }}
          A2_SHA: ${{ github.sha }}
          A2_ATTEMPT: ${{ github.run_attempt }}
        run: |
          exec env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" A2_SIDE="$A2_SIDE" A2_RANGE="$A2_RANGE" A2_SLOT="$A2_SLOT" A2_PRIOR_FAILURE="$A2_PRIOR_FAILURE" A2_BEFORE="$A2_BEFORE" A2_REF="$A2_REF" A2_SHA="$A2_SHA" A2_ATTEMPT="$A2_ATTEMPT" PYTHONDONTWRITEBYTECODE=1 python tools/r12-a2-ci/full_driver.py
      - name: Seal sanitized receipt 1
        id: seal01
