      - name: Checkpoint completed range
        id: checkpoint
        env:
          PRIOR_FAILURE: ${{ inputs.prior_failure }}
        run: |
          case "$PRIOR_FAILURE" in true|false) ;; *) exit 1 ;; esac
          printf '%s\n' 'safe_to_continue=true' >> "$GITHUB_OUTPUT"
          if [ "$PRIOR_FAILURE" = 'true' ] || [ -f "$RUNNER_TEMP/r12-a2-full-had-failure" ]; then
