name: R12 A2 continuation range (called workflow)
on:
  workflow_call:
    inputs:
      side:
        required: true
        type: string
      group_range:
        required: true
        type: string
      prior_failure:
        required: true
        type: string
    outputs:
      safe_to_continue:
        value: ${{ jobs.compare.outputs.safe_to_continue }}
      has_failure:
        value: ${{ jobs.compare.outputs.has_failure }}
