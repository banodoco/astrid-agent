name: FIX-18 candidate unit and PID diagnostics
on:
  push:
    branches: [release/14/fix18-r13-differences]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: "-rA"
      ASTRID_RUNTIME_CHECKOUT: "${{ github.workspace }}/astrid-runtime"
      ASTRID_VIBECOMFY_CHECKOUT: "${{ github.workspace }}/vibecomfy-checkout"
      ASTRID_TEST_LIFECYCLE_CHECKOUT: "${{ github.workspace }}/runpod-lifecycle-checkout"
    steps:
      - name: Checkout exact FIX-18 candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact Runtime lock
        id: runtime
        run: echo "ref=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Runtime
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime.outputs.ref }}
          path: astrid-runtime
          persist-credentials: false
      - name: Resolve pinned lifecycle
        id: lifecycle
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("astrid/packs/runpod/pins.json"))["sources"]["lifecycle"]
          print("repository="+x["repository"].removeprefix("https://github.com/").removesuffix(".git"))
          print("ref="+x["revision"])
          PY
      - name: Checkout pinned lifecycle
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lifecycle.outputs.repository }}
          ref: ${{ steps.lifecycle.outputs.ref }}
          path: runpod-lifecycle-checkout
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install candidate dependencies and Runtime
        run: |
          python -m pip install -e '.[dev]'
          python scripts/ci_install_runtime.py
      - name: Resolve VibeComfy exact revision
        id: vibe
        run: echo "ref=$(python3 scripts/vibecomfy_pin.py)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned VibeComfy
        uses: actions/checkout@v4
        with:
          repository: peteromallet/VibeComfy
          ref: ${{ steps.vibe.outputs.ref }}
          path: vibecomfy-checkout
          persist-credentials: false
      - name: Install pinned VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout
      - name: Record exact identities
        run: |
          mkdir -p results
          {
            echo "Agent=$(git rev-parse HEAD)"
            echo "Runtime=$(git -C astrid-runtime rev-parse HEAD)"
            echo "VibeComfy=$(git -C vibecomfy-checkout rev-parse HEAD)"
            echo "Lifecycle=$(git -C runpod-lifecycle-checkout rev-parse HEAD)"
            python --version
            uname -a
          } | tee results/identity.txt
          test "$(git -C astrid-runtime rev-parse HEAD)" = "${{ steps.runtime.outputs.ref }}"
          test "$(git -C vibecomfy-checkout rev-parse HEAD)" = "${{ steps.vibe.outputs.ref }}"
      - name: Original middle-shot ID with corrected NEW-overrun setup; original controls
        id: length
        continue-on-error: true
        run: >-
          python -m pytest -vv -rA --tb=long
          tests/sdk/test_timeline_film_length.py::test_a_layer_longer_than_its_middle_shot_blocks_check
          tests/sdk/test_timeline_film_length.py::test_audio_past_the_end_is_not_flagged
          tests/sdk/test_timeline_film_length.py::test_extending_the_last_picture_lengthens_the_last_shot
          --junitxml=results/candidate-length.xml
      - name: Original external process PID/listener custody ID
        id: pid
        continue-on-error: true
        run: >-
          python -m pytest -vv -rA -s --tb=long
          tests/test_pinokio_platform_adapter.py::test_real_external_process_can_be_adopted_without_substitute_launch
          --junitxml=results/candidate-pid.xml
      - name: Independent observational PID/port/inode trace (no guard bypass)
        id: trace
        continue-on-error: true
        shell: bash
        run: |
          python -u - <<'PY' 2>&1 | tee results/listener-ownership-trace.txt
          import os,sys,hashlib,re,subprocess,time,traceback,tempfile
          from pathlib import Path
          from scripts import pinokio_platform_adapter as a
          from tests.test_pinokio_platform_adapter import _spec
          with tempfile.TemporaryDirectory() as tmp:
              spec=_spec(Path(tmp))
              spec["preexisting_session"]={"identity":"release-zero-identity","instance_id":"release-zero-instance"}
              env=dict(os.environ)
              env.update({"ASTRID_RUNTIME_IDENTITY":"release-zero-identity",
                          "ASTRID_RUNTIME_INSTANCE_ID":"release-zero-instance",
                          "ASTRID_CONTROLLER_TOKEN":"raw-token-never-given-to-adapter"})
              process=subprocess.Popen(spec["runtime_argv"],cwd=spec["runtime_cwd"],env=env,
                         stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                         shell=False,start_new_session=True)
              def snap(stage):
                  pid,port=process.pid,spec["port"]
                  sockets=set()
                  try:
                      for fd in Path(f"/proc/{pid}/fd").iterdir():
                          try:
                              name=os.readlink(fd)
                              m=re.fullmatch(r"socket:\[(\d+)\]",name)
                              if m: sockets.add(m[1])
                          except (FileNotFoundError,PermissionError): pass
                      listen=set()
                      for table in ("/proc/net/tcp","/proc/net/tcp6"):
                          listen.update(a._parse_linux_listening_inodes(Path(table).read_text(),port))
                      owner=a._listener_owned_by(pid,spec["host"],port,"linux")
                      print(stage,"pid",pid,"pgid",os.getpgid(pid),"process_alive",process.poll() is None,
                            "port",port,"socket_inodes",sorted(sockets),"listen_inodes",sorted(listen),
                            "intersection",sorted(sockets & listen),"authenticated_owner",owner,flush=True)
                  except BaseException as e: print(stage,"OBSERVATION ERROR",type(e).__name__,str(e),flush=True)
              try:
                  deadline=time.monotonic()+5
                  while time.monotonic()<deadline and a._port_free(spec["host"],spec["port"]):
                      time.sleep(.05)
                  snap("before-adoption")
                  adopted=a.adopt_process(spec,pid=process.pid,identity="release-zero-identity",
                      instance_id="release-zero-instance",
                      controller_token_digest=hashlib.sha256(b"raw-token-never-given-to-adapter").hexdigest())
                  print("adoption",adopted["result"],"pid_match",adopted["pid"]==process.pid,flush=True)
                  snap("after-adoption")
                  try:
                      observed,_=a.run_operation("processes",spec)
                      print("processes","running",observed.get("running"),
                            "instance_match",observed.get("runtime_instance_id")=="release-zero-instance",flush=True)
                  except BaseException:
                      traceback.print_exc()
                      snap("after-processes-refusal")
                      raise
                  a.run_operation("stop",spec)
                  process.wait(timeout=5)
              finally:
                  if process.poll() is None:
                      try: os.killpg(process.pid,a.signal.SIGKILL)
                      except ProcessLookupError: pass
                      process.wait(timeout=5)
          PY
      - name: Retain candidate proof and PID trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix18-candidate-unit-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 14
      - name: Show results as failure, not hidden in green
        if: always()
        run: |
          echo "length: ${{ steps.length.outcome }}"
          echo "PID: ${{ steps.pid.outcome }}"
          echo "trace: ${{ steps.trace.outcome }}"
          [[ "${{ steps.length.outcome }}" == "success" && "${{ steps.pid.outcome }}" == "success" && "${{ steps.trace.outcome }}" == "success" ]]
