name: M4-6 non-release synthetic attestation canary

on:
  workflow_dispatch:

# This workflow has no release inputs, credentials, artifacts, slots, mutation,
# or publication. Its sole publication is the Sigstore transparency/timestamp
# record produced by actions/attest for the deterministic synthetic subject.
permissions: {}

env:
  CANARY_ARTIFACT_NAME: m4-6-nonrelease-synthetic-canary
  CANARY_PREDICATE_TYPE: https://astrid.dev/attestations/m4-6/nonrelease-synthetic-canary/v1
  CANARY_MAX_ARTIFACT_BYTES: "67108864"

jobs:
  synthetic_canary:
    name: m4-6-nonrelease-synthetic-canary
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create deterministic synthetic subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .m4-6-canary
          printf '%s' 'astrid-m4-6-nonrelease-synthetic-canary-v1' > .m4-6-canary/subject.txt
          test "$(wc -c < .m4-6-canary/subject.txt)" -le "$CANARY_MAX_ARTIFACT_BYTES"
      - name: Upload immutable synthetic artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-6-nonrelease-synthetic-canary
          path: .m4-6-canary/subject.txt
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          include-hidden-files: false
      - name: Validate upload and prepare canary predicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          gh api --hostname github.com \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > .m4-6-canary/artifact-api.json
          gh api --hostname github.com \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > .m4-6-canary/run-api.json
          export ARTIFACT_ID ARTIFACT_DIGEST WORKFLOW_REF WORKFLOW_SHA
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".m4-6-canary")
          artifact = json.loads((root / "artifact-api.json").read_text(encoding="utf-8"))
          run = json.loads((root / "run-api.json").read_text(encoding="utf-8"))
          expected_id = int(os.environ["ARTIFACT_ID"])
          expected_digest = f"sha256:{os.environ['ARTIFACT_DIGEST']}"
          if artifact.get("id") != expected_id:
              raise SystemExit("immutable canary artifact ID mismatch")
          if artifact.get("name") != os.environ["CANARY_ARTIFACT_NAME"]:
              raise SystemExit("fixed canary artifact name mismatch")
          if artifact.get("digest") != expected_digest or artifact.get("expired") is not False:
              raise SystemExit("canary artifact digest/expiry mismatch")
          if artifact.get("size_in_bytes", 0) > int(os.environ["CANARY_MAX_ARTIFACT_BYTES"]):
              raise SystemExit("canary artifact exceeds fixed bound")
          if run.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("canary run API identity mismatch")
          predicate = {
              "version": 1,
              "kind": "nonrelease-synthetic-canary",
              "repository": {
                  "id": 1223136945,
                  "fullName": "banodoco/astrid-agent",
                  "ownerId": 134059142,
                  "ownerName": "banodoco",
              },
              "workflow": {
                  "id": run["workflow_id"],
                  "path": ".github/workflows/m4-6-attestation-canary.yml",
                  "ref": os.environ["WORKFLOW_REF"],
                  "sha": os.environ["WORKFLOW_SHA"],
              },
              "run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "headSha": os.environ["GITHUB_SHA"],
                  "sourceRef": os.environ["GITHUB_REF"],
                  "event": os.environ["GITHUB_EVENT_NAME"],
              },
              "artifact": {
                  "id": expected_id,
                  "name": os.environ["CANARY_ARTIFACT_NAME"],
                  "digest": expected_digest,
                  "sizeBytes": artifact["size_in_bytes"],
              },
          }
          path = root / "predicate.json"
          path.write_text(
              json.dumps(predicate, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Sign synthetic custom predicate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: m4-6-nonrelease-synthetic-canary
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
          predicate-type: https://astrid.dev/attestations/m4-6/nonrelease-synthetic-canary/v1
          predicate-path: .m4-6-canary/predicate.json
          show-summary: false
      - name: Cryptographically verify synthetic attestation and API binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python scripts/m4_6_github_attestation.py verify-canary \
            --predicate-type "$CANARY_PREDICATE_TYPE" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --event-name "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --artifact-id "$ARTIFACT_ID" \
            --download-root .m4-6-canary/verified-custody \
            --max-artifact-bytes "$CANARY_MAX_ARTIFACT_BYTES" \
            --github-output "$GITHUB_OUTPUT"
