name: M46 Linux protected principal experiment (unqualified)
on:
  workflow_dispatch:
  push:
    branches:
      - lane/M-QUAL/R-36-M46-CAPABILITY-DISCRIMINATOR-R1
permissions:
  contents: read
jobs:
  m46_boundary_probe_linux:
    name: m46-boundary-probe-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed probe only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: banodoco/astrid-agent
          ref: b694db2488f6457128cbf50914a169f971c209e2
          persist-credentials: false
      - name: Provision a disposable non-admin candidate
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          # An existing account must never be adopted or deleted by this probe.
          if getent passwd m46candidate || getent group m46candidate; then exit 20; fi
          if [ -e /home/m46candidate ] || [ -L /home/m46candidate ]; then exit 20; fi
          mkdir -m 700 "$RUNNER_TEMP/m46-boundary-probe"
          sudo useradd --create-home --home-dir /home/m46candidate --user-group --shell /usr/sbin/nologin m46candidate
          id -u m46candidate > "$RUNNER_TEMP/m46-boundary-probe/created-uid"
          # Only this fresh UID's manager receives the system-manager drop-in.
          uid="$(cat "$RUNNER_TEMP/m46-boundary-probe/created-uid")"
          dropin="/etc/systemd/system/user@${uid}.service.d"
          if [ -e "$dropin" ] || [ -L "$dropin" ]; then exit 21; fi
          if sudo systemctl is-active --quiet "user@${uid}.service"; then exit 22; fi
          sudo mkdir -m 755 "$dropin"
          printf '%s\n' "$dropin" > "$RUNNER_TEMP/m46-boundary-probe/created-dropin"
          printf '[Service]\nCapabilityBoundingSet=\n' | sudo tee "$dropin/90-m46-capabilities.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger m46candidate
          sudo systemctl start "user@$(id -u m46candidate).service"
      - name: Retain manager startup failure
        if: ${{ !cancelled() && steps.provision.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/m46-boundary-probe/created-uid"
          if [ ! -f "$marker" ]; then exit 0; fi
          sudo /usr/bin/python3 - "$marker" "$RUNNER_TEMP/m46-boundary-probe/manager-start-failure.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          uid = int(Path(sys.argv[1]).read_text().strip())
          unit = f'user@{uid}.service'
          result = dict(admitted=False, commands=[])
          for argv in (['systemctl', 'show', unit, '-p', 'ActiveState', '-p', 'SubState', '-p', 'Result', '-p', 'ExecMainStatus', '-p', 'MainPID', '-p', 'DropInPaths'],
                       ['systemctl', 'status', unit, '--no-pager', '--full', '-n', '20'],
                       ['journalctl', '-b', '--no-pager', '-n', '100', '-o', 'short-precise', f'_SYSTEMD_UNIT={unit}']):
              row = dict(argv=argv)
              result['commands'].append(row)
              try:
                  p = subprocess.run(argv, capture_output=True, text=True, timeout=10)
                  row.update(inner_exit=p.returncode, stdout=p.stdout[:32768], stderr=p.stderr[:32768],
                             stdout_truncated=len(p.stdout)>32768, stderr_truncated=len(p.stderr)>32768)
              except Exception as exc:
                  row['capture_error'] = f'{type(exc).__name__}: {exc}'
          Path(sys.argv[2]).write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Attempt export and uploader interference under the separate UID
        id: boundary_control
        shell: bash
        run: |
          set -euo pipefail
          # The real cached uploader is opened for write WITHOUT writing bytes.
          # No environment or credential values are inspected by the candidate.
          action_root="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/_actions"
          uploader="$action_root/actions/upload-artifact/ea165f8d65b6e75b540449e92b4886f43607fa02/dist/upload/index.js"
          test -f "$uploader"
          sudo /usr/bin/python3 - "$(id -u m46candidate)" "$(id -g m46candidate)" \
            "$uploader" "$GITHUB_WORKSPACE/scripts/m4_6_protected_boundary_probe.py" \
            "$RUNNER_TEMP/m46-boundary-probe/boundary.json" <<'PY'
          import json, sys, traceback
          from pathlib import Path
          from scripts import m4_6_protected_boundary_probe as probe
          output = Path(sys.argv[5])
          evidence = {'admitted': False, 'child_observations': []}
          original_run = probe.subprocess.run
          def record_run(*args, **kwargs):
              completed = original_run(*args, **kwargs)
              # Only the pinned probe's synthetic child output is captured.
              evidence['child_observations'].append(dict(
                  exit=completed.returncode, stdout=completed.stdout, stderr=completed.stderr))
              output.write_text(json.dumps(evidence, indent=2) + '\n')
              return completed
          probe.subprocess.run = record_run
          try:
              evidence['result'] = probe.run_probe(int(sys.argv[1]), int(sys.argv[2]),
                                                    [Path(sys.argv[3]), Path(sys.argv[4])])
          except Exception as exc:
              evidence['error'] = f'{type(exc).__name__}: {exc}'
              traceback.print_exc()
              raise
          finally:
              output.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Verify disposable user manager capability boundary
        id: manager_boundary
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 - "$RUNNER_TEMP/m46-boundary-probe/manager.json" <<'PY'
          import json, os, pwd, subprocess, sys
          from pathlib import Path
          account = pwd.getpwnam('m46candidate')
          unit = f'user@{account.pw_uid}.service'
          result = dict(admitted=False, native_product_observed=False, commands=[])
          try:
              argv = ['/usr/bin/systemctl', 'show', unit, '-p', 'MainPID', '-p', 'ActiveState', '-p', 'CapabilityBoundingSet', '-p', 'DropInPaths']
              p = subprocess.run(argv, capture_output=True, text=True, timeout=30)
              result['commands'].append(dict(argv=argv, inner_exit=p.returncode, stdout=p.stdout, stderr=p.stderr))
              if p.returncode: raise RuntimeError('manager show failed')
              fields = dict(line.split('=', 1) for line in p.stdout.splitlines() if '=' in line)
              pid = int(fields['MainPID'])
              expected_dropin = f'/etc/systemd/system/{unit}.d/90-m46-capabilities.conf'
              if pid <= 0 or fields['ActiveState'] != 'active' or expected_dropin not in fields['DropInPaths'].split():
                  raise RuntimeError('manager or configured drop-in not observed')
              status = dict(line.split(':', 1) for line in Path(f'/proc/{pid}/status').read_text().splitlines() if ':' in line)
              observed = {name: status[name].strip() for name in ('Uid', 'Gid', 'Groups', 'CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb')}
              result.update(manager_pid=pid, manager_fields=fields, manager_status=observed)
              if (set(map(int, status['Uid'].split())) != {account.pw_uid}
                  or set(map(int, status['Gid'].split())) != {account.pw_gid}
                  or not set(map(int, status['Groups'].split())) <= {account.pw_gid}
                  or any(int(status[name].strip(), 16) != 0 for name in ('CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb'))):
                  raise RuntimeError('manager identity or capability boundary differs')
              result['manager_boundary_verified'] = True
          except Exception as exc:
              result['error'] = f'{type(exc).__name__}: {exc}'
              raise
          finally:
              Path(sys.argv[1]).write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Observe a synthetic candidate-owned user service from the protected collector
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && steps.manager_boundary.outcome == 'success' && steps.boundary_control.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 - "$RUNNER_TEMP/m46-boundary-probe/lifecycle.json" <<'PY'
          import json, os, pwd, subprocess, sys, tempfile, time
          from pathlib import Path
          account = pwd.getpwnam('m46candidate')
          uid, gid = account.pw_uid, account.pw_gid
          rows = []
          def call(argv, allowed=(0,), **kwargs):
              p = subprocess.run(argv, capture_output=True, text=True, timeout=30, **kwargs)
              rows.append(dict(argv=argv, inner_exit=p.returncode, stdout=p.stdout, stderr=p.stderr))
              if p.returncode not in allowed:
                  raise RuntimeError('command failed: ' + repr(argv))
              return p.stdout
          result = dict(admitted=False, native_product_observed=False, candidate_uid=uid, commands=rows)
          try:
              script = '''set -eu
          mkdir -p "$HOME/.config/systemd/user"
          cat > "$HOME/.config/systemd/user/m46-boundary.service" <<'UNIT'
          [Unit]
          Description=M46 synthetic boundary experiment
          [Service]
          ExecStart=/usr/bin/sleep 300
          NoNewPrivileges=yes
          # Bounding set is inherited from the separately verified user manager.
          UNIT
          systemctl --user daemon-reload || { code=$?; printf 'daemon-reload inner_exit=%s\n' "$code"; exit "$code"; }
          printf 'daemon-reload inner_exit=0\n'
          systemctl --user start m46-boundary.service || { code=$?; printf 'start inner_exit=%s\n' "$code"; exit "$code"; }
          printf 'start inner_exit=0\n'
          '''
              call(['/usr/bin/setpriv', f'--reuid={uid}', f'--regid={gid}', '--clear-groups',
                    '--no-new-privs', '--inh-caps=-all', '--ambient-caps=-all', '--bounding-set=-all',
                    '/usr/bin/env', '-i', 'PATH=/usr/bin:/bin', 'HOME=' + account.pw_dir,
                    f'XDG_RUNTIME_DIR=/run/user/{uid}', f'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{uid}/bus',
                    '/bin/sh', '-eu', '-c', script])
              query = ['/usr/bin/systemctl', '--user', '--machine=m46candidate@.host']
              before = call(query + ['show', 'm46-boundary.service', '-p', 'MainPID', '-p', 'InvocationID', '-p', 'ActiveState', '-p', 'FragmentPath', '-p', 'CapabilityBoundingSet', '-p', 'NoNewPrivileges'])
              fields = dict(line.split('=', 1) for line in before.splitlines() if '=' in line)
              pid = int(fields['MainPID'])
              if (pid <= 0 or fields['ActiveState'] != 'active' or not fields['InvocationID']
                  or fields['FragmentPath'] != account.pw_dir + '/.config/systemd/user/m46-boundary.service'
                  or fields['NoNewPrivileges'] != 'yes'):
                  raise RuntimeError('candidate user-manager observation incomplete')
              status = dict(line.split(':', 1) for line in Path(f'/proc/{pid}/status').read_text().splitlines() if ':' in line)
              executable = str(Path(f'/proc/{pid}/exe').resolve(strict=True))
              result['service_status'] = {name: status[name].strip() for name in ('Uid', 'Gid', 'Groups', 'NoNewPrivs', 'CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb')}
              result['manager'] = fields
              if (set(map(int, status['Uid'].split())) != {uid}
                  or set(map(int, status['Gid'].split())) != {gid}
                  or not set(map(int, status['Groups'].split())) <= {gid}
                  or executable != '/usr/bin/sleep' or status['NoNewPrivs'].strip() != '1'
                  or any(int(status[name].strip(), 16) != 0 for name in ('CapInh', 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb'))):
                  raise RuntimeError('service token or executable differs')
              result.update(service_pid=pid, service_executable=executable, service_uid=uid,
                            service_birth_stat=Path(f'/proc/{pid}/stat').read_text(), manager=fields)
              call(query + ['stop', 'm46-boundary.service'])
              for _ in range(100):
                  if not Path(f'/proc/{pid}').exists(): break
                  time.sleep(.05)
              if Path(f'/proc/{pid}').exists():
                  raise RuntimeError('synthetic service remains')
              after = call(query + ['show', 'm46-boundary.service', '-p', 'MainPID', '-p', 'ActiveState'])
              result.update(after=after, synthetic_service_lifecycle=True)
          except Exception as exc:
              result['error'] = f'{type(exc).__name__}: {exc}'
              # Best effort and bounded: retain failure details before principal cleanup,
              # without replacing the original failure or changing the lifecycle checks.
              diagnostics = []
              result['failure_diagnostics'] = diagnostics
              query = ['/usr/bin/systemctl', '--user', '--machine=m46candidate@.host']
              for argv in (
                  query + ['show', 'm46-boundary.service', '-p', 'ActiveState', '-p', 'SubState',
                           '-p', 'Result', '-p', 'ExecMainCode', '-p', 'ExecMainStatus',
                           '-p', 'ExecStart', '-p', 'MainPID', '-p', 'InvocationID'],
                  query + ['status', 'm46-boundary.service', '--no-pager', '--full', '-n', '20'],
                  ['/usr/bin/journalctl', '-b', '--no-pager', '-n', '100', '-o', 'short-precise', f'_UID={uid}'],
              ):
                  row = dict(argv=argv)
                  diagnostics.append(row)
                  try:
                      with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                          p = subprocess.run(argv, stdout=out, stderr=err, timeout=10)
                          row['inner_exit'] = p.returncode
                          for key, stream in (('stdout', out), ('stderr', err)):
                              stream.seek(0)
                              data = stream.read(32769)
                              row[key] = data[:32768].decode('utf-8', errors='replace')
                              row[key + '_truncated'] = len(data) > 32768
                  except Exception as capture_exc:
                      row['capture_error'] = f'{type(capture_exc).__name__}: {capture_exc}'
              raise
          finally:
              Path(sys.argv[1]).write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Remove the exact disposable principal and all its processes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/m46-boundary-probe/created-uid"
          if [ ! -f "$marker" ]; then exit 0; fi
          expected_uid="$(cat "$marker")"
          test "$(id -u m46candidate)" = "$expected_uid"
          test "$(getent passwd m46candidate | cut -d: -f6)" = /home/m46candidate
          cleanup_failed=0
          sudo loginctl disable-linger m46candidate || cleanup_failed=1
          sudo systemctl stop "user@${expected_uid}.service" || cleanup_failed=1
          # pkill exit 1 means no remaining process. Every other failure is fatal.
          if sudo pkill -KILL -u "$expected_uid"; then :; else test "$?" = 1; fi
          test -z "$(ps -u "$expected_uid" -o pid=)"
          sudo userdel --remove m46candidate || cleanup_failed=1
          dropin_marker="$RUNNER_TEMP/m46-boundary-probe/created-dropin"
          if [ -f "$dropin_marker" ]; then
            expected_dropin="/etc/systemd/system/user@${expected_uid}.service.d"
            test "$(cat "$dropin_marker")" = "$expected_dropin"
            sudo rm -f "$expected_dropin/90-m46-capabilities.conf" || cleanup_failed=1
            sudo rmdir "$expected_dropin" || cleanup_failed=1
            sudo systemctl daemon-reload || cleanup_failed=1
          fi
          exit "$cleanup_failed"
      - name: Retain unqualified experiment outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m46-boundary-probe-${{ github.run_id }}-${{ github.run_attempt }}-linux
          path: ${{ runner.temp }}/m46-boundary-probe/*.json
          if-no-files-found: error
          overwrite: false
          retention-days: 7
