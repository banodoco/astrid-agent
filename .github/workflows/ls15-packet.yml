name: LS-15 resident VibeComfy proof

on:
  pull_request:
    branches: [release/14/plan-55]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ls15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resident:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'p55/ls-15'
    name: LS-15 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy
      ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/comfyui
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 91cb4cb499306b2f09686de0fb67b803bcb89077
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux media tools for unchanged integration cases
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Verify unchanged dependency pins and integrated ancestry
        id: pins
        run: |
          mkdir -p proof
          git -C head rev-parse HEAD 'HEAD^{tree}' > proof/head.txt
          git -C base rev-parse HEAD 'HEAD^{tree}' > proof/base.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          pairs = {}
          for name in ('base', 'head'):
              root = pathlib.Path(name)
              runtime = json.loads((root / 'runtime.lock.json').read_text())['source_commit']
              sources = json.loads((root / 'astrid/packs/runpod/pins.json').read_text())['sources']
              vibe = json.loads((root / 'astrid/packs/vibecomfy/pins.json').read_text())['sources']['vibecomfy']['revision']
              pairs[name] = runtime, vibe, sources['comfyui']['revision']
          assert pairs['base'] == pairs['head'], 'dependency identity differs; this pair is not comparable'
          for key, value in zip(('runtime', 'vibe', 'comfy'), pairs['head']):
              print(key + '=' + value)
          print('comfy_repository=' + sources['comfyui']['repository'].removeprefix('https://github.com/').removesuffix('.git'))
          PY
          git -C head fetch --no-tags origin 91cb4cb499306b2f09686de0fb67b803bcb89077
          git -C head merge-base --is-ancestor 91cb4cb499306b2f09686de0fb67b803bcb89077 HEAD
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.pins.outputs.runtime }}
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.pins.outputs.vibe }}
          path: vibecomfy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.comfy_repository }}
          ref: ${{ steps.pins.outputs.comfy }}
          path: comfyui
          persist-credentials: false
      - name: Install exact test inputs
        id: install
        run: |
          python -m pip install -e './head[dev]' uv
          python -m pip install --no-deps -e ./runtime -e ./runtime/packages/python
          python -m pip install -e ./vibecomfy
          mkdir -p proof
          git -C head rev-parse HEAD 'HEAD^{tree}' > proof/head.txt
          git -C base rev-parse HEAD 'HEAD^{tree}' > proof/base.txt
          git -C runtime rev-parse HEAD > proof/runtime.txt
          git -C vibecomfy rev-parse HEAD > proof/vibecomfy.txt
          python -VV > proof/python.txt
          python -m pip freeze > proof/environment.txt
          python - <<'PY'
          import os, pathlib, tempfile
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              print('ASTRID_RUNTIME_DATA_ROOT=' + tempfile.mkdtemp(prefix='astrid-ls15-'), file=output)
          PY
      - name: Unchanged base regressions including inherited failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: base
        env:
          PYTHONPATH: ${{ github.workspace }}/base
        run: |
          python -m pytest --import-mode=importlib -rA --junitxml=../proof/base.xml \
            tests/core/execution/test_managed_tool_session.py \
            tests/core/execution/test_warm_hold.py \
            tests/core/execution/test_resident_sessions.py \
            tests/core/execution/test_resident_session_lifetime.py \
            tests/core/execution/test_generic_host_actions_v3.py \
            tests/core/execution/test_network_policy_popen_class.py \
            tests/core/execution/test_private_network_command.py \
            tests/test_generic_host_child_output.py \
            tests/packs/test_canonical_pack_v3.py tests/packs/test_pack_discovery_v3.py \
            tests/core/pack/test_verified_relocations.py \
            tests/core/generation/backends/test_comfy_held_transport.py tests/core/generation/backends/test_comfy_held_rework.py \
            tests/core/generation/test_managed_preparation.py \
            tests/sdk/test_ls6_default_materialization.py tests/sdk/test_ls6_materialization_regressions.py \
            2>&1 | tee ../proof/base.log
      - name: Unchanged candidate regressions including inherited failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: head
        env:
          PYTHONPATH: ${{ github.workspace }}/head
        run: |
          python -m pytest --import-mode=importlib -rA --junitxml=../proof/head.xml \
            tests/core/execution/test_managed_tool_session.py \
            tests/core/execution/test_warm_hold.py \
            tests/core/execution/test_resident_sessions.py \
            tests/core/execution/test_resident_session_lifetime.py \
            tests/core/execution/test_generic_host_actions_v3.py \
            tests/core/execution/test_network_policy_popen_class.py \
            tests/core/execution/test_private_network_command.py \
            tests/test_generic_host_child_output.py \
            tests/packs/test_canonical_pack_v3.py tests/packs/test_pack_discovery_v3.py \
            tests/core/pack/test_verified_relocations.py \
            tests/core/generation/backends/test_comfy_held_transport.py tests/core/generation/backends/test_comfy_held_rework.py \
            tests/core/generation/test_managed_preparation.py \
            tests/sdk/test_ls6_default_materialization.py tests/sdk/test_ls6_materialization_regressions.py \
            2>&1 | tee ../proof/head.log
      - name: Unchanged attached-server integration on both sides
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ASTRID_CI_JOB: lanes-integration
        run: |
          outcome=0
          for source in base head; do
            (cd "$source"; PYTHONPATH="$PWD" python -m pytest --import-mode=importlib -m integration -rA \
              --junitxml=../proof/$source-vibe.xml \
              tests/packs/vibecomfy/test_local_server_run.py \
              tests/packs/vibecomfy/test_prepared_local_server.py \
              tests/packs/vibecomfy/test_ls5_rework_run.py \
              2>&1 | tee ../proof/$source-vibe.log) || outcome=1
          done
          exit "$outcome"
      - name: Candidate packet route, context and generation proofs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: head
        env:
          PYTHONPATH: ${{ github.workspace }}/head
        run: |
          python -m pytest --import-mode=importlib -rA --junitxml=../proof/packet-unit.xml \
            tests/core/execution/test_ls15_resident_route.py tests/core/execution/test_ls15_concurrency.py \
            tests/core/generation/test_ls15_retained_preparation.py 2>&1 | tee ../proof/packet-unit.log
      - name: Candidate actual host zero-work and concurrent isolation proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: head
        env:
          PYTHONPATH: ${{ github.workspace }}/head
          ASTRID_CI_JOB: lanes-integration
        run: |
          python -m pytest --import-mode=importlib -m integration -rA -o tmp_path_retention_policy=all --basetemp=../proof/packet-tmp \
            --junitxml=../proof/packet-host.xml tests/packs/vibecomfy/test_ls15_resident_host.py \
            2>&1 | tee ../proof/packet-host.log
      - name: Unchanged Linux managed preparation on both sides
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        env:
          ASTRID_CI_JOB: lanes-integration
        run: |
          outcome=0
          for source in base head; do
            (cd "$source"; PYTHONPATH="$PWD" python -m pytest --import-mode=importlib -m integration -rA \
              --junitxml=../proof/$source-managed.xml tests/integrations/test_managed_host_preparation.py \
              2>&1 | tee ../proof/$source-managed.log) || outcome=1
          done
          exit "$outcome"
      - name: Unchanged Linux installation-lock contention on both sides
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          outcome=0
          for source in base head; do
            (cd "$source"; PYTHONPATH="$PWD" python -m pytest --import-mode=importlib -rA \
              --junitxml=../proof/$source-contention.xml tests/core/generation/test_managed_preparation_contention.py \
              2>&1 | tee ../proof/$source-contention.log) || outcome=1
          done
          exit "$outcome"
      - name: Linux managed generation reuse and custody proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        working-directory: head
        env:
          PYTHONPATH: ${{ github.workspace }}/head
          ASTRID_CI_JOB: lanes-integration
        run: |
          python -m pytest --import-mode=importlib -m integration -rA -o tmp_path_retention_policy=all --basetemp=../proof/managed-tmp \
            --junitxml=../proof/packet-managed.xml tests/integrations/test_ls15_managed_resident.py \
            2>&1 | tee ../proof/packet-managed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls15-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            proof/*.txt
            proof/*.log
            proof/*.xml
            proof/packet-tmp/**/warm-counters.json
            proof/packet-tmp/**/child-counters.jsonl
            proof/packet-tmp/**/result.json
            proof/packet-tmp/**/manifest.json
            proof/managed-tmp/**/managed-warm-counters.json
            proof/managed-tmp/**/child-counters.jsonl
            proof/managed-tmp/**/result.json
            proof/managed-tmp/**/manifest.json
          if-no-files-found: error
          retention-days: 30
