# Candidate-only receipt producer. No deployment, publication, or complete qualification claim.
# The full nine-row journey gate remains unchanged; six Pinokio rows are not run here.
name: Release-1 direct lifecycle receipts
'on':
  workflow_dispatch: {}
  push:
    branches:
    - lane/M-QUAL/direct-journey
    - venue/**
permissions:
  contents: write
concurrency:
  group: journey-direct-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-receipts:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
        - job_id: direct-linux
          mode: direct
          leg: release0-to-release1
          runner: ubuntu-24.04
          shell: sh
          os: linux
        - job_id: direct-macos
          mode: direct
          leg: release0-to-release1
          runner: macos-14
          shell: sh
          os: macos
        - job_id: direct-windows
          mode: direct
          leg: release0-to-release1
          runner: windows-2022
          shell: powershell.exe
          os: windows
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Check out reviewed Agent receipt harness
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ github.workflow_sha }}
        path: agent
        persist-credentials: false
    - name: Check out frozen App candidate
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-app
        ref: a55bec9ff384b5bbfee5535962880084ab2adb1b
        path: app
        persist-credentials: false
    - name: Check out frozen Agent candidate
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: af5ae8afdb9829beb2bba4f811dbe97765bd72b2
        path: candidate-agent
        fetch-depth: 0
        persist-credentials: false
    - name: Check out frozen Runtime candidate
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: 47e5949465cb6f3afdfd1cb8a0e90009fd9d4020
        path: runtime
        persist-credentials: false
    - name: Check out frozen Pinokio candidate
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-pinokio
        ref: 89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4
        path: pinokio
        persist-credentials: false
    - name: Fetch authentic release-0 Agent object
      shell: bash
      run: |
        git -C candidate-agent fetch --no-tags --depth=1 origin 3204bb00135bec8ee2d2d3fb21eed5abfceca649
        git -C candidate-agent cat-file -e '3204bb00135bec8ee2d2d3fb21eed5abfceca649^{commit}'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Record effective immutable checkouts
      shell: bash
      run: |
        {
          echo "## Effective Release-1 journey tuple"
          echo "- Driver Agent: $(git -C agent rev-parse HEAD)"
          echo "- Candidate App: $(git -C app rev-parse HEAD)"
          echo "- Candidate Agent: $(git -C candidate-agent rev-parse HEAD)"
          echo "- Candidate Runtime: $(git -C runtime rev-parse HEAD)"
          echo "- Candidate Pinokio: $(git -C pinokio rev-parse HEAD)"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Freeze and validate candidate inputs
      shell: bash
      env:
        CANDIDATE: '{"app":"a55bec9ff384b5bbfee5535962880084ab2adb1b","agent":"af5ae8afdb9829beb2bba4f811dbe97765bd72b2","runtime":"47e5949465cb6f3afdfd1cb8a0e90009fd9d4020","pinokio":"89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4","manifest_sha256":"ced136903a7319e78a0be7db0cc1709c0663eaf7d567c040fe1812a916693874","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"}}'
      run: |
        printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
        python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --prepare-only
    - name: Run authentic direct release-0 to release-1 lifecycle
      id: lifecycle
      env:
        ASTRID_CI_EXPECTED_RUNNER: ${{ matrix.runner }}
      run: |
        $runRoot = Join-Path $env:RUNNER_TEMP "astrid-r1-${{ matrix.job_id }}"
        Start-Transcript -Path (Join-Path $env:RUNNER_TEMP "journey-${{ matrix.job_id }}.log")
        python -u agent/scripts/ci_journey.py `
          --job-id '${{ matrix.job_id }}' --mode direct --leg release0-to-release1 `
          --candidate "$env:RUNNER_TEMP/candidate.json" `
          --app-checkout "$pwd/app" --candidate-agent-checkout "$pwd/candidate-agent" `
          --candidate-runtime-checkout "$pwd/runtime" --pinokio-checkout "$pwd/pinokio" `
          --run-root $runRoot --root (Join-Path $runRoot program) --data-root (Join-Path $runRoot data) `
          --shell '${{ matrix.shell }}' --release0-fixture "$pwd/agent/tests/fixtures/release0" --allow-release0-to-release1
        $driverExit = $LASTEXITCODE
        Stop-Transcript
        "$driverExit" | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "journey-${{ matrix.job_id }}-exit.txt")
        if ($driverExit -ne 0) { exit $driverExit }
    - name: Bind driver identity and enforce compact evidence size
      if: always()
      id: evidence
      env:
        DRIVER_REF: ${{ github.ref }}
        DRIVER_SHA: ${{ github.workflow_sha }}
      run: |
        $upload = Join-Path $env:RUNNER_TEMP "astrid-r1-${{ matrix.job_id }}/evidence/evidence-upload"
        New-Item -ItemType Directory -Force $upload | Out-Null
        $actual = if (Test-Path agent/.git) { (git -C agent rev-parse HEAD) } else { $null }
        $identity = @{driver_ref=$env:DRIVER_REF; workflow_sha=$env:DRIVER_SHA; driver_checkout_sha=$actual; run_id=$env:GITHUB_RUN_ID; job_id='${{ matrix.job_id }}'}
        $identity | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $upload 'driver-identity.json')
        if (Test-Path (Join-Path $env:RUNNER_TEMP 'candidate.json')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'candidate.json') $upload }
        $requiredEvidence = @(
          (Join-Path $upload 'before-cleanup/journey-result.json'),
          (Join-Path $upload 'after-cleanup/journey-result.json')
        )
        $missingEvidence = @($requiredEvidence | Where-Object { -not (Test-Path -LiteralPath $_) })
        if ($missingEvidence.Count -gt 0) {
          throw "Named journey evidence is missing before/after cleanup: $($missingEvidence -join ', ')"
        }
        $bytes = (Get-ChildItem -LiteralPath $upload -Recurse -File | Measure-Object -Property Length -Sum).Sum
        "Evidence bytes before upload: $bytes" | Tee-Object -FilePath (Join-Path $upload 'artifact-size.txt')
        if ($bytes -ge 49000000) {
          "oversize=true" >> $env:GITHUB_OUTPUT
          Write-Error "Named evidence exceeds the conservative 49,000,000-byte limit; uploading receipts only."
          exit 1
        }
        "oversize=false" >> $env:GITHUB_OUTPUT
        if ($actual -ne $env:DRIVER_SHA) { throw "Driver checkout does not match workflow SHA" }
    - name: Retain the matrix receipt even after a lifecycle failure
      id: receipt
      if: always() && steps.evidence.outputs.oversize != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: journey-receipt-${{ matrix.job_id }}
        path: ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/evidence/evidence-upload/
        if-no-files-found: error
    - name: Retain receipt and size diagnostic if evidence is oversized
      id: oversize_receipt
      if: always() && steps.evidence.outputs.oversize == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: journey-receipt-${{ matrix.job_id }}-oversize
        path: |
          ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/evidence/evidence-upload/**/journey-result.json
          ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/evidence/evidence-upload/driver-identity.json
          ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/evidence/evidence-upload/artifact-size.txt
        if-no-files-found: error
    - name: Record git venue row metadata
      if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/venue/')
      env:
        SOURCE_REF: ${{ github.ref }}
        SOURCE_HEAD: ${{ github.sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        OVERSIZE: ${{ steps.evidence.outputs.oversize }}
        RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        RECEIPT_ID: ${{ steps.receipt.outputs.artifact-id }}
        RECEIPT_DIGEST: ${{ steps.receipt.outputs.artifact-digest }}
        OVERSIZE_OUTCOME: ${{ steps.oversize_receipt.outcome }}
        OVERSIZE_ID: ${{ steps.oversize_receipt.outputs.artifact-id }}
        OVERSIZE_DIGEST: ${{ steps.oversize_receipt.outputs.artifact-digest }}
        ROW_STATUS: ${{ job.status }}
      run: |
        $dest = Join-Path $env:RUNNER_TEMP "venue-row-${{ matrix.job_id }}"
        New-Item -ItemType Directory -Force $dest | Out-Null
        $exitPath = Join-Path $env:RUNNER_TEMP "journey-${{ matrix.job_id }}-exit.txt"
        $logPath = Join-Path $env:RUNNER_TEMP "journey-${{ matrix.job_id }}.log"
        if (Test-Path $logPath) { Copy-Item $logPath (Join-Path $dest 'lifecycle.log') }
        $exitCode = if (Test-Path $exitPath) { [int](Get-Content $exitPath -Raw).Trim() } else { $null }
        $effective = @{}
        foreach ($item in @(@('driver','agent'),@('app','app'),@('agent','candidate-agent'),@('runtime','runtime'),@('pinokio','pinokio'))) {
          $effective[$item[0]] = if (Test-Path (Join-Path $item[1] '.git')) { (git -C $item[1] rev-parse HEAD) } else { $null }
        }
        $row = @{ repository=$env:GITHUB_REPOSITORY; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT;
          source_ref=$env:SOURCE_REF; source_head=$env:SOURCE_HEAD; workflow_ref=$env:WORKFLOW_REF; workflow_sha=$env:WORKFLOW_SHA;
          job_id='${{ matrix.job_id }}'; actions_job=$env:GITHUB_JOB; runner='${{ matrix.runner }}'; mode='${{ matrix.mode }}'; leg='${{ matrix.leg }}'; shell='${{ matrix.shell }}';
          effective=$effective; inner_exit_code=$exitCode; lifecycle_outcome=$env:LIFECYCLE_OUTCOME; evidence_outcome=$env:EVIDENCE_OUTCOME;
          oversize=$env:OVERSIZE; receipt_outcome=$env:RECEIPT_OUTCOME; artifact_id=$env:RECEIPT_ID; artifact_digest=$env:RECEIPT_DIGEST;
          oversize_outcome=$env:OVERSIZE_OUTCOME; oversize_artifact_id=$env:OVERSIZE_ID; oversize_artifact_digest=$env:OVERSIZE_DIGEST; job_status_at_collection=$env:ROW_STATUS }
        $row | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 (Join-Path $dest 'row.json')
    - name: Retain git venue row metadata
      if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/venue/')
      uses: actions/upload-artifact@v4
      with:
        name: venue-row-${{ matrix.job_id }}
        path: ${{ runner.temp }}/venue-row-${{ matrix.job_id }}/
        if-no-files-found: error
  publish-venue:
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/venue/')
    needs: direct-receipts
    runs-on: ubuntu-24.04
    steps:
    - name: Download available row evidence
      id: download
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/venue-evidence/artifacts
    - name: Check out source for authenticated result publication
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: venue-publish
        persist-credentials: true
    - name: Publish collected rows through git
      env:
        SOURCE_REF: ${{ github.ref }}
        SOURCE_HEAD: ${{ github.sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        MATRIX_RESULT: ${{ needs.direct-receipts.result }}
        DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        case "$SOURCE_REF" in refs/heads/venue/*) result_ref="refs/heads/venue-results/${SOURCE_REF#refs/heads/venue/}" ;; *) exit 1 ;; esac
        git check-ref-format "$result_ref"
        export EVIDENCE_DIR="$RUNNER_TEMP/venue-evidence"
        mkdir -p "$EVIDENCE_DIR"
        python3 - <<'PYCODE'
        import hashlib, json, os, pathlib
        root = pathlib.Path(os.environ['EVIDENCE_DIR'])
        rows = {}
        for name in ('direct-linux', 'direct-macos', 'direct-windows'):
            path = root / 'artifacts' / ('venue-row-' + name) / 'row.json'
            rows[name] = json.loads(path.read_text(encoding='utf-8-sig')) if path.exists() else None
        receipt = {'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'source_ref': os.environ['SOURCE_REF'],
                   'source_head': os.environ['SOURCE_HEAD'], 'workflow_ref': os.environ['WORKFLOW_REF'],
                   'workflow_sha': os.environ['WORKFLOW_SHA'], 'matrix_result': os.environ['MATRIX_RESULT'],
                   'download_outcome': os.environ['DOWNLOAD_OUTCOME'], 'rows': rows}
        (root / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
        files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'SHA256SUMS')
        (root / 'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files))
        PYCODE
        cd venue-publish
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        set +e
        git ls-remote --exit-code --heads origin "$result_ref" > /dev/null
        remote_status=$?
        set -e
        if [ "$remote_status" -eq 0 ]; then
          git fetch --no-tags origin "$result_ref:refs/remotes/origin/venue-result"
          git switch --detach refs/remotes/origin/venue-result
        elif [ "$remote_status" -eq 2 ]; then
          git switch --orphan venue-result
        else
          exit "$remote_status"
        fi
        run_dir="runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test ! -e "$run_dir"
        mkdir -p "$run_dir"
        cp -a "$EVIDENCE_DIR/." "$run_dir/"
        git add -f "$run_dir"
        git commit -m "Venue result $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
        git push origin "HEAD:$result_ref"
