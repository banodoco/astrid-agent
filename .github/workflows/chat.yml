name: Chat service

on:
  push:
    branches: [main, release-1, "int/**"]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Chat service / Select affected paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      typescript: ${{ steps.paths.outputs.typescript }}
      appui: ${{ steps.paths.outputs.appui }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            // An absent output means run everything. Never trust a partial file list.
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number});
            const count = pr.data.changed_files;
            if (!Number.isInteger(count) || count < 1 || count >= 3000) return;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number, per_page: 100});
            if (files.length !== count || files.some(f =>
              !['added', 'modified'].includes(f.status) || typeof f.filename !== 'string')) return;
            const paths = files.map(f => f.filename);
            core.setOutput('docs', String(paths.every(p =>
              p === 'README.md' || /^docs\/.*\.md$/i.test(p))));
            core.setOutput('typescript', String(paths.every(p => p.startsWith('packages/typescript/'))));
            core.setOutput('appui', String(paths.every(p =>
              p.startsWith('src/features/') || p.startsWith('src/pages/'))));
  windows-launchers:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: npm ci --ignore-scripts
      - name: Exercise native Windows chat child launches
        run: bun test ./astrid/chat/discoveryProbe.test.ts ./astrid/chat/astridAcpLauncher.windows.test.ts ./astrid/chat/acpProcessHost.test.ts
      - name: Allow slow Windows model discovery through HTTP
        run: bun test ./astrid/chat/astrid-agent-models.test.ts -t "model discovery allows sequential OMP startup"
      - name: Parse the operator diagnostic with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/diagnostics/windows_acp_*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Parse the operator diagnostic with PowerShell Core
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/diagnostics/windows_acp_*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
  chat:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: npm ci --ignore-scripts
      - run: bun run check:chat-bundle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun run test:chat
      - run: bun run astrid/chat/astrid-local-agent-adapters-smoke.ts

  pr-gate:
    name: Chat service / PR aggregate
    if: ${{ always() }}
    needs: [changes, windows-launchers, chat]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes'].get('outputs', {})
          is_pr = os.environ['EVENT'] == 'pull_request'
          classes = {'windows-launchers': '', 'chat': ''}
          for job, special in classes.items():
              skipped = is_pr and (outputs.get('docs') == 'true' or
                                    (special and outputs.get(special) == 'true'))
              expected = 'skipped' if skipped else 'success'
              result = needs[job]['result']
              if result != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {result}")
          PYCODE
