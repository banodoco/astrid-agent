name: Chat service

on:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main, release-1, "int/**", "release/*/main", "release/*/plan-*"]
  pull_request:
    branches: ["release/*/main", "release/*/plan-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

jobs:
  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Plan39 evidence collector
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/int/') && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}
          bun-version: "1.3.14"
      - name: Plan39 recorded command 02
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-02 --matrix ${{ strategy.job-index || 0 }} --shell pwsh {0}
        run: npm ci --ignore-scripts
      - name: Exercise native Windows chat child launches
        if: ${{ !cancelled() }}
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-03 --matrix ${{ strategy.job-index || 0 }} --shell pwsh {0}
        run: bun test --reporter=junit --reporter-outfile="$env:CEILING_STEP_DIR/bun-results.xml" ./astrid/chat/discoveryProbe.test.ts ./astrid/chat/astridAcpLauncher.windows.test.ts ./astrid/chat/acpProcessHost.test.ts
      - name: Allow slow Windows model discovery through HTTP
        if: ${{ !cancelled() }}
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-04 --matrix ${{ strategy.job-index || 0 }} --shell pwsh {0}
        run: bun test --reporter=junit --reporter-outfile="$env:CEILING_STEP_DIR/bun-results.xml" ./astrid/chat/astrid-agent-models.test.ts -t "model discovery allows sequential OMP startup"
      - name: Parse the operator diagnostic with Windows PowerShell
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-05 --matrix ${{ strategy.job-index || 0 }} --shell powershell {0}
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/diagnostics/windows_acp_*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Parse the operator diagnostic with PowerShell Core
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-06 --matrix ${{ strategy.job-index || 0 }} --shell pwsh {0}
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in Get-ChildItem scripts/diagnostics/windows_acp_*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error

  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Plan39 evidence collector
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/int/') && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}
          bun-version: "1.4.2"
      - name: Plan39 recorded command 03
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-03 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: npm ci --ignore-scripts
      - name: Plan39 recorded command 04
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-04 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: bun run check:chat-bundle
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/int/') && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}
          bun-version: "1.3.14"
      - name: Plan39 recorded command 06
        if: ${{ !cancelled() }}
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-06 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: bun run test:chat --reporter=junit --reporter-outfile="$CEILING_STEP_DIR/bun-results.xml"
      - name: Plan39 recorded command 07
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-07 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: bun run astrid/chat/astrid-local-agent-adapters-smoke.ts
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error
