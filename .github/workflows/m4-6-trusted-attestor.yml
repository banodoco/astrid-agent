name: M4-6 trusted artifact attestor (disabled)

on:
  workflow_dispatch:

# This workflow is a reviewed, versioned upload/attestor wrapper. Every job is
# intentionally unreachable until a later integration review changes source.
# There is no dispatch input, environment value, or repository setting that can
# enable a hosted release slot in this revision.
permissions: {}

env:
  M4_6_MAX_ARTIFACT_BYTES: "67108864"
  M4_6_PREDICATE_TYPE: https://astrid.dev/attestations/m4-6/trusted-artifact-set/v1
  # These deliberately invalid sentinels prevent this disconnected revision
  # from treating its own runtime github.workflow_sha/ref as review policy. A
  # later integration must supply independently reviewed exact caller/signer
  # identities and full SHAs from outside the run being verified.
  M4_6_REVIEWED_CALLER_WORKFLOW_REF: UNCONFIGURED_INDEPENDENT_REVIEW_REQUIRED
  M4_6_REVIEWED_CALLER_WORKFLOW_SHA: UNCONFIGURED_INDEPENDENT_REVIEW_REQUIRED
  M4_6_REVIEWED_SIGNER_WORKFLOW_REF: UNCONFIGURED_INDEPENDENT_REVIEW_REQUIRED
  M4_6_REVIEWED_SIGNER_WORKFLOW_SHA: UNCONFIGURED_INDEPENDENT_REVIEW_REQUIRED
  M4_6_REVIEWED_SOURCE_REF: UNCONFIGURED_INDEPENDENT_REVIEW_REQUIRED
  M4_6_REVIEWED_SOURCE_EVENT: workflow_dispatch

jobs:
  produce_direct_macos:
    name: m4-6-producer-direct-macos
    if: ${{ false }}
    runs-on: macos-14
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.contract.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      slot_id: ${{ steps.contract.outputs.slot_id }}
      run_attempt: ${{ steps.contract.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Enforce fixed direct-macos upload contract
        id: contract
        shell: bash
        env:
          INPUT_PATH: .m4-6/trusted-input/direct-macos
          SLOT_ID: direct-macos
          ARTIFACT_NAME: m4-6-direct-macos
        run: |
          set -euo pipefail
          python - "$INPUT_PATH" "$M4_6_MAX_ARTIFACT_BYTES" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          limit = int(sys.argv[2])
          if not root.is_dir():
              raise SystemExit(f"missing fixed upload directory: {root}")
          files = [path for path in root.rglob("*") if path.is_file()]
          if not files:
              raise SystemExit(f"empty fixed upload directory: {root}")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit(f"symlinks are forbidden in fixed upload directory: {root}")
          size = sum(path.stat().st_size for path in files)
          if size > limit:
              raise SystemExit(f"fixed upload exceeds {limit} bytes: {size}")
          PY
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "slot_id=$SLOT_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload fixed direct-macos artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m4-6-direct-macos
          path: .m4-6/trusted-input/direct-macos
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          include-hidden-files: false
      - name: Reject missing immutable upload outputs
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

