        git -C "$ASTRID_RUNTIME_CHECKOUT" archive --format=tar "$historical_media_http_runtime" >/dev/null
        {
          echo "## Effective Runtime sources"
          echo "- Runtime checkout: $ASTRID_RUNTIME_CHECKOUT"
          echo "- Runtime lock source: $RUNTIME_LOCK_SHA (checkout HEAD: $locked_runtime)"
          echo "- Runtime historical source: $HISTORICAL_RUNTIME_SHA (resolved: $historical_runtime; object: $historical_type)"
          echo "- Busy-upgrade historical Runtime tree: $historical_busy_runtime (commit, tree and archive available)"
          echo "- R12 historical Agent tree: $historical_r12_agent (commit, tree and archive available)"
          echo "- Media-manifest historical Agent tree: $historical_manifest_agent (commit, tree and archive available)"
          echo "- Media-manifest historical Runtime tree: $historical_manifest_runtime (commit, tree and archive available)"
          echo "- Authenticated media HTTP historical Runtime tree: $historical_media_http_runtime (commit, tree and archive available)"
