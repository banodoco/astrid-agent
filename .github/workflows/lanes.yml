name: D18 paired original shard diagnostic
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  integration:
    name: Sequential control and integrated original group 1
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - name: Prepare diagnostic sidecar outside product trees
      run: |-
        set -euo pipefail
        . /etc/os-release
        test "$ID" = ubuntu && test "$VERSION_ID" = 26.04
        mkdir -p "$RUNNER_TEMP/d18-tools" "$RUNNER_TEMP/d18-proof"
        printf %s  | base64 -d > "$RUNNER_TEMP/d18-tools/d18_observer.py"
        printf %s  | base64 -d > "$RUNNER_TEMP/d18-tools/verify_arm.py"
        printf %s  | base64 -d > "$RUNNER_TEMP/d18-tools/frozen.json"
        cp "$RUNNER_TEMP"/d18-tools/* "$RUNNER_TEMP/d18-proof/"
      shell: bash
    - name: Prepare control scratch
      run: mkdir -p "$RUNNER_TEMP/control-user"/{home,cache,config,data,state} "$RUNNER_TEMP/d18-proof/control/results" "$RUNNER_TEMP/control-temp" "$RUNNER_TEMP/control-tmp"
      shell: bash
    - name: control / Check out repository
      uses: actions/checkout@v4
      with:
        path: control
        persist-credentials: false
        ref: c6e7ba9152b1beda575ae3b07f914338a62d075f
    - name: control / Resolve launcher ref
      id: control-launcher-ref
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-01 --shell bash "{0}"
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
        INPUT_LAUNCHER_REF: d15c58b5cd1f7e24c1e699340b33961027f7c573
      run: |
        ref="${INPUT_LAUNCHER_REF:-main}"
        if [[ -n "$INPUT_LAUNCHER_REF" && ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "launcher_ref must be a full 40-character commit SHA (or empty for main)" >&2
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
      working-directory: control
    - name: control / Read the pinned Runtime commit
      id: control-runtime-pin
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-02 --shell bash "{0}"
      run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Check out the Runtime (astrid-runtime)
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ steps.control-runtime-pin.outputs.commit }}
        path: control/astrid-runtime
        persist-credentials: false
    - name: control / Check out Pinokio (astrid-pinokio)
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-pinokio
        ref: ${{ steps.control-launcher-ref.outputs.ref }}
        path: control/astrid-pinokio
        persist-credentials: false
    - name: control / Fetch historical Agent archive objects
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-05 --shell bash "{0}"
      run: git fetch --no-tags --depth=1 origin a53ef0c257e4b0bbc2a65959b9119e2cb4cff453 0e1543e0da2215db9cb3320cfd1083174c3c62a9 ba21beffd177e7d80a5b839bde5a9e25b97235c2
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Fetch historical Runtime archive objects
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell bash "{0}"
      run: git -C astrid-runtime fetch --no-tags --depth=1 origin 11443b0b5b34bd5b36725504fb083146192a759d 959ce04fcf91351903c361d03e6b19eb0bbe8587 efcb3264e854fc312faa0bc6e702a9034edc2e06 d9e2a71e87c827290a3ff58a94f6fb8b4bc11e0b 1e6d899efa77a2d6ec247c38250f9748330bb587 becfe6db88b2cc034dba3fafa6c050117cdf2b06 6634a17f3ffd885567ba3c91b6c7a560df7375a4 f103bb46866999c961a8865636f2e66d544e0c9b 9ef808711a5207f5be74dc5f267af6fdd7bc9550 6d53a19070faf63fc15ae1f81417722edc2c8a5f b2a1d9fd82121a5509769531a2e91aece97d78b9 b92d3e7a05eec65c142294ef4873edd059e9b31d
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Verify Runtime sources before tests
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-07 --shell bash "{0}"
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
        RUNTIME_LOCK_SHA: ${{ steps.control-runtime-pin.outputs.commit }}
        HISTORICAL_RUNTIME_SHA: efcb3264e854fc312faa0bc6e702a9034edc2e06
      run: |
        set -euo pipefail
        locked_runtime="$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD)"
        test "$locked_runtime" = "$RUNTIME_LOCK_SHA"
        historical_runtime="$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${HISTORICAL_RUNTIME_SHA}^{commit}")"
        test "$historical_runtime" = "$HISTORICAL_RUNTIME_SHA"
        historical_type="$(git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -t "$HISTORICAL_RUNTIME_SHA")"
        test "$historical_type" = commit
        # Both source trees are used by real Lanes tests via git archive.
        # A shallow checkout does not otherwise guarantee their availability.
        historical_busy_runtime=6d53a19070faf63fc15ae1f81417722edc2c8a5f
        historical_r12_agent=0e1543e0da2215db9cb3320cfd1083174c3c62a9
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${historical_busy_runtime}^{commit}")" = "$historical_busy_runtime"
        test "$(git rev-parse "${historical_r12_agent}^{commit}")" = "$historical_r12_agent"
        git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -e "${historical_busy_runtime}^{tree}"
        git cat-file -e "${historical_r12_agent}^{tree}"
        git -C "$ASTRID_RUNTIME_CHECKOUT" archive --format=tar "$historical_busy_runtime" >/dev/null
        git archive --format=tar "$historical_r12_agent" >/dev/null
        # The retained media-manifest realm needs its matching H31 sources.
        historical_manifest_agent=ba21beffd177e7d80a5b839bde5a9e25b97235c2
        historical_manifest_runtime=b2a1d9fd82121a5509769531a2e91aece97d78b9
        test "$(git rev-parse "${historical_manifest_agent}^{commit}")" = "$historical_manifest_agent"
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${historical_manifest_runtime}^{commit}")" = "$historical_manifest_runtime"
        test "$(git cat-file -t "$historical_manifest_agent")" = commit
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -t "$historical_manifest_runtime")" = commit
        git cat-file -e "${historical_manifest_agent}^{tree}"
        git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -e "${historical_manifest_runtime}^{tree}"
        git archive --format=tar "$historical_manifest_agent" >/dev/null
        git -C "$ASTRID_RUNTIME_CHECKOUT" archive --format=tar "$historical_manifest_runtime" >/dev/null
        # The authenticated media HTTP cases retain this historical Runtime.
        historical_media_http_runtime=b92d3e7a05eec65c142294ef4873edd059e9b31d
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${historical_media_http_runtime}^{commit}")" = "$historical_media_http_runtime"
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -t "$historical_media_http_runtime")" = commit
        git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -e "${historical_media_http_runtime}^{tree}"
        git -C "$ASTRID_RUNTIME_CHECKOUT" archive --format=tar "$historical_media_http_runtime" >/dev/null
        {
          echo "## Effective Runtime sources"
          echo "- Runtime checkout: $ASTRID_RUNTIME_CHECKOUT"
          echo "- Runtime lock source: $RUNTIME_LOCK_SHA (checkout HEAD: $locked_runtime)"
          echo "- Runtime historical source: $HISTORICAL_RUNTIME_SHA (resolved: $historical_runtime; object: $historical_type)"
          echo "- Busy-upgrade historical Runtime tree: $historical_busy_runtime (commit, tree and archive available)"
          echo "- R12 historical Agent tree: $historical_r12_agent (commit, tree and archive available)"
          echo "- Media-manifest historical Agent tree: $historical_manifest_agent (commit, tree and archive available)"
          echo "- Media-manifest historical Runtime tree: $historical_manifest_runtime (commit, tree and archive available)"
          echo "- Authenticated media HTTP historical Runtime tree: $historical_media_http_runtime (commit, tree and archive available)"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: control
    - name: control / Record checked-out refs
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-08 --shell bash "{0}"
      run: |
        {
          echo "## Effective checked-out refs"
          echo "- Agent: $(git rev-parse HEAD)"
          echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
          echo "- Pinokio: $(git -C astrid-pinokio rev-parse HEAD)"
        } >> "$GITHUB_STEP_SUMMARY"
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11.18
      id: control-python
    - name: Isolate control Python environment
      run: |-
        set -euo pipefail
        "${{ steps.control-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/control-venv"
        echo "$RUNNER_TEMP/control-venv/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: control / Set up pinned uv
      uses: astral-sh/setup-uv@v6
      with:
        version: 0.11.32
        enable-cache: false
    - name: control / Set up Node.js 22 (HyperFrames CLI)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: control / Set up Node.js from .node-version
      uses: actions/setup-node@v4
      with:
        node-version-file: control/.node-version
    - name: control / Install system media tools and a system font
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-14 --shell bash "{0}"
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu-core
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Install package with dev extras
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-15 --shell bash "{0}"
      run: python -m pip install -e '.[dev]'
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Install the Runtime and client from the checkout
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-16 --shell bash "{0}"
      run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Read the pinned VibeComfy revision
      id: control-vibecomfy-pin
      shell: python -I -c "import os,runpy,sys; os.environ['GITHUB_WORKSPACE']=os.path.join(os.environ['GITHUB_WORKSPACE'],'control'); os.environ['RUNNER_TEMP']=os.path.join(os.environ['RUNNER_TEMP'],'control-temp'); sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-17 --shell bash "{0}"
      run: |
        rev="$(python3 scripts/vibecomfy_pin.py)"
        if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
          echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
          exit 1
        fi
        echo "revision=$rev" >> "$GITHUB_OUTPUT"
      working-directory: control
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
        ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/control/astrid-runtime
        ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/control/vibecomfy-checkout
        ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/control/runpod-lifecycle-checkout
        ASTRID_TEST_COMFY_SOURCE: ${{ github.workspace }}/control/comfyui-checkout
        ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/control/astrid-pinokio
        HOME: ${{ runner.temp }}/control-user/home
        XDG_CACHE_HOME: ${{ runner.temp }}/control-user/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/control-user/config
        XDG_DATA_HOME: ${{ runner.temp }}/control-user/data
        XDG_STATE_HOME: ${{ runner.temp }}/control-user/state
    - name: control / Check out VibeComfy at the pinned engine revision
      uses: actions/checkout@v4
      with:
        repository: banodoco/VibeComfy
        ref: ${{ steps.control-vibecomfy-pin.outputs.revision }}
        path: control/vibecomfy-checkout
        persist-credentials: false
    - name: control / Record VibeComfy checkout
      env:
        ASTRID_CI_JOB: lanes-integration
        ASTRID_CI_MATRIX: '0'
