# The heavy lanes the per-push run (ci.yml) deselects: integration (real Runtime daemons, subprocesses, the network)
# and opt_in. Nightly, on request, and on pushes to main/release-1, so regressions are seen promptly.
# Lanes with no job (workstation, omp, gpu, app_checkout: a GPU, the owner's workstation files or another repo's checkout) are listed by name in every run (tests/lanes.py).
name: Lanes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      launcher_ref:
        description: Optional full 40-character astrid-pinokio commit SHA; defaults to main
        required: false
        type: string
  push:
    branches: [main, release-1]

jobs:
  integration:
    name: integration shard ${{ matrix.group }} / 4
    runs-on: ubuntu-latest
    env:
      # tests/lanes.py: a lane this job provides fails, not skips, when its dependency is missing.
      ASTRID_CI_JOB: lanes-integration
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/astrid-pinokio
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve launcher ref
        id: launcher-ref
        shell: bash
        env:
          INPUT_LAUNCHER_REF: ${{ inputs.launcher_ref }}
        run: |
          ref="${INPUT_LAUNCHER_REF:-main}"
          if [[ -n "$INPUT_LAUNCHER_REF" && ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "launcher_ref must be a full 40-character commit SHA (or empty for main)" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      # The Runtime sibling the integration tests start daemons from (tests/helpers/runtime.py), at the pinned commit.
      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      # The canonical Pinokio checkout the Pinokio integration tests read (ASTRID_PINOKIO_CHECKOUT).
      - name: Check out Pinokio (astrid-pinokio)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ steps.launcher-ref.outputs.ref }}
          path: astrid-pinokio

      - name: Fetch historical Agent archive object
        run: git fetch --no-tags --depth=1 origin a53ef0c257e4b0bbc2a65959b9119e2cb4cff453

      - name: Fetch historical Runtime archive objects
        run: >-
          git -C astrid-runtime fetch --no-tags --depth=1 origin
          11443b0b5b34bd5b36725504fb083146192a759d
          959ce04fcf91351903c361d03e6b19eb0bbe8587
          efcb3264e854fc312faa0bc6e702a9034edc2e06

      - name: Verify Runtime sources before tests
        shell: bash
        env:
          RUNTIME_LOCK_SHA: ${{ steps.runtime-pin.outputs.commit }}
          HISTORICAL_RUNTIME_SHA: efcb3264e854fc312faa0bc6e702a9034edc2e06
        run: |
          set -euo pipefail
          locked_runtime="$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD)"
          test "$locked_runtime" = "$RUNTIME_LOCK_SHA"
          historical_runtime="$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${HISTORICAL_RUNTIME_SHA}^{commit}")"
          test "$historical_runtime" = "$HISTORICAL_RUNTIME_SHA"
          historical_type="$(git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -t "$HISTORICAL_RUNTIME_SHA")"
          test "$historical_type" = commit
          {
            echo "## Effective Runtime sources"
            echo "- Runtime checkout: $ASTRID_RUNTIME_CHECKOUT"
            echo "- Runtime lock source: $RUNTIME_LOCK_SHA (checkout HEAD: $locked_runtime)"
            echo "- Runtime historical source: $HISTORICAL_RUNTIME_SHA (resolved: $historical_runtime; object: $historical_type)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record checked-out refs
        shell: bash
        run: |
          {
            echo "## Effective checked-out refs"
            echo "- Agent: $(git rev-parse HEAD)"
            echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
            echo "- Pinokio: $(git -C astrid-pinokio rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.lock

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The HyperFrames CLI needs Node 22 (tests/fixtures/renderer_packs/hyperframes/render.py finds it in the tool cache);
      # the step after this one puts the product's pinned Node first on PATH again.
      - name: Set up Node.js 22 (HyperFrames CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      # The tests put the Runtime checkout on sys.path (tests/helpers/runtime.py), so the Runtime and its client are
      # installed from that same checkout, not from the archive scripts/ci_install_runtime.py installs.
      - name: Install the Runtime and client from the checkout
        run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: rev=$(python3 scripts/vibecomfy_pin.py) && echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: peteromallet/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        run: |
          echo "- VibeComfy: $(git -C vibecomfy-checkout rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Install the Remotion dependencies
        run: |
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
          npm ci --prefix remotion

      - name: Provision the Remotion browser
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Integration tests (shard)
        run: python -m pytest -q -m "integration and not opt_in and not app_checkout" --splits 4 --group ${{ matrix.group }}

  opt-in:
    name: opt-in
    runs-on: ubuntu-latest
    env:
      ASTRID_CI_JOB: lanes-opt-in
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Record checked-out refs
        shell: bash
        run: |
          {
            echo "## Effective checked-out refs"
            echo "- Agent: $(git rev-parse HEAD)"
            echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.lock

      # The HyperFrames CLI needs Node 22 (tests/fixtures/renderer_packs/hyperframes/render.py finds it in the tool cache);
      # the step after this one puts the product's pinned Node first on PATH again.
      - name: Set up Node.js 22 (HyperFrames CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      # The tests put the Runtime checkout on sys.path (tests/helpers/runtime.py), so the Runtime and its client are
      # installed from that same checkout, not from the archive scripts/ci_install_runtime.py installs.
      - name: Install the Runtime and client from the checkout
        run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: rev=$(python3 scripts/vibecomfy_pin.py) && echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: peteromallet/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        run: |
          echo "- VibeComfy: $(git -C vibecomfy-checkout rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Install the Remotion dependencies
        run: |
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
          npm ci --prefix remotion

      - name: Provision the Remotion browser
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Opt-in tests
        run: python -m pytest -q -m opt_in

  # The tests that need Astrid installed as a wheel (not editable, not the checkout): the wheel the release job builds,
  # installed into its own venv, with the Runtime and the Remotion project provisioned. pytest runs from that venv with
  # --import-mode=importlib so the checkout is not put on sys.path ahead of site-packages.
  installed:
    name: installed wheel
    runs-on: ubuntu-latest
    env:
      ASTRID_CI_JOB: lanes-installed
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_HOST_EXECUTION_PROFILE: installed
      ASTRID_REMOTION_PROJECT_DIR: ${{ github.workspace }}/remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Record checked-out refs
        shell: bash
        run: |
          {
            echo "## Effective checked-out refs"
            echo "- Agent: $(git rev-parse HEAD)"
            echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build exactly one wheel
        run: |
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock
          python -m build --wheel --no-isolation --outdir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1

      # Not editable: astrid, the Runtime and its client are copied into the venv's site-packages.
      - name: Install the wheel and the Runtime into a venv
        run: |
          python -m venv "$RUNNER_TEMP/installed-venv"
          "$RUNNER_TEMP/installed-venv/bin/python" -m pip install "$(ls dist/*.whl)[dev]"
          "$RUNNER_TEMP/installed-venv/bin/python" -m pip install --no-deps ./astrid-runtime ./astrid-runtime/packages/python

      - name: Install the Remotion dependencies
        run: npm ci --prefix remotion

      - name: Installed tests
        run: >-
          "$RUNNER_TEMP/installed-venv/bin/pytest" -q -m installed --import-mode=importlib
          tests/packs/h3_av/test_character_swap_cpu_boundary.py
