        git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -e "${historical_busy_runtime}^{tree}"
        git cat-file -e "${historical_r12_agent}^{tree}"
        git -C "$ASTRID_RUNTIME_CHECKOUT" archive --format=tar "$historical_busy_runtime" >/dev/null
        git archive --format=tar "$historical_r12_agent" >/dev/null
        # The retained media-manifest realm needs its matching H31 sources.
        historical_manifest_agent=ba21beffd177e7d80a5b839bde5a9e25b97235c2
        historical_manifest_runtime=b2a1d9fd82121a5509769531a2e91aece97d78b9
        test "$(git rev-parse "${historical_manifest_agent}^{commit}")" = "$historical_manifest_agent"
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${historical_manifest_runtime}^{commit}")" = "$historical_manifest_runtime"
        test "$(git cat-file -t "$historical_manifest_agent")" = commit
        test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -t "$historical_manifest_runtime")" = commit
        git cat-file -e "${historical_manifest_agent}^{tree}"
        git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -e "${historical_manifest_runtime}^{tree}"
        git archive --format=tar "$historical_manifest_agent" >/dev/null
        git -C "$ASTRID_RUNTIME_CHECKOUT" archive --format=tar "$historical_manifest_runtime" >/dev/null
        # The authenticated media HTTP cases retain this historical Runtime.
        historical_media_http_runtime=b92d3e7a05eec65c142294ef4873edd059e9b31d
