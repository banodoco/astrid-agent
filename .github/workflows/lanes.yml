# The heavy lanes the per-push run (ci.yml) deselects: integration (real Runtime daemons, subprocesses, the network)
# and opt_in. Nightly, on request, and on pushes to main/release-1, so regressions are seen promptly.
# Lanes with no job (workstation, omp, gpu, app_checkout: a GPU, the owner's workstation files or another repo's checkout) are listed by name in every run (tests/lanes.py).
name: Lanes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      launcher_ref:
        description: Optional full 40-character astrid-pinokio commit SHA; defaults to main
        required: false
        type: string
  push:
    branches: [main, release-1, "int/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration shard ${{ matrix.group }} / 4
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # tests/lanes.py: a lane this job provides fails, not skips, when its dependency is missing.
      ASTRID_CI_JOB: lanes-integration
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/runpod-lifecycle-checkout
      ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/astrid-pinokio
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve launcher ref
        id: launcher-ref
        shell: bash
        env:
          INPUT_LAUNCHER_REF: ${{ inputs.launcher_ref }}
        run: |
          ref="${INPUT_LAUNCHER_REF:-main}"
          if [[ -n "$INPUT_LAUNCHER_REF" && ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "launcher_ref must be a full 40-character commit SHA (or empty for main)" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      # The Runtime sibling the integration tests start daemons from (tests/helpers/runtime.py), at the pinned commit.
      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      # The canonical Pinokio checkout the Pinokio integration tests read (ASTRID_PINOKIO_CHECKOUT).
      - name: Check out Pinokio (astrid-pinokio)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ steps.launcher-ref.outputs.ref }}
          path: astrid-pinokio

      - name: Fetch historical Agent archive object
        run: git fetch --no-tags --depth=1 origin a53ef0c257e4b0bbc2a65959b9119e2cb4cff453

      - name: Fetch historical Runtime archive objects
        run: >-
          git -C astrid-runtime fetch --no-tags --depth=1 origin
          11443b0b5b34bd5b36725504fb083146192a759d
          959ce04fcf91351903c361d03e6b19eb0bbe8587
          efcb3264e854fc312faa0bc6e702a9034edc2e06
          d9e2a71e87c827290a3ff58a94f6fb8b4bc11e0b
          1e6d899efa77a2d6ec247c38250f9748330bb587
          becfe6db88b2cc034dba3fafa6c050117cdf2b06
          6634a17f3ffd885567ba3c91b6c7a560df7375a4
          f103bb46866999c961a8865636f2e66d544e0c9b
          9ef808711a5207f5be74dc5f267af6fdd7bc9550

      - name: Verify Runtime sources before tests
        shell: bash
        env:
          RUNTIME_LOCK_SHA: ${{ steps.runtime-pin.outputs.commit }}
          HISTORICAL_RUNTIME_SHA: efcb3264e854fc312faa0bc6e702a9034edc2e06
        run: |
          set -euo pipefail
          locked_runtime="$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD)"
          test "$locked_runtime" = "$RUNTIME_LOCK_SHA"
          historical_runtime="$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse "${HISTORICAL_RUNTIME_SHA}^{commit}")"
          test "$historical_runtime" = "$HISTORICAL_RUNTIME_SHA"
          historical_type="$(git -C "$ASTRID_RUNTIME_CHECKOUT" cat-file -t "$HISTORICAL_RUNTIME_SHA")"
          test "$historical_type" = commit
          {
            echo "## Effective Runtime sources"
            echo "- Runtime checkout: $ASTRID_RUNTIME_CHECKOUT"
            echo "- Runtime lock source: $RUNTIME_LOCK_SHA (checkout HEAD: $locked_runtime)"
            echo "- Runtime historical source: $HISTORICAL_RUNTIME_SHA (resolved: $historical_runtime; object: $historical_type)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record checked-out refs
        shell: bash
        run: |
          {
            echo "## Effective checked-out refs"
            echo "- Agent: $(git rev-parse HEAD)"
            echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
            echo "- Pinokio: $(git -C astrid-pinokio rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pip cache (C-08)
        id: c08-agent-lanes-2
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The HyperFrames CLI needs Node 22 (tests/fixtures/renderer_packs/hyperframes/render.py finds it in the tool cache);
      # the step after this one puts the product's pinned Node first on PATH again.
      - name: Set up Node.js 22 (HyperFrames CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      # The tests put the Runtime checkout on sys.path (tests/helpers/runtime.py), so the Runtime and its client are
      # installed from that same checkout, not from the archive scripts/ci_install_runtime.py installs.
      - name: Install the Runtime and client from the checkout
        run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: peteromallet/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        run: |
          echo "- VibeComfy: $(git -C vibecomfy-checkout rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Install the Remotion dependencies
        run: |
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
          npm ci --prefix remotion

      - name: Provision the Remotion browser
        run: npx remotion browser ensure
        working-directory: remotion

      # The RunPod CPU-path integration tests' tuple_sources fixture reads the pinned
      # runpod-lifecycle checkout (ASTRID_TEST_LIFECYCLE_CHECKOUT), as the unit shards do in ci.yml.
      - name: Read the pinned RunPod lifecycle revision
        id: lifecycle-pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path("astrid/packs/runpod/pins.json").read_text())["sources"]["lifecycle"]
          print(f"repository={source['repository'].removeprefix('https://github.com/').removesuffix('.git')}")
          print(f"revision={source['revision']}")
          PY

      - name: Check out the pinned RunPod lifecycle (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lifecycle-pin.outputs.repository }}
          ref: ${{ steps.lifecycle-pin.outputs.revision }}
          path: runpod-lifecycle-checkout

      - name: Record RunPod lifecycle checkout
        shell: bash
        env:
          LIFECYCLE_REVISION: ${{ steps.lifecycle-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_TEST_LIFECYCLE_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$LIFECYCLE_REVISION"
          echo "- RunPod lifecycle: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Integration tests (shard)
        run: python -m pytest -v -rA --durations=40 -m "integration and not opt_in and not app_checkout" --splits 4 --group ${{ matrix.group }}

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-lanes-2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  opt-in:
    name: opt-in
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ASTRID_CI_JOB: lanes-opt-in
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Record checked-out refs
        shell: bash
        run: |
          {
            echo "## Effective checked-out refs"
            echo "- Agent: $(git rev-parse HEAD)"
            echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pip cache (C-08)
        id: c08-agent-lanes-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The HyperFrames CLI needs Node 22 (tests/fixtures/renderer_packs/hyperframes/render.py finds it in the tool cache);
      # the step after this one puts the product's pinned Node first on PATH again.
      - name: Set up Node.js 22 (HyperFrames CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      # The tests put the Runtime checkout on sys.path (tests/helpers/runtime.py), so the Runtime and its client are
      # installed from that same checkout, not from the archive scripts/ci_install_runtime.py installs.
      - name: Install the Runtime and client from the checkout
        run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: peteromallet/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        run: |
          echo "- VibeComfy: $(git -C vibecomfy-checkout rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Install the Remotion dependencies
        run: |
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
          npm ci --prefix remotion

      - name: Provision the Remotion browser
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Opt-in tests
        run: python -m pytest -q -rA -m opt_in

  # The tests that need Astrid installed as a wheel (not editable, not the checkout): the wheel the release job builds,
  # installed into its own venv, with the Runtime and the Remotion project provisioned. pytest runs from that venv with
  # --import-mode=importlib so the checkout is not put on sys.path ahead of site-packages.
      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-lanes-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  installed:
    name: installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASTRID_CI_JOB: lanes-installed
      ASTRID_APP_IDENTITY: 933c53a6fb1a11e5f8a01335d6252016d703beec
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_HOST_EXECUTION_PROFILE: installed
      ASTRID_REMOTION_PROJECT_DIR: ${{ github.workspace }}/remotion
      ASTRID_INSTALLED_RECEIPT_DIR: ${{ github.workspace }}/installed-wheel-receipt
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Prepare installed-wheel receipt
        id: receipt_init
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASTRID_INSTALLED_RECEIPT_DIR"
          : > "$ASTRID_INSTALLED_RECEIPT_DIR/inner-exits.txt"

      - name: Read the pinned Runtime commit
        id: runtime_pin
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/runtime-pin.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/runtime_pin.exit"; exit "$rc"' EXIT
          echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (astrid-runtime)
        id: runtime_checkout
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime_pin.outputs.commit }}
          path: astrid-runtime

      - name: Record checked-out refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/refs.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/refs.exit"; exit "$rc"' EXIT
          {
            echo "## Effective checked-out refs"
            echo "- Agent: $(git rev-parse HEAD)"
            echo "- Runtime: $(git -C astrid-runtime rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js from .node-version
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools
        id: media
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/media.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/media.exit"; exit "$rc"' EXIT
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build exactly one wheel
        id: wheel
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/wheel.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/wheel.exit"; exit "$rc"' EXIT
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock
          python -m build --wheel --no-isolation --outdir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1

      # Not editable: astrid, the Runtime and its client are copied into the venv's site-packages.
      - name: Install the wheel and the Runtime into a venv
        id: install
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/install.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/install.exit"; exit "$rc"' EXIT
          python -m venv "$RUNNER_TEMP/installed-venv"
          "$RUNNER_TEMP/installed-venv/bin/python" -m pip install "$(ls dist/*.whl)[dev]"
          "$RUNNER_TEMP/installed-venv/bin/python" -m pip install --no-deps ./astrid-runtime ./astrid-runtime/packages/python

      - name: Install the Remotion dependencies
        id: npm
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/npm.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/npm.exit"; exit "$rc"' EXIT
          npm ci --prefix remotion

      # The installed selector verifies the wheel-owned registry carrier and
      # its host-owned state.  Produce that state through the installed
      # interpreter, just as an installed renderer does; the Composition
      # package is a built artifact and supplies no TypeScript source tree.
      - name: Generate the installed Remotion registry
        id: registry
        run: |
          set -euo pipefail
          exec > >(tee -a "$ASTRID_INSTALLED_RECEIPT_DIR/registry.log") 2>&1
          trap 'rc=$?; printf "%s\n" "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/registry.exit"; exit "$rc"' EXIT
          "$RUNNER_TEMP/installed-venv/bin/python" -I - <<'PY'
          import os
          from pathlib import Path

          from astrid.packs.rendering.rendering.renderers.remotion import run

          project = Path(os.environ["ASTRID_REMOTION_PROJECT_DIR"])
          run._regenerate_element_registries(project, None)
          state = run._read_registry_state(project)
          if state != run.gen_effect_registry.compute_generated_registry_state():
              raise SystemExit("installed Remotion registry state does not match its generator")
          if not run._registry_outputs_match_state(project, state):
              raise SystemExit("installed Remotion registry outputs do not match their state")
          PY

      - name: Installed tests
        id: selector
        run: >-
          set -o pipefail; set +e;
          "$RUNNER_TEMP/installed-venv/bin/pytest" -q -m installed --import-mode=importlib
          --junitxml="$ASTRID_INSTALLED_RECEIPT_DIR/selector.junit.xml"
          tests/packs/h3_av/test_character_swap_cpu_boundary.py 2>&1 |
          tee "$ASTRID_INSTALLED_RECEIPT_DIR/selector.log";
          rc=${PIPESTATUS[0]}; printf '%s\n' "$rc" > "$ASTRID_INSTALLED_RECEIPT_DIR/selector.exit"; exit "$rc"

      - name: Collect installed-wheel receipt
        id: receipt
        if: ${{ always() }}
        shell: bash
        env:
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_RECEIPT_INIT: ${{ steps.receipt_init.outcome }}
          OUTCOME_RUNTIME_PIN: ${{ steps.runtime_pin.outcome }}
          OUTCOME_RUNTIME_CHECKOUT: ${{ steps.runtime_checkout.outcome }}
          OUTCOME_REFS: ${{ steps.refs.outcome }}
          OUTCOME_PYTHON: ${{ steps.python.outcome }}
          OUTCOME_NODE: ${{ steps.node.outcome }}
          OUTCOME_MEDIA: ${{ steps.media.outcome }}
          OUTCOME_WHEEL: ${{ steps.wheel.outcome }}
          OUTCOME_INSTALL: ${{ steps.install.outcome }}
          OUTCOME_NPM: ${{ steps.npm.outcome }}
          OUTCOME_REGISTRY: ${{ steps.registry.outcome }}
          OUTCOME_SELECTOR: ${{ steps.selector.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$ASTRID_INSTALLED_RECEIPT_DIR"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path.cwd()
          receipt_dir = Path(os.environ["ASTRID_INSTALLED_RECEIPT_DIR"])
          receipt_dir.mkdir(parents=True, exist_ok=True)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def command_output(*args, cwd=root):
              try:
                  return subprocess.run(args, cwd=cwd, check=True, capture_output=True, text=True).stdout.strip()
              except (OSError, subprocess.CalledProcessError):
                  return "unavailable"

          def read_int(path, fallback):
              try:
                  return int(path.read_text(encoding="utf-8").strip())
              except (OSError, ValueError):
                  return fallback

          def outcome_exit(outcome):
              return 0 if outcome == "success" else 1

          outcomes = {
              name.removeprefix("OUTCOME_").lower(): value
              for name, value in os.environ.items()
              if name.startswith("OUTCOME_")
          }
          step_names = (
              "checkout", "receipt_init", "runtime_pin", "runtime_checkout", "refs", "python", "node",
              "media", "wheel", "install", "npm", "registry", "selector",
          )
          inner_exits = {
              name: read_int(receipt_dir / f"{name}.exit", outcome_exit(outcomes.get(name, "unknown")))
              for name in step_names
          }
          (receipt_dir / "inner-exits.txt").write_text(
              "".join(f"{name}={value}\n" for name, value in inner_exits.items()), encoding="utf-8"
          )

          runtime_lock = root / "runtime.lock.json"
          runtime_input = "unavailable"
          if runtime_lock.is_file():
              try:
                  runtime_input = json.loads(runtime_lock.read_text(encoding="utf-8"))["source_commit"]
              except (KeyError, json.JSONDecodeError):
                  pass

          composition_package = root / "remotion" / "package.json"
          composition_lock = root / "remotion" / "package-lock.json"
          composition = "unavailable"
          composition_version = "unavailable"
          composition_artifact = None
          composition_sidecar = None
          try:
              package = json.loads(composition_package.read_text(encoding="utf-8"))
              dependency = package["dependencies"]["@banodoco/timeline-composition"]
              composition_artifact = root / "remotion" / dependency.removeprefix("file:")
              composition_sidecar = Path(f"{composition_artifact}.sha256")
              composition_version = dependency.rsplit("-", 1)[-1].removesuffix(".tgz")
              composition = dependency
          except (KeyError, OSError, json.JSONDecodeError):
              pass

          junit = receipt_dir / "selector.junit.xml"
          junit_counts = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          if junit.is_file():
              try:
                  suite = ET.parse(junit).getroot()
                  if suite.tag == "testsuites":
                      for key in junit_counts:
                          junit_counts[key] = int(float(suite.attrib.get(key, "0")))
                      if not any(suite.attrib.get(key) for key in junit_counts):
                          for child in suite.iter("testsuite"):
                              for key in junit_counts:
                                  junit_counts[key] += int(float(child.attrib.get(key, "0")))
                  else:
                      for key in junit_counts:
                          junit_counts[key] = int(float(suite.attrib.get(key, "0")))
              except (ET.ParseError, ValueError):
                  pass
          selector_exit = read_int(receipt_dir / "selector.exit", inner_exits["selector"])

          generated = {}
          bundle_dir = receipt_dir / "artifacts"
          bundle_dir.mkdir(parents=True, exist_ok=True)
          bundled_artifacts = {}

          def bundle(path, name):
              if not path.is_file():
                  return None
              destination = bundle_dir / name
              shutil.copy2(path, destination)
              return destination

          generated_paths = (
              root / "remotion" / "src" / "effects.generated.ts",
              root / "remotion" / "src" / "animations.generated.ts",
              root / "remotion" / "src" / "transitions.generated.ts",
              root / "remotion" / ".astrid-registry-state.json",
          )
          for path in generated_paths:
              generated[str(path.relative_to(root))] = sha256(path) if path.is_file() else None
              bundled = bundle(path, path.name)
              if bundled is not None:
                  bundled_artifacts[str(path.relative_to(root))] = {
                      "path": str(bundled.relative_to(receipt_dir)),
                      "sha256": sha256(bundled),
                  }

          artifact_hashes = {}
          evidence_names = {
              "runtime.lock.json": "runtime.lock.json",
              "remotion/package.json": "remotion-package.json",
              "remotion/package-lock.json": "remotion-package-lock.json",
              "remotion/artifacts/banodoco-timeline-composition-0.0.17.tgz.sha256": "timeline-composition.tgz.sha256",
          }
          for path in (root / "runtime.lock.json", composition_package, composition_lock, composition_artifact, composition_sidecar):
              if path is not None and path.is_file():
                  source = str(path.relative_to(root))
                  artifact_hashes[source] = sha256(path)
                  bundled = bundle(path, evidence_names.get(source, "timeline-composition.tgz"))
                  bundled_artifacts[source] = {
                      "path": str(bundled.relative_to(receipt_dir)),
                      "sha256": sha256(bundled),
                  }
          for path in sorted((root / "dist").glob("*.whl")) if (root / "dist").is_dir() else ():
              source = str(path.relative_to(root))
              artifact_hashes[source] = sha256(path)
              bundled = bundle(path, "astrid-wheel.whl")
              bundled_artifacts[source] = {
                  "path": str(bundled.relative_to(receipt_dir)),
                  "sha256": sha256(bundled),
              }

          selector_command = (
              "ASTRID_HOST_EXECUTION_PROFILE=installed "
              "ASTRID_RUNTIME_CHECKOUT=$GITHUB_WORKSPACE/astrid-runtime "
              "ASTRID_REMOTION_PROJECT_DIR=$GITHUB_WORKSPACE/remotion "
              "$RUNNER_TEMP/installed-venv/bin/pytest -q -rA -m installed --import-mode=importlib "
              "--junitxml=$GITHUB_WORKSPACE/installed-wheel-receipt/selector.junit.xml "
              "tests/packs/h3_av/test_character_swap_cpu_boundary.py"
          )
          receipt = {
              "schema": "ag-ci-h3-wheel-r8/v1",
              "status": "green" if all(value == 0 for value in inner_exits.values()) else "failed",
              "repository": "banodoco/astrid-agent",
              "workflow": {
                  "name": os.environ.get("GITHUB_WORKFLOW", "unavailable"),
                  "identity": os.environ.get("GITHUB_WORKFLOW", "unavailable"),
                  "file": ".github/workflows/lanes.yml",
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", "unavailable"),
                  "run_id": os.environ.get("GITHUB_RUN_ID", "unavailable"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "unavailable"),
                  "job": os.environ.get("GITHUB_JOB", "unavailable"),
                  "run_ref": os.environ.get("GITHUB_REF", "unavailable"),
                  "requested_agent": os.environ.get("GITHUB_SHA", "unavailable"),
              },
              "tuple": {
                  "agent_requested": os.environ.get("GITHUB_SHA", "unavailable"),
                  "agent_effective": command_output("git", "rev-parse", "HEAD"),
                  "runtime_requested": runtime_input,
                  "runtime_effective": command_output("git", "-C", "astrid-runtime", "rev-parse", "HEAD"),
                  "app_identity": os.environ.get("ASTRID_APP_IDENTITY", "unavailable"),
                  "composition": {
                      "name": "@banodoco/timeline-composition",
                      "version": composition_version,
                      "spec": composition,
                      "artifact_sha256": artifact_hashes.get(str(composition_artifact.relative_to(root))) if composition_artifact and composition_artifact.is_file() else None,
                  },
              },
              "installed_selector": {
                  "command": selector_command,
                  "exit": selector_exit,
                  "result": "passed" if selector_exit == 0 else "failed",
                  "junit": {"path": "selector.junit.xml", **junit_counts},
              },
              "inner_exits": inner_exits,
              "generated_registry_hashes": generated,
              "artifacts": artifact_hashes,
              "bundled_artifacts": bundled_artifacts,
              "coverage": {
                  "selector": "tests/packs/h3_av/test_character_swap_cpu_boundary.py",
                  "profile": "installed",
                  "prohibited_options_absent": ["--maxfail", "-x"],
              },
              "logs": [path.name for path in sorted(receipt_dir.glob("*.log"))],
          }

          receipt_path = receipt_dir / "RECEIPT.json"
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          manifest_paths = [
              path for path in sorted(receipt_dir.rglob("*"))
              if path.is_file() and path.name not in {"SHA256SUMS", "RECEIPT.json"}
          ]
          manifest_lines = []
          seen = set()
          for path in manifest_paths:
              if path in seen:
                  continue
              seen.add(path)
              relative = path.relative_to(receipt_dir) if path.is_relative_to(receipt_dir) else path.relative_to(root)
              manifest_lines.append(f"{sha256(path)}  {relative}")
          manifest = receipt_dir / "SHA256SUMS"
          manifest.write_text("".join(line + "\n" for line in manifest_lines), encoding="utf-8")
          receipt["artifact_manifest"] = {"path": "SHA256SUMS", "sha256": sha256(manifest)}
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload installed-wheel receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installed-wheel-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/installed-wheel-receipt
          if-no-files-found: warn
