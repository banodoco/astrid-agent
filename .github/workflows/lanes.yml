name: FIX-12 paired functional comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        cell: [reference, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - uses: ./proof/.github/actions/fix12-environment
        with:
          cell: ${{ matrix.cell }}
      - name: Run standard functional tests
        run: bash proof/scripts/ci/fix12_pair/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-${{ matrix.cell }}
          path: |
            ${{ runner.temp }}/fix12-receipt/sources.json
            ${{ runner.temp }}/fix12-receipt/inventory.json
            ${{ runner.temp }}/fix12-receipt/pytest.jsonl
            ${{ runner.temp }}/fix12-receipt/pytest-exit.txt
          if-no-files-found: warn

  compare:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: functional-*
      - name: Compare the two functional runner receipts
        run: python3 proof/scripts/ci/fix12_pair/compare.py
