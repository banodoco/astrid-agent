          for repo,num,head,href,bref,bsha in [(a,689,E['HEAD_SHA'],'p90/90-WS9-requirements-preview','release/16/plan-94',E['PLAN']),(v,224,E['VC_HEAD'],'p90/90-WS2-requirements-plan','release/16/plan-90',E['VC_BASE'])]:
              p=api(f'repos/{repo}/pulls/{num}'); assert p['state']=='open' and p['draft'] and not p['merged']
              assert (p['head']['sha'],p['head']['ref'],p['head']['repo']['full_name'])==(head,href,repo)
