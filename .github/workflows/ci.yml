name: AT11 paired hosted qualification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTEST_ADDOPTS: -rA
jobs:
  unit-shard:
    name: AT11 ${{ matrix.source }} with original unit shard 1
    runs-on: ${{ matrix.os }}
    # Shard 7 has a ~35-minute tail after ~15 minutes of tests; 60 minutes cancels healthy runs.
    # Shards 1 and 6 were cancelled at 120 minutes on 05346e9f at 92%; shard 1 then took 2h03 of pytest on 1e94061c.
    # With the 120 s per-test timeout a hang fails after 2 minutes, so 180 minutes is a wall, not an allowance.
    timeout-minutes: 180
    env:
      # The test run's skip registry (tests/lanes.py) reads this: a lane this job provides fails, not skips, when its dependency is missing.
      ASTRID_CI_JOB: unit-shard-${{ matrix.os }}
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/runpod-lifecycle-checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # A pull request runs shard 1 of 8 only; the job name and --splits 8 are unchanged.
        group: [1]
        source: [7b3869939122a6bff701f27df13f90c2761d5b13]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ matrix.source }}

      # These release-0 rollback and launcher tests archive a pinned historical
      # Agent source tree; the default shallow checkout does not contain it.
      - name: Fetch release-0 Agent archive for installer rollback tests
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-01 --shell bash "{0}"
        run: |
          set -euo pipefail
          release0_agent=3204bb00135bec8ee2d2d3fb21eed5abfceca649
          git fetch --no-tags --depth=1 origin "$release0_agent"
          test "$(git rev-parse "${release0_agent}^{commit}")" = "$release0_agent"
          git cat-file -e "${release0_agent}:astrid/installer/core.py"
          git archive --format=tar "$release0_agent" astrid >/dev/null
          echo "- Release-0 Agent archive: $release0_agent (tree and archive available)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the pinned Runtime commit
        id: runtime-pin
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-02 --shell bash "{0}"
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Read the pinned RunPod lifecycle revision
        id: lifecycle-pin
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-04 --shell bash "{0}"
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path("astrid/packs/runpod/pins.json").read_text())["sources"]["lifecycle"]
          print(f"repository={source['repository'].removeprefix('https://github.com/').removesuffix('.git')}")
          print(f"revision={source['revision']}")
          PY

      - name: Check out the pinned RunPod lifecycle (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lifecycle-pin.outputs.repository }}
          ref: ${{ steps.lifecycle-pin.outputs.revision }}
          path: runpod-lifecycle-checkout

      - name: Record RunPod lifecycle checkout
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell bash "{0}"
        env:
          LIFECYCLE_REVISION: ${{ steps.lifecycle-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_TEST_LIFECYCLE_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$LIFECYCLE_REVISION"
          echo "- RunPod lifecycle: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-3
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The product's pinned Node (.node-version), the one the installer ships: the tests run the same Node the product does.
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-11 --shell bash "{0}"

      - name: Install package with dev extras
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-12 --shell bash "{0}"
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-13 --shell bash "{0}"
        run: python scripts/ci_install_runtime.py

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-14 --shell bash "{0}"
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-16 --shell bash "{0}"
        env:
          VIBECOMFY_REVISION: ${{ steps.vibecomfy-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_VIBECOMFY_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$VIBECOMFY_REVISION"
          echo "- VibeComfy: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-17 --shell bash "{0}"
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Run the fixed 20-trial series under original shard load
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          PYTHONUNBUFFERED: 1
          ASTRID_PYTEST_HARD_EXIT_ON_LEAKED_THREADS: 1
          AT11_BASE: 5dd0e9ea869560f827ef9184a11c8eb22d0b665d
          AT11_EXACT_SOURCE: ${{ matrix.source }}
          AT11_SHARD_COMMAND: >-
            mkdir -p "$TEST_RESULTS_DIR" && python -P -m ci.run_pytest -p ceiling_pytest -v -rA --junitxml="$TEST_RESULTS_DIR/unit-shard.xml" --durations=40 --splits 8 --group 1 --durations-path tests/.test_durations --store-durations --clean-durations
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-18 --shell bash "{0}"
        run: |
          cat > "$RUNNER_TEMP/at11_trials.py" <<'PYTHON'
          import hashlib
          import importlib.util
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "at11-proof"
          out.mkdir(exist_ok=True)
          scratch = Path(os.environ["RUNNER_TEMP"]) / "at11-media"
          suite = "tests/core/generation/test_h3_build_after_outputs.py"
          ids = [suite + "::" + name for name in (
              "test_h3_contribution_build_and_after_outputs_end_to_end",
              "test_the_run_actions_after_outputs_spec_composes_the_candidate",
          )]
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          def save(path, obj):
              path.write_text(json.dumps(obj, indent=2) + "\n")
          def state(command):
              events = out / "load" / "unit-shard.jsonl"
              return dict(utc_epoch=time.time(), loadavg=os.getloadavg(), raw_exit=command.poll(),
                          shard_event_bytes=events.stat().st_size if events.exists() else 0)
          def native_calls_started():
              eventfile = out / "load" / "unit-shard.jsonl"
              if not eventfile.exists():
                  return False
              with eventfile.open() as stream:
                  for line in stream:
                      if line.endswith("\n"):
                          row = json.loads(line)
                          if row.get("type") == "report" and row.get("when") == "call":
                              return True
              return False
          def measure_media():
              records = []
              for name in ("source.mp4", "generated.mp4"):
                  for path in sorted(scratch.rglob(name)):
                      if path.is_symlink():
                          continue
                      args = ["ffprobe", "-v", "error", "-count_frames", "-show_entries",
                              "stream=codec_type,nb_read_frames,duration,r_frame_rate", "-of", "json", str(path)]
                      run = subprocess.run(args, text=True, capture_output=True)
                      records.append(dict(path=str(path.relative_to(scratch)), exit=run.returncode,
                                          streams=json.loads(run.stdout).get("streams", []) if run.returncode == 0 else [],
                                          error=run.stderr[-2000:]))
              return records

          head = output("git", "rev-parse", "HEAD")
          candidate = os.environ["AT11_EXACT_SOURCE"]
          base = os.environ["AT11_BASE"]
          assert head == candidate and output("git", "rev-parse", "HEAD^") == base
          assert output("git", "diff", "--name-only", base, candidate) == suite
          source = Path(os.environ["RUNNER_TEMP"]) / "at11-exact-source"
          subprocess.run(["git", "worktree", "add", "--detach", str(source), base], check=True)
          version = output("ffmpeg", "-version").splitlines()[0]
          metadata = dict(head=head, ffmpeg=version, ffmpeg_path=shutil.which("ffmpeg"),
                          cpus=os.cpu_count(), runner_image=os.getenv("ImageVersion"),
                          fixture_sha256=hashlib.sha256(Path(suite).read_bytes()).hexdigest(),
                          runner=os.environ.get("RUNNER_OS"), kernel=output("uname", "-a"),
                          original_test_ids=ids)
          metadata.update(base=base, candidate=candidate, full_shard_source=head,
                          runner_image_os=os.getenv("ImageOS"), ffprobe=output("ffprobe","-version").splitlines()[0],
                          ffmpeg_package=output("dpkg-query","-W","ffmpeg"),
                          python=sys.version, python_executable=sys.executable,
                          dependencies={k:output("git","-C",os.environ[k],"rev-parse","HEAD") for k in
                                        ("ASTRID_RUNTIME_CHECKOUT","ASTRID_VIBECOMFY_CHECKOUT","ASTRID_TEST_LIFECYCLE_CHECKOUT")},
                          installed_origins={n:str(getattr(importlib.util.find_spec(n),"origin",None))
                                             for n in ("astrid","runtime_protocol","pytest")})
          save(out / "environment.json", metadata)
          if "version 8.0.1" not in version:
              raise SystemExit("The runner does not have the original hosted FFmpeg 8.0.1")
          load_dir = out / "load"
          load_dir.mkdir()
          env = dict(os.environ, TEST_RESULTS_DIR=str(load_dir))
          with (load_dir / "console.log").open("w") as log:
              load = subprocess.Popen(["bash", "-ec", os.environ["AT11_SHARD_COMMAND"]], env=env,
                                      stdout=log, stderr=subprocess.STDOUT)
              deadline = time.monotonic() + 1800
              while load.poll() is None and time.monotonic() < deadline and not native_calls_started():
                  time.sleep(3)
              if not native_calls_started() or load.poll() is not None:
                  raise SystemExit("Shard 1 did not reach active test calls before qualification")
              rows = []
              for index in range(40):
                  number = index // 2 + 1
                  # Reverse the within-pair order every other pair on the same running shard.
                  ref = (base, candidate)[(index % 2) ^ ((number - 1) % 2)]
                  label = "base" if ref == base else "candidate"
                  subprocess.run(["git", "-C", str(source), "switch", "--detach", ref], check=True)
                  assert output("git", "-C", str(source), "rev-parse", "HEAD") == ref
                  dest = out / f"{label}-{number:02d}"
                  dest.mkdir()
                  scratch = Path(os.environ["RUNNER_TEMP"]) / f"at11-media-{label}-{number:02d}"
                  capture = dest / "native"
                  capture.mkdir()
                  start = state(load)
                  if scratch.exists():
                      shutil.rmtree(scratch)
                  cmd = [sys.executable, "-P", "-m", "ci.run_pytest", "-p", "ceiling_pytest", "-v", "-rA",
                         "--junitxml=" + str(dest / "cases.xml"), "-o", "tmp_path_retention_policy=all", "--basetemp=" + str(scratch), *ids]
                  with (dest / "console.log").open("w") as trial_log:
                      attempt = subprocess.run(cmd, cwd=source, env=dict(env, TEST_RESULTS_DIR=str(dest), CEILING_STEP_DIR=str(capture),
                                               PYTHONPATH=os.pathsep.join(str(source / n) for n in ("scripts/ci","scripts"))),
                                               stdout=trial_log, stderr=subprocess.STDOUT)
                  finish = state(load)
                  phases = []
                  events_file = dest / "cases.jsonl"
                  if events_file.exists():
                      for line in events_file.read_text().splitlines():
                          item = json.loads(line)
                          if item.get("type") == "report" and item.get("nodeid") in ids:
                              phases.append({k:item.get(k) for k in ("nodeid", "when", "outcome")})
                  result = dict(trial=number, source=ref, side=label, fixture_sha256=hashlib.sha256((source/suite).read_bytes()).hexdigest(), args=cmd, raw_exit=attempt.returncode, start=start, finish=finish,
                                phases=phases, media=measure_media())
                  save(dest / "result.json", result)
                  rows.append(result)
                  if scratch.exists():
                      shutil.rmtree(scratch)
                  print(f"trial {number}: exit={attempt.returncode}, phases={len(phases)}, shard={finish}", flush=True)
              save(out / "series.json", rows)
              # Preserve the unmodified full-shard result independently of the fixed trial series.
              load_status = load.wait()
              save(out / "load-result.json", {"args":os.environ["AT11_SHARD_COMMAND"], "raw_exit":load_status})
          for row in rows:
              if row["start"]["raw_exit"] is not None or row["finish"]["raw_exit"] is not None:
                  raise SystemExit("The full shard ended during the trial series")
              if len(row["phases"]) != 6:
                  raise SystemExit("A trial did not execute all six original test phases")
          if any(row["raw_exit"] for row in rows if row["side"] == "candidate"):
              raise SystemExit(1)
          PYTHON
          python "$RUNNER_TEMP/at11_trials.py"
      - name: Retain every trial and the original shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at11-${{ matrix.source }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/at11-proof/
          if-no-files-found: error
          retention-days: 30
