name: 93-CAT exact candidate proof
on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read
jobs:
  proof:
    if: github.repository == 'banodoco/astrid-agent' && github.ref == 'refs/heads/proof/93-cat-56d5f556'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: 56d5f556ccf865324f40dd7c63c128586b57f78d
          path: agent
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-dev
          ref: 394cd8c7051d82c36fac8ea9ede9c6d4e14d5c0c
          path: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - name: Install declared native setup prerequisite
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Guard exact tree and execute proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          exec > >(tee "$RUNNER_TEMP/receipts/proof.log") 2>&1
          head=56d5f556ccf865324f40dd7c63c128586b57f78d
          base=d94c7a549600726d386ecab444719e69736be4bc
          check_refs() {
            test "$(gh api repos/banodoco/astrid-agent/pulls/690 --jq .head.sha)" = "$head"
            test "$(gh api repos/banodoco/astrid-agent/git/ref/heads/release/16/plan-93 --jq .object.sha)" = "$base"
          }
          check_refs
          test "$(git -C dev rev-parse HEAD)" = 394cd8c7051d82c36fac8ea9ede9c6d4e14d5c0c
          cd agent
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git rev-parse HEAD^{tree})" = ed9e84734fb6b84205451e1a8e65b237fce069b0
          git merge-base --is-ancestor "$base" "$head"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "HEAD=$head TREE=$(git rev-parse HEAD^{tree}) BASE=$base"
          test "$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" = 686ca695469bda48cd40a70824c4ccef2a137284
          test "$(python -c 'import json; print(json.load(open("astrid/packs/vibecomfy/pins.json"))["sources"]["vibecomfy"]["revision"])')" = 55c3948212d23cf037fae8a4c6faad77d33e7279
          test "$(python -c 'import json; print(json.load(open("astrid/packs/runpod/pins.json"))["sources"]["lifecycle"]["revision"])')" = 9f88ef7640bc664f697112d966ecefa123d44340
          bash "$GITHUB_WORKSPACE/dev/env/agent-setup.sh"
          envroot="$GITHUB_WORKSPACE/agent.env"
          for pair in runtime:686ca695469bda48cd40a70824c4ccef2a137284 vibecomfy:55c3948212d23cf037fae8a4c6faad77d33e7279 lifecycle:9f88ef7640bc664f697112d966ecefa123d44340; do repo=${pair%%:*}; pin=${pair#*:}; test "$(git -C "$envroot/$repo" rev-parse HEAD)" = "$pin"; done
          "$envroot/venv/bin/python" -c 'import sys, aiohttp, astrid, runtime_protocol; print("python",sys.version); print("aiohttp",aiohttp.__file__); print("astrid",astrid.__file__); print("runtime_protocol",runtime_protocol.__file__)'
          PYTHONPATH="$envroot/vibecomfy" "$envroot/venv/bin/python" -c 'import vibecomfy; print("vibecomfy",vibecomfy.__file__)'
          PYTHONPATH="$envroot/lifecycle/src" "$envroot/venv/bin/python" -c 'import runpod_lifecycle.pod_agent; print("lifecycle",runpod_lifecycle.pod_agent.__file__)'
          free=$(df -Pk "$envroot/basetemp" | awk 'NR==2 {printf "%.0f",$4*1024}')
          echo "FREE_BYTES_AFTER_SETUP=$free"
          test "$free" -gt 2147483648 || { echo 'ENV: insufficient space'; exit 3; }
          PYTEST_ADDOPTS=-rA bash "$GITHUB_WORKSPACE/dev/env/agent-pytest.sh" -q -p no:cacheprovider tests/core/generation/test_entries.py
          env -i PATH="$envroot/venv/bin:/usr/local/bin:/usr/bin:/bin" HOME="$envroot/home" TMPDIR="$envroot/tmp" XDG_CACHE_HOME="$envroot/cache" LANG=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$envroot/vibecomfy" VIBECOMFY_SOURCE="$envroot/vibecomfy" ASTRID_RUNTIME_CHECKOUT="$envroot/runtime" ASTRID_VIBECOMFY_CHECKOUT="$envroot/vibecomfy" ASTRID_TEST_LIFECYCLE_CHECKOUT="$envroot/lifecycle" "$envroot/venv/bin/python" -c 'from scripts.gen_capability_index import _in_repo_packs_only; from astrid.core.generation import availability, listing; import json; _in_repo_packs_only(); d=availability.availability_declaration(); rows=[r for r in listing.catalog_rows() if r["id"]=="wan-2.2"]; print("WAN_DECLARATION",d["models"].get("wan-2.2")); print("WAN_ROWS",json.dumps(rows)); assert rows and all(r["availability"]=="unavailable" and r.get("reason") and r.get("fix") for r in rows)'
          check_refs
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 93-cat-proof-receipts
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: warn
