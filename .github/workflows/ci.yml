name: R93-D exact base and head proof (disposable)
run-name: R93-D c511aaac exact proof v4
'on': workflow_dispatch
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: r93-d-c511aaac-v4-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BASE_SHA: 44d59774abb638c61ed0aae2b32653e62a5bcf66
      BASE_TREE: 7f580eb0d59121108f36ababb3f1dfdc625b2a3a
      HEAD_SHA: c511aaac4801edf1b6b2dbb1c20dc76fed3e75b9
      HEAD_TREE: a1c32337b83378779be8190707218d7d06c46010
      DEV_SHA: 21feb35007210df7bc23a03c6226e2c5873fdab1
      DEV_TREE: 700a4a21af4f9ede7a09995863ae07dbf441a4a2
      PROOF_REF: proof/93-d-c511aaac-v4
    steps:
      - name: Initialize receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r93-d-receipts"
          printf 'run=%s attempt=%s event=%s ref=%s sha=%s workflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/r93-d-receipts/event.txt"
          test "$GITHUB_REPOSITORY" = banodoco/astrid-agent
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$PROOF_REF"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: wrapper
        with:
          ref: ${{ github.sha }}
          path: wrapper
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: base
        with:
          ref: 44d59774abb638c61ed0aae2b32653e62a5bcf66
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: head
        with:
          ref: c511aaac4801edf1b6b2dbb1c20dc76fed3e75b9
          path: head
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: dev
        with:
          repository: banodoco/astrid-dev
          ref: 21feb35007210df7bc23a03c6226e2c5873fdab1
          path: dev
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        id: uv
        with:
          enable-cache: false
      - name: Guard, setup, collect and execute both exact payloads
        id: execute
        if: always()
        timeout-minutes: 75
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_OUTCOMES: ${{ steps.wrapper.outcome }} ${{ steps.base.outcome }} ${{ steps.head.outcome }} ${{ steps.dev.outcome }} ${{ steps.python.outcome }} ${{ steps.uv.outcome }}
        run: |
          set -euo pipefail
          export R="$RUNNER_TEMP/r93-d-receipts"
          mkdir -p "$R"
          token=$GH_TOKEN
          unset GH_TOKEN GITHUB_TOKEN GEN_DESELECT_FILE PYTEST_ADDOPTS VERIFY_SIDE
          driver="$RUNNER_TEMP/r93-d-driver.sh"
          cat > "$driver" <<'DRIVER'
          set -euo pipefail
          W=$GITHUB_WORKSPACE
          A=repos/banodoco/astrid-agent
          check_checkout() {
            local path=$1 sha=$2 tree=$3 status
            test "$(git -C "$path" rev-parse HEAD)" = "$sha"
            test "$(git -C "$path" rev-parse 'HEAD^{tree}')" = "$tree"
            status=$(git -C "$path" status --porcelain --untracked-files=all)
            printf '%s HEAD=%s TREE=%s STATUS=%s\n' "$path" "$sha" "$tree" "$status"
            test -z "$status"
          }
          guard() {
            test "$GITHUB_REPOSITORY" = banodoco/astrid-agent
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = "refs/heads/$PROOF_REF"
            test "$GITHUB_WORKFLOW_REF" = "banodoco/astrid-agent/.github/workflows/ci.yml@refs/heads/$PROOF_REF"
            test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$(gh api "$A/git/ref/heads/$PROOF_REF" --jq .object.sha)" = "$GITHUB_SHA"
            test "$(gh api "$A/git/ref/heads/release/16/plan-93" --jq .object.sha)" = "$BASE_SHA"
            test "$(gh api "$A/git/ref/heads/p93/R93-D" --jq .object.sha)" = "$HEAD_SHA"
            pr=$(gh api "$A/pulls/696" --jq '[.state,.draft,.merged,.base.repo.full_name,.base.ref,.base.sha,.head.repo.full_name,.head.ref,.head.sha] | @tsv')
            printf 'PR696=%s\n' "$pr"
            test "$pr" = "$(printf 'open\ttrue\tfalse\tbanodoco/astrid-agent\trelease/16/plan-93\t%s\tbanodoco/astrid-agent\tp93/R93-D\t%s' "$BASE_SHA" "$HEAD_SHA")"
            test "$(gh api "$A/git/commits/$BASE_SHA" --jq .tree.sha)" = "$BASE_TREE"
            test "$(gh api "$A/git/commits/$HEAD_SHA" --jq .tree.sha)" = "$HEAD_TREE"
            wrapper_tree=$(gh api "$A/git/commits/$GITHUB_SHA" --jq .tree.sha)
            check_checkout "$W/wrapper" "$GITHUB_SHA" "$wrapper_tree"
            test "$(git -C "$W/wrapper" rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $HEAD_SHA"
            test "$(git -C "$W/wrapper" diff --name-only "$HEAD_SHA" "$GITHUB_SHA")" = .github/workflows/ci.yml
            git -C "$W/wrapper" rev-parse HEAD:.github/workflows/ci.yml
            sha256sum "$W/wrapper/.github/workflows/ci.yml"
            run=$(gh api "$A/actions/runs/$GITHUB_RUN_ID" --jq '[.event,.head_branch,.head_sha,.workflow_id,.run_attempt] | @tsv')
            test "$run" = "$(printf 'workflow_dispatch\t%s\t%s\t282274792\t1' "$PROOF_REF" "$GITHUB_SHA")"
            ids=$(gh api --paginate "$A/actions/workflows/282274792/runs?branch=proof%2F93-d-c511aaac-v4&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id')
            printf 'dispatch_ids=%s\n' "$ids"
            test "$ids" = "$GITHUB_RUN_ID"
            check_checkout "$W/base" "$BASE_SHA" "$BASE_TREE"
            check_checkout "$W/head" "$HEAD_SHA" "$HEAD_TREE"
            check_checkout "$W/dev" "$DEV_SHA" "$DEV_TREE"
            test "$(git -C "$W/dev" hash-object env/agent-setup.sh)" = 2da3dc49bd2180f62fcabe2db787eb79bacff3d8
            test "$(git -C "$W/dev" hash-object env/agent-pytest.sh)" = 4bd27a26c096824490aaea9711fa10f8208652a8
            test "$(git -C "$W/dev" hash-object env/agent-pytest-pod.sh)" = c55ba94bef3b0434651d4b2d57dd7574b49e1ebe
          }
          deps() {
            local side=$1 E="$W/$1.env" pair repo pin tree free
            if test "$side" = base; then
              check_checkout "$W/base" "$BASE_SHA" "$BASE_TREE"
            else
              test "$side" = head
              check_checkout "$W/head" "$HEAD_SHA" "$HEAD_TREE"
            fi
            check_checkout "$W/dev" "$DEV_SHA" "$DEV_TREE"
            for pair in runtime:686ca695469bda48cd40a70824c4ccef2a137284 vibecomfy:55c3948212d23cf037fae8a4c6faad77d33e7279 lifecycle:9f88ef7640bc664f697112d966ecefa123d44340; do
              repo=$(cut -d: -f1 <<< "$pair"); pin=$(cut -d: -f2 <<< "$pair")
              tree=$(git -C "$E/$repo" rev-parse "$pin^{tree}")
              check_checkout "$E/$repo" "$pin" "$tree"
            done
            cat "$E/setup.txt"
            "$E/venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3,13); print(sys.version)'
            free=$(df -Pk "$E/basetemp" | awk 'NR==2 {print $4}')
            printf 'free_KiB=%s\n' "$free"
            test "$free" -gt 2097152
          }
          case "$1" in
            guard) guard ;;
            prerequisites)
              printf 'action_outcomes=%s\n' "$ACTION_OUTCOMES"
              test "$ACTION_OUTCOMES" = 'success success success success success success'
              for tool in gh git uv python; do command -v "$tool"; done
              if ! command -v ffmpeg || ! command -v ffprobe; then
                sudo apt-get update
                sudo apt-get install -y ffmpeg
              fi
              ffmpeg -version; ffprobe -version; uv --version; python --version; df -Pk "$W"
              ;;
            setup)
              cd "$W/$2"
              bash "$W/dev/env/agent-setup.sh"
              ;;
            deps) deps "$2" ;;
            collect|test)
              mode=$1; side=$2; label=${3:-$side}; cd "$W/$side"
              base_node=tests/test_onboarding_one_home.py::test_shipped_skills_run_astrid_through_the_launcher_not_python_m
              if test "$side" = base && test "$label" = base-fixtures; then
                selectors=(tests/test_setup_skill_branches.py::test_runpod_machine_entry_refuses_a_job_without_a_claimed_machine tests/test_setup_skill_branches.py::test_runpod_setup_from_pristine_settings_preserves_choices_and_quotes_without_claim)
              elif test "$side" = base && test "$label" = base; then
                selectors=("$base_node")
              elif test "$side" = head && test "$label" = head; then
                selectors=(tests/test_ladder_skill_wiring.py tests/test_ladder_wording.py tests/test_installer_maintained_guides.py tests/test_onboarding_one_home.py tests/test_setup_skill_branches.py tests/test_setup_skill_pack.py)
              else
                exit 64
              fi
              export VERIFY_SIDE="$side" PYTEST_ADDOPTS=-rA
              unset GEN_DESELECT_FILE
              printf 'mode=%s side=%s receipt=%s selectors=' "$mode" "$side" "$label"; printf '%q ' "${selectors[@]}"; printf '\n'
              if test "$mode" = collect; then
                bash "$W/dev/env/agent-pytest.sh" --collect-only -q "${selectors[@]}"
              else
                bash "$W/dev/env/agent-pytest.sh" -q --junitxml="$R/$label.xml" "${selectors[@]}"
              fi
              ;;
            *) exit 64 ;;
          esac
          DRIVER
          cat > "$RUNNER_TEMP/r93-d-log.sh" <<'LOGGER'
          logged() {
            local label=$1; shift
            local -a ps
            set +e
            "$@" 2>&1 | tee "$R/$label.log"
            ps=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${ps[0]}" "${ps[1]}" > "$R/$label.exit"
          }
          good() { test -f "$R/$1.exit" && grep -qx '0 0' "$R/$1.exit"; }
          LOGGER
          source "$RUNNER_TEMP/r93-d-log.sh"
          logged preflight env GH_TOKEN="$token" bash "$driver" guard
          if good preflight; then
            logged prerequisites bash "$driver" prerequisites
            if good prerequisites; then
              for side in base head; do
                logged "$side-setup" bash "$driver" setup "$side"
                if good "$side-setup"; then
                  logged "$side-deps-before" bash "$driver" deps "$side"
                  if good "$side-deps-before"; then
                    logged "$side-collect" bash "$driver" collect "$side"
                    logged "$side-test" bash "$driver" test "$side"
                    if test "$side" = base; then
                      logged base-fixtures-deps-before bash "$driver" deps base
                      if good base-fixtures-deps-before; then
                        logged base-fixtures-collect bash "$driver" collect base base-fixtures
                        logged base-fixtures-test bash "$driver" test base base-fixtures
                        logged base-fixtures-deps-after bash "$driver" deps base
                      fi
                    fi
                  fi
                fi
              done
            fi
          fi
      - name: Prepare immutable expected inventory
        id: inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r93-d-receipts"
          mkdir -p "$R"
          cat > "$R/expected-inventory.json" <<'INVENTORY'
          {
            "expected_head": {
              "tests/test_ladder_skill_wiring.py": [
                "test_both_guides_follow_one_target_action",
                "test_vibe_reasons_and_copy_agree_with_producer",
                "test_guide_commands_parse_and_placement_is_not_duplicated",
                "test_setup_mirror_is_generated"
              ],
              "tests/test_ladder_wording.py": [
                "test_desktop_copy_is_the_single_public_action[closed-closed-I found your ComfyUI Desktop. It is closed at http://127.0.0.1:8000.-Open ComfyUI Desktop yourself, then I will check the same address again.]",
                "test_desktop_copy_is_the_single_public_action[stale-stale_registration-Your ComfyUI Desktop registration points to missing files.-Reinstall ComfyUI Desktop without deleting your existing files, then I will check again.]",
                "test_desktop_copy_is_the_single_public_action[denied-access_denied-Access to http://127.0.0.1:8000 was denied.-I'll retry the same check through the normal permission request.]",
                "test_running_desktop_copy_does_not_claim_compute_or_delivery",
                "test_choices_and_unsupported_copy"
              ],
              "tests/test_installer_maintained_guides.py": [
                "test_maintained_setup_guides_explain_approved_default_execution",
                "test_setup_guides_have_one_approved_installer_command_per_platform",
                "test_skill_journey_steps_run_in_order",
                "test_install_journey_hands_over_to_generation",
                "test_generation_setup_routes_capability_and_consent",
                "test_generation_commands_include_platform_launchers_and_paid_bounds",
                "test_skill_command_steps_have_one_block_per_os_success_line_and_doctor_fallback",
                "test_skill_never_names_a_bare_astrid_command",
                "test_bare_astrid_check_catches_prose_chained_and_fenced_forms",
                "test_skill_entry_routes_appear_once_each_in_order",
                "test_quoted_installer_first_lines_exist_in_installer_outcome",
                "test_existing_install_route_keeps_saved_choices_and_passes_no_choice_flags",
                "test_app_brief_route_shows_the_brief_values_and_runs_its_command_as_given",
                "test_success_first_lines_start_with_a_quoted_prefix_in_step_2",
                "test_step_2_labels_the_full_flag_command_for_fresh_install_only",
                "test_step_1_keeps_the_brief_values_and_applies_a_changed_choice_alone",
                "test_getting_started_tells_existing_installs_to_run_the_plain_line",
                "test_readme_banner_ends_with_connected_check_and_names_no_missing_heading",
                "test_readme_banner_keeps_saved_choices_for_an_existing_install",
                "test_setup_choices_recommend_current_settings"
              ],
              "tests/test_onboarding_one_home.py": [
                "test_runpod_machine_commands_live_only_in_the_runpod_skill",
                "test_setup_generate_commands_have_the_same_form_in_the_generation_skill",
                "test_each_concept_section_has_one_home_and_the_others_only_link_to_it",
                "test_runpod_section_in_the_generation_skill_is_one_line_and_a_link",
                "test_skills_reach_the_scan_through_the_launcher_and_never_the_pack_module",
                "test_user_facing_scan_strings_name_the_generate_scan_command",
                "test_generation_skill_names_cancel_through_the_launcher_and_mcp",
                "test_shipped_skills_run_astrid_through_the_launcher_not_python_m"
              ],
              "tests/test_setup_skill_branches.py": [
                "test_generation_skill_fenced_scan_command_uses_real_cli_parser",
                "test_setup_engine_fenced_command_reaches_real_parser_through_fake_launcher",
                "test_nvidia_fenced_command_and_csv_cross_the_12_decimal_gb_boundary[11445-True]",
                "test_nvidia_fenced_command_and_csv_cross_the_12_decimal_gb_boundary[11444-False]",
                "test_engine_readiness_parser_uses_its_distinct_query",
                "test_runpod_machine_entry_refuses_a_job_without_a_claimed_machine",
                "test_runpod_machine_refuses_claim_without_paid_consent",
                "test_runpod_setter_guide_command_uses_hidden_prompt_without_key_in_argv_or_env",
                "test_runpod_setup_commands_reach_real_generation_parsers",
