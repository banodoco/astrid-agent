                "test_runpod_setup_guide_explains_the_persisted_policy",
                "test_runpod_setup_from_pristine_settings_preserves_choices_and_quotes_without_claim",
                "test_generation_defaults_step_offers_four_answers_each_with_one_undo",
                "test_generation_defaults_commands_parse_through_real_cli_and_never_queue_a_run",
                "test_generation_defaults_preview_and_save_run_against_fakes",
                "test_generation_defaults_fetch_saved_workflow_read_only_then_pins_it",
                "test_setup_skill_has_one_hand_off_sentence_and_no_runpod_walkthrough",
