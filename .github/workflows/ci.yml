# Default run per push (testing plan UA.1). The heavy lanes run elsewhere: darwin_native, remotion, chrome and codex_cli
# in the darwin-native job below; integration and opt_in nightly in .github/workflows/lanes.yml. The lanes with no job
# (workstation, omp, gpu, app_checkout) are listed by name at the end of every run (tests/lanes.py).
name: CI

on:
  push:
    branches: [main, release-1, "int/**"]
  workflow_dispatch:
    inputs:
      agent_sha:
        description: Immutable full Agent commit to test
        required: true
        type: string
      selector:
        description: Exact Windows schema ACL selectors
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-and-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ASTRID_CI_JOB: windows-native-and-installer
    steps:
      - uses: actions/checkout@v4
      - name: Restore pip cache (C-08)
        id: c08-agent-ci-5
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'
      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py
      - name: Check native PowerShell cleanup exit codes
        run: python -m pytest -q tests/test_installer_windows_tasks.py
      - name: Check Windows pack-host identity and service launcher binding
        run: python -m pytest -q tests/sdk/test_host_recovery.py tests/test_services.py -k windows
      - name: Check Remotion admission and captured source handoff
        run: python -m pytest -q tests/core/rendering/test_remotion_host_regressions.py
      - name: Check native Windows process and permission behavior
        run: >-
          python -m pytest -q
          tests/core/execution/test_platform_helpers.py::test_windows_scope_job_kills_descendants_after_leader_exit
          tests/core/execution/test_platform_helpers.py::test_windows_lock_and_owner_permissions_are_native
          tests/core/execution/test_platform_helpers.py::test_windows_scope_dies_when_owner_process_exits
          tests/test_generic_host_child_output.py
          tests/test_host_child_stdin.py
          tests/test_windows_child_stdin.py -rP

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-5.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  windows-schema-acl-carrier:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Windows schema ACL carrier
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The focused selectors are registered to this existing Windows lane.
      ASTRID_CI_JOB: windows-native-and-installer
    steps:
      - name: Check out the dispatched Agent commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.agent_sha }}
          fetch-depth: 1

      - name: Initialize evidence and assert immutable request
        id: request
        shell: pwsh
        env:
          AGENT_SHA: ${{ inputs.agent_sha }}
          SELECTOR: ${{ inputs.selector }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'windows-schema-acl-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Set-Content -Path "$evidence/requested-agent-sha.txt" -Value $env:AGENT_SHA
          Set-Content -Path "$evidence/requested-selector.txt" -Value $env:SELECTOR
          $expectedSelector = 'tests/core/rendering/test_local_schema.py::test_windows_native_schema_path_acl_controls tests/core/rendering/test_local_schema.py::test_windows_native_schema_dacl_allows_privileged_and_rejects_foreign'
          if ($env:AGENT_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'agent_sha must be a lowercase full 40-hex commit'
          }
          if ($env:SELECTOR -cne $expectedSelector) {
            throw 'selector does not equal the exact Windows schema ACL selector pair'
          }
          $actual = (git rev-parse HEAD).Trim()
          Set-Content -Path "$evidence/checked-out-agent-sha.txt" -Value $actual
          if ($actual -cne $env:AGENT_SHA) {
            throw "checked-out Agent SHA $actual does not equal requested $env:AGENT_SHA"
          }
          "agent_sha=$actual" >> $env:GITHUB_OUTPUT
          "selector=$env:SELECTOR" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py

      - name: Collect and run exact Windows schema ACL selectors
        id: pytest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $evidence = 'windows-schema-acl-evidence'
          $pathSelector = 'tests/core/rendering/test_local_schema.py::test_windows_native_schema_path_acl_controls'
          $daclSelector = 'tests/core/rendering/test_local_schema.py::test_windows_native_schema_dacl_allows_privileged_and_rejects_foreign'
          python -m pytest --collect-only -q -p no:cacheprovider $pathSelector $daclSelector 2>&1 | Tee-Object -FilePath "$evidence/windows-schema-acl-collection.log"
          $collectionExit = $LASTEXITCODE
          python -m pytest -q -p no:cacheprovider --junitxml=windows-schema-acl.xml tests/core/rendering/test_local_schema.py::test_windows_native_schema_path_acl_controls tests/core/rendering/test_local_schema.py::test_windows_native_schema_dacl_allows_privileged_and_rejects_foreign 2>&1 | Tee-Object -FilePath "$evidence/windows-schema-acl.log"
          $pytestExit = $LASTEXITCODE
          if (Test-Path windows-schema-acl.xml) {
            Copy-Item windows-schema-acl.xml "$evidence/windows-schema-acl.xml" -Force
          } else {
            Set-Content -Path "$evidence/windows-schema-acl.xml.missing" -Value 'pytest did not create windows-schema-acl.xml'
          }
          Set-Content -Path "$evidence/collection-exit.txt" -Value $collectionExit
          Set-Content -Path "$evidence/pytest-inner-exit.txt" -Value $pytestExit
          "collection_exit=$collectionExit" >> $env:GITHUB_OUTPUT
          "pytest_exit=$pytestExit" >> $env:GITHUB_OUTPUT

      - name: Record Windows schema ACL receipt
        if: always()
        shell: pwsh
        env:
          AGENT_SHA: ${{ steps.request.outputs.agent_sha }}
          SELECTOR: ${{ steps.request.outputs.selector }}
          COLLECTION_EXIT: ${{ steps.pytest.outputs.collection_exit }}
          PYTEST_EXIT: ${{ steps.pytest.outputs.pytest_exit }}
        run: |
          $ErrorActionPreference = 'Continue'
          $evidence = 'windows-schema-acl-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $pathSelector = 'tests/core/rendering/test_local_schema.py::test_windows_native_schema_path_acl_controls'
          $daclSelector = 'tests/core/rendering/test_local_schema.py::test_windows_native_schema_dacl_allows_privileged_and_rejects_foreign'
          $collectionNodes = @()
          if (Test-Path "$evidence/windows-schema-acl-collection.log") {
            $collectionNodes = @(Get-Content "$evidence/windows-schema-acl-collection.log" | Where-Object { $_ -like 'tests/core/rendering/test_local_schema.py::*' })
          }
          $pathNodes = @($collectionNodes | Where-Object { $_ -like "*$pathSelector*" })
          $daclNodes = @($collectionNodes | Where-Object { $_ -like "*$daclSelector*" })
          $junitNodes = @()
          $skipped = -1
          $failed = -1
          $junitState = 'missing'
          if (Test-Path "$evidence/windows-schema-acl.xml") {
            try {
              [xml]$junit = Get-Content -Raw "$evidence/windows-schema-acl.xml"
              $junitNodes = @($junit.SelectNodes('//testcase'))
              $skipped = @($junit.SelectNodes('//testcase/skipped')).Count
              $failed = @($junit.SelectNodes('//testcase/failure')).Count + @($junit.SelectNodes('//testcase/error')).Count
              $junitState = 'parsed'
            } catch {
              $junitState = "parse-error: $($_.Exception.Message)"
            }
          }
          $collectionNodes | Set-Content "$evidence/windows-schema-acl-collected-nodes.txt"
          $junitNodes | ForEach-Object { "$($_.classname)::$($_.name)" } | Set-Content "$evidence/windows-schema-acl-junit-nodes.txt"
          @(
            "selector=$env:SELECTOR"
            "checked_out_agent_sha=$env:AGENT_SHA"
            "collection_exit=$env:COLLECTION_EXIT"
            "pytest_exit=$env:PYTEST_EXIT"
            "collected_nodes=$($collectionNodes.Count)"
            "path_selector_collected=$($pathNodes.Count)"
            "dacl_selector_collected=$($daclNodes.Count)"
            "junit_testcases=$($junitNodes.Count)"
            "skipped_nodes=$skipped"
            "failed_nodes=$failed"
            "junit_state=$junitState"
          ) | Set-Content "$evidence/windows-schema-acl-summary.txt"
          Get-ChildItem -Path $evidence -File | Sort-Object Name | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Name)" | Add-Content "$evidence/windows-schema-acl-summary.txt"
          }

      - name: Upload Windows schema ACL evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-schema-acl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: windows-schema-acl-evidence
          if-no-files-found: error

      - name: Fail closed on collection, pytest, skips, or incomplete coverage
        if: always()
        shell: pwsh
        env:
          COLLECTION_EXIT: ${{ steps.pytest.outputs.collection_exit }}
          PYTEST_EXIT: ${{ steps.pytest.outputs.pytest_exit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = @{}
          Get-Content windows-schema-acl-evidence/windows-schema-acl-summary.txt | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts.Count -eq 2) { $summary[$parts[0]] = $parts[1] }
          }
          foreach ($key in @('collection_exit', 'pytest_exit', 'collected_nodes', 'path_selector_collected', 'dacl_selector_collected', 'junit_testcases', 'skipped_nodes', 'failed_nodes')) {
            if (-not $summary.ContainsKey($key) -or $summary[$key] -notmatch '^\d+$') {
              throw "missing or invalid $key in focused receipt"
            }
          }
          if ($env:COLLECTION_EXIT -ne '0' -or [int]$summary['collection_exit'] -ne 0) { throw 'selector collection failed' }
          if ($env:PYTEST_EXIT -ne '0' -or [int]$summary['pytest_exit'] -ne 0) { throw 'pytest failed' }
          if ([int]$summary['skipped_nodes'] -ne 0) { throw "requested selectors skipped $($summary['skipped_nodes']) node(s)" }
          if ([int]$summary['failed_nodes'] -ne 0) { throw "requested selectors failed $($summary['failed_nodes']) node(s)" }
          if ([int]$summary['collected_nodes'] -le 0 -or [int]$summary['path_selector_collected'] -le 0 -or [int]$summary['dacl_selector_collected'] -le 0) { throw 'one or both requested selectors did not collect' }
          if ([int]$summary['junit_testcases'] -ne [int]$summary['collected_nodes']) { throw 'JUnit testcase count does not equal the collected node count' }

  checks:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-4
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py

      # Repo structure is gated in the default lane by a shrink-only baseline
      # (tests/reshape/test_compare_baselines.py; scripts/reshape/baselines/structure_astrid.json).

      - name: Ruff baseline gate
        run: make ruff

      - name: Mypy baseline gate
        run: make mypy

      - name: Import cycles gate
        run: make cycles

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-4.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  unit-shard:
    name: unit shard ${{ matrix.group }} / 8 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Shard 7 has a ~35-minute tail after ~15 minutes of tests; 60 minutes cancels healthy runs.
    timeout-minutes: 120
    env:
      # The test run's skip registry (tests/lanes.py) reads this: a lane this job provides fails, not skips, when its dependency is missing.
      ASTRID_CI_JOB: unit-shard-${{ matrix.os }}
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        group: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-3
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The product's pinned Node (.node-version), the one the installer ships: the tests run the same Node the product does.
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
        shell: bash

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 -c 'from astrid.core.generation.engine_recipe import engine_source_revision; print(engine_source_revision("vibecomfy", "windows-x86_64-cu130", "vibecomfy"))')"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        shell: bash
        env:
          VIBECOMFY_REVISION: ${{ steps.vibecomfy-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_VIBECOMFY_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$VIBECOMFY_REVISION"
          echo "- VibeComfy: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Unit tests (default lane shard)
        # Read the committed baseline for selection; write only this shard's
        # measured tests so the eight artifacts can be merged without stale entries.
        run: python -m pytest -q --splits 8 --group ${{ matrix.group }} --durations-path tests/.test_durations --store-durations --clean-durations

      - name: Upload measured test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: test-durations-${{ matrix.group }}-${{ matrix.os }}
          path: tests/.test_durations
          include-hidden-files: true
          if-no-files-found: error

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-3.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, unit-shard]
    steps:
      - name: All unit shards and fast checks passed
        run: echo "unit passed"

  darwin-native:
    name: darwin native
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      ASTRID_CI_JOB: darwin-native
      # A test in both the integration and a darwin lane starts real Runtime daemons from this checkout (tests/helpers/runtime.py).
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-2
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore npm cache (C-08)
        id: c08-agent-ci-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remotion/package-lock.json') }}
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install Remotion dependencies
        run: npm ci --prefix remotion

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the Runtime and client from the checkout
        run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 -c 'from astrid.core.generation.engine_recipe import engine_source_revision; print(engine_source_revision("vibecomfy", "windows-x86_64-cu130", "vibecomfy"))')"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        shell: bash
        env:
          VIBECOMFY_REVISION: ${{ steps.vibecomfy-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_VIBECOMFY_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$VIBECOMFY_REVISION"
          echo "- VibeComfy: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Provision the Remotion browser
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Install the Codex CLI (the codex_cli lane starts its native binary in the host sandbox)
        run: npm install -g @openai/codex@0.163.0

      # The lanes the default run deselects and only this job provides: native macOS, the Remotion install, headless Chromium, the Codex CLI.
      - name: Darwin native, Remotion and browser tests
        run: python -m pytest -q -m "darwin_native or remotion or chrome or codex_cli"

  # Release wheel (testing plan R-1: kept from the old m8 artifact job). Hashed build tools, one wheel,
  # installed with only the hashed runtime lock, and the toolchain recorded next to it. It is also the
  # one check that every Python pyproject.toml admits (>=3.11) installs and imports Astrid.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remotion/package-lock.json') }}
      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  release:
    name: release wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install wheel builder
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock

      - name: Build exactly one wheel
        run: |
          python -m build --wheel --no-isolation --outdir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1

      - name: Install the wheel with the hashed runtime lock only
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/runtime.lock
          "$RUNNER_TEMP/release-venv/bin/python" scripts/ci_install_runtime.py
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/release-venv/bin/python" -c "import astrid"

      # The default-lane home for "the shipped wheel works when installed" (testing plan R-1):
      # it adopts the wheel and venv built above, so the wheel that is uploaded is the wheel that is smoked.
      - name: Smoke the installed wheel
        run: bash scripts/smoke_wheel_install.sh --wheel dist/*.whl --venv "$RUNNER_TEMP/release-venv"

      - name: Validate locks and record the release toolchain
        run: python -m scripts.reshape.release_reproducibility --expected-python ${{ matrix.python-version }} --output dist/toolchain.json

      - name: Upload the wheel and its toolchain record
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: release-wheel-${{ matrix.python-version }}
          path: dist/

  # Boundary: every vendored copy matches the immutable Runtime commit selected by runtime.lock.json.
  # The default-lane test catches local edits; this job also verifies producer manifest and source bytes.
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (producer)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: runtime-producer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: All vendored Runtime artifacts match the pinned producer
        run: python scripts/vendor_lock.py check runtime.lock.json --producer runtime-producer
