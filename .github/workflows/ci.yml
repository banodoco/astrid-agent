# Default run per push (testing plan UA.1). The heavy lanes run elsewhere: darwin_native, remotion, chrome and codex_cli
# in the darwin-native job below; integration and opt_in nightly in .github/workflows/lanes.yml. The lanes with no job
# (workstation, omp, gpu, app_checkout) are listed by name at the end of every run (tests/lanes.py).
name: CI

on:
  push:
    branches: [main, release-1, "int/**", "release/*/main"]
  # Plan and fix branches land in release/<N>/main by pull request; their own pushes start nothing. A pull request
  # runs only the cheap subset: fast checks, unit shard 1 of 8 (and the unit aggregate), and boundary. The heavy jobs
  # (windows, darwin, release wheels, shards 2-8) carry `if: github.event_name != 'pull_request'` and run on the push.
  pull_request:
    branches: ["release/*/main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/int/r1' && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

env:
  PYTEST_ADDOPTS: -rA

jobs:
  windows-native-and-installer:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ASTRID_CI_JOB: windows-native-and-installer
    steps:
      - uses: actions/checkout@v4
      - name: Restore pip cache (C-08)
        id: c08-agent-ci-5
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'
      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py
      - name: Check native PowerShell cleanup exit codes
        run: python -m pytest -q tests/test_installer_windows_tasks.py
      - name: Check Windows pack-host identity and service launcher binding
        run: python -m pytest -q tests/sdk/test_host_recovery.py tests/test_services.py -k windows
      - name: Check Remotion admission and captured source handoff
        run: python -m pytest -q tests/core/rendering/test_remotion_host_regressions.py
      - name: Check native Windows process and permission behavior
        run: >-
          python -m pytest -q
          tests/core/execution/test_platform_helpers.py::test_windows_scope_job_kills_descendants_after_leader_exit
          tests/core/execution/test_platform_helpers.py::test_windows_lock_and_owner_permissions_are_native
          tests/core/execution/test_platform_helpers.py::test_windows_scope_dies_when_owner_process_exits
          tests/test_generic_host_child_output.py
          tests/test_host_child_stdin.py
          tests/test_windows_child_stdin.py -rP

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-agent-ci-5.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  checks:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/runpod-lifecycle-checkout

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Read the pinned RunPod lifecycle revision
        id: lifecycle-pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path("astrid/packs/runpod/pins.json").read_text())["sources"]["lifecycle"]
          print(f"repository={source['repository'].removeprefix('https://github.com/').removesuffix('.git')}")
          print(f"revision={source['revision']}")
          PY

      - name: Check out the pinned RunPod lifecycle (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lifecycle-pin.outputs.repository }}
          ref: ${{ steps.lifecycle-pin.outputs.revision }}
          path: runpod-lifecycle-checkout

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-4
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py

      # The collection gate imports every test module in the same environment the shards use, so it needs the pinned
      # VibeComfy checkout; without it every module that imports vibecomfy reports a collection error that is only this job.
      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      # Repo structure is gated in the default lane by a no-new-violations baseline
      # (tests/reshape/test_compare_baselines.py; scripts/reshape/baselines/structure_astrid.json).

      - name: Ruff baseline gate
        run: make ruff

      # Mypy checks the project only with the YAML stubs, and with a NumPy whose bundled stubs parse under the configured
      # Python 3.11 target; unpinned, the latest NumPy stubs make mypy stop before it checks anything.
      - name: Install mypy stubs and the NumPy that mypy can parse
        if: ${{ !cancelled() }}
        run: python -m pip install types-PyYAML 'numpy<2.4'

      - name: Mypy baseline gate
        if: ${{ !cancelled() }}
        run: make mypy

      - name: Import cycles gate
        run: make cycles

      # Root-level TLS tests are outside the PR's single unit shard. Keep the
      # transport inventory and certificate refusal probes on every PR.
      - name: Check Agent TLS policy and review regressions
        if: ${{ !cancelled() }}
        run: >-
          python -m pytest -q -rA
          tests/core/util/test_http_trust.py
          tests/installer/test_tls_fallback.py
          tests/test_721_remaining_tls_policy.py
          tests/test_721_urllib_os_tls_policy.py
          tests/test_721_tls_review.py
          tests/test_721_http_policy_guard.py
          tests/test_astrid_error_contract.py
          --deselect=tests/test_astrid_error_contract.py::test_to_envelope_omits_code_and_source_type_when_none
          --junitxml=tls-policy-regressions.xml

      # The corrected error-envelope contract runs independently of the TLS suite.
      # Execute it separately, even after an earlier failure, with its normal
      # exit. Together these two steps still run every original case.
      - name: Check independent error-envelope code-null contract
        if: ${{ always() }}
        run: >-
          python -m pytest -q -rA
          tests/test_astrid_error_contract.py::test_to_envelope_omits_code_and_source_type_when_none
          --junitxml=tls-error-contract.xml

      - name: Retain TLS policy regression results
        if: ${{ always() && hashFiles('tls-policy-regressions.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tls-policy-regressions
          path: tls-policy-regressions.xml
          if-no-files-found: error
          retention-days: 30

      - name: Retain independent error contract result
        if: ${{ always() && hashFiles('tls-error-contract.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tls-error-contract
          path: tls-error-contract.xml
          if-no-files-found: error
          retention-days: 30

      # Runs even when an earlier gate failed: a collection error stops every shard, and the ruff, mypy and cycle gates
      # being red on this branch must not hide it.
      - name: Collection errors gate
        if: ${{ !cancelled() }}
        run: make collection

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-agent-ci-4.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  unit-shard:
    name: unit shard ${{ matrix.group }} / 8 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Shard 7 has a ~35-minute tail after ~15 minutes of tests; 60 minutes cancels healthy runs.
    # Shards 1 and 6 were cancelled at 120 minutes on 05346e9f at 92%; shard 1 then took 2h03 of pytest on 1e94061c.
    # With the 120 s per-test timeout a hang fails after 2 minutes, so 180 minutes is a wall, not an allowance.
    timeout-minutes: 180
    env:
      # The test run's skip registry (tests/lanes.py) reads this: a lane this job provides fails, not skips, when its dependency is missing.
      ASTRID_CI_JOB: unit-shard-${{ matrix.os }}
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/runpod-lifecycle-checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # A pull request runs shard 1 of 8 only; the job name and --splits 8 are unchanged.
        group: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1,2,3,4,5,6,7,8]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # These release-0 rollback and launcher tests archive a pinned historical
      # Agent source tree; the default shallow checkout does not contain it.
      - name: Fetch release-0 Agent archive for installer rollback tests
        shell: bash
        run: |
          set -euo pipefail
          release0_agent=3204bb00135bec8ee2d2d3fb21eed5abfceca649
          git fetch --no-tags --depth=1 origin "$release0_agent"
          test "$(git rev-parse "${release0_agent}^{commit}")" = "$release0_agent"
          git cat-file -e "${release0_agent}:astrid/installer/core.py"
          git archive --format=tar "$release0_agent" astrid >/dev/null
          echo "- Release-0 Agent archive: $release0_agent (tree and archive available)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Read the pinned RunPod lifecycle revision
        id: lifecycle-pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path("astrid/packs/runpod/pins.json").read_text())["sources"]["lifecycle"]
          print(f"repository={source['repository'].removeprefix('https://github.com/').removesuffix('.git')}")
          print(f"revision={source['revision']}")
          PY

      - name: Check out the pinned RunPod lifecycle (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lifecycle-pin.outputs.repository }}
          ref: ${{ steps.lifecycle-pin.outputs.revision }}
          path: runpod-lifecycle-checkout

      - name: Record RunPod lifecycle checkout
        shell: bash
        env:
          LIFECYCLE_REVISION: ${{ steps.lifecycle-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_TEST_LIFECYCLE_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$LIFECYCLE_REVISION"
          echo "- RunPod lifecycle: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-3
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The product's pinned Node (.node-version), the one the installer ships: the tests run the same Node the product does.
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pinned Remotion dependencies
        run: npm ci --prefix remotion

      - name: Install system media tools and a system font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
        shell: bash

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        shell: bash
        env:
          VIBECOMFY_REVISION: ${{ steps.vibecomfy-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_VIBECOMFY_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$VIBECOMFY_REVISION"
          echo "- VibeComfy: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Unit tests (default lane shard)
        # Read the committed baseline for selection; write only this shard's
        # measured tests so the eight artifacts can be merged without stale entries.
        env:
          PYTHONUNBUFFERED: 1
          ASTRID_PYTEST_HARD_EXIT_ON_LEAKED_THREADS: 1
        run: python -m pytest -v -rA --durations=40 --splits 8 --group ${{ matrix.group }} --durations-path tests/.test_durations --store-durations --clean-durations

      - name: Upload measured test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: test-durations-${{ matrix.group }}-${{ matrix.os }}
          path: tests/.test_durations
          include-hidden-files: true
          if-no-files-found: error

      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-agent-ci-3.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  unit:
    name: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, unit-shard]
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      SHARDS_RESULT: ${{ needs.unit-shard.result }}
    steps:
      - name: Require all unit shards and fast checks to pass
        run: |
          if [[ "$CHECKS_RESULT" != success || "$SHARDS_RESULT" != success ]]; then
            echo "::error::unit requires successful dependencies: fast checks=$CHECKS_RESULT, unit shards=$SHARDS_RESULT"
            exit 1
          fi
          echo "unit passed"

  darwin-native:
    name: darwin native
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      ASTRID_CI_JOB: darwin-native
      # A test in both the integration and a darwin lane starts real Runtime daemons from this checkout (tests/helpers/runtime.py).
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (astrid-runtime)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-2
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore npm cache (C-08)
        id: c08-agent-ci-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remotion/package-lock.json') }}
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install Remotion dependencies
        run: npm ci --prefix remotion

      - name: Install package with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Install the Runtime and client from the checkout
        run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        shell: bash
        env:
          VIBECOMFY_REVISION: ${{ steps.vibecomfy-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_VIBECOMFY_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$VIBECOMFY_REVISION"
          echo "- VibeComfy: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Provision the Remotion browser
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Install the Codex CLI (the codex_cli lane starts its native binary in the host sandbox)
        run: npm install -g @openai/codex@0.163.0

      # The lanes the default run deselects and only this job provides: native macOS, the Remotion install, headless Chromium, the Codex CLI.
      - name: Darwin native, Remotion and browser tests
        run: python -m pytest -q -rA -m "darwin_native or remotion or chrome or codex_cli"

  # Release wheel (testing plan R-1: kept from the old m8 artifact job). Hashed build tools, one wheel,
  # installed with only the hashed runtime lock, and the toolchain recorded next to it. It is also the
  # one check that every Python pyproject.toml admits (>=3.11) installs and imports Astrid.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-agent-ci-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remotion/package-lock.json') }}
      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-agent-ci-2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}

  release:
    name: release wheel / Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install wheel builder
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock

      - name: Build exactly one wheel
        run: |
          python -m build --wheel --no-isolation --outdir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1

      - name: Install the wheel with the hashed runtime lock only
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/runtime.lock
          "$RUNNER_TEMP/release-venv/bin/python" scripts/ci_install_runtime.py
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/release-venv/bin/python" -c "import astrid"

      # The default-lane home for "the shipped wheel works when installed" (testing plan R-1):
      # it adopts the wheel and venv built above, so the wheel that is uploaded is the wheel that is smoked.
      - name: Smoke the installed wheel
        run: bash scripts/smoke_wheel_install.sh --wheel dist/*.whl --venv "$RUNNER_TEMP/release-venv"

      - name: Validate locks and record the release toolchain
        run: python -m scripts.reshape.release_reproducibility --expected-python ${{ matrix.python-version }} --output dist/toolchain.json

      - name: Upload the wheel and its toolchain record
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: release-wheel-${{ matrix.python-version }}
          path: dist/

  # Boundary: every vendored copy matches the immutable Runtime commit selected by runtime.lock.json.
  # The default-lane test catches local edits; this job also verifies producer manifest and source bytes.
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the pinned Runtime commit
        id: runtime-pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (producer)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: runtime-producer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: All vendored Runtime artifacts match the pinned producer
        run: python scripts/vendor_lock.py check runtime.lock.json --producer runtime-producer

  # A pull request into a release branch comes from a branch of that release and names what it belongs
  # to: the plan (a plan branch does so by its name) or the astrid-dev issue. See the Release skill,
  # "How a release runs".
  landing-reference:
    name: landing reference
    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from a branch of this release and names its plan or issue
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          release="${BASE_REF#release/}"; release="${release%/main}"
          if ! printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/[a-z0-9][a-z0-9-]*$" || [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "::error::A pull request into ${BASE_REF} must come from a branch of that release: release/${release}/plan-<PP> or release/${release}/<topic>. This one comes from '${HEAD_REF}'."
            exit 1
          fi
          if printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/plan-[0-9]+$"; then
            echo "Plan branch: $HEAD_REF"; exit 0
          fi
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq '(plan[ -]?[0-9]+|astrid-dev#[0-9]+|astrid-dev/issues/[0-9]+)'; then
            echo "Reference found."; exit 0
          fi
          echo "::error::A pull request into a release branch must name the plan or the astrid-dev issue it belongs to, for example 'Plan 55' or 'banodoco/astrid-dev#721'."
          exit 1
