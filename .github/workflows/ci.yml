name: R93-D exact base and head proof (disposable)
run-name: R93-D 90fe6e96 exact proof
'on': workflow_dispatch
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: r93-d-90fe6e96-v1-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BASE_SHA: 44d59774abb638c61ed0aae2b32653e62a5bcf66
      BASE_TREE: 7f580eb0d59121108f36ababb3f1dfdc625b2a3a
      HEAD_SHA: 90fe6e96459d9b09a2225bc791a010e0e82ab5da
      HEAD_TREE: 738b93b02594e1967c8f500b9ab4d46865c4c0a0
      DEV_SHA: 21feb35007210df7bc23a03c6226e2c5873fdab1
      DEV_TREE: 700a4a21af4f9ede7a09995863ae07dbf441a4a2
      PROOF_REF: proof/93-d-90fe6e96-v1
    steps:
      - name: Initialize receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r93-d-receipts"
          printf 'run=%s attempt=%s event=%s ref=%s sha=%s workflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" > "$RUNNER_TEMP/r93-d-receipts/event.txt"
          test "$GITHUB_REPOSITORY" = banodoco/astrid-agent
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$PROOF_REF"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: wrapper
        with:
          ref: ${{ github.sha }}
          path: wrapper
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: base
        with:
          ref: 44d59774abb638c61ed0aae2b32653e62a5bcf66
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: head
        with:
          ref: 90fe6e96459d9b09a2225bc791a010e0e82ab5da
          path: head
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: dev
        with:
          repository: banodoco/astrid-dev
          ref: 21feb35007210df7bc23a03c6226e2c5873fdab1
          path: dev
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        id: uv
        with:
          enable-cache: false
      - name: Guard, setup, collect and execute both exact payloads
        id: execute
        if: always()
        timeout-minutes: 75
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_OUTCOMES: ${{ steps.wrapper.outcome }} ${{ steps.base.outcome }} ${{ steps.head.outcome }} ${{ steps.dev.outcome }} ${{ steps.python.outcome }} ${{ steps.uv.outcome }}
        run: |
          set -euo pipefail
          export R="$RUNNER_TEMP/r93-d-receipts"
          mkdir -p "$R"
          token=$GH_TOKEN
          unset GH_TOKEN GITHUB_TOKEN GEN_DESELECT_FILE PYTEST_ADDOPTS VERIFY_SIDE
          driver="$RUNNER_TEMP/r93-d-driver.sh"
          cat > "$driver" <<'DRIVER'
          set -euo pipefail
          W=$GITHUB_WORKSPACE
          A=repos/banodoco/astrid-agent
          check_checkout() {
            local path=$1 sha=$2 tree=$3 status
            test "$(git -C "$path" rev-parse HEAD)" = "$sha"
            test "$(git -C "$path" rev-parse 'HEAD^{tree}')" = "$tree"
            status=$(git -C "$path" status --porcelain --untracked-files=all)
            printf '%s HEAD=%s TREE=%s STATUS=%s\n' "$path" "$sha" "$tree" "$status"
            test -z "$status"
          }
          guard() {
            test "$GITHUB_REPOSITORY" = banodoco/astrid-agent
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = "refs/heads/$PROOF_REF"
            test "$GITHUB_WORKFLOW_REF" = "banodoco/astrid-agent/.github/workflows/ci.yml@refs/heads/$PROOF_REF"
            test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$(gh api "$A/git/ref/heads/$PROOF_REF" --jq .object.sha)" = "$GITHUB_SHA"
            test "$(gh api "$A/git/ref/heads/release/16/plan-93" --jq .object.sha)" = "$BASE_SHA"
            test "$(gh api "$A/git/ref/heads/p93/R93-D" --jq .object.sha)" = "$HEAD_SHA"
            pr=$(gh api "$A/pulls/696" --jq '[.state,.draft,.merged,.base.repo.full_name,.base.ref,.base.sha,.head.repo.full_name,.head.ref,.head.sha] | @tsv')
            printf 'PR696=%s\n' "$pr"
            test "$pr" = "$(printf 'open\ttrue\tfalse\tbanodoco/astrid-agent\trelease/16/plan-93\t%s\tbanodoco/astrid-agent\tp93/R93-D\t%s' "$BASE_SHA" "$HEAD_SHA")"
            test "$(gh api "$A/git/commits/$BASE_SHA" --jq .tree.sha)" = "$BASE_TREE"
            test "$(gh api "$A/git/commits/$HEAD_SHA" --jq .tree.sha)" = "$HEAD_TREE"
            wrapper_tree=$(gh api "$A/git/commits/$GITHUB_SHA" --jq .tree.sha)
            check_checkout "$W/wrapper" "$GITHUB_SHA" "$wrapper_tree"
            test "$(git -C "$W/wrapper" rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $HEAD_SHA"
            test "$(git -C "$W/wrapper" diff --name-only "$HEAD_SHA" "$GITHUB_SHA")" = .github/workflows/ci.yml
            git -C "$W/wrapper" rev-parse HEAD:.github/workflows/ci.yml
            sha256sum "$W/wrapper/.github/workflows/ci.yml"
            run=$(gh api "$A/actions/runs/$GITHUB_RUN_ID" --jq '[.event,.head_branch,.head_sha,.workflow_id,.run_attempt] | @tsv')
            test "$run" = "$(printf 'workflow_dispatch\t%s\t%s\t282274792\t1' "$PROOF_REF" "$GITHUB_SHA")"
            ids=$(gh api --paginate "$A/actions/workflows/282274792/runs?branch=proof%2F93-d-90fe6e96-v1&event=workflow_dispatch&per_page=100" --jq '.workflow_runs[].id')
            printf 'dispatch_ids=%s\n' "$ids"
            test "$ids" = "$GITHUB_RUN_ID"
            check_checkout "$W/base" "$BASE_SHA" "$BASE_TREE"
            check_checkout "$W/head" "$HEAD_SHA" "$HEAD_TREE"
            check_checkout "$W/dev" "$DEV_SHA" "$DEV_TREE"
            test "$(git -C "$W/dev" hash-object env/agent-setup.sh)" = 2da3dc49bd2180f62fcabe2db787eb79bacff3d8
            test "$(git -C "$W/dev" hash-object env/agent-pytest.sh)" = 4bd27a26c096824490aaea9711fa10f8208652a8
            test "$(git -C "$W/dev" hash-object env/agent-pytest-pod.sh)" = c55ba94bef3b0434651d4b2d57dd7574b49e1ebe
          }
          deps() {
            local side=$1 E="$W/$1.env" pair repo pin tree free
            if test "$side" = base; then
              check_checkout "$W/base" "$BASE_SHA" "$BASE_TREE"
            else
              test "$side" = head
              check_checkout "$W/head" "$HEAD_SHA" "$HEAD_TREE"
            fi
            check_checkout "$W/dev" "$DEV_SHA" "$DEV_TREE"
            for pair in runtime:686ca695469bda48cd40a70824c4ccef2a137284 vibecomfy:55c3948212d23cf037fae8a4c6faad77d33e7279 lifecycle:9f88ef7640bc664f697112d966ecefa123d44340; do
              repo=$(cut -d: -f1 <<< "$pair"); pin=$(cut -d: -f2 <<< "$pair")
              tree=$(git -C "$E/$repo" rev-parse "$pin^{tree}")
              check_checkout "$E/$repo" "$pin" "$tree"
            done
            cat "$E/setup.txt"
            "$E/venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3,13); print(sys.version)'
            free=$(df -Pk "$E/basetemp" | awk 'NR==2 {print $4}')
            printf 'free_KiB=%s\n' "$free"
            test "$free" -gt 2097152
          }
          case "$1" in
            guard) guard ;;
            prerequisites)
              printf 'action_outcomes=%s\n' "$ACTION_OUTCOMES"
              test "$ACTION_OUTCOMES" = 'success success success success success success'
              for tool in gh git uv python; do command -v "$tool"; done
              if ! command -v ffmpeg || ! command -v ffprobe; then
                sudo apt-get update
                sudo apt-get install -y ffmpeg
              fi
              ffmpeg -version; ffprobe -version; uv --version; python --version; df -Pk "$W"
              ;;
            setup)
              cd "$W/$2"
              bash "$W/dev/env/agent-setup.sh"
              ;;
            deps) deps "$2" ;;
            collect|test)
              mode=$1; side=$2; cd "$W/$side"
              base_node=tests/test_onboarding_one_home.py::test_shipped_skills_run_astrid_through_the_launcher_not_python_m
              if test "$side" = base; then
                selectors=("$base_node")
              else
                selectors=(tests/test_ladder_skill_wiring.py tests/test_ladder_wording.py tests/test_installer_maintained_guides.py tests/test_onboarding_one_home.py tests/test_setup_skill_branches.py tests/test_setup_skill_pack.py)
              fi
              export VERIFY_SIDE="$side" PYTEST_ADDOPTS=-rA
              unset GEN_DESELECT_FILE
              printf 'mode=%s side=%s selectors=' "$mode" "$side"; printf '%q ' "${selectors[@]}"; printf '\n'
              if test "$mode" = collect; then
                bash "$W/dev/env/agent-pytest.sh" --collect-only -q "${selectors[@]}"
              else
                bash "$W/dev/env/agent-pytest.sh" -q --junitxml="$R/$side.xml" "${selectors[@]}"
              fi
              ;;
            *) exit 64 ;;
          esac
          DRIVER
          cat > "$RUNNER_TEMP/r93-d-log.sh" <<'LOGGER'
          logged() {
            local label=$1; shift
            local -a ps
            set +e
            "$@" 2>&1 | tee "$R/$label.log"
            ps=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${ps[0]}" "${ps[1]}" > "$R/$label.exit"
          }
          good() { test -f "$R/$1.exit" && grep -qx '0 0' "$R/$1.exit"; }
          LOGGER
          source "$RUNNER_TEMP/r93-d-log.sh"
          logged preflight env GH_TOKEN="$token" bash "$driver" guard
          if good preflight; then
            logged prerequisites bash "$driver" prerequisites
            if good prerequisites; then
              for side in base head; do
                logged "$side-setup" bash "$driver" setup "$side"
                if good "$side-setup"; then
                  logged "$side-deps-before" bash "$driver" deps "$side"
                  if good "$side-deps-before"; then
                    logged "$side-collect" bash "$driver" collect "$side"
                    logged "$side-test" bash "$driver" test "$side"
                  fi
                fi
              done
            fi
          fi
      - name: Final guards and classify actual receipts
        if: always()
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          export R="$RUNNER_TEMP/r93-d-receipts"
          mkdir -p "$R"
          token=$GH_TOKEN
          unset GH_TOKEN GITHUB_TOKEN GEN_DESELECT_FILE PYTEST_ADDOPTS VERIFY_SIDE
          driver="$RUNNER_TEMP/r93-d-driver.sh"
          if ! test -s "$driver" || ! test -s "$RUNNER_TEMP/r93-d-log.sh"; then
            printf '{"qualification":"NOT_QUALIFIED","reason":"execution driver unavailable"}\n' > "$R/summary.json"
            exit 1
          fi
          source "$RUNNER_TEMP/r93-d-log.sh"
          for side in base head; do
            if good "$side-setup"; then
              logged "$side-deps-after" bash "$driver" deps "$side"
            fi
          done
          logged postflight env GH_TOKEN="$token" bash "$driver" guard
          python3 - "$R" "$EXECUTE_OUTCOME" <<'PY'
          import json, pathlib, re, sys, xml.etree.ElementTree as ET
          r = pathlib.Path(sys.argv[1])
          stages = {}
          for path in sorted(r.glob('*.exit')):
              stages[path.stem] = [int(x) for x in path.read_text().split()]
          required = ['preflight', 'prerequisites', 'postflight']
          for side in ('base', 'head'):
              required += [f'{side}-{s}' for s in ('setup','deps-before','collect','deps-after')]
          infra = [s for s in required if stages.get(s) != [0,0]]
          if sys.argv[2] != 'success':
              infra.append('execute-step-' + sys.argv[2])
          summary = {'stage_exits_producer_tee': stages, 'infrastructure_failures': infra}
          historical_node = 'test_shipped_skills_run_astrid_through_the_launcher_not_python_m'
          historical_line = 'astrid/packs/runpod/docs/SKILL.md:69:'
          for side in ('base','head'):
              data = {'test_exit': stages.get(f'{side}-test')}
              try:
                  nodes = [s for s in (r/f'{side}-collect.log').read_text().splitlines() if re.match(r'^tests/[^\n]+\.py::', s)]
                  data['collected_selected'] = len(nodes)
                  by_file = {}
                  for node in nodes:
                      file = node.split('::',1)[0]
                      by_file[file] = by_file.get(file,0) + 1
                  data['selected_by_file'] = by_file
                  data['collection_tail'] = (r/f'{side}-collect.log').read_text().splitlines()[-12:]
                  cases = list(ET.parse(r/f'{side}.xml').getroot().iter('testcase'))
                  failures = [c for c in cases if c.find('failure') is not None]
                  errors = [c for c in cases if c.find('error') is not None]
                  skipped = [c for c in cases if c.find('skipped') is not None]
                  def identity(c): return c.get('classname','') + '::' + c.get('name','')
                  same = len(failures) == 1 and not errors and failures[0].get('name') == historical_node and failures[0].get('classname','').endswith('test_onboarding_one_home')
                  if same:
                      failure = failures[0].find('failure')
                      message = (failure.get('message') or '') + (failure.text or '')
                      same = historical_line in message and 'python3 -m astrid generate settings' in message
                  complete = len(nodes) == len(cases) > 0 and len(set(nodes)) == len(nodes)
                  if side == 'head':
                      complete = complete and set(by_file) == {
                          'tests/test_ladder_skill_wiring.py', 'tests/test_ladder_wording.py',
                          'tests/test_installer_maintained_guides.py', 'tests/test_onboarding_one_home.py',
                          'tests/test_setup_skill_branches.py', 'tests/test_setup_skill_pack.py'}
                  if side == 'base':
                      complete = complete and len(cases) == 1 and nodes[0] == 'tests/test_onboarding_one_home.py::' + historical_node and cases[0].get('name') == historical_node
                  data.update(cases=len(cases), failures=[identity(c) for c in failures], errors=[identity(c) for c in errors], skipped=[identity(c) for c in skipped], complete=complete, historical_only=bool(same))
                  rc = data['test_exit']
                  if not complete or not rc or rc[1] != 0:
                      data['result'] = 'INCOMPLETE_OR_LOG_FAILURE'
                  elif rc == [0,0] and not failures and not errors and len(skipped) < len(cases) and (side != 'base' or not skipped):
                      data['result'] = 'DEFAULT_LANE_PASSED'
                  elif rc == [1,0] and same:
                      data['result'] = 'HISTORICAL_LAUNCHER_FAILURE_ONLY'
                  else:
                      data['result'] = 'FAILED_OR_INCOMPLETE'
              except (OSError, ET.ParseError, ValueError) as exc:
                  data.update(result='MISSING_OR_INVALID_RECEIPT', detail=str(exc))
              summary[side] = data
          ok = not infra and summary['base']['result'] in ('DEFAULT_LANE_PASSED','HISTORICAL_LAUNCHER_FAILURE_ONLY') and summary['head']['result'] == 'DEFAULT_LANE_PASSED'
          summary['qualification'] = 'HEAD_DEFAULT_LANE_PASSED' if ok else 'NOT_QUALIFIED'
          result = json.dumps(summary, indent=2, sort_keys=True)
          (r/'summary.json').write_text(result+'\n')
          print(result)
          sys.exit(0 if ok else 1)
          PY
      - name: Preserve bounded proof receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r93-d-90fe6e96-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r93-d-receipts/
          if-no-files-found: error
          retention-days: 14
