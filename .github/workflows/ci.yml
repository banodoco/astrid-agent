name: LS-12 matched macOS first-job work observation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  observed-sdk:
    name: One SDK first job per source on the same Mac
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_COMPILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          sparse-checkout: scripts/ci/ls12_owned_proof
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e379565641414bc183cd02edebab1cbf77617931
          path: source-a
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7194011c2f41643a699f261c5276886612bc2186
          path: source-b
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: 62333bd797e84b21cb3995e4bcf580ed0bdcf9f0
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: 1ba0ac3ad4fe69fa0b4966cc41e6852224013f97
          path: vibe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/runpod-lifecycle
          ref: 7f0b025e9391baac9f5c2fb7393617ea6fef0704
          path: lifecycle
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the original CPU test dependencies once
        id: setup
        run: |
          python -m venv "$RUNNER_TEMP/ls12-venv"
          py="$RUNNER_TEMP/ls12-venv/bin/python"
          "$py" -m pip install -e './source-b[dev]'
          "$py" -m pip install --no-deps -e ./runtime -e ./runtime/packages/python -e ./lifecycle
          "$py" -m pip install -e ./vibe
      - name: Observe the original SDK case on e379
        run: '"$RUNNER_TEMP/ls12-venv/bin/python" controller/scripts/ci/ls12_owned_proof/matched.py source-a'
      - name: Observe the original SDK case on 7194
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: '"$RUNNER_TEMP/ls12-venv/bin/python" controller/scripts/ci/ls12_owned_proof/matched.py source-b'
      - name: Retain the two diagnostic receipts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ls12-owned-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ls12-public/*.json
            ${{ runner.temp }}/ls12-public/*.junit.xml
          if-no-files-found: error
