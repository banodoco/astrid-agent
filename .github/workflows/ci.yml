name: P39 SDK child discovery comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DESTINATION: b1e53baf5facbb340dfc42b1688f7152c255e351
      CANDIDATE: f0283b919d5584fb2c6773d91a6b7090f98a4d8f
      CASE: tests/core/execution/test_generic_host_child_bridge_d18.py::test_real_sdk_verified_artifacts_and_managed_outputs[python]
      ASTRID_CI_JOB: lanes-integration
      ASTRID_CI_MATRIX: '0'
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibe
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/life
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.DESTINATION }}
          path: agent
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: banodoco/astrid-runtime
          ref: 2537fed24385ec1c24f48a812e09af4bb63fb794
          path: runtime
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: banodoco/VibeComfy
          ref: c27fe76b79d917fd9c08246660bc77211be64146
          path: vibe
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: banodoco/runpod-lifecycle
          ref: 7f0b025e9391baac9f5c2fb7393617ea6fef0704
          path: life
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.32'
      - name: Install the source and dependencies used by the original case
        working-directory: agent
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          git diff --exit-code "$DESTINATION" "$CANDIDATE" -- pyproject.toml runtime.lock.json astrid/packs/runpod/pins.json tests/core/execution/test_generic_host_child_bridge_d18.py astrid/core/execution/generic_host.py scripts/ci/run_pytest.py scripts/ci/pytest_entrypoint.py scripts/ci/ceiling_pytest.py
          test "$(git rev-parse HEAD)" = "$DESTINATION"
          test "$(git -C ../runtime rev-parse HEAD)" = "$(jq -r .source_commit runtime.lock.json)"
          test "$(git -C ../vibe rev-parse HEAD)" = "$(jq -r .sources.vibecomfy.revision astrid/packs/runpod/pins.json)"
          test "$(git -C ../life rev-parse HEAD)" = "$(jq -r .sources.lifecycle.revision astrid/packs/runpod/pins.json)"
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e ../runtime -e ../runtime/packages/python
          python -m pip install -e ../vibe
      - name: Alternate the original case on the two frozen refs
        working-directory: agent
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/discovery-receipts"
          mkdir -p "$evidence"
          python -m pip freeze > "$evidence/python.txt"
          uname -a > "$evidence/runner.txt"
          df -B1 . >> "$evidence/runner.txt"
          for repo in agent runtime vibe life; do git -C "../$repo" rev-parse HEAD >> "$evidence/runner.txt"; done
          export PYTHONPATH="$PWD/scripts"
          verdict=0
          for trial in 1 2 3; do
            for ref in "$DESTINATION" "$CANDIDATE"; do
              git checkout --quiet --detach "$ref"
              test "$(git rev-parse HEAD)" = "$ref"
              git diff --exit-code HEAD
              cell="$evidence/$trial-$ref"
              mkdir "$cell"
              git rev-parse HEAD 'HEAD^{tree}' > "$cell/source.txt"
              df -B1 . > "$cell/disk.txt"
              scratch="$(mktemp -d "$RUNNER_TEMP/child-discovery.XXXXXX")"
              rc=0
              (
                export HOME="$scratch/home" TMPDIR="$scratch/tmp" ASTRID_HOME="$scratch/astrid"
                export ASTRID_WORKSPACE_CONFIG_DIR="$scratch/workspace" XDG_RUNTIME_DIR="$scratch/run"
                mkdir -m 700 "$HOME" "$TMPDIR" "$ASTRID_HOME" "$ASTRID_WORKSPACE_CONFIG_DIR" "$XDG_RUNTIME_DIR"
                export CEILING_STEP_DIR="$cell"
                python -P -m ci.run_pytest -p ceiling_pytest -v -rA --junitxml="$cell/test.xml" -m 'integration and not opt_in and not app_checkout' "$CASE"
              ) > "$cell/launcher.log" 2>&1 || rc=$?
              echo "$rc" > "$cell/exit.txt"
              if (( rc != 0 )); then verdict=1; fi
              if ! python -c 'import os,sys,xml.etree.ElementTree as ET; cases=ET.parse(sys.argv[1]).findall(".//testcase"); assert len(cases)==1 and cases[0].get("name")==os.environ["CASE"].split("::")[-1] and cases[0].find("skipped") is None' "$cell/test.xml"; then verdict=1; fi
            done
          done
          exit "$verdict"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p39-original-sdk-child-discovery
          path: ${{ runner.temp }}/discovery-receipts
          if-no-files-found: error
