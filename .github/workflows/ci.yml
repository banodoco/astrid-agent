name: WS9 exact original and full-plan CPU proof v3
on:
  workflow_dispatch:
    inputs:
      expected_wrapper:
        description: Exact independently reviewed wrapper commit
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ws9-5c0bb64-ecdb223-one-cpu-proof
  cancel-in-progress: false
jobs:
  proof:
