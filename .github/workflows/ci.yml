name: AT12 paired hosted qualification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTEST_ADDOPTS: -rA
jobs:
  unit-shard:
    name: AT12 paired trials with original unit shard 2
    runs-on: ${{ matrix.os }}
    # Shard 7 has a ~35-minute tail after ~15 minutes of tests; 60 minutes cancels healthy runs.
    # Shards 1 and 6 were cancelled at 120 minutes on 05346e9f at 92%; shard 1 then took 2h03 of pytest on 1e94061c.
    # With the 120 s per-test timeout a hang fails after 2 minutes, so 180 minutes is a wall, not an allowance.
    timeout-minutes: 180
    env:
      # The test run's skip registry (tests/lanes.py) reads this: a lane this job provides fails, not skips, when its dependency is missing.
      ASTRID_CI_JOB: unit-shard-${{ matrix.os }}
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/runpod-lifecycle-checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # A pull request runs shard 1 of 8 only; the job name and --splits 8 are unchanged.
        group: [2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: 7301b471ceafb1e3224f135e6365faec297c0bea
          fetch-depth: 2

      # These release-0 rollback and launcher tests archive a pinned historical
      # Agent source tree; the default shallow checkout does not contain it.
      - name: Fetch release-0 Agent archive for installer rollback tests
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-01 --shell bash "{0}"
        run: |
          set -euo pipefail
          release0_agent=3204bb00135bec8ee2d2d3fb21eed5abfceca649
          git fetch --no-tags --depth=1 origin "$release0_agent"
          test "$(git rev-parse "${release0_agent}^{commit}")" = "$release0_agent"
          git cat-file -e "${release0_agent}:astrid/installer/core.py"
          git archive --format=tar "$release0_agent" astrid >/dev/null
          echo "- Release-0 Agent archive: $release0_agent (tree and archive available)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the pinned Runtime commit
        id: runtime-pin
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-02 --shell bash "{0}"
        run: echo "commit=$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" >> "$GITHUB_OUTPUT"

      - name: Check out the Runtime (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-pin.outputs.commit }}
          path: astrid-runtime

      - name: Read the pinned RunPod lifecycle revision
        id: lifecycle-pin
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-04 --shell bash "{0}"
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path("astrid/packs/runpod/pins.json").read_text())["sources"]["lifecycle"]
          print(f"repository={source['repository'].removeprefix('https://github.com/').removesuffix('.git')}")
          print(f"revision={source['revision']}")
          PY

      - name: Check out the pinned RunPod lifecycle (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lifecycle-pin.outputs.repository }}
          ref: ${{ steps.lifecycle-pin.outputs.revision }}
          path: runpod-lifecycle-checkout

      - name: Record RunPod lifecycle checkout
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell bash "{0}"
        env:
          LIFECYCLE_REVISION: ${{ steps.lifecycle-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_TEST_LIFECYCLE_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$LIFECYCLE_REVISION"
          echo "- RunPod lifecycle: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pip cache (C-08)
        id: c08-agent-ci-3
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      # The product's pinned Node (.node-version), the one the installer ships: the tests run the same Node the product does.
      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install system media tools and a system font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-11 --shell bash "{0}"

      - name: Install package with dev extras
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-12 --shell bash "{0}"
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-13 --shell bash "{0}"
        run: python scripts/ci_install_runtime.py

      - name: Read the pinned VibeComfy revision
        id: vibecomfy-pin
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-14 --shell bash "{0}"
        run: |
          rev="$(python3 scripts/vibecomfy_pin.py)"
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "VibeComfy engine recipe must resolve to a full lowercase 40-hex revision" >&2
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: Check out VibeComfy at the pinned engine revision
        uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.vibecomfy-pin.outputs.revision }}
          path: vibecomfy-checkout

      - name: Record VibeComfy checkout
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-16 --shell bash "{0}"
        env:
          VIBECOMFY_REVISION: ${{ steps.vibecomfy-pin.outputs.revision }}
        run: |
          set -euo pipefail
          checked_out="$(git -C "$ASTRID_VIBECOMFY_CHECKOUT" rev-parse HEAD)"
          test "$checked_out" = "$VIBECOMFY_REVISION"
          echo "- VibeComfy: $checked_out" >> "$GITHUB_STEP_SUMMARY"

      - name: Install VibeComfy
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-17 --shell bash "{0}"
        run: python -m pip install -e ./vibecomfy-checkout

      - name: Run fixed paired trials with unchanged shard 2
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          PYTHONUNBUFFERED: 1
          ASTRID_PYTEST_HARD_EXIT_ON_LEAKED_THREADS: 1
          AT12_SHARD_COMMAND: >-
            mkdir -p "$TEST_RESULTS_DIR" && python -P -m ci.run_pytest -p ceiling_pytest -v -rA --junitxml="$TEST_RESULTS_DIR/unit-shard.xml" --durations=40 --splits 8 --group 2 --durations-path tests/.test_durations --store-durations --clean-durations
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-18 --shell bash "{0}"
        run: |
          cat > "$RUNNER_TEMP/at12_trials.py" <<'AT12_PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import threading
          import time
          from pathlib import Path
          from xml.etree import ElementTree

          BASE = "6076344855410066a01f09b54d8ef7101700a66d"
          CANDIDATE = "7301b471ceafb1e3224f135e6365faec297c0bea"
          SUITE = "tests/core/generation/test_readiness_missing_models.py"
          ID = SUITE + "::test_the_download_plan_and_readiness_agree[True]"
          tmp = Path(os.environ["RUNNER_TEMP"])
          out = tmp / "at12-proof"
          out.mkdir()
          load_dir = out / "load"
          load_dir.mkdir()
          journal = load_dir / "unit-shard.jsonl"


          def git(*args, cwd=None):
              return subprocess.check_output(["git", *args], cwd=cwd, text=True).strip()


          def save(file, value):
              file.write_text(json.dumps(value, indent=2) + "\n")


          def group_cpu_ticks(process):
              # Include only processes in the original shard's process group.
              total = 0
              for entry in Path("/proc").iterdir():
                  if not entry.name.isdecimal():
                      continue
                  try:
                      fields = (entry/"stat").read_text().rsplit(")", 1)[1].split()
                      if int(fields[2]) == process.pid:
                          total += sum(int(x) for x in fields[11:15])
                  except (OSError, ValueError, IndexError):
                      continue
              return total


          def snapshot(process):
              stat = Path("/proc/stat").read_text().splitlines()[0].split()[1:9]
              pressure = Path("/proc/pressure/cpu")
              return {
                  "monotonic_ns": time.monotonic_ns(), "utc_epoch": time.time(),
                  "shard_exit": process.poll(), "shard_group_cpu_ticks": group_cpu_ticks(process),
                  "journal_bytes": journal.stat().st_size if journal.exists() else 0,
                  "loadavg": os.getloadavg(),
                  "host_cpu_ticks": list(map(int, stat)),
                  "cpu_psi": pressure.read_text().splitlines()[0] if pressure.exists() else None,
              }


          def sampler(process, stop):
              with (out / "load-samples.jsonl").open("w", buffering=1) as stream:
                  while not stop.is_set():
                      stream.write(json.dumps(snapshot(process)) + "\n")
                      stop.wait(1)


          def active_calls():
              if not journal.exists():
                  return 0
              count = 0
              with journal.open() as stream:
                  for line in stream:
                      if line.endswith("\n"):
                          e = json.loads(line)
                          count += e.get("type") == "report" and e.get("when") == "call"
                          if count >= 3:
                              break
              return count


          assert git("rev-parse", "HEAD") == CANDIDATE and git("rev-parse", "HEAD^") == BASE
          assert git("diff", "--name-only", BASE, CANDIDATE) == SUITE
          trees = {}
          fixtures = {}
          for label, ref in (("base", BASE), ("candidate", CANDIDATE)):
              source = tmp / ("at12-" + label + "-source")
              subprocess.run(["git", "worktree", "add", "--detach", str(source), ref], check=True)
              assert git("rev-parse", "HEAD", cwd=source) == ref
              trees[label] = source
              fixtures[label] = hashlib.sha256((source / SUITE).read_bytes()).hexdigest()
          save(out / "environment.json", {
              "base":BASE, "candidate":CANDIDATE, "driver":os.environ["GITHUB_SHA"],
              "target":ID, "fixture_sha256":fixtures, "full_shard_source":CANDIDATE,
              "kernel":os.uname().release, "cpus":len(os.sched_getaffinity(0)), "python":sys.version,
              "image":os.getenv("ImageVersion"), "run":os.environ["GITHUB_RUN_ID"],
              "attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "pins":{k:git("rev-parse","HEAD",cwd=os.environ[k]) for k in
                  ("ASTRID_RUNTIME_CHECKOUT","ASTRID_VIBECOMFY_CHECKOUT","ASTRID_TEST_LIFECYCLE_CHECKOUT")},
          })
          rows = []
          with (load_dir / "console.log").open("w") as stream:
              command = os.environ["AT12_SHARD_COMMAND"]
              load = subprocess.Popen(["bash","-ec",command], env=dict(os.environ, TEST_RESULTS_DIR=str(load_dir)),
                                      stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
              stop = threading.Event()
              samples = threading.Thread(target=sampler,args=(load,stop),daemon=True)
              samples.start()
              deadline = time.monotonic() + 1800
              while load.poll() is None and time.monotonic() < deadline and active_calls() < 3:
                  time.sleep(1)
              if load.poll() is not None or active_calls() < 3:
                  raise SystemExit("Historical shard did not reach live native calls; inconclusive")
              for pair in range(1,21):
                  for side in (("base","candidate") if pair%2 else ("candidate","base")):
                      source = trees[side]
                      dest = out / f"{pair:02}-{side}"
                      dest.mkdir()
                      scratch = tmp / f"at12-{pair}-{side}"
                      scratch.mkdir()
                      home = scratch / "home"
                      home.mkdir()
                      capture = dest / "native"
                      capture.mkdir()
                      args = [sys.executable,"-P","-m","ci.run_pytest","-p","ceiling_pytest",
                              "-v","-rA","--junitxml="+str(dest/"case.xml"),"-o","junit_logging=all",
                              "--basetemp="+str(scratch/"pytest"),ID]
                      env = dict(os.environ, HOME=str(home), XDG_CONFIG_HOME=str(home/"config"), XDG_CACHE_HOME=str(home/"cache"),
                                 XDG_DATA_HOME=str(home/"data"), XDG_STATE_HOME=str(home/"state"),
                                 TEST_RESULTS_DIR=str(dest), CEILING_STEP_DIR=str(capture),
                                 PYTHONPATH=os.pathsep.join(str(source / s) for s in ("scripts/ci","scripts")))
                      start = snapshot(load)
                      with (dest/"console.log").open("w") as log:
                          trial = subprocess.Popen(args, cwd=source, env=env, stdout=log, stderr=subprocess.STDOUT)
                          offsets = []
                          event_file = dest/"case.jsonl"
                          previous_size = 0
                          while trial.poll() is None:
                              size = event_file.stat().st_size if event_file.exists() else 0
                              if size != previous_size:
                                  offsets.append({"foreground_journal_bytes":size, "load":snapshot(load)})
                                  previous_size = size
                              time.sleep(0.1)
                          offsets.append({"foreground_journal_bytes":event_file.stat().st_size if event_file.exists() else 0,
                                          "load":snapshot(load)})
                          save(dest/"phase-offsets.json", offsets)
                      end = snapshot(load)
                      phases = []
                      journal_file = dest/"case.jsonl"
                      if journal_file.exists():
                          for line in journal_file.read_text().splitlines():
                              e = json.loads(line)
                              if e.get("type") == "report":
                                  phases.append({k:e.get(k) for k in ("nodeid","when","outcome","detail")})
                      xml = dest/"case.xml"
                      cases = [x.get("name") for x in ElementTree.parse(xml).iter("testcase")] if xml.exists() else []
                      row = dict(pair=pair,side=side,source=git("rev-parse","HEAD",cwd=source),
                                 worktree=str(source),home=str(home),fixture_sha256=fixtures[side],start=start,end=end,args=args,phases=phases,
                                 junit_names=cases,raw_exit=trial.returncode)
                      rows.append(row)
                      save(dest/"result.json",row)
                      print(pair,side,trial.returncode,flush=True)
              save(out/"series.json",rows)
              stop.set()
              samples.join()
              load_exit = load.wait()
              save(out/"load-result.json",{"command":command,"raw_exit":load_exit})

          def full_phases(row, outcomes):
              return row["junit_names"] == [ID.split("::")[-1]] and [
                  (e["nodeid"],e["when"],e["outcome"]) for e in row["phases"]
              ] == list(zip([ID]*3, ["setup","call","teardown"], outcomes))

          def original_failure(row):
              return (row["raw_exit"] == 1 and full_phases(row, ["passed","failed","passed"])
                      and "assert ready is (not planned)" in row["phases"][1]["detail"]
                      and "assert False is not []" in row["phases"][1]["detail"])

          def passed(row):
              return row["raw_exit"] == 0 and full_phases(row, ["passed"]*3)

          if len(rows) != 40 or any(r["start"]["shard_exit"] is not None or r["end"]["shard_exit"] is not None for r in rows):
              raise SystemExit("Named shard did not span all 40 trials; inconclusive")
          samples = [json.loads(line) for line in (out/"load-samples.jsonl").read_text().splitlines()]
          unresolved = []
          all_markers = []
          for r in rows:
              markers = [r["start"], *(s for s in samples if r["start"]["monotonic_ns"] < s["monotonic_ns"] < r["end"]["monotonic_ns"]), r["end"]]
              advanced = any(b["journal_bytes"] > a["journal_bytes"] or b["shard_group_cpu_ticks"] > a["shard_group_cpu_ticks"]
                             for a,b in zip(markers,markers[1:]))
              all_markers.append(advanced)
              if not advanced:
                  unresolved.append([r["pair"],r["side"]])
          save(out/"load-review.json",{"windows_with_progress":sum(all_markers),
              "windows_without_observed_cpu_or_journal_advance":unresolved,
              "state":"REVIEW" if unresolved else "ACTIVE",
              "note":"A live original shard can be inside one long call. Use phase-offsets, CPU samples, and the native journal to assess any unresolved windows."})
          if not any(all_markers) or rows[-1]["end"]["journal_bytes"] <= rows[0]["start"]["journal_bytes"]:
              raise SystemExit("No meaningful native progress evidenced over the trial series; inconclusive")
          if unresolved:
              print("Assess unresolved intervals before crediting load overlap:",unresolved,flush=True)
          if any(not passed(r) for r in rows if r["side"] == "candidate"):
              raise SystemExit("Candidate missed 20/20 genuine passes")
          baseline = [r for r in rows if r["side"] == "base"]
          if not any(original_failure(r) for r in baseline) or any(not (passed(r) or original_failure(r)) for r in baseline):
              raise SystemExit("Same original baseline failure not isolated under paired load; inconclusive")
          AT12_PY
          python "$RUNNER_TEMP/at12_trials.py"
      - name: Retain original target and named shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: at12-paired-${{ github.run_attempt }}
          path: ${{ runner.temp }}/at12-proof/
          retention-days: 30
          if-no-files-found: error
