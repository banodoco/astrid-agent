              ]
            },
            "expected_deselected": [],
            "expected_skips": [],
            "historical_offenders": [
              "astrid/packs/runpod/docs/SKILL.md:69: Opt in to full per-job re-verification with `\"models\": {\"trust_unchanged\": false}` in that same document (`python3 -m astrid generate settings checkout --file \"$WORK/generation.json\"`, edit, then `python3 -m astrid generate settings checkin \"$WORK/generation.json\"`)."
            ]
          }
          INVENTORY
          printf '%s  %s\n' ec6f6b08db648965acddb4d408d037560cae7b7b964e67c7327c67350910e696 "$R/expected-inventory.json" | sha256sum --check --strict
      - name: Final guards and classify actual receipts
        if: always()
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
        run: |
          set -euo pipefail
          export R="$RUNNER_TEMP/r93-d-receipts"
          mkdir -p "$R"
          token=$GH_TOKEN
          unset GH_TOKEN GITHUB_TOKEN GEN_DESELECT_FILE PYTEST_ADDOPTS VERIFY_SIDE
          driver="$RUNNER_TEMP/r93-d-driver.sh"
          if ! test -s "$driver" || ! test -s "$RUNNER_TEMP/r93-d-log.sh"; then
            printf '{"qualification":"NOT_QUALIFIED","reason":"execution driver unavailable"}\n' > "$R/summary.json"
            exit 1
          fi
          source "$RUNNER_TEMP/r93-d-log.sh"
          for side in base head; do
            if good "$side-setup"; then
              logged "$side-deps-after" bash "$driver" deps "$side"
            fi
          done
          logged postflight env GH_TOKEN="$token" bash "$driver" guard
          if test "$INVENTORY_OUTCOME" != success || ! test -s "$R/expected-inventory.json" || ! printf '%s  %s\n' ec6f6b08db648965acddb4d408d037560cae7b7b964e67c7327c67350910e696 "$R/expected-inventory.json" | sha256sum --check --strict; then
            printf '{"qualification":"NOT_QUALIFIED","reason":"inventory preparation unavailable or invalid"}\n' > "$R/summary.json"
            exit 1
          fi
          python3 - "$R" "$EXECUTE_OUTCOME" "$GITHUB_WORKSPACE" <<'PY'
          import collections, json, pathlib, re, sys, xml.etree.ElementTree as ET
          
          r = pathlib.Path(sys.argv[1])
          workspace = pathlib.Path(sys.argv[3])
          spec = json.loads(r.joinpath("expected-inventory.json").read_text())
          historical_node = "tests/test_onboarding_one_home.py::test_shipped_skills_run_astrid_through_the_launcher_not_python_m"
          expected_head = [file + "::" + name for file, names in spec["expected_head"].items() for name in names]
          assert len(expected_head) == len(set(expected_head)) == 80
          assert historical_node in expected_head
          expected_fixtures = ["tests/test_setup_skill_branches.py::test_runpod_machine_entry_refuses_a_job_without_a_claimed_machine","tests/test_setup_skill_branches.py::test_runpod_setup_from_pristine_settings_preserves_choices_and_quotes_without_claim"]
          assert len(set(expected_fixtures)) == 2 and set(expected_fixtures) <= set(expected_head)
          assert spec["expected_deselected"] == spec["expected_skips"] == []
          historical_offenders = spec["historical_offenders"]
          
          def counter_difference(expected, actual):
              return {"missing": sorted((collections.Counter(expected) - collections.Counter(actual)).elements()),
                      "unexpected": sorted((collections.Counter(actual) - collections.Counter(expected)).elements())}
          
          def identity(node):
              file, name = node.split("::", 1)
              assert file.startswith("tests/") and file.endswith(".py")
              return file[:-3].replace("/", "."), name
          
          def inventory_errors(expected, collected, executed, skipped, totals):
              # Executed JUnit identities must be unique and exactly equal to
              # both the independent inventory and selected collection multiset.
              differences = {
                  "expected_vs_collected": counter_difference(expected, collected),
                  "collected_vs_executed": counter_difference(collected, executed),
              }
              complete = (all(not any(d.values()) for d in differences.values())
                          and len(collected) == len(set(collected))
                          and len(executed) == len(set(executed))
                          and not skipped
                          and totals == (len(expected), len(expected), 0))
              return complete, differences
          
          def collect_inventory(text):
              nodes = [line for line in text.splitlines()
                       if re.fullmatch(r"tests/[^:\r\n]+\.py::test_[^\r\n]+", line)]
              totals = []
              for line in text.splitlines():
                  m = re.fullmatch(r"(\d+) tests? collected in [\d.]+s", line)
                  if m:
                      count = int(m[1])
                      totals.append((count, count, 0))
                  m = re.fullmatch(r"(\d+)/(\d+) tests? collected \((\d+) deselected\) in [\d.]+s", line)
                  if m:
                      totals.append(tuple(map(int, m.groups())))
              if len(totals) != 1:
                  raise ValueError("expected exactly one explicit collection summary, got " + repr(totals))
              return nodes, totals[0]
          
          def historical_message(message, offenders):
              # pytest puts the full user assertion message before its first
              # assertion-rewrite line. A second offender is a second line here.
              user, sep, rewritten = message.partition("\nassert ")
              return bool(sep and rewritten and offenders == historical_offenders
                          and user == "AssertionError: " + "\n".join(historical_offenders))
          
          def scan_offenders(root):
              # Independent read-only repeat of the ORIGINAL test's complete
              # guide inventory and matching rule, not a substitute for pytest.
              exclusions = {"astrid/packs/developer/docs/SKILL.md",
                            "astrid/packs/_core/docs/pack-builder/SKILL.md",
                            "astrid/packs/_core/docs/pack-testing/SKILL.md",
                            "docs/setup/release-recipe.md"}
              guides = sorted({*root.glob("astrid/packs/*/docs/**/SKILL.md"),
                               *root.glob("docs/setup/*.md")})
              paths = [p.relative_to(root).as_posix() for p in guides]
              if len(paths) != 34 or not exclusions.issubset(paths) or "astrid/packs/_core/docs/SKILL.md" not in paths:
                  raise ValueError("guide inventory drift: " + repr(paths))
              found = []
              for p, path in zip(guides, paths):
                  if path in exclusions:
                      continue
                  for number, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                      if re.search(r"\bpython3?\s+-m\s+astrid(?![\w.])", line):
                          found.append(f"{path}:{number}: {line.strip()}")
              return paths, found
          
          def parse_cases(path, expected):
              inverse = {identity(node): node for node in expected}
              if len(inverse) != len(expected):
                  raise ValueError("ambiguous normalization")
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              if len(suites) != 1:
                  raise ValueError("expected exactly one JUnit suite")
              suite = suites[0]
              cases = list(suite.findall("testcase"))
              if len(cases) != len(list(root.iter("testcase"))):
                  raise ValueError("nested/unaccounted testcase")
              executed, failed, errors, skipped = [], [], [], []
              historical_failure_message = None
              error_details = {}
              for case in cases:
                  pair = (case.get("classname"), case.get("name"))
                  node = inverse.get(pair, "UNRECOGNIZED:" + repr(pair))
                  executed.append(node)
                  outcomes = [e for e in case if e.tag in ("failure", "error", "skipped")]
                  if len(outcomes) > 1:
                      raise ValueError("multiple outcomes for " + node)
                  if outcomes:
                      event = outcomes[0]
                      {"failure": failed, "error": errors, "skipped": skipped}[event.tag].append(node)
                      if event.tag == "error":
                          error_details[node] = {"message": event.get("message", ""), "body": event.text or ""}
                      if event.tag == "failure" and node == historical_node:
                          historical_failure_message = event.get("message", "")
              for name, actual in (("tests", len(cases)), ("failures", len(failed)), ("errors", len(errors)), ("skipped", len(skipped))):
                  if int(suite.attrib[name]) != actual:
                      raise ValueError("JUnit aggregate disagrees: " + name)
              return executed, failed, errors, skipped, historical_failure_message, error_details
          
          def fixture_setup_error(detail, root):
              # Match the actual v2 setup-error form, not any error mentioning this fixture.
              body = detail["body"]
              lines = body.splitlines()
              reported = [line for line in lines if line.startswith("E ")]
              trace = str(root/"tests/packs/runpod/test_target_selection.py")
              return (detail["message"] == 'failed on setup with "' + body + '"'
                      and reported == ["E       fixture 'acknowledged_watchdog' not found"]
                      and "file " + trace + ", line 20" in lines
                      and "  def case(tmp_path, monkeypatch, pod_watchdog_transport, acknowledged_watchdog):" in lines
                      and bool(lines) and lines[-1] == trace + ":20")
          
          def fixture_diagnostic_result(complete, rc, failed, errors, skipped, details, root):
              if not complete or not rc or rc[1] != 0:
                  return "INCOMPLETE_OR_LOG_FAILURE"
              if rc == [0,0] and not failed and not errors and not skipped:
                  return "BASE_FIXTURE_DIAGNOSTICS_PASSED"
              if (rc == [1,0] and not failed and not skipped
                      and collections.Counter(errors) == collections.Counter(expected_fixtures)
                      and set(details) == set(expected_fixtures)
                      and all(fixture_setup_error(d, root) for d in details.values())):
                  return "BASE_FIXTURE_SETUP_ERRORS_ONLY"
              return "FAILED_OR_INCOMPLETE"

          def selfcheck():
              # Positive and adversarial accounting checks; no product test execution.
              a, b = historical_node, expected_head[0]
              normal = (2, 2, 0)
              assert inventory_errors([a,b], [a,b], [b,a], [], normal)[0]
              assert not inventory_errors([a,b], [a,b], [a,a], [], normal)[0]
              assert not inventory_errors([a,b], [a], [a], [], (1,1,0))[0]
              assert not inventory_errors([a,b], [a,b], [a,b], [b], normal)[0]
              assert not inventory_errors([a,b], [a,b], [a,b], [], (2,3,1))[0]
              assert not inventory_errors([a,b], [a,b], [a,"UNRECOGNIZED"], [], normal)[0]
              message = "AssertionError: " + historical_offenders[0] + "\nassert ['x'] == []"
              assert historical_message(message, historical_offenders)
              assert not historical_message(message.replace("\nassert ", "\nextra.py:1: extra\nassert "), historical_offenders)
              assert not historical_message(message, historical_offenders + ["extra.py:1: extra"])
              assert not historical_message(message.replace("checkout", "new checkout"), historical_offenders)
              assert collect_inventory(a + "\n1 test collected in 0.01s\n") == ([a], (1,1,0))
              assert collect_inventory(a + "\n1/2 tests collected (1 deselected) in 0.01s\n") == ([a], (1,2,1))
              assert len({identity(node) for node in expected_head}) == 80
              root = workspace/"base"
              trace = str(root/"tests/packs/runpod/test_target_selection.py")
              body = "file " + trace + ", line 20\n  def case(tmp_path, monkeypatch, pod_watchdog_transport, acknowledged_watchdog):\nE       fixture 'acknowledged_watchdog' not found\n" + trace + ":20"
              detail = {"message": 'failed on setup with "' + body + '"', "body": body}
              details = {node: detail for node in expected_fixtures}
              assert fixture_diagnostic_result(True, [1,0], [], expected_fixtures, [], details, root) == "BASE_FIXTURE_SETUP_ERRORS_ONLY"
              assert fixture_diagnostic_result(True, [0,0], [], [], [], {}, root) == "BASE_FIXTURE_DIAGNOSTICS_PASSED"
              assert fixture_diagnostic_result(False, [1,0], [], expected_fixtures, [], details, root) == "INCOMPLETE_OR_LOG_FAILURE"
              assert fixture_diagnostic_result(True, [1,1], [], expected_fixtures, [], details, root) == "INCOMPLETE_OR_LOG_FAILURE"
              assert fixture_diagnostic_result(True, [1,0], [], expected_fixtures[:1], [], details, root) == "FAILED_OR_INCOMPLETE"
              assert fixture_diagnostic_result(True, [1,0], [a], expected_fixtures, [], details, root) == "FAILED_OR_INCOMPLETE"
              assert not fixture_setup_error({**detail, "message": "failed on call with " + body}, root)
              other = body.replace("fixture 'acknowledged_watchdog' not found", "fixture 'other' not found")
              assert not fixture_setup_error({"message": 'failed on setup with "' + other + '"', "body": other}, root)
              extra = body.replace("\nE ", "\nE       another error\nE ")
              assert not fixture_setup_error({"message": 'failed on setup with "' + extra + '"', "body": extra}, root)
              print("classifier self-checks passed (synthetic receipts only)")
          
          selfcheck()
          stages, malformed = {}, []
          for path in sorted(r.glob("*.exit")):
              try:
                  parts = [int(x) for x in path.read_text().split()]
                  if len(parts) != 2 or any(x < 0 or x > 255 for x in parts):
                      raise ValueError("invalid exit pair")
                  stages[path.stem] = parts
              except (OSError, ValueError) as exc:
                  malformed.append({"file": path.name, "error": str(exc)})
          required = ["preflight", "prerequisites", "postflight", "base-fixtures-deps-before", "base-fixtures-collect", "base-fixtures-deps-after"]
          for side in ("base", "head"):
              required += [f"{side}-{s}" for s in ("setup","deps-before","collect","deps-after")]
          infra = [s for s in required if stages.get(s) != [0,0]]
          if sys.argv[2] != "success":
              infra.append("execute-step-" + sys.argv[2])
          if malformed:
              infra.append("malformed-stage-receipts")
          summary = {"stage_exits_producer_tee": stages, "infrastructure_failures": infra,
                     "malformed_exit_receipts": malformed,
                     "expected_deselected": spec["expected_deselected"], "expected_skips": spec["expected_skips"]}
          for side in ("base","base-fixtures","head"):
              expected = [historical_node] if side == "base" else expected_fixtures if side == "base-fixtures" else expected_head
              data = {"test_exit": stages.get(f"{side}-test"), "expected_nodes": expected}
              try:
                  nodes, totals = collect_inventory((r/f"{side}-collect.log").read_text())
                  executed, failed, errors, skipped, message, error_details = parse_cases(r/f"{side}.xml", expected)
                  root = workspace/("base" if side == "base-fixtures" else side)
                  paths, offenders = scan_offenders(root)
                  complete, differences = inventory_errors(expected, nodes, executed, skipped, totals)
                  same = failed == [historical_node] and not errors and not skipped and historical_message(message or "", offenders)
                  data.update(collected_nodes=nodes, executed_nodes=executed,
                              collection_selected=totals[0], collection_total=totals[1],
                              configured_deselected=totals[2], differences=differences,
                              failures=failed, errors=errors, skipped=skipped,
                              passed=sorted(set(executed)-set(failed)-set(errors)-set(skipped)),
                              complete=complete, historical_only=bool(same),
                              guide_inventory=paths, actual_offenders=offenders,
                              historical_assertion_message=message, error_details=error_details)
                  rc = data["test_exit"]
                  if side == "base-fixtures":
                      data["result"] = fixture_diagnostic_result(complete, rc, failed, errors, skipped, error_details, root)
                  elif not complete or not rc or rc[1] != 0:
                      data["result"] = "INCOMPLETE_OR_LOG_FAILURE"
                  elif rc == [0,0] and not failed and not errors and not offenders:
                      data["result"] = "DEFAULT_LANE_PASSED"
                  elif rc == [1,0] and same:
                      data["result"] = "HISTORICAL_LAUNCHER_FAILURE_ONLY"
                  else:
                      data["result"] = "FAILED_OR_INCOMPLETE"
              except (OSError, ET.ParseError, ValueError, KeyError, AssertionError) as exc:
                  data.update(result="MISSING_OR_INVALID_RECEIPT", detail=str(exc))
              summary[side] = data
          ok = (not infra and summary["base"]["result"] in ("DEFAULT_LANE_PASSED","HISTORICAL_LAUNCHER_FAILURE_ONLY")
                and summary["base-fixtures"]["result"] in ("BASE_FIXTURE_DIAGNOSTICS_PASSED", "BASE_FIXTURE_SETUP_ERRORS_ONLY")
                and summary["head"]["result"] == "DEFAULT_LANE_PASSED")
          summary["qualification"] = "HEAD_DEFAULT_LANE_PASSED" if ok else "NOT_QUALIFIED"
          result = json.dumps(summary, indent=2, sort_keys=True)
          (r/"summary.json").write_text(result+"\n")
          print(json.dumps({k: summary[k]["result"] for k in ("base","base-fixtures","head")}, sort_keys=True))
          print("qualification=" + summary["qualification"])
          sys.exit(0 if ok else 1)
          PY
      - name: Preserve bounded proof receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r93-d-c511aaac-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r93-d-receipts/
          if-no-files-found: error
          retention-days: 14
