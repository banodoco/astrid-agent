      - name: Event and live immutable guards before any work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ws9-receipts"
          cat > "$RUNNER_TEMP/ws9-live.py" <<'PY'
