          assert E['GITHUB_REPOSITORY']=='banodoco/astrid-agent'
          assert E['GITHUB_EVENT_NAME']=='workflow_dispatch' and E['GITHUB_RUN_ATTEMPT']=='1'
          assert E['GITHUB_REF']=='refs/heads/'+E['PROOF_REF'] and E['GITHUB_SHA']==E['EXPECTED_WRAPPER']
          def api(path): return json.loads(subprocess.check_output(['gh','api',path]))
          a='banodoco/astrid-agent'; v='banodoco/VibeComfy'
          wf=api(f'repos/{a}/actions/workflows/282274792'); assert wf['id']==282274792 and wf['path']=='.github/workflows/ci.yml' and wf['state']=='active'
          run=api(f'repos/{a}/actions/runs/{E["GITHUB_RUN_ID"]}'); assert run['workflow_id']==282274792 and run['head_sha']==E['EXPECTED_WRAPPER'] and run['head_branch']==E['PROOF_REF'] and run['event']=='workflow_dispatch' and run['run_attempt']==1
          refs=[(a,E['PROOF_REF'],E['EXPECTED_WRAPPER']), (a,'release/16/plan-94',E['PLAN']), (a,'p90/90-WS9-requirements-preview',E['HEAD_SHA']), (a,'p90/90-WS9-full-plan-proof-candidate',E['MERGED']), (v,'release/16/plan-90',E['VC_BASE']), (v,'p90/90-WS2-requirements-plan',E['VC_HEAD'])]
          receipt={'event':{k:E[k] for k in ('GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')},'refs':[],'prs':[],'commits':{}}
          for repo,ref,expected in refs:
              actual=api(f'repos/{repo}/git/ref/heads/{ref}')['object']['sha']; assert actual==expected,(repo,ref,actual)
