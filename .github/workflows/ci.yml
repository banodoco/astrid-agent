name: 94-B exact CPU proof
on:
  workflow_dispatch:
    inputs:
      wrapper_sha:
        required: true
        type: string
      wrapper_blob:
        required: true
        type: string
      wrapper_digest:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: p94b-exact-55a6e949-v1
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Exact base and candidate CPU proof
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          WRAPPER_BLOB: ${{ inputs.wrapper_blob }}
          WRAPPER_DIGEST: ${{ inputs.wrapper_digest }}
        run: |
          set -euo pipefail
          repo=banodoco/astrid-agent
          a=https://github.com/banodoco/astrid-agent.git
          base=33dee103884c027edeaba576bd4279050e23460d
          head=55a6e949444e173bfb8022d533ef93c363455337
          proof_ref=proof/94-b-55a6e949-v1-7228380671
          dev=21feb35007210df7bc23a03c6226e2c5873fdab1
          work=$(mktemp -d "$RUNNER_TEMP/p94b.XXXXXXXX")
          receipt="$RUNNER_TEMP/p94b-receipt"
          mkdir "$receipt"
          guard() {
            test "$GITHUB_EVENT_NAME" = workflow_dispatch &&
            test "$GITHUB_RUN_ATTEMPT" = 1 &&
            test "$GITHUB_REPOSITORY" = "$repo" &&
            test "$GITHUB_REF" = "refs/heads/$proof_ref" &&
            test "$GITHUB_SHA" = "$WRAPPER_SHA" &&
            test "$(gh api "repos/$repo/git/ref/heads/$proof_ref" --jq .object.sha)" = "$WRAPPER_SHA" &&
            test "$(gh api "repos/$repo/git/ref/heads/release/16/plan-94" --jq .object.sha)" = "$base" &&
            test "$(gh api "repos/$repo/git/ref/heads/p94/94-B-transfer-recovery" --jq .object.sha)" = "$head" &&
            test "$(gh api "repos/$repo/pulls/699" --jq '[.state,.draft,.merged,.base.ref,.base.sha,.head.ref,.head.sha] | @tsv')" = "$(printf 'open\ttrue\tfalse\trelease/16/plan-94\t%s\tp94/94-B-transfer-recovery\t%s' "$base" "$head")"
          }
          finish() {
            rc=$?
            trap - EXIT
            if guard; then echo POST_GUARD=0 > "$receipt/post-guard.txt"; else echo POST_GUARD=90 > "$receipt/post-guard.txt"; rc=90; fi
            cat "$receipt/post-guard.txt"
            printf 'FINAL_EXIT=%s\n' "$rc" | tee "$receipt/final.exit"
            (cd "$receipt" && find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256)
            exit "$rc"
          }
          trap finish EXIT
          guard
          printf 'run=%s attempt=%s event=%s wrapper=%s ref=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$GITHUB_REF" | tee "$receipt/run.txt"
          [[ "$WRAPPER_SHA" =~ ^[0-9a-f]{40}$ && "$WRAPPER_BLOB" =~ ^[0-9a-f]{40}$ && "$WRAPPER_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo PRE_GUARD=0 > "$receipt/pre-guard.txt"
          df -Pk "$work" | tee "$receipt/free-before.txt"
          test "$(df -Pk "$work" | awk 'NR==2 {print $4}')" -ge 67108864
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if ! command -v uv; then pipx install uv; export PATH="$HOME/.local/bin:$PATH"; fi
          uv --version; git --version; ffmpeg -version | head -1
          git init -q "$work/agent"
          git -C "$work/agent" fetch --no-tags --depth=16 "$a" "$base" "$head" "$WRAPPER_SHA"
          g() { git -C "$work/agent" "$@"; }
          test "$(g rev-parse "$base^{tree}")" = 0c023cdd865c8f037a5c98229e06002272b701a9
          test "$(g rev-parse "$head^{tree}")" = 978e17841750974c9d1ffff27e5756cbe92ba2dd
          g merge-base --is-ancestor "$base" "$head"
          test "$(g rev-list --parents -n 1 "$WRAPPER_SHA")" = "$WRAPPER_SHA $head"
          test "$(g diff --name-only "$head" "$WRAPPER_SHA")" = .github/workflows/ci.yml
          test "$(g rev-parse "$WRAPPER_SHA:.github/workflows/ci.yml")" = "$WRAPPER_BLOB"
          g show "$WRAPPER_SHA:.github/workflows/ci.yml" > "$receipt/wrapper.yml"
          test "$(sha256sum "$receipt/wrapper.yml" | cut -d' ' -f1)" = "$WRAPPER_DIGEST"
          g diff --name-status "$base" "$head" > "$receipt/diff.txt"
          g diff --binary "$base" "$head" > "$receipt/product.patch"
          printf '%s\n' astrid/core/generation/asset_alignment.py astrid/core/generation/asset_gaps.py tests/core/generation/test_attached_model_download.py tests/core/generation/test_download_compute_gate.py tests/core/generation/test_download_progress_and_resume.py | sort > "$work/paths"
          g diff --name-only "$base" "$head" | sort | diff -u "$work/paths" -
          for sha in "$base" "$head"; do
            test "$(g rev-parse "$sha:tests/core/generation/test_download_space_budget.py")" = 3a9474bc62a4a42b0320c89f3ea4b96949ffaabc
            test "$(g rev-parse "$sha:tests/core/generation/test_generate_align.py")" = 0cea7fbc87350e1340d9029f5dab8fa25594e923
            test "$(g rev-parse "$sha:tests/conftest.py")" = 90dceb03604273cd81347326f6f8333bd4292411
            test "$(g rev-parse "$sha:tests/lanes.py")" = 652be8a03de8f239d91f2442b16510184e8b0492
            test "$(g rev-parse "$sha:pyproject.toml")" = e2f86e5e47b6ce08a53b0c01f2a0d8ba43cf4aef
            g ls-tree -r "$sha" > "$receipt/$sha.tree"
          done
          test "$(g rev-parse "$base:tests/core/generation/test_attached_model_download.py")" = e4f5d55098a86e2d6aace6fee66a66af6f780545
          test "$(g rev-parse "$head:tests/core/generation/test_attached_model_download.py")" = aa22f8cae020a49031e7d200a61115231b397c84
          git init -q "$work/dev"
          git -C "$work/dev" fetch --depth=1 https://github.com/banodoco/astrid-dev.git "$dev"
          git -C "$work/dev" checkout --detach FETCH_HEAD
          test "$(git -C "$work/dev" rev-parse HEAD)" = "$dev"
          test "$(git -C "$work/dev" rev-parse HEAD^{tree})" = 700a4a21af4f9ede7a09995863ae07dbf441a4a2
          test "$(git -C "$work/dev" hash-object env/agent-setup.sh)" = 2da3dc49bd2180f62fcabe2db787eb79bacff3d8
          test "$(git -C "$work/dev" hash-object env/agent-pytest.sh)" = 4bd27a26c096824490aaea9711fa10f8208652a8
          g worktree add --detach "$work/base" "$base"
          g worktree add --detach "$work/head" "$head"
          cat > "$work/provenance.py" <<'PY'
          import importlib, importlib.metadata as md, json, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          co, env = map(Path, sys.argv[1:])
          assert sys.version_info[:2] == (3, 13)
          assert Path(sys.prefix).resolve() == (env / 'venv').resolve()
          def origin(name):
              module = importlib.import_module(name)
              path = Path(module.__file__).resolve()
              print(name, path, flush=True)
              return path
          def distribution(name, source, vcs=None):
              d = md.distribution(name)
              url = json.loads(d.read_text('direct_url.json'))
              print(name, d.version, url, flush=True)
              if vcs:
                  assert url['url'].removesuffix('.git') == 'https://github.com/banodoco/runpod-lifecycle'
                  assert url['vcs_info']['commit_id'] == vcs
              else:
                  assert Path(unquote(urlparse(url['url']).path)).resolve() == source.resolve()
              assert d.files, name
              for rel in d.files:
                  p = Path(str(rel))
                  if p.parts[0] in ('astrid_runtime', 'runtime_protocol', 'astrid_runtime_client', 'runpod_lifecycle') and p.suffix in ('.py', '.json'):
                      assert d.locate_file(rel).read_bytes() == (source / p).read_bytes(), p
              return d
          assert origin('astrid').is_relative_to(co / 'astrid')
          assert origin('vibecomfy.fetch').is_relative_to(env / 'vibecomfy' / 'vibecomfy')
          rt = distribution('astrid-runtime', env / 'runtime')
          cl = distribution('astrid-runtime-client', env / 'runtime' / 'packages/python')
          lc = distribution('runpod-lifecycle', env / 'lifecycle' / 'src', '9f88ef7640bc664f697112d966ecefa123d44340')
          for name, dist, rel in [('runtime_protocol', rt, 'runtime_protocol/__init__.py'), ('astrid_runtime', rt, 'astrid_runtime/__init__.py'), ('astrid_runtime_client', cl, 'astrid_runtime_client/__init__.py'), ('runpod_lifecycle.pod_agent', lc, 'runpod_lifecycle/pod_agent.py')]:
              assert origin(name) == Path(dist.locate_file(rel)).resolve(), name
          assert rt.locate_file('runtime_protocol/schemas/timeline-commit-bundle.json').read_bytes() == (env / 'runtime/runtime_protocol/schemas/timeline-commit-bundle.json').read_bytes()
          assert origin('aiohttp').is_relative_to(env / 'venv')
          PY
          cat > "$work/account.py" <<'PY'
          import collections, json, re, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          receipt, side, *selectors = sys.argv[1:]
          root = Path(receipt)
          log = (root / f'{side}.collect.log').read_text()
          lines = log.splitlines()
          nodes = [line for line in lines if any(line.startswith(s + '::') for s in selectors)]
          summaries = re.findall(r'(?m)^(\d+)(?:/(\d+))? tests? collected(?: \((\d+) deselected\))? in ', log)
          def identity(node):
              address, bracket, param = node.partition('[')
              path, *names = address.split('::')
              return ('.'.join([path.removesuffix('.py').replace('/', '.'), *names[:-1]]), names[-1] + bracket + param)
          collected = collections.Counter(map(identity, nodes))
          cases = ET.parse(root / f'{side}.xml').findall('.//testcase')
          actual = collections.Counter((c.attrib['classname'], c.attrib['name']) for c in cases)
          counts = collections.Counter('error' if c.find('error') is not None else 'failure' if c.find('failure') is not None else 'skip' if c.find('skipped') is not None else 'pass' for c in cases)
          result = {'side': side, 'selectors': selectors, 'collected': len(nodes), 'junit_cases': len(cases), 'counts': dict(counts), 'collection_summary': summaries, 'missing': list((collected-actual).items()), 'unexpected': list((actual-collected).items())}
          (root / f'{side}.account.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          assert len(summaries) == 1 and int(summaries[0][0]) == len(nodes) and nodes
          assert all(any(n.startswith(s + '::') for n in nodes) for s in selectors)
          assert max(collected.values()) == 1 and actual == collected
          deselected = int(summaries[0][2] or 0)
          assert len(set(re.findall(r'(?m)^  DESELECTED (.+)$', log))) == deselected
          assert not re.search(r'(?m)^  NOT IMPORTED |tests left out by --splits/-k/--deselect|test\(s\) with no lane marker', log)
          assert counts['error'] == counts['failure'] == counts['skip'] == 0
          assert not re.search(r'(?m)^(XFAIL|XPASS) ', (root / f'{side}.pytest.log').read_text())
          PY
          run_side() (
            set -euo pipefail
            side=$1; sha=$2; shift 2
            co="$work/$side"; e="$co.env"
            cd "$co"
            trap 'rc=$?; printf "SIDE_EXIT=%s\n" "$rc" > "$receipt/$side.exit"' EXIT
            test "$(git rev-parse HEAD)" = "$sha"
            test -z "$(git status --porcelain)"
            printf 'commit=%s tree=%s\n' "$sha" "$(git rev-parse HEAD^{tree})" > "$receipt/$side.source"
            printf '%s\n' "$@" > "$receipt/$side.selectors"
            set +e
            bash "$work/dev/env/agent-setup.sh" 2>&1 | tee "$receipt/$side.setup.log"
            sc=("${PIPESTATUS[@]}")
            set -e
            printf 'SETUP=%s TEE=%s\n' "${sc[0]}" "${sc[1]}" > "$receipt/$side.setup.exit"
            test "${sc[*]}" = '0 0'
            for spec in 'runtime 686ca695469bda48cd40a70824c4ccef2a137284 969fae6cd851e01b659b7e7818d6757df7b7a093' 'vibecomfy 55c3948212d23cf037fae8a4c6faad77d33e7279 4dc07e25872a5e04fe279304fd1741d802cb444e' 'lifecycle 9f88ef7640bc664f697112d966ecefa123d44340 557853a6368375e37598d02502532d0091659fa4'; do
              read -r dep commit tree <<< "$spec"
              test "$(git -C "$e/$dep" rev-parse HEAD)" = "$commit"
              test "$(git -C "$e/$dep" rev-parse HEAD^{tree})" = "$tree"
              test -z "$(git -C "$e/$dep" status --porcelain --untracked-files=no)"
              printf '%s %s %s\n' "$dep" "$commit" "$tree" >> "$receipt/$side.source"
            done
            df -Pk "$e/tmp" | tee "$receipt/$side.free.txt"
            test "$(df -Pk "$e/tmp" | awk 'NR==2 {print $4}')" -ge 4194304
            env -i PATH="$e/venv/bin:$(cat "$e/uv-dir"):/usr/local/bin:/usr/bin:/bin" HOME="$e/home" TMPDIR="$e/tmp" XDG_CACHE_HOME="$e/cache" LANG=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONPATH="$e/vibecomfy" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 VIBECOMFY_SOURCE="$e/vibecomfy" ASTRID_RUNTIME_CHECKOUT="$e/runtime" ASTRID_VIBECOMFY_CHECKOUT="$e/vibecomfy" ASTRID_TEST_LIFECYCLE_CHECKOUT="$e/lifecycle" "$e/venv/bin/python" "$work/provenance.py" "$co" "$e" 2>&1 | tee "$receipt/$side.provenance.log"
            uv pip freeze --python "$e/venv/bin/python" > "$receipt/$side.freeze.txt"
            unset GEN_DESELECT_FILE PYTEST_ADDOPTS VERIFY_SIDE
            set +e
            VERIFY_SIDE="$side" bash "$work/dev/env/agent-pytest.sh" -q -p no:cacheprovider --collect-only "$@" 2>&1 | tee "$receipt/$side.collect.log"
            cc=("${PIPESTATUS[@]}")
            printf 'COLLECT=%s TEE=%s\n' "${cc[0]}" "${cc[1]}" > "$receipt/$side.collect.exit"
            PYTEST_ADDOPTS="-rA --junitxml=$receipt/$side.xml" VERIFY_SIDE="$side" bash "$work/dev/env/agent-pytest.sh" -q -p no:cacheprovider "$@" 2>&1 | tee "$receipt/$side.pytest.log"
            pc=("${PIPESTATUS[@]}")
            printf 'PYTEST=%s TEE=%s\n' "${pc[0]}" "${pc[1]}" > "$receipt/$side.pytest.exit"
            python3 "$work/account.py" "$receipt" "$side" "$@" 2>&1 | tee "$receipt/$side.account.log"
            ac=("${PIPESTATUS[@]}")
            set -e
            test "$(git rev-parse HEAD)" = "$sha"
            test -z "$(git status --porcelain --untracked-files=no)"
            for dep in runtime vibecomfy lifecycle; do test -z "$(git -C "$e/$dep" status --porcelain --untracked-files=no)"; done
            guard
            test "${cc[*]} ${pc[*]} ${ac[*]}" = '0 0 0 0 0 0'
          )
          prefix=tests/core/generation
          set +e
          run_side base "$base" "$prefix/test_download_space_budget.py" "$prefix/test_attached_model_download.py" "$prefix/test_generate_align.py"
          brc=$?
          run_side head "$head" "$prefix/test_download_space_budget.py" "$prefix/test_download_progress_and_resume.py" "$prefix/test_download_compute_gate.py" "$prefix/test_attached_model_download.py" "$prefix/test_generate_align.py"
          hrc=$?
          set -e
          printf 'BASE=%s HEAD=%s\n' "$brc" "$hrc" | tee "$receipt/sides.exit"
          test "$brc $hrc" = '0 0'
      - name: Preserve complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p94b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p94b-receipt
          if-no-files-found: error
          retention-days: 14
