# Throwaway R14-P39-01 / K1a cancellation proof. Never merge this branch.
# The unit aggregate below is byte-for-byte identical to plan base 6bbda788c.
# Two real matrix jobs share a run-local concurrency group: one is cancelled
# by GitHub, the other succeeds. No repository settings or other runs change.
name: CI

on:
  workflow_dispatch:

jobs:
  checks:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Successful dependency fixture
        run: echo "K1a cancellation proof fast-check dependency succeeded"

  unit-shard:
    name: unit shard ${{ matrix.group }} / 2 (cancellation proof)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    concurrency:
      group: r14-p39-k1a-cancel-proof-${{ github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Hold shard while sibling cancels it
        run: |
          echo "GitHub job concurrency will cancel one of the two real matrix jobs."
          sleep 45
          echo "Surviving shard succeeded."

  unit:
    name: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, unit-shard]
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      SHARDS_RESULT: ${{ needs.unit-shard.result }}
    steps:
      - name: Require all unit shards and fast checks to pass
        run: |
          if [[ "$CHECKS_RESULT" != success || "$SHARDS_RESULT" != success ]]; then
            echo "::error::unit requires successful dependencies: fast checks=$CHECKS_RESULT, unit shards=$SHARDS_RESULT"
            exit 1
          fi
          echo "unit passed"

