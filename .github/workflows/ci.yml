name: Wheel installed identity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTEST_ADDOPTS: -rA
jobs:

  release:
    name: release wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

        with:
          ref: 36ad4bbc89250aa29315803b075e9ddd5308ea77

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install system media tools
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-03 --shell bash "{0}"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install wheel builder
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-04 --shell bash "{0}"
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock

      - name: Build exactly one wheel
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-05 --shell bash "{0}"
        run: |
          python -m build --wheel --no-isolation --outdir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1

      - name: Install the wheel with the hashed runtime lock only
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell bash "{0}"
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/runtime.lock
          "$RUNNER_TEMP/release-venv/bin/python" scripts/ci_install_runtime.py
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/release-venv/bin/python" -c "import astrid"

      # The default-lane home for "the shipped wheel works when installed" (testing plan R-1):
      # it adopts the wheel and venv built above, so the wheel that is uploaded is the wheel that is smoked.
      - name: Smoke the installed wheel
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-07 --shell bash "{0}"
        run: bash scripts/smoke_wheel_install.sh --wheel dist/*.whl --venv "$RUNNER_TEMP/release-venv"

      - name: Validate locks and record the release toolchain
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-08 --shell bash "{0}"
        run: python -m scripts.reshape.release_reproducibility --expected-python ${{ matrix.python-version }} --output dist/toolchain.json

      - name: Upload the wheel and its toolchain record
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: release-wheel-${{ matrix.python-version }}
          path: dist/

      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error
      - name: Read installed Runtime and client from the completed wheel smoke environment
        env:
          WHEEL_PYTHON: ${{ matrix.python-version }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-venv/bin/python" -I - <<'WHEEL_IDENTITY_PY'
          """Read-only post-smoke evidence from the wheel virtual environment."""
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from importlib import metadata
          from pathlib import Path
          from urllib.request import urlopen

          CANDIDATE = "36ad4bbc89250aa29315803b075e9ddd5308ea77"
          TREE = "dc2ae082125ff067086e7a3271758c025bbeae93"
          RUNTIME = "2537fed24385ec1c24f48a812e09af4bb63fb794"
          REVIEWED_ARCHIVE_SHA256 = "9f7763bae778614459d4134a8427e2837793e0e79812bb045e436e4425cdf7ad"
          VERSIONS = {"astrid-runtime": "0.1.0", "astrid-runtime-client": "0.2.14"}
          ARCHIVE = f"https://github.com/banodoco/astrid-runtime/archive/{RUNTIME}.tar.gz"


          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()


          def observe(name, subdir, output, root, expected_digest):
              result = {"name": name, "expected_subdirectory": subdir}
              matches = list(metadata.distributions(name=name))
              if len(matches) != 1:
                  raise ValueError(f"found {len(matches)} distributions for {name}")
              package = matches[0]
              paths = [f for f in package.files or () if f.name == "METADATA" and f.parent.name.endswith(".dist-info")]
              if len(paths) != 1:
                  raise ValueError(f"ambiguous dist-info METADATA for {name}")
              info = Path(package.locate_file(paths[0])).resolve().parent
              if not info.is_relative_to(root):
                  raise ValueError(f"distribution outside wheel environment: {info}")
              result.update(dist_info=str(info), version=package.version, installed_name=package.metadata["Name"])
              copied = output / name
              copied.mkdir()
              for key in ("METADATA", "direct_url.json", "RECORD"):
                  original = (info / key).resolve()
                  if not original.is_relative_to(info):
                      raise ValueError(f"{key} points outside dist-info")
                  (copied / key).write_bytes(original.read_bytes())
              result["retained_sha256"] = {p.name: digest(p) for p in sorted(copied.iterdir())}
              source = json.loads((copied / "direct_url.json").read_bytes())
              archive_info = source.get("archive_info", {})
              hashes = archive_info.get("hashes", {})
              legacy = archive_info.get("hash")
              sha = hashes.get("sha256") or (legacy or "").removeprefix("sha256=")
              result.update(observed_source=source, observed_archive_sha256=sha)
              result["matched"] = (
                  package.metadata["Name"].lower().replace("_", "-") == name
                  and package.version == VERSIONS[name]
                  and source.get("url") == ARCHIVE
                  and source.get("subdirectory") == subdir
                  and "dir_info" not in source and "vcs_info" not in source
                  and (legacy is None or legacy == f"sha256={sha}")
                  and expected_digest is not None and sha == expected_digest
              )
              return result


          def main():
              temp = Path(os.environ["RUNNER_TEMP"])
              repo = Path(os.environ["GITHUB_WORKSPACE"])
              output = temp / "wheel-installed-identity"
              output.mkdir()
              expected_env = (temp / "release-venv").resolve()
              root = Path(sys.prefix).resolve()
              rev = lambda obj: subprocess.check_output(["git", "-C", str(repo), "rev-parse", obj], text=True).strip()
              version = ".".join(map(str, sys.version_info[:2]))
              receipt = {
                  "candidate": rev("HEAD"), "tree": rev("HEAD^{tree}"),
                  "driver": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                  "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "python": sys.version,
                  "executable": sys.executable, "prefix": str(root), "base_prefix": sys.base_prefix,
                  "lock_runtime": json.loads((repo / "runtime.lock.json").read_bytes())["source_commit"],
                  "expected_archive": ARCHIVE, "errors": [], "distributions": {},
              }
              if (receipt["candidate"], receipt["tree"], receipt["lock_runtime"]) != (CANDIDATE, TREE, RUNTIME):
                  receipt["errors"].append("candidate tree or lock pin mismatch")
              if root != expected_env or root == Path(sys.base_prefix).resolve() or version != os.environ["WHEEL_PYTHON"]:
                  receipt["errors"].append("unexpected interpreter")
              receipt["agent_wheels"] = {p.name: digest(p) for p in sorted((repo / "dist").glob("*.whl"))}
              if len(receipt["agent_wheels"]) != 1:
                  receipt["errors"].append("expected one built Agent wheel")
              independent_digest = None
              try:
                  with urlopen(ARCHIVE, timeout=90) as response:
                      receipt["archive_final_url"] = response.geturl()
                      independent_digest = hashlib.file_digest(response, "sha256").hexdigest()
              except Exception as exc:
                  receipt["errors"].append(f"independent archive read: {exc}")
              receipt["reviewer_archive_sha256"] = REVIEWED_ARCHIVE_SHA256
              receipt["independently_fetched_sha256"] = independent_digest
              if independent_digest != REVIEWED_ARCHIVE_SHA256:
                  receipt["errors"].append("archive digest differs from independent review or is missing")
              for name, subdir in (("astrid-runtime", None), ("astrid-runtime-client", "packages/python")):
                  try:
                      observation = observe(name, subdir, output, root, independent_digest)
                      receipt["distributions"][name] = observation
                      if not observation["matched"]:
                          receipt["errors"].append(f"{name}: origin, layout, hash or metadata mismatch")
                  except Exception as exc:
                      receipt["errors"].append(f"{name}: {exc}")
              receipt["disposition"] = "UNKNOWN" if receipt["errors"] else "MATCH"
              (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
              print(receipt["disposition"], receipt["errors"])
              return bool(receipt["errors"])


          if __name__ == "__main__":
              sys.exit(main())
          WHEEL_IDENTITY_PY

      - name: Retain separate wheel metadata receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-installed-identity-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheel-installed-identity/
          retention-days: 90
          if-no-files-found: error
