name: WS9 exact original and full-plan CPU proof
on:
  workflow_dispatch:
    inputs:
      expected_wrapper:
        description: Exact independently reviewed wrapper commit
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ws9-5c0bb64-ecdb223-one-cpu-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: 782df5c25ee0cfed40a32d83b73851e006a98f3e
      HEAD_SHA: 5c0bb641d0ec6320e0306657d09798fa7fff6e19
      PLAN: 33dee103884c027edeaba576bd4279050e23460d
      MERGED: ecdb2232482ee34f08f838d9d6c16b1b9b4fc5a8
      MERGED_TREE: 62523eea12196bbf3462adde734d67f843d81fcf
      PLAN_TREE: 0c023cdd865c8f037a5c98229e06002272b701a9
      VC_BASE: 55c3948212d23cf037fae8a4c6faad77d33e7279
      VC_HEAD: 3ed74f2c3dbd782afdd8702d22b7c83b1c40b82a
      VC_HEAD_TREE: bc4bce5ff6af1b63ccc7c146c48327abd21d0d11
      RT: 686ca695469bda48cd40a70824c4ccef2a137284
      LC: 9f88ef7640bc664f697112d966ecefa123d44340
      DEV_SHA: 394cd8c7051d82c36fac8ea9ede9c6d4e14d5c0c
      PROOF_REF: proof/90-ws9-5c0bb64-ecdb223-v2
      EXPECTED_WRAPPER: ${{ inputs.expected_wrapper }}
      R: ${{ runner.temp }}/ws9-receipts
    steps:
      - name: Create receipt directory and verify event
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R"
          printf 'repository=%s\nref=%s\nsha=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$R/event.txt"
          test "$GITHUB_REPOSITORY" = banodoco/astrid-agent
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$PROOF_REF"
          test "$GITHUB_SHA" = "$EXPECTED_WRAPPER"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Live guards and authoritative commit trees before work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ws9-live-guard.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ref() { gh api "repos/$1/git/ref/heads/$2" --jq .object.sha; }
          check_ref() {
            local actual
            actual=$(ref "$1" "$2")
            printf '%s %s %s\n' "$1" "$2" "$actual"
            test "$actual" = "$3"
          }
          check_pr() {
            gh api "repos/$1/pulls/$2" | jq -e \
              --arg head "$3" --arg branch "$4" --arg base "$5" --arg repo "$1" \
              '.state=="open" and .draft==true and .merged==false and .head.sha==$head and .head.ref==$branch and .head.repo.full_name==$repo and .base.ref==$base and .base.repo.full_name==$repo'
          }
          check_ref banodoco/astrid-agent "$PROOF_REF" "$EXPECTED_WRAPPER"
          check_ref banodoco/astrid-agent release/16/plan-94 "$PLAN"
          check_ref banodoco/astrid-agent p90/90-WS9-requirements-preview "$HEAD_SHA"
          check_ref banodoco/astrid-agent p90/90-WS9-full-plan-proof-candidate "$MERGED"
          check_ref banodoco/VibeComfy release/16/plan-90 "$VC_BASE"
          check_ref banodoco/VibeComfy p90/90-WS2-requirements-plan "$VC_HEAD"
          check_pr banodoco/astrid-agent 689 "$HEAD_SHA" p90/90-WS9-requirements-preview release/16/plan-94
          check_pr banodoco/VibeComfy 224 "$VC_HEAD" p90/90-WS2-requirements-plan release/16/plan-90
          SH
          bash "$RUNNER_TEMP/ws9-live-guard.sh" | tee "$R/live-before.txt"
          tree() { gh api "repos/$1/git/commits/$2" --jq .tree.sha; }
          for pair in \
              "banodoco/astrid-agent:$BASE" "banodoco/astrid-agent:$HEAD_SHA" \
              "banodoco/astrid-agent:$PLAN" "banodoco/astrid-agent:$MERGED" \
              "banodoco/astrid-agent:$EXPECTED_WRAPPER" \
              "banodoco/VibeComfy:$VC_BASE" "banodoco/VibeComfy:$VC_HEAD" \
              "banodoco/astrid-runtime:$RT" "banodoco/runpod-lifecycle:$LC" \
              "banodoco/astrid-dev:$DEV_SHA"; do
            repo=${pair%%:*}; sha=${pair#*:}
            t=$(tree "$repo" "$sha")
            [[ "$t" =~ ^[0-9a-f]{40}$ ]]
            printf '%s %s %s\n' "$repo" "$sha" "$t"
          done | tee "$R/authoritative-trees.txt"
          grep -Fx "banodoco/astrid-agent $PLAN $PLAN_TREE" "$R/authoritative-trees.txt"
          grep -Fx "banodoco/astrid-agent $MERGED $MERGED_TREE" "$R/authoritative-trees.txt"
          grep -Fx "banodoco/VibeComfy $VC_HEAD $VC_HEAD_TREE" "$R/authoritative-trees.txt"
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ github.sha }}
          path: agent-objects
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-dev
          ref: 394cd8c7051d82c36fac8ea9ede9c6d4e14d5c0c
          path: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install declared native prerequisite
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify complete native merge and source closure
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/agent-objects"
          test "$(git rev-parse HEAD)" = "$EXPECTED_WRAPPER"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-list --parents -n 1 HEAD)" = "$EXPECTED_WRAPPER $MERGED"
          test "$(git diff --name-only "$MERGED" HEAD)" = .github/workflows/ci.yml
          git diff --binary "$MERGED" HEAD > "$R/wrapper.diff"
          git show HEAD:.github/workflows/ci.yml > "$R/wrapper.yml"
          sha256sum "$R/wrapper.yml" > "$R/wrapper.sha256"
          test "$(git rev-list --parents -n 1 "$MERGED")" = "$MERGED $PLAN $HEAD_SHA"
          test "$(git merge-base "$PLAN" "$HEAD_SHA")" = "$BASE"
          test "$(git rev-parse "$MERGED^{tree}")" = "$MERGED_TREE"
          test "$(git rev-parse "$PLAN^{tree}")" = "$PLAN_TREE"
          git merge-base --is-ancestor "$BASE" "$MERGED"
          git merge-base --is-ancestor "$HEAD_SHA" "$MERGED"
          git merge-base --is-ancestor "$PLAN" "$MERGED"
          git merge-tree --write-tree "$PLAN" "$HEAD_SHA" > "$R/native-merge-tree.txt"
          test "$(cat "$R/native-merge-tree.txt")" = "$MERGED_TREE"
          git fsck --connectivity-only --no-reflogs > "$R/agent-fsck.txt" 2>&1
          for sha in "$BASE" "$HEAD_SHA" "$PLAN" "$MERGED"; do
            tree=$(awk -v s="$sha" '$2==s {print $3}' "$R/authoritative-trees.txt")
            test -n "$tree"
            test "$(git rev-parse "$sha^{tree}")" = "$tree"
            git ls-tree -rz --full-tree "$sha" > "$R/agent-$sha.leaves"
          done
          python - <<'PY' | tee "$R/full-tree-union.txt"
          import os
          from pathlib import Path
          r = Path(os.environ["R"])
          def leaves(sha):
              entries = {}
              for entry in (r / ("agent-" + sha + ".leaves")).read_bytes().split(b"\0"):
                  if not entry:
                      continue
                  meta, path = entry.split(b"\t", 1)
                  assert path not in entries
                  entries[path] = meta  # exact mode, type, object id
              return entries
          b,h,p,m = (leaves(os.environ[key]) for key in ("BASE","HEAD_SHA","PLAN","MERGED"))
          def delta(a,z):
              return {k for k in a.keys() | z.keys() if a.get(k) != z.get(k)}
          hd, pd = delta(b,h), delta(b,p)
          expected_head = {x.encode() for x in (
              "astrid/core/generation/cli.py",
              "astrid/core/generation/preflight.py",
              "astrid/core/generation/requirements.py",
              "astrid/packs/generation/docs/SKILL.md",
              "tests/core/generation/test_requirements_preview.py",
          )}
          expected_plan = {x.encode() for x in (
              "astrid/core/generation/asset_gaps.py",
              "astrid/core/generation/gpu_environment.py",
              "tests/core/generation/test_attached_model_download.py",
              "tests/core/generation/test_download_space_budget.py",
              "tests/core/generation/test_gpu_compute_probe.py",
          )}
          assert hd == expected_head and pd == expected_plan and not hd & pd
          expected = dict(p)
          for k in hd:
              if k in h: expected[k] = h[k]
              else: expected.pop(k, None)
          assert m == expected
          assert delta(p,m) == hd and delta(h,m) == pd
          print("FULL_LEAF_UNION", len(b), len(h), len(p), len(m), "head_delta", len(hd), "plan_delta", len(pd), "conflicts 0 mismatches 0")
          selectors = ("cli_gold_075b","readiness_inputs_f04","node_approval_contract",
                       "managed_preparation","attached_model_download","generate_align")
          for name in selectors:
              k = ("tests/core/generation/test_"+name+".py").encode()
              assert b[k] == h[k] and p[k] == m[k], k
              print("ORIGINAL_SELECTOR", k.decode(), b[k].decode(), p[k].decode())
          for k in (b"pyproject.toml", b"tests/conftest.py", b"tests/lanes.py",
                    b"runtime.lock.json", b"astrid/packs/vibecomfy/pins.json", b"astrid/packs/runpod/pins.json"):
              assert b[k] == h[k] == p[k] == m[k], k
          PY
          git diff --binary "$BASE" "$HEAD_SHA" > "$R/original-pr.diff"
          git diff --binary "$PLAN" "$MERGED" > "$R/integrated-pr.diff"
          git diff --binary "$BASE" "$PLAN" > "$R/current-plan.diff"
          git diff --name-status "$BASE" "$HEAD_SHA" > "$R/original-pr.paths"
          git diff --name-status "$PLAN" "$MERGED" > "$R/integrated-pr.paths"
          test "$(git -C "$GITHUB_WORKSPACE/dev" rev-parse HEAD)" = "$DEV_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/dev" rev-parse --is-shallow-repository)" = false
          test -z "$(git -C "$GITHUB_WORKSPACE/dev" status --porcelain --untracked-files=all)"
          test "$(git -C "$GITHUB_WORKSPACE/dev" rev-parse HEAD^{tree})" = "$(awk -v s="$DEV_SHA" '$2==s {print $3}' "$R/authoritative-trees.txt")"
          test "$(git -C "$GITHUB_WORKSPACE/dev" hash-object env/agent-setup.sh)" = 2da3dc49bd2180f62fcabe2db787eb79bacff3d8
          test "$(git -C "$GITHUB_WORKSPACE/dev" hash-object env/agent-pytest.sh)" = 4bd27a26c096824490aaea9711fa10f8208652a8
          git -C "$GITHUB_WORKSPACE/dev" ls-tree -rz --full-tree HEAD > "$R/dev.leaves"
          for side in base head current merged; do
            case "$side" in
              base) sha=$BASE;; head) sha=$HEAD_SHA;; current) sha=$PLAN;; merged) sha=$MERGED;;
            esac
            git worktree add --detach "$GITHUB_WORKSPACE/ws9-$side" "$sha"
          done
      - name: Run exact original and integrated selectors (all sides, no exclusions)
        shell: bash
        run: |
          set -euo pipefail
          # Keep GitHub token out of every setup/test process. No provider secrets.
          unset GH_TOKEN GITHUB_TOKEN GEN_DESELECT_FILE PYTEST_ADDOPTS
          export PYTHONDONTWRITEBYTECODE=1
          DEV="$GITHUB_WORKSPACE/dev"
          cat > "$RUNNER_TEMP/ws9-provenance.py" <<'PY'
          import hashlib, importlib, json, os, pathlib, subprocess, sys
          root, envroot, vc = map(pathlib.Path, sys.argv[1:4])
          def git(repo, *args):
              return subprocess.check_output(["git","-C",str(repo),*args])
          def witness(name, repo, relative=None):
              module = importlib.import_module(name)
              path = pathlib.Path(module.__file__).resolve()
              rel = relative if relative is not None else path.relative_to(repo).as_posix()
              raw = git(repo,"show","HEAD:"+rel)
              assert path.read_bytes() == raw, (name, path, rel)
              return {"module":name,"origin":str(path),"source_path":rel,
                      "source_sha":git(repo,"rev-parse","HEAD").decode().strip(),
                      "sha256":hashlib.sha256(raw).hexdigest()}
          rows = [witness("astrid", root), witness("astrid.core.generation.cli",root),
                  witness("astrid.core.generation.preflight",root),
                  witness("vibecomfy",vc),
                  witness("runtime_protocol",envroot/"runtime","runtime_protocol/__init__.py")]
          if os.environ.get("VERIFY_SIDE") in ("head","merged"):
              rows.extend([witness("astrid.core.generation.requirements",root),
                           witness("vibecomfy.requirements",vc),
                           witness("vibecomfy.requirements._plan",vc)])
          import aiohttp, psutil
          for mod in (aiohttp,psutil):
              assert pathlib.Path(mod.__file__).resolve().is_relative_to(envroot/"venv"), mod.__file__
          print(json.dumps({"python":sys.version,"executable":sys.executable,
                            "imports":rows,"aiohttp":aiohttp.__file__,"psutil":psutil.__file__},indent=2))
          PY
          verify_checkout() {
            local path=$1 sha=$2 tree
            tree=$(awk -v s="$sha" '$2==s {print $3}' "$R/authoritative-trees.txt")
            test -n "$tree" || return 3
            test "$(git -C "$path" rev-parse HEAD)" = "$sha" || return 3
            test "$(git -C "$path" rev-parse HEAD^{tree})" = "$tree" || return 3
            test "$(git -C "$path" rev-parse --is-shallow-repository)" = false || return 3
            test -z "$(git -C "$path" status --porcelain --untracked-files=all)" || return 3
            git -C "$path" diff-index --quiet HEAD -- || return 3
          }
          full_dep() {
            local path=$1 url=$2 pin=$3
            if [ "$(git -C "$path" rev-parse --is-shallow-repository)" = true ]; then
              git -C "$path" fetch --unshallow "$url" "$pin"
            else
              git -C "$path" fetch "$url" "$pin"
            fi
            git -C "$path" checkout --detach "$pin"
            verify_checkout "$path" "$pin"
          }
          run_side() (
            set -Eeuo pipefail
            side=$1; sha=$2; vc_pin=$3
            root="$GITHUB_WORKSPACE/ws9-$side"; E="$root.env"
            echo ENV > "$R/$side.phase"
            cd "$root"
            verify_checkout "$root" "$sha"
            trap 'x=$?; set +e; verify_checkout "$root" "$sha"; a=$?; if [ -d "$E/runtime/.git" ]; then verify_checkout "$E/runtime" "$RT"; b=$?; else b=1; fi; if [ -d "$E/vibecomfy/.git" ]; then verify_checkout "$E/vibecomfy" "$vc_pin"; c=$?; else c=1; fi; if [ -d "$E/lifecycle/.git" ]; then verify_checkout "$E/lifecycle" "$LC"; d=$?; else d=1; fi; printf "%s %s %s %s\n" "$a" "$b" "$c" "$d" > "$R/$side.post-guard"; if ((a||b||c||d)); then exit 3; fi; exit "$x"' EXIT
            test "$(python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')" = "$RT"
            test "$(python -c 'import json; print(json.load(open("astrid/packs/runpod/pins.json"))["sources"]["lifecycle"]["revision"])')" = "$LC"
            test "$(python -c 'import json; print(json.load(open("astrid/packs/vibecomfy/pins.json"))["sources"]["vibecomfy"]["revision"])')" = "$VC_BASE"
            bash "$DEV/env/agent-setup.sh" 2>&1 | tee "$R/$side.setup.log"
            cp "$E/setup.txt" "$R/$side.setup.txt"
            # The original setup is intentionally unchanged. It fetches the
            # shipped VC pin. For candidate sides replace ONLY that disposable
            # source checkout with the accepted producer, not Agent pins.
            test "$(git -C "$E/vibecomfy" rev-parse HEAD)" = "$VC_BASE"
            test "$(git -C "$E/runtime" rev-parse HEAD)" = "$RT"
            test "$(git -C "$E/lifecycle" rev-parse HEAD)" = "$LC"
            full_dep "$E/runtime" https://github.com/banodoco/astrid-runtime "$RT"
            full_dep "$E/vibecomfy" https://github.com/banodoco/VibeComfy "$vc_pin"
            full_dep "$E/lifecycle" https://github.com/banodoco/runpod-lifecycle "$LC"
            for dep in runtime vibecomfy lifecycle; do
              git -C "$E/$dep" ls-tree -rz --full-tree HEAD > "$R/$side.$dep.leaves"
              git -C "$E/$dep" fsck --connectivity-only --no-reflogs > "$R/$side.$dep.fsck" 2>&1
            done
            # Independent provenance in the SAME import environment as the
            # unchanged runner. Runtime installed bytes compared to source,
            # not a path override that would hide fixture failures.
            env -i PATH="$E/venv/bin:$(cat "$E/uv-dir"):/usr/local/bin:/usr/bin:/bin" \
              HOME="$E/home" TMPDIR="$E/tmp" XDG_CACHE_HOME="$E/cache" LANG=C.UTF-8 \
              PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 PYTHONSAFEPATH=1 \
              PYTHONPATH="$E/vibecomfy" VERIFY_SIDE="$side" \
              VIBECOMFY_SOURCE="$E/vibecomfy" ASTRID_RUNTIME_CHECKOUT="$E/runtime" \
              ASTRID_VIBECOMFY_CHECKOUT="$E/vibecomfy" ASTRID_TEST_LIFECYCLE_CHECKOUT="$E/lifecycle" \
              "$E/venv/bin/python" "$RUNNER_TEMP/ws9-provenance.py" "$root" "$E" "$E/vibecomfy" \
              > "$R/$side.imports.json"
            # Lifecycle is separately imported from its actual selected source;
            # the original runner exposes its checkout path to tests.
            PYTHONPATH="$E/lifecycle/src" "$E/venv/bin/python" -B -c \
              'import pathlib,sys,runpod_lifecycle.pod_agent as p; q=pathlib.Path(p.__file__).resolve(); assert q.is_relative_to(pathlib.Path(sys.argv[1]).resolve()); print(q)' \
              "$E/lifecycle" > "$R/$side.lifecycle-import.txt"
            "$E/venv/bin/python" -m pip list --format=json > "$R/$side.packages.json"
            "$E/venv/bin/python" -m pip freeze --all > "$R/$side.freeze.txt"
            df -Pk "$E/basetemp" "$E/home" "$E/tmp" | tee "$R/$side.disk.txt"
            free=$(df -Pk "$E/basetemp" | awk 'NR==2 {printf "%.0f",$4*1024}')
            test "$free" -gt 2147483648
            verify_checkout "$root" "$sha"
            args=(tests/core/generation/test_cli_gold_075b.py
                  tests/core/generation/test_readiness_inputs_f04.py
                  tests/core/generation/test_node_approval_contract.py
                  tests/core/generation/test_managed_preparation.py
                  tests/core/generation/test_attached_model_download.py
                  tests/core/generation/test_generate_align.py)
            if [[ "$side" == head || "$side" == merged ]]; then
              args+=(tests/core/generation/test_requirements_preview.py)
            fi
            printf '%s\n' "bash $DEV/env/agent-pytest.sh -q -rA -s --junitxml=$R/$side.xml ${args[*]}" > "$R/$side.argv.txt"
            printf '%s %s\n' "$sha" "$vc_pin" > "$R/$side.pins.txt"
            # Do not override runner env-i, original conftest or marker config.
            # WS9_EXPECTED_* is not propagated by this runner; outer immutable
            # checks establish SHA equality instead. The test's default VC SHA
            # is the exact accepted producer.
            echo COLLECTION > "$R/$side.phase"
            set +e
            VERIFY_SIDE="$side" bash "$DEV/env/agent-pytest.sh" -q --collect-only "${args[@]}" 2>&1 | tee "$R/$side.collect.log"
            collect_codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${collect_codes[0]}" "${collect_codes[1]}" > "$R/$side.collect-exits.txt"
            # Keep a genuine test run even if collection failed; never hide either exit.
            echo TEST > "$R/$side.phase"
            set +e
            VERIFY_SIDE="$side" bash "$DEV/env/agent-pytest.sh" -q -rA -s \
              --junitxml="$R/$side.xml" "${args[@]}" 2>&1 | tee "$R/$side.pytest.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${codes[0]}" "${codes[1]}" > "$R/$side.pytest-exits.txt"
            python - "$R/$side.pytest.log" "$R/$side.command-receipts.jsonl" <<'PY'
          import sys
          from pathlib import Path
          # Pytest progress dots can precede a receipt on the same line.
          source, output = map(Path, sys.argv[1:])
          marker = "WS9_COMMAND_RECEIPT "
          with output.open("w") as stream:
              for line in source.read_text(errors="replace").splitlines():
                  if marker in line:
                      stream.write(marker + line.split(marker, 1)[1] + "\n")
          PY
            echo TEST_FINISHED > "$R/$side.phase"
            if (( codes[1] != 0 )); then exit 3; fi
            exit "${codes[0]}"
          )
          overall=0
          for side in base head current merged; do
            case "$side" in
              base) sha=$BASE; vc=$VC_BASE;;
              head) sha=$HEAD_SHA; vc=$VC_HEAD;;
              current) sha=$PLAN; vc=$VC_BASE;;
              merged) sha=$MERGED; vc=$VC_HEAD;;
            esac
            set +e
            run_side "$side" "$sha" "$vc" 2>&1 | tee "$R/$side.full.log"
            rc=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${rc[0]}" "${rc[1]}" > "$R/$side.side-exits.txt"
            if (( rc[0] || rc[1] )); then overall=1; fi
          done
          printf '%s\n' "$overall" > "$R/side-overall.txt"
          # Do not fail early: separate post guards and receipt summary must run.
      - name: Final immutable source and live-ref guards
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$R"
          test -f "$RUNNER_TEMP/ws9-live-guard.sh"
          bash "$RUNNER_TEMP/ws9-live-guard.sh" | tee "$R/live-after.txt"
          test -f "$R/side-overall.txt"
          for side in base head current merged; do
            case "$side" in
              base) sha=$BASE; vc=$VC_BASE;;
              head) sha=$HEAD_SHA; vc=$VC_HEAD;;
              current) sha=$PLAN; vc=$VC_BASE;;
              merged) sha=$MERGED; vc=$VC_HEAD;;
            esac
            root="$GITHUB_WORKSPACE/ws9-$side"
            for pair in "$root:$sha" "$root.env/runtime:$RT" "$root.env/vibecomfy:$vc" "$root.env/lifecycle:$LC"; do
              path=${pair%:*}; pin=${pair##*:}
              tree=$(awk -v s="$pin" '$2==s {print $3}' "$R/authoritative-trees.txt")
              test -n "$tree"
              test "$(git -C "$path" rev-parse HEAD)" = "$pin"
              test "$(git -C "$path" rev-parse HEAD^{tree})" = "$tree"
              test "$(git -C "$path" rev-parse --is-shallow-repository)" = false
              test -z "$(git -C "$path" status --porcelain --untracked-files=all)"
              git -C "$path" diff-index --quiet HEAD --
            done
            test "$(cat "$R/$side.post-guard")" = '0 0 0 0'
          done
          test "$(git -C "$GITHUB_WORKSPACE/agent-objects" rev-parse HEAD)" = "$EXPECTED_WRAPPER"
          test -z "$(git -C "$GITHUB_WORKSPACE/agent-objects" status --porcelain --untracked-files=all)"
          test "$(git -C "$GITHUB_WORKSPACE/dev" rev-parse HEAD)" = "$DEV_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE/dev" status --porcelain --untracked-files=all)"
          echo PASS > "$R/post-guard.txt"
      - name: Account for tests, failures and command receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R"
          python - <<'PY' | tee "$R/summary.json"
          import json, os, re, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          r=Path(os.environ["R"])
          def read(name):
              p=r/name
              return p.read_text().strip() if p.is_file() else None
          rows={}
          ids={}
          good=True
          for side in ("base","head","current","merged"):
              phase=read(side+".phase")
              exits=read(side+".pytest-exits.txt")
              row={"phase":phase,"pytest_and_tee_exits":exits,"side_exits":read(side+".side-exits.txt"),
                   "collection_exits":read(side+".collect-exits.txt"),"post_guard":read(side+".post-guard")}
              collection=read(side+".collect.log") or ""
              nodes=[line.strip() for line in collection.splitlines()
                     if line.startswith("tests/core/generation/test_") and "::" in line]
              selectors=["cli_gold_075b","readiness_inputs_f04","node_approval_contract",
                         "managed_preparation","attached_model_download","generate_align"]
              if side in ("head","merged"):
                  selectors.append("requirements_preview")
              expected_paths={"tests/core/generation/test_"+x+".py" for x in selectors}
              seen_paths={node.split("::",1)[0] for node in nodes}
              row["collected_nodes"]=len(nodes)
              row["collection_unique"]=len(set(nodes))
              row["collection_paths"]=sorted(seen_paths)
              row["missing_selector_paths"]=sorted(expected_paths-seen_paths)
              row["unexpected_selector_paths"]=sorted(seen_paths-expected_paths)
              row["collection_nonpass_counts"]=[m.group(0) for m in re.finditer(r"\b\d+ (?:deselected|skipped|errors?)\b",collection)]
              xml=r/(side+".xml")
              cases=[]
              if xml.is_file():
                  try: cases=list(ET.parse(xml).iter("testcase"))
                  except ET.ParseError as exc: row["xml_error"]=str(exc)
              ident=[(x.get("classname"),x.get("name")) for x in cases]
              ids[side]=set(ident)
              row.update(cases=len(cases), unique=len(ids[side]),
                         failures=sum(x.find("failure") is not None for x in cases),
                         errors=sum(x.find("error") is not None for x in cases),
                         skips=sum(x.find("skipped") is not None for x in cases))
              log=read(side+".pytest.log") or ""
              row["reported_nonpass_counts"]=[m.group(0) for m in re.finditer(r"\b\d+ (?:deselected|xfailed|xpassed|skipped|failed|errors?)\b",log)]
              commands=[]
              command_errors=[]
              for line in (read(side+".command-receipts.jsonl") or "").splitlines():
                  try: commands.append(json.loads(line.removeprefix("WS9_COMMAND_RECEIPT ")))
                  except (ValueError,TypeError) as exc: command_errors.append(str(exc))
              row["command_receipts"]=len(commands)
              expected_agent={"base":os.environ["BASE"],"head":os.environ["HEAD_SHA"],
                              "current":os.environ["PLAN"],"merged":os.environ["MERGED"]}[side]
              for command in commands:
                  try:
                      imports=command["imports"]
                      assert imports["astrid.core.generation.requirements"]["sha"]==expected_agent
                      assert imports["vibecomfy.requirements"]["sha"]==os.environ["VC_HEAD"]
                      assert imports["runtime_protocol"]["sha"]==os.environ["RT"]
                      assert command["unchanged"] and command["before"]==command["after"]
                      assert command["json"]["plan"]["digest"]==command["digest"]
                  except (AssertionError,KeyError,TypeError) as exc:
                      command_errors.append(repr(exc))
              row["command_receipt_errors"]=command_errors
              expected_commands=13 if side in ("head","merged") else 0
              clean=(phase=="TEST_FINISHED" and exits=="0 0" and row["side_exits"]=="0 0"
                     and row["post_guard"]=="0 0 0 0" and cases and len(ident)==len(ids[side])
                     and row["collection_exits"]=="0 0" and len(nodes)==len(set(nodes))==len(cases)
                     and seen_paths==expected_paths and not row["collection_nonpass_counts"]
                     and not(row["failures"] or row["errors"] or row["skips"] or row["reported_nonpass_counts"])
                     and len(commands)==expected_commands and not command_errors)
              row["disposition"]=("PASS_CANDIDATE_CPU_ONLY" if clean else
                                  "ENV_OR_GUARD" if phase!="TEST_FINISHED" or row["post_guard"]!="0 0 0 0"
                                  else "TEST_FAIL_OR_INCOMPLETE")
              good=good and bool(clean)
              rows[side]=row
          missing_original=sorted(ids["base"]-ids["head"])
          missing_integrated=sorted(ids["current"]-ids["merged"])
          good=good and not missing_original and not missing_integrated and read("post-guard.txt")=="PASS"
          print(json.dumps({"sides":rows,"missing_original_ids":missing_original,
                            "missing_integrated_ids":missing_integrated,
                            "post_guard":read("post-guard.txt"),"cpu_proof_complete":bool(good)},indent=2))
          sys.exit(0 if good else 1)
          PY
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws9-exact-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ws9-receipts/
          if-no-files-found: error
          retention-days: 7
