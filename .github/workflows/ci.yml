                "test_route_zero_detects_a_pinokio_install_before_a_fresh_install",
                "test_pinokio_launcher_resolved_from_the_skill_runs_with_its_arguments",
                "test_launcher_paths_list_the_pinokio_launcher_for_each_os",
                "test_generation_defaults_undo_is_the_restore_command_defaults_set_prints",
                "test_generation_steps_3_and_6_save_and_undo_a_placement_with_settings_set_and_unset",
                "test_work_folder_is_defined_before_first_use_and_windows_fetch_uses_curl_exe"
              ],
              "tests/test_setup_skill_pack.py": [
                "test_setup_pack_is_default_and_mirror_is_current",
                "test_generic_sync_name_preserves_existing_targets",
                "test_declared_name_is_generic_and_rejects_unsafe_paths",
                "test_setup_is_materialised_in_view",
                "test_custom_name_is_not_pruned_as_an_orphan",
                "test_setup_is_selected_and_visible_in_default_sync",
                "test_preinstalled_managed_setup_copy_is_adopted_by_sync",
                "test_preinstall_helper_writes_durable_marker_and_default_sync_adopts_it",
                "test_preinstall_helper_preserves_unmanaged_harness_entry",
                "test_documented_preinstall_launcher_form_runs_with_local_helper",
                "test_sync_rejects_colliding_names_before_mutation",
