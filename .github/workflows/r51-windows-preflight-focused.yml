name: R-51 focused Windows preflight

on:
  push:
    branches: [venue/M-QUAL-R51-WINDOWS-PREFLIGHT-2]

permissions:
  contents: write

jobs:
  focused-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record source and runner identity
        run: |
          mkdir -p evidence
          {
            printf 'repository=%s\nref=%s\nsource_candidate=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF" '8506e75f7cd474b6da13316385e871efe11d0e60'
            printf 'checkout_sha=%s\nworkflow_sha=%s\n' "$(git rev-parse HEAD)" "$GITHUB_WORKFLOW_SHA"
            printf 'workflow_ref=%s\nrun_id=%s\nrun_attempt=%s\njob=%s\nrunner_os=%s\nrunner_arch=%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH"
            python --version
            git --version
          } > evidence/identity.txt
          sha256sum scripts/ci_journey.py tests/test_ci_journey.py .github/workflows/r51-windows-preflight-focused.yml > evidence/source-sha256sums.txt
      - name: Install pytest
        run: python -m pip install pytest==8.3.5
      - name: Run two named tests
        id: focused
        run: |
          set +e
          export PYTHONPATH=.
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          printf '%s\n' 'pytest -c /dev/null --noconftest -q tests/test_ci_journey.py::test_windows_preflight_handles_absent_tasks_without_hiding_scheduler_errors tests/test_ci_journey.py::test_tst_b1_windows_manager_action_must_be_inside_exact_owned_root' > evidence/focused-tests.log
          pytest -c /dev/null --noconftest -q tests/test_ci_journey.py::test_windows_preflight_handles_absent_tasks_without_hiding_scheduler_errors tests/test_ci_journey.py::test_tst_b1_windows_manager_action_must_be_inside_exact_owned_root 2>&1 | tee -a evidence/focused-tests.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > evidence/inner-exit.txt
          exit "$rc"
      - name: Package focused evidence
        if: always()
        run: |
          mkdir -p evidence
          if [ ! -f evidence/inner-exit.txt ]; then printf 'not-run\n' > evidence/inner-exit.txt; fi
          (cd evidence && sha256sum identity.txt source-sha256sums.txt focused-tests.log inner-exit.txt > SHA256SUMS) || true
          powershell -NoProfile -Command "Compress-Archive -Path evidence/* -DestinationPath focused-evidence.zip -Force"
          sha256sum focused-evidence.zip > artifact-sha256.txt
      - name: Upload focused evidence
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: r51-focused-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: focused-evidence.zip
          if-no-files-found: error
      - name: Publish evidence by git
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          printf 'artifact_id=%s\nartifact_url=%s\nartifact_digest=%s\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" > evidence/upload.txt
          cp artifact-sha256.txt evidence/
          result_dir="$RUNNER_TEMP/r51-result"
          git init -q "$result_dir"
          git -C "$result_dir" config user.name 'github-actions[bot]'
          git -C "$result_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$result_dir" config core.autocrlf false
          printf '* -text\n' > "$result_dir/.git/info/attributes"
          mkdir -p "$result_dir/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp -R evidence/. "$result_dir/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/"
          cp focused-evidence.zip "$result_dir/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/"
          git -C "$result_dir" add .
          git -C "$result_dir" commit -qm 'Retain R-51 focused Windows evidence'
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          git -C "$result_dir" push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/venue-results/M-QUAL-R51-WINDOWS-PREFLIGHT-2
