name: C-06g focused coordinator proof

on:
  push:
    branches:
      - lane/M-CI/C-06G-FOCUSED-PROOF-R2
    paths:
      - .github/workflows/c06g-focused-proof.yml

permissions:
  contents: read

jobs:
  focused-coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: tests/ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install 'PyYAML>=6.0' 'jsonschema>=4.0'
      - name: Record and verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "checkout_sha=$(git rev-parse HEAD)"
            echo "parent_sha=$(git rev-parse HEAD^)"
            sha256sum scripts/ci/regression_coordinator.py tests/ci/test_regression_coordinator.py
          } | tee "$RUNNER_TEMP/c06g-identity.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 024fe668b2e34a86ef2b06e9f918919593580abd
          git diff --exit-code 024fe668b2e34a86ef2b06e9f918919593580abd HEAD -- . ':(exclude).github/workflows/c06g-focused-proof.yml'
      - name: Install candidate-pinned legacy schemas
        shell: bash
        run: |
          set -euo pipefail
          tuple_source=.github/integration/tuple.schema.json
          ledger_source=.github/integration/ledger.schema.json
          tuple_expected=90c200fddd45eae3eaf2796c17bd964e21d0be9b6097748abb8370b8b28774d0
          ledger_expected=7e9617427bdf0eac8bd22db56b6dec3dd2e3c1a803e616851c944f9a54c28226
          tuple_actual=$(sha256sum "$tuple_source" | cut -d ' ' -f 1)
          ledger_actual=$(sha256sum "$ledger_source" | cut -d ' ' -f 1)
          echo "tuple_source_sha256=$tuple_actual"
          echo "ledger_source_sha256=$ledger_actual"
          test "$tuple_actual" = "$tuple_expected"
          test "$ledger_actual" = "$ledger_expected"
          sudo install -d /home/user/repo/docs/merge-plan/schemas
          sudo install -m 0644 "$tuple_source" /home/user/repo/docs/merge-plan/schemas/tuple.schema.json
          sudo install -m 0644 "$ledger_source" /home/user/repo/docs/merge-plan/schemas/ledger.schema.json
          tuple_installed=$(sha256sum /home/user/repo/docs/merge-plan/schemas/tuple.schema.json | cut -d ' ' -f 1)
          ledger_installed=$(sha256sum /home/user/repo/docs/merge-plan/schemas/ledger.schema.json | cut -d ' ' -f 1)
          echo "tuple_installed_sha256=$tuple_installed"
          echo "ledger_installed_sha256=$ledger_installed"
          test "$tuple_installed" = "$tuple_expected"
          test "$ledger_installed" = "$ledger_expected"
          echo "installed_schema_sha256_checks=passed"
      - name: Run named and adjacent tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          echo '$ python -m unittest -v test_regression_coordinator.DeploymentAdapterTests.test_preexisting_terminal_pass_is_quarantined_and_requires_red_readback test_regression_coordinator.DeploymentAdapterTests.test_mark_terminal_on_legacy_pass_invalidates_old_readback test_regression_coordinator.DeploymentAdapterTests.test_predicted_red_digest_cannot_verify_during_quarantine' | tee "$RUNNER_TEMP/c06g-named.log"
          python -m unittest -v test_regression_coordinator.DeploymentAdapterTests.test_preexisting_terminal_pass_is_quarantined_and_requires_red_readback test_regression_coordinator.DeploymentAdapterTests.test_mark_terminal_on_legacy_pass_invalidates_old_readback test_regression_coordinator.DeploymentAdapterTests.test_predicted_red_digest_cannot_verify_during_quarantine 2>&1 | tee -a "$RUNNER_TEMP/c06g-named.log"
          named_exit=${PIPESTATUS[0]}
          echo "named_inner_exit=$named_exit" | tee -a "$RUNNER_TEMP/c06g-named.log"
          echo '$ python -m unittest -v test_regression_coordinator test_regression_finalizer test_regression_deployment test_regression_aggregate test_regression_green test_local_regression_green test_trusted_finalizer' | tee "$RUNNER_TEMP/c06g-adjacent.log"
          python -m unittest -v test_regression_coordinator test_regression_finalizer test_regression_deployment test_regression_aggregate test_regression_green test_local_regression_green test_trusted_finalizer 2>&1 | tee -a "$RUNNER_TEMP/c06g-adjacent.log"
          adjacent_exit=${PIPESTATUS[0]}
          echo "adjacent_inner_exit=$adjacent_exit" | tee -a "$RUNNER_TEMP/c06g-adjacent.log"
          if [ "$named_exit" -ne 0 ] || [ "$adjacent_exit" -ne 0 ]; then exit 1; fi
      - name: Upload identity and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c06g-focused-proof
          path: |
            ${{ runner.temp }}/c06g-identity.log
            ${{ runner.temp }}/c06g-named.log
            ${{ runner.temp }}/c06g-adjacent.log
          if-no-files-found: warn
