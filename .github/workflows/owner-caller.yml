name: Windows timeline schema owner caller

on:
  push:
    branches: ["venue/M-R1FIX-WIN-TIMELINE-SCHEMA-OWNER-4"]

permissions:
  contents: write
  actions: read

jobs:
  windows-journey:
    name: Windows task host journey (${{ matrix.installer-shell }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        installer-shell: [powershell.exe, pwsh.exe]
    steps:
      - name: Check out exact source Agent candidate
        uses: actions/checkout@v4
        with:
          ref: 3fff57b55ab6f51f33b66eedb7203013667cf3b1

      - name: Check out task-owned caller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: owner-caller

      - name: Resolve App ref
        id: app-ref
        shell: pwsh
        run: '"ref=36ff224e3c9ad862e3f807e2548b997a36799543" >> $env:GITHUB_OUTPUT'

      - name: Set up the journey driver (not the installed Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the pinned Runtime commit from the Agent lock
        id: runtime-ref
        shell: pwsh
        run: |
          $lock = Get-Content runtime.lock.json -Raw | ConvertFrom-Json
          $runtimeRef = $lock.source_commit
          if ($runtimeRef -notmatch '^[0-9a-f]{40}$') {
            throw "runtime.lock.json source_commit is not a full commit SHA"
          }
          "ref=$runtimeRef" >> $env:GITHUB_OUTPUT

      - name: Check out the selected Runtime
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-ref.outputs.ref }}
          path: journey-runtime

      - name: Check out the selected App installer
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: journey-app

      - name: Record checked-out refs
        shell: pwsh
        run: |
          $agentRef = git rev-parse HEAD
          $runtimeRef = git -C journey-runtime rev-parse HEAD
          $appRef = git -C journey-app rev-parse HEAD
          $callerRef = git -C owner-caller rev-parse HEAD
          $manifestHash = (Get-FileHash journey-app/public/install-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($agentRef -cne '3fff57b55ab6f51f33b66eedb7203013667cf3b1' -or $runtimeRef -cne '47e5949465cb6f3afdfd1cb8a0e90009fd9d4020' -or $appRef -cne '36ff224e3c9ad862e3f807e2548b997a36799543' -or $callerRef -cne '${{ github.sha }}' -or $manifestHash -cne 'b78ae7e74188f6e0bbf01950b0d388d4cf36ea990c9bb574fd8aef57a8782777') { throw 'Candidate tuple or manifest digest mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'X5-windows-journey'
          New-Item -ItemType Directory -Force $dir | Out-Null
          @{agent=$agentRef; runtime=$runtimeRef; app=$appRef; caller=$callerRef; manifest_sha256=$manifestHash; source_override=$true; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; job=$env:GITHUB_JOB; shell='${{ matrix.installer-shell }}'} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dir 'checked-out.json')
          Copy-Item journey-app/public/install-manifest.json (Join-Path $dir 'published-install-manifest.json')
          @(
            "## Effective checked-out refs"
            "- Agent: $agentRef"
            "- Runtime: $runtimeRef"
            "- App: $appRef"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install py-spy in the journey driver environment
        run: python -m pip install py-spy==0.4.2

      - name: Install with the real App install.ps1 / ${{ matrix.installer-shell }}
        id: install
        shell: pwsh
        run: |
          python -u owner-caller/diagnostics/owner-caller/run-install.py ${{ matrix.installer-shell }}
          $code = $LASTEXITCODE
          $dir = Join-Path $env:RUNNER_TEMP 'X5-windows-journey'
          Set-Content -Encoding ascii (Join-Path $dir 'install-inner-exit.txt') "$code"
          exit $code

      - name: Start Runtime through its installed Scheduled Task
        id: start
        run: python -u scripts/ci_windows_journey.py start

      - name: Wait for health on 127.0.0.1:17340
        id: health
        run: python -u scripts/ci_windows_journey.py health

      - name: Wait for pack-host running and its ready file
        id: host
        run: python -u scripts/ci_windows_journey.py host

      - name: Run an installed-profile SDK invocation through settlement
        id: task
        run: python -u scripts/ci_windows_journey.py task

      - name: Disable Scheduled Task restarts and run Runtime down
        id: down
        if: always()
        run: python -u scripts/ci_windows_journey.py down

      - name: Verify no Astrid or Runtime processes remain
        id: stopped
        if: always()
        run: python -u scripts/ci_windows_journey.py stopped

      - name: Collect install logs, Runtime logs, health and process lists
        id: collect
        if: always()
        run: python -u scripts/ci_windows_journey.py collect

      - name: Record row step outcomes
        if: always()
        shell: pwsh
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_RESULT: ${{ job.status }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'X5-windows-journey'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:STEP_RESULTS | Set-Content -Encoding utf8 (Join-Path $dir 'step-results.json')
          @{shell='${{ matrix.installer-shell }}'; job=$env:GITHUB_JOB; run_id=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; caller='${{ github.sha }}'; job_status=$env:JOB_RESULT} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dir 'row.json')

      - name: Upload Windows task host journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: Windows-task-host-journey-${{ matrix.installer-shell }}
          path: ${{ runner.temp }}/X5-windows-journey/
          if-no-files-found: error

  publish:
    if: always()
    needs: windows-journey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/owner-results/rows
      - name: Publish git-only result receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_RESULT: ${{ needs.windows-journey.result }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/owner-results"
          run="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result/$run"
          mv "$result/rows" "$result/$run/rows" || mkdir -p "$result/$run/rows"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$result/$run/jobs.json"
          python - "$result/$run" <<'PYCODE'
          import json, os, pathlib, subprocess, sys
          root=pathlib.Path(sys.argv[1])
          (root/'receipt.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'caller_sha':os.environ['CALLER_SHA'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],'matrix_result':os.environ['MATRIX_RESULT'],'requested':{'agent':'3fff57b55ab6f51f33b66eedb7203013667cf3b1','runtime':'47e5949465cb6f3afdfd1cb8a0e90009fd9d4020','app':'36ff224e3c9ad862e3f807e2548b997a36799543','manifest_sha256':'b78ae7e74188f6e0bbf01950b0d388d4cf36ea990c9bb574fd8aef57a8782777','source_override':True}},indent=2)+'\n')
          for shell in ('powershell.exe','pwsh.exe'):
              p=root/'rows'/('Windows-task-host-journey-'+shell)
              if not p.is_dir():
                  p.mkdir(parents=True); (p/'MISSING.txt').write_text('Row artifact unavailable.\n')
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          for job in jobs:
              if job['name'].startswith('Windows task host journey ('):
                  with (root/('job-%s.log'%job['id'])).open('wb') as f:
                      p=subprocess.run(['gh','api','repos/%s/actions/jobs/%s/logs'%(os.environ['GITHUB_REPOSITORY'],job['id'])],stdout=f,stderr=subprocess.PIPE)
                  if p.returncode: (root/('job-%s-log-error.txt'%job['id'])).write_bytes(p.stderr)
          PYCODE
          cd "$result/$run"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan owner-results
          git rm -rf .
          mkdir -p runs
          cp -a "$result/$run" runs/
          git add runs
          git commit -m "Windows owner evidence ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:refs/heads/venue-results/M-R1FIX-WIN-TIMELINE-SCHEMA-OWNER-4
