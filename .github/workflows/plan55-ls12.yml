name: Plan 55 first job after a change
on:
  pull_request:
    branches: ["release/14/plan-55"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "astrid/**"
      - "tests/integrations/test_ls12_first_job.py"
      - "tests/ls12_first_job_run.py"
      - "tests/core/pack/test_ls12*"
      - "tests/core/generation/test_ls12*"
      - "tests/sdk/test_ls12*"
      - "tests/packs/vibecomfy/test_ls12*"
      - ".github/workflows/plan55-ls12.yml"
permissions:
  contents: read
concurrency:
  group: plan55-ls12-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  first-job:
    if: github.head_ref == 'p55/ls12-fingerprint-20261116'
    name: First job (${{ matrix.os }}, ${{ matrix.revision }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        revision: [base, candidate]
    env:
      ASTRID_CI_JOB: lanes-integration
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/runtime
      ASTRID_VIBECOMFY_CHECKOUT: ${{ github.workspace }}/vibecomfy-checkout
      ASTRID_TEST_LIFECYCLE_CHECKOUT: ${{ github.workspace }}/runpod-lifecycle-checkout
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-rA"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read canonical dependency authority
        id: pins
        shell: python
        run: |
          import json, os, pathlib
          runtime = json.loads(pathlib.Path("runtime.lock.json").read_text())["source_commit"]
          vibe = json.loads(pathlib.Path("astrid/packs/vibecomfy/pins.json").read_text())["sources"]["vibecomfy"]["revision"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print("runtime=" + runtime, file=out)
              print("vibecomfy=" + vibe, file=out)
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.pins.outputs.runtime }}
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: ${{ steps.pins.outputs.vibecomfy }}
          path: vibecomfy-checkout
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/runpod-lifecycle
          ref: 7f0b025e9391baac9f5c2fb7393617ea6fef0704
          path: runpod-lifecycle-checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        id: install
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --no-deps -e ./runtime -e ./runtime/packages/python -e ./runpod-lifecycle-checkout
          python -m pip install -e ./vibecomfy-checkout
      - name: Select exact product source and identical proof
        id: source
        shell: python
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          source = root
          if os.environ["REVISION"] == "base":
              source = root / "ls12-base"
              subprocess.run(["git", "worktree", "add", "--detach", str(source), "493616c1cfc7a83f18894dc81773571e977f26ef"], check=True)
              for relative in [
                  "tests/integrations/test_ls12_first_job.py", "tests/ls12_first_job_run.py",
                  "tests/core/generation/test_ls12_first_job_collector.py",
                  "tests/core/generation/test_ls12_runtime_observer.py",
                  "tests/core/pack/test_ls12_import_admission.py",
                  "tests/core/pack/test_ls12_source_identity.py",
                  "tests/core/generation/test_ls12_named_entry.py",
                  "tests/sdk/test_ls12_single_emission.py",
                  "tests/packs/vibecomfy/test_ls12_attempt_bundle.py",
                  "tests/core/pack/test_discovery_fingerprint_walk.py",
              ]:
                  shutil.copyfile(root / relative, source / relative)
          proof = root / "ls12-proof"
          proof.mkdir()
          refs = {key: subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
                  for key, path in {"agent": source, "harness": root, "runtime": root / "runtime", "vibecomfy": root / "vibecomfy-checkout", "lifecycle": root / "runpod-lifecycle-checkout"}.items()}
          (proof / "sources.json").write_text(json.dumps(refs, indent=2) + "\n")
          for relative in ["runtime.lock.json", "astrid/packs/vibecomfy/pins.json"]:
              if (source / relative).read_bytes() != (root / relative).read_bytes():
                  raise SystemExit("base/candidate dependency authorities differ: " + relative)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              print("LS12_SOURCE=" + str(source), file=out)
              print("LS12_PROOF=" + str(proof), file=out)
              print("PYTHONPATH=" + os.pathsep.join(map(str, [source, root / "runtime", root / "runtime/packages/python", root / "vibecomfy-checkout", root / "runpod-lifecycle-checkout/src"])), file=out)
      - name: Unchanged admission and identity tests plus new proof oracles
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.chdir(os.environ["LS12_SOURCE"])
          command = [sys.executable, "-m", "pytest", "-q", "-rA",
              "tests/core/pack/test_identity.py", "tests/core/pack/test_verified_relocations.py",
              "tests/core/execution/test_external_pack_loading_m1_03.py",
              "tests/core/generation/test_ls12_first_job_collector.py",
              "tests/core/generation/test_ls12_runtime_observer.py",
              "--junitxml=" + str(pathlib.Path(os.environ["LS12_PROOF"]) / "focused.xml")]
          subprocess.run(command, check=True)
      - name: Execute discovery scope including known inherited failing case
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.chdir(os.environ["LS12_SOURCE"])
          subprocess.run([sys.executable, "-m", "pytest", "-q", "-rA", "tests/core/generation/test_discovery_scope.py",
              "--junitxml=" + str(pathlib.Path(os.environ["LS12_PROOF"]) / "discovery.xml")], check=True)
      - name: Admission, source identity, named entry and single-emission probes
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.chdir(os.environ["LS12_SOURCE"])
          subprocess.run([sys.executable, "-m", "pytest", "-q", "-rA",
              "tests/core/pack/test_ls12_import_admission.py",
              "tests/core/pack/test_ls12_source_identity.py",
              "tests/core/generation/test_ls12_named_entry.py",
              "tests/sdk/test_ls12_single_emission.py",
              "tests/packs/vibecomfy/test_ls12_attempt_bundle.py",
              "tests/core/pack/test_discovery_fingerprint_walk.py",
              "--junitxml=" + str(pathlib.Path(os.environ["LS12_PROOF"]) / "ls12.xml")], check=True)
      - name: First-job timing and separate process/hash observations
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.chdir(os.environ["LS12_SOURCE"])
          subprocess.run([sys.executable, "-m", "tests.ls12_first_job_run",
              "--output", str(pathlib.Path(os.environ["LS12_PROOF"]) / "meter"),
              "--samples", "20", "--counter-samples", "2", "--require-d1"], check=True)
      - name: Existing caller source, input and target authority tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.chdir(os.environ["LS12_SOURCE"])
          subprocess.run([sys.executable, "-m", "pytest", "-q", "-rA",
              "tests/sdk/test_generation_source_retention.py",
              "tests/sdk/test_generation_workflow.py", "tests/sdk/test_generation_target.py",
              "tests/core/generation/test_t4i_job_contract.py",
              "--junitxml=" + str(pathlib.Path(os.environ["LS12_PROOF"]) / "caller.xml")], check=True)
      - name: Existing local-server execution, input custody and prepared-workflow tests
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.chdir(os.environ["LS12_SOURCE"])
          subprocess.run([sys.executable, "-m", "pytest", "-q", "-rA", "-m", "integration or not integration",
              "tests/packs/vibecomfy/test_local_server_run.py",
              "tests/packs/vibecomfy/test_local_server_helpers.py",
              "tests/packs/vibecomfy/test_local_server_media.py",
              "tests/packs/vibecomfy/test_local_server_mask_preflight.py",
              "tests/packs/vibecomfy/test_prepared_local_server.py",
              "--junitxml=" + str(pathlib.Path(os.environ["LS12_PROOF"]) / "local-server.xml")], check=True)
      - name: Hash retained proof
        if: ${{ always() && steps.source.outcome == 'success' }}
        shell: python
        run: |
          import hashlib, os, pathlib
          proof = pathlib.Path(os.environ["LS12_PROOF"])
          files = sorted(p for p in proof.rglob("*") if p.is_file() and p.name != "SHA256SUMS")
          (proof / "SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.relative_to(proof).as_posix() + "\n" for p in files))
      - name: Preserve every observation and original failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ls12-${{ matrix.os }}-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ls12-proof
          include-hidden-files: true
          retention-days: 14
