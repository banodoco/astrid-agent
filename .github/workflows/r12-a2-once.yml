name: R12 A2 no-credit shakedown (one push)
on:
  push:
    branches: ['scratch/r12-a2-shakedown-019-20261111']
permissions:
  contents: read
concurrency:
  group: r12-a2-shakedown-019-20261111
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'banodoco/astrid-agent' && github.ref == 'refs/heads/scratch/r12-a2-shakedown-019-20261111' && github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1 && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        side: [r10, r11, base, candidate]
        group: ['019']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.17'
      - name: Validate and execute isolated group
        id: a2
        env:
          A2_SIDE: ${{ matrix.side }}
          A2_GROUP: ${{ matrix.group }}
          A2_BEFORE: ${{ github.event.before }}
          A2_REF: ${{ github.ref }}
          A2_SHA: ${{ github.sha }}
          A2_ATTEMPT: ${{ github.run_attempt }}
        run: python tools/r12-a2-ci/runner.py
      - name: Upload receipt even after failure or cancellation
        if: always() && steps.a2.outputs.receipt_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r12-a2-${{ matrix.group }}-${{ matrix.side }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-a2-receipt/receipt.json
          if-no-files-found: warn
          retention-days: 90
