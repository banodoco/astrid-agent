name: Plan 55 ETW reader parser oracles
on:
  push:
    branches: ["p55/etw-parser-oracles-20261116"]
permissions:
  contents: read
jobs:
  reader:
    name: Existing ETW reader unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest for standalone parser unit file
        run: python -m pip install pytest
      - name: Run original native-reader assertions, no generation
        run: python -m pytest -q -rA --confcutdir=tests/core/generation tests/core/generation/test_local_speed_native_reader.py
      - name: Check new stream-retention and decoder unit cases
        run: python -m tests.local_speed_decode_check
