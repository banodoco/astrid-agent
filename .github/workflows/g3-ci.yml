name: G3 agent ci
'on':
  workflow_call:
    inputs:
      runtime_sha:
        required: true
        type: string
      agent_sha:
        required: true
        type: string
      app_sha:
        required: true
        type: string
      pinokio_sha:
        required: true
        type: string
      vibecomfy_sha:
        required: true
        type: string
    secrets:
      RUNTIME_READ_TOKEN:
        required: false
      ASTRID_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  windows-native-and-installer:
    runs-on: windows-latest
    env:
      ASTRID_CI_JOB: windows-native-and-installer
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-agent-ci-5
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install package with dev extras
      run: python -m pip install -e '.[dev]'
    - name: Install the pinned Runtime and client
      run: python scripts/ci_install_runtime.py
    - name: Check native PowerShell cleanup exit codes
      run: python -m pytest -q tests/test_installer_windows_tasks.py
    - name: Check Windows pack-host identity and service launcher binding
      run: python -m pytest -q tests/sdk/test_host_recovery.py tests/test_services.py -k windows
    - name: Check native Windows process and permission behavior
      run: python -m pytest -q tests/core/execution/test_platform_helpers.py::test_windows_scope_job_kills_descendants_after_leader_exit
        tests/core/execution/test_platform_helpers.py::test_windows_lock_and_owner_permissions_are_native tests/core/execution/test_platform_helpers.py::test_windows_scope_dies_when_owner_process_exits
        tests/test_generic_host_child_output.py tests/test_host_child_stdin.py tests/test_windows_child_stdin.py -rP
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-5.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
  checks:
    name: fast checks
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-agent-ci-4
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install system media tools
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg

        '
    - name: Install package with dev extras
      run: python -m pip install -e '.[dev]'
    - name: Install the pinned Runtime and client
      run: python scripts/ci_install_runtime.py
    - name: Ruff baseline gate
      run: make ruff
    - name: Mypy baseline gate
      run: make mypy
    - name: Import cycles gate
      run: make cycles
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-4.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
  unit-shard:
    name: unit shard ${{ matrix.group }} / 8 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      ASTRID_CI_JOB: unit-shard-${{ matrix.os }}
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        group:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Check out the Runtime (test fixtures)
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        path: astrid-runtime
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: astrid-runtime
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-agent-ci-3
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up pinned uv
      uses: astral-sh/setup-uv@v6
      with:
        version: 0.11.32
    - name: Set up Node.js from .node-version
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - name: Install system media tools and a system font
      if: runner.os == 'Linux'
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg fonts-dejavu-core

        '
      shell: bash
    - name: Install package with dev extras
      run: python -m pip install -e '.[dev]'
    - name: Install the pinned Runtime and client
      run: python scripts/ci_install_runtime.py
    - name: Unit tests (default lane shard)
      run: python -m pytest -q --splits 8 --group ${{ matrix.group }} --durations-path tests/.test_durations --store-durations
        --clean-durations
    - name: Upload measured test durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-durations-${{ matrix.group }}-${{ matrix.os }}
        path: tests/.test_durations
        include-hidden-files: true
        if-no-files-found: error
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-3.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
  unit:
    name: unit
    runs-on: ubuntu-latest
    needs:
    - checks
    - unit-shard
    steps:
    - name: All unit shards and fast checks passed
      run: echo "unit passed"
  darwin-native:
    name: darwin native
    runs-on: macos-latest
    env:
      ASTRID_CI_JOB: darwin-native
      ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Check out the Runtime (astrid-runtime)
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        path: astrid-runtime
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: astrid-runtime
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-agent-ci-2
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Restore npm cache (C-08)
      id: c08-agent-ci-1
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remotion/package-lock.json') }}
    - name: Set up Node.js from .node-version
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - name: Install ffmpeg
      run: brew install ffmpeg
    - name: Install Remotion dependencies
      run: npm ci --prefix remotion
    - name: Install package with dev extras
      run: python -m pip install -e '.[dev]'
    - name: Install the Runtime and client from the checkout
      run: python -m pip install --no-deps -e ./astrid-runtime -e ./astrid-runtime/packages/python
    - name: Provision the Remotion browser
      run: npx remotion browser ensure
      working-directory: remotion
    - name: Install the Codex CLI (the codex_cli lane starts its native binary in the host sandbox)
      run: npm install -g @openai/codex@0.163.0
    - name: Darwin native, Remotion and browser tests
      run: python -m pytest -q -m "darwin_native or remotion or chrome or codex_cli"
    - name: Save npm cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-1.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('remotion/package-lock.json') }}
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-agent-ci-2.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/*.lock') }}
  release:
    name: release wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system media tools
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg

        '
    - name: Install wheel builder
      run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/build.lock
    - name: Build exactly one wheel
      run: 'python -m build --wheel --no-isolation --outdir dist

        test "$(ls dist/*.whl | wc -l)" -eq 1

        '
    - name: Install the wheel with the hashed runtime lock only
      run: 'python -m venv "$RUNNER_TEMP/release-venv"

        "$RUNNER_TEMP/release-venv/bin/python" -m pip install --disable-pip-version-check --no-input --require-hashes -r requirements/runtime.lock

        "$RUNNER_TEMP/release-venv/bin/python" scripts/ci_install_runtime.py

        "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-deps dist/*.whl

        "$RUNNER_TEMP/release-venv/bin/python" -m pip check

        cd "$RUNNER_TEMP" && "$RUNNER_TEMP/release-venv/bin/python" -c "import astrid"

        '
    - name: Smoke the installed wheel
      run: bash scripts/smoke_wheel_install.sh --wheel dist/*.whl --venv "$RUNNER_TEMP/release-venv"
    - name: Validate locks and record the release toolchain
      run: python -m scripts.reshape.release_reproducibility --expected-python ${{ matrix.python-version }} --output dist/toolchain.json
    - name: Upload the wheel and its toolchain record
      uses: actions/upload-artifact@v4
      with:
        name: release-wheel-${{ matrix.python-version }}
        path: dist/
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Check out the Runtime (producer)
      uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        path: runtime-producer
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: runtime-producer
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: All vendored Runtime artifacts match the pinned producer
      run: python scripts/vendor_lock.py check runtime.lock.json --producer runtime-producer
