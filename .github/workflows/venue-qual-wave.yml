name: Venue qualification wave
on:
  push:
    branches: ['venue/V-08-QUAL-WAVE-*']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        run: |
          matrix=$(python3 scripts/venue/qual_wave.py matrix .github/workflows/venue-qual-wave-inputs.json --source .github/workflows/venue-qual-wave-source.txt)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  row:
    needs: inputs
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inputs.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout wave
        uses: actions/checkout@v4
        with:
          path: wave
          persist-credentials: false
      - name: Checkout Agent
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: af5ae8afdb9829beb2bba4f811dbe97765bd72b2
          path: agent
          persist-credentials: false
      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: 47e5949465cb6f3afdfd1cb8a0e90009fd9d4020
          path: runtime
          persist-credentials: false
      - name: Checkout App
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: a55bec9ff384b5bbfee5535962880084ab2adb1b
          path: app
          persist-credentials: false
      - name: Checkout Pinokio
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: 89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4
          path: pinokio
          persist-credentials: false
      - name: Execute exact row entry
        id: run
        env:
          ROW_ID: ${{ matrix.id }}
        run: python3 wave/scripts/venue/qual_wave_run.py wave/.github/workflows/venue-qual-wave-inputs.json
      - name: Upload row evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qual-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: venue-evidence/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Propagate inner exit
        if: ${{ steps.run.outcome == 'success' }}
        env:
          ROW_ID: ${{ matrix.id }}
        run: exit "$(cat "venue-evidence/$ROW_ID/exit-code.txt")"
