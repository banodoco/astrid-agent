name: Guarded exact R25 orphan stop and recovery (manual only)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Stop exact tree, or recover a previous interrupted stop
        type: choice
        required: true
        options: [stop, recover]
      audit_id:
        description: Previous run-id and attempt (required for recover)
        type: string
        required: false
concurrency:
  group: guarded-r25-exact-stop
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stop:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 5
    steps:
      - name: Verify exact identities and perform selected guarded phase
        shell: bash
        working-directory: /
        env:
          R25_STOP_PHASE: ${{ inputs.phase }}
          R25_STOP_AUDIT_ID: ${{ inputs.audit_id }}
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          code = base64.b64decode("", validate=True)
          exec(compile(code, "guarded-r25-stop", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload action audit
        if: always() && env.R25_STOP_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: guarded-r25-stop-${{ github.run_id }}
          path: ${{ env.R25_STOP_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
