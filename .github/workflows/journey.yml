name: macOS runner checkout cleanup (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 5
    steps:
      - name: Remove only the verified disposable runner checkout
        shell: bash
        working-directory: /
        run: |
          /opt/homebrew/opt/python@3.11/bin/python3.11 - <<'PY'
          #!/usr/bin/env python3
          """Delete only the dedicated runner's disposable repository workspace."""
          import json
          import os
          import pwd
          import re
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          UID = 503
          LABEL = "haus.astrid.runtime"


          def assert_no_launchagent():
              result = subprocess.run(["launchctl", "print", f"gui/{UID}/{LABEL}"],
                                      capture_output=True, text=True, timeout=20, check=False)
              missing = f'Could not find service "{LABEL}" in domain for user gui: {UID}'
              stderr = result.stderr.strip().replace("\r\n", "\n")
              if result.returncode != 113 or stderr not in {missing, f"Bad request.\n{missing}"}:
                  raise RuntimeError("Smoke LaunchAgent is present or cannot be verified absent")


          def assert_no_referencing_processes(paths):
              output = subprocess.check_output(["ps", "-ww", "-axo", "pid=,command="], text=True)
              records = []
              for line in output.splitlines():
                  match = re.match(r"^\s*(\d+)\s+(.*)$", line)
                  if match:
                      records.append((int(match.group(1)), match.group(2)))
                  elif records:
                      pid, command = records[-1]
                      records[-1] = (pid, command + "\n" + line)
              if any(any(str(path) in command for path in paths) for _, command in records):
                  raise RuntimeError("A process references the smoke root or checkout")


          def assert_checkout_not_open(target):
              result = subprocess.run(["lsof", "-n", "+D", str(target)], capture_output=True,
                                      text=True, timeout=60, check=False)
              if result.returncode != 1 or result.stdout.strip() or result.stderr.strip():
                  raise RuntimeError("Checkout is open or its usage cannot be verified")


          def assert_real_directory(path, *, owner=None):
              # Every component must be a real directory; never traverse a symlink.
              current = Path(path.anchor)
              for name in path.parts[1:]:
                  current /= name
                  st = current.lstat()
                  if not stat.S_ISDIR(st.st_mode):
                      raise RuntimeError("Workspace path contains a symlink or non-directory")
              if owner is not None and path.lstat().st_uid != owner:
                  raise RuntimeError("Workspace directory has the wrong owner")


          def assert_tree_safe(root):
              device = root.lstat().st_dev
              for directory, dirs, files in os.walk(root, followlinks=False, onerror=lambda e: (_ for _ in ()).throw(e)):
                  for name in dirs + files:
                      st = (Path(directory) / name).lstat()
                      # rmtree's fd-safe implementation unlinks symlink entries rather
                      # than following them; compare devices only for real entries.
                      if stat.S_ISLNK(st.st_mode):
                          continue
                      if st.st_dev != device:
                          raise RuntimeError("Checkout contains a mounted filesystem")


          def main():
              if os.getuid() != UID or os.environ.get("RUNNER_NAME") != "hannah-mac":
                  raise RuntimeError("This action requires the dedicated runner identity")
              home = Path(pwd.getpwuid(UID).pw_dir)
              work = home / "actions-runner" / "_work"
              temp = work / "_temp"
              if Path(os.environ["RUNNER_TEMP"]) != temp:
                  raise RuntimeError("Runner temp does not match the expected location")
              assert_real_directory(work, owner=UID)
              assert_real_directory(temp, owner=UID)
              target = work / "astrid-agent"
              smoke = temp / "astrid-r1-direct-macos"
              before = shutil.disk_usage(work).free
              assert_no_launchagent()
              assert_no_referencing_processes((smoke, target))
              if not (target.exists() or target.is_symlink()):
                  print(json.dumps({"status": "already absent", "free_bytes_before": before, "free_bytes_after": before}))
                  return
              assert_real_directory(target, owner=UID)
              assert_tree_safe(target)
              assert_checkout_not_open(target)
              # The run directory must itself already be absent; it is never deleted here.
              if smoke.exists() or smoke.is_symlink():
                  raise RuntimeError("Smoke root still exists; inspect it separately")
              if not shutil.rmtree.avoids_symlink_attacks:
                  raise RuntimeError("Safe directory deletion is unavailable")
              # Recheck immediately at the destructive boundary.
              assert_no_launchagent()
              assert_no_referencing_processes((smoke, target))
              assert_checkout_not_open(target)
              assert_real_directory(target, owner=UID)
              if smoke.exists() or smoke.is_symlink():
                  raise RuntimeError("Smoke root appeared during cleanup")
              shutil.rmtree(target)
              after = shutil.disk_usage(work).free
              print(json.dumps({"status": "checkout removed", "free_bytes_before": before, "free_bytes_after": after}))


          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  reason = str(exc) if type(exc) is RuntimeError else "System or data error during cleanup"
                  print(json.dumps({"status": "refused", "reason": reason}))
                  raise SystemExit(1)
          PY
