name: WS02 launchd state audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 5
    steps:
      - name: Read only runner launchd state
        shell: bash
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import json, os, re, subprocess
          if os.getuid()!=503 or os.environ.get('RUNNER_NAME')!='hannah-mac': raise SystemExit('Unexpected runner')
          q=subprocess.run(['/bin/launchctl','print-disabled','gui/503'],capture_output=True,text=True,timeout=20,check=True)
          if 'disabled services' not in q.stdout: raise SystemExit('Disabled state unverified')
          m=re.search(r'(?m)^\s*"haus\.astrid\.runtime"\s*=>\s*(\w+)\s*$',q.stdout)
          value=m.group(1) if m else 'not-listed'
          service=subprocess.run(['/bin/launchctl','print','gui/503/haus.astrid.runtime'],capture_output=True,text=True,timeout=20)
          missing='Could not find service "haus.astrid.runtime" in domain for user gui: 503'
          absent=service.returncode==113 and service.stderr.strip().replace('\r\n','\n') in (missing,'Bad request.\n'+missing)
          print(json.dumps({'label_state':value,'service_absent':absent}))
          if value not in ('enabled','false','not-listed') or not absent: raise SystemExit('Launchd state requires review')
          PYCODE
