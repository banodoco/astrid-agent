name: M46 principal boundary native discriminator (unadmitted)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m46_principal_discriminator:
    name: m46-principal-discriminator-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 641b51dedda8e0d7bde2d31dfbd906651e9cb723
          persist-credentials: false
      - name: Provision separate disposable principal and execute
        id: native
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/m46-principal"
          mkdir -m 700 "$out"
          { git rev-parse HEAD; uname -a; id; } > "$out/venue.txt" 2>&1
          status=0
          if id m46principal >/dev/null 2>&1; then
            echo 'account already exists; refusing' >> "$out/venue.txt"
            exit 20
          fi
          sudo useradd --create-home --user-group --shell /usr/sbin/nologin m46principal || exit $?
          uid="$(id -u m46principal)"
          printf '%s\n' "$uid" > "$out/uid"
          sudo loginctl enable-linger m46principal || status=$?
          if [ "$status" = 0 ]; then sudo systemctl start "user@${uid}.service" || status=$?; fi
          if [ "$status" = 0 ]; then
            sudo install -d -o root -g root -m 0755 /opt/m46-principal-discriminator || status=$?
            sudo install -o root -g root -m 0444 scripts/m4_6_linux_principal_discriminator.py /opt/m46-principal-discriminator/collector.py || status=$?
            printf '{"synthetic":true}\n' | sudo tee /opt/m46-principal-discriminator/export.json >/dev/null || status=$?
            sudo chmod 0444 /opt/m46-principal-discriminator/export.json || status=$?
          fi
          if [ "$status" = 0 ]; then
            sudo /usr/bin/python3 /opt/m46-principal-discriminator/collector.py "$uid" /opt/m46-principal-discriminator > "$out/result.json" 2> "$out/stderr.txt" || status=$?
          fi
          printf '%s\n' "$status" > "$out/inner-exit.txt"
          exit "$status"
      - name: Remove disposable principal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/m46-principal/uid"
          if [ ! -f "$marker" ]; then exit 0; fi
          uid="$(cat "$marker")"
          test "$(id -u m46principal)" = "$uid"
          sudo loginctl disable-linger m46principal
          sudo systemctl stop "user@${uid}.service"
          if sudo pkill -KILL -u "$uid"; then :; else test "$?" = 1; fi
          test -z "$(ps -u "$uid" -o pid=)"
          sudo userdel --remove m46principal
      - name: Retain unadmitted native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m46-principal-${{ github.run_id }}-${{ github.run_attempt }}-linux
          path: ${{ runner.temp }}/m46-principal/*
          if-no-files-found: error
          overwrite: false
          retention-days: 7
