name: MAC-UPDATE-02 isolated diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 120
    steps:
      - name: Run isolated diagnostic and stage evidence
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, data in (("mac_update_outer.py", ""), ("mac_update_inner.py", "")):
              (temp / name).write_bytes(base64.b64decode(data, validate=True))
          raise SystemExit(subprocess.call(['/usr/bin/python3', '-u', str(temp / 'mac_update_outer.py')]))
          PYCODE
      - name: Upload sanitized evidence
        id: upload
        if: always() && env.R05_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-02-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.R05_UPLOAD }}
          if-no-files-found: error
      - name: Remove only verified task sandbox after upload
        if: always() && steps.upload.outcome == 'success' && env.WS02_TASK_ROOT != ''
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64, os, pathlib, pwd
          home=pathlib.Path(pwd.getpwuid(503).pw_dir)
          pyroot=home/'actions-runner/_work/_tool/Python/3.11.18/arm64'
          py=pyroot/'bin/python3.11'
          if os.getuid()!=503 or pyroot.is_symlink() or pyroot.resolve()!=pyroot or pyroot.stat().st_uid!=503 or not py.resolve().is_relative_to(pyroot) or py.stat().st_uid!=503:
              raise SystemExit('Runner Python identity not verified')
          source=base64.b64decode("",validate=True).decode()
          os.execv(str(py),[str(py),'-I','-c',source])
          PYCODE
