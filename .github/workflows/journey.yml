name: Prelaunch runner-owned inventory (manual read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 20
    steps:
      - name: Inventory runner-owned task paths and test process identities
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          script = base64.b64decode("", validate=True)
          exec(compile(script, "prelaunch-inventory", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload redacted inventory and checksum
        if: always() && env.PRELAUNCH_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-runner-inventory-${{ github.run_id }}
          path: ${{ env.PRELAUNCH_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
