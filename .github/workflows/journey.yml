name: Release-1 installed lifecycle receipts

# This workflow is deliberately a receipt producer, not a release dispatcher.
# A caller supplies one immutable candidate tuple; the final gate rejects any
# missing, skipped, failed, duplicate, or foreground-substituted matrix result.
on:
  workflow_call:
    inputs:
      candidate:
        description: Frozen JSON with app, agent, runtime and pinokio full commit SHAs plus bootstrap hashes
        required: true
        type: string
      old_launcher_ref:
        description: Full SHA for the approved pre-self-pull Pinokio backend action
        required: true
        type: string
      stopped_path_agent_ref:
        description: Full candidate Agent SHA containing the integrated A/B stopped path
        required: true
        type: string
      m4_4a_executor_configs:
        description: JSON object keyed by linux/macos/windows containing complete explicit M4-4a executor configs
        required: false
        default: '{"linux":{},"macos":{},"windows":{}}'
        type: string
      m4_4a_backend_only:
        description: Run and aggregate only the three M4-4a backend rows
        required: false
        default: false
        type: boolean
      m4_5_enabled:
        description: Run all twelve M4-5 hosted Release-2 scenarios (requires an installed boundary executable)
        required: false
        default: false
        type: boolean
      m4_5_only:
        description: Skip Release-1/M4-4a jobs and gates because M4-5 has its own frozen candidate tuple
        required: false
        default: false
        type: boolean
      m4_5_boundary:
        description: Explicit installed boundary executable available on each matrix runner
        required: false
        type: string
      m4_5_boundary_args:
        description: JSON array of separate argv strings passed to the boundary executable
        required: false
        default: "[]"
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: Frozen candidate JSON; hosted results are evidence, never a publish action
        required: true
        type: string
      old_launcher_ref:
        description: Full SHA for the approved pre-self-pull Pinokio backend action
        required: true
        type: string
      stopped_path_agent_ref:
        description: Full candidate Agent SHA containing the integrated A/B stopped path
        required: true
        type: string
      m4_4a_executor_configs:
        description: JSON object keyed by linux/macos/windows containing complete explicit M4-4a executor configs
        required: false
        default: '{"linux":{},"macos":{},"windows":{}}'
        type: string
      m4_4a_backend_only:
        description: Run and aggregate only the three M4-4a backend rows
        required: false
        default: false
        type: boolean
      m4_5_enabled:
        description: Run all twelve M4-5 hosted Release-2 scenarios (requires an installed boundary executable)
        required: false
        default: false
        type: boolean
      m4_5_only:
        description: Skip Release-1/M4-4a jobs and gates because M4-5 has its own frozen candidate tuple
        required: false
        default: false
        type: boolean
      m4_5_boundary:
        description: Explicit installed boundary executable available on each matrix runner
        required: false
        type: string
      m4_5_boundary_args:
        description: JSON array of separate argv strings passed to the boundary executable
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.config.outputs.candidate }}
      driver_agent_ref: ${{ steps.config.outputs.driver_agent_ref }}
      old_launcher_ref: ${{ steps.config.outputs.old_launcher_ref }}
      stopped_path_agent_ref: ${{ steps.config.outputs.stopped_path_agent_ref }}
      m4_4a_executor_configs: ${{ steps.config.outputs.m4_4a_executor_configs }}
      m4_4a_backend_only: ${{ steps.config.outputs.m4_4a_backend_only }}
      m4_5_enabled: ${{ steps.config.outputs.m4_5_enabled }}
      m4_5_only: ${{ steps.config.outputs.m4_5_only }}
      m4_5_boundary: ${{ steps.config.outputs.m4_5_boundary }}
      m4_5_boundary_args: ${{ steps.config.outputs.m4_5_boundary_args }}
      m4_5_matrix: ${{ steps.config.outputs.m4_5_matrix }}
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - name: Check out reviewed Agent matrix contracts
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - id: config
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
          DRIVER_AGENT_REF: ${{ github.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          OLD_LAUNCHER_REF: ${{ inputs.old_launcher_ref }}
          STOPPED_PATH_AGENT_REF: ${{ inputs.stopped_path_agent_ref }}
          M4_4A_EXECUTOR_CONFIGS: ${{ inputs.m4_4a_executor_configs }}
          M4_4A_BACKEND_ONLY: ${{ inputs.m4_4a_backend_only }}
          M4_5_ENABLED: ${{ inputs.m4_5_enabled }}
          M4_5_ONLY: ${{ inputs.m4_5_only }}
          M4_5_BOUNDARY: ${{ inputs.m4_5_boundary }}
          M4_5_BOUNDARY_ARGS: ${{ inputs.m4_5_boundary_args }}
        run: |
          python3 - <<'PY'
          import json, os, re
          import sys
          sys.path.insert(0, "driver/scripts")
          import journey_matrix
          import journey_release2
          candidate = json.loads(os.environ["CANDIDATE"])
          if not isinstance(candidate, dict) or any(
              not re.fullmatch(r"[0-9a-f]{40}", str(candidate.get(key, "")))
              for key in ("app", "agent", "runtime", "pinokio")
          ):
              raise SystemExit("a frozen candidate with app/agent/runtime/pinokio full commit SHAs is required")
          driver = os.environ["DRIVER_AGENT_REF"]
          if not re.fullmatch(r"[0-9a-f]{40}", driver):
              raise SystemExit("the reviewed Agent workflow SHA is required")
          if os.environ["WORKFLOW_REPOSITORY"] != "banodoco/astrid-agent":
              raise SystemExit("the receipt harness must run from banodoco/astrid-agent")
          old_launcher = os.environ["OLD_LAUNCHER_REF"]
          if old_launcher != "bbba620e3d89eeff8021417f365e6ea584203105":
              raise SystemExit("the approved old_launcher_ref SHA is required")
          stopped_path = os.environ["STOPPED_PATH_AGENT_REF"]
          m4_5_only = os.environ["M4_5_ONLY"].lower() == "true"
          if stopped_path != candidate["agent"]:
              raise SystemExit("stopped_path_agent_ref must equal the frozen candidate Agent SHA")
          if not m4_5_only and stopped_path == "3cc84be5d8c565f1a4a500dcf713478498e34885":
              raise SystemExit("the provisional Agent base lacks the integrated A/B stopped path")
          try:
              executor_configs = json.loads(os.environ["M4_4A_EXECUTOR_CONFIGS"])
          except json.JSONDecodeError as exc:
              raise SystemExit("m4_4a_executor_configs must be a JSON object") from exc
          if not isinstance(executor_configs, dict) or set(executor_configs) != {"linux", "macos", "windows"}:
              raise SystemExit("m4_4a_executor_configs must contain exactly linux, macos and windows")
          if not m4_5_only and any(not isinstance(value, dict) for value in executor_configs.values()):
              raise SystemExit("each M4-4a executor config must be a JSON object")
          backend_only = os.environ["M4_4A_BACKEND_ONLY"].lower() == "true"
          m4_5_enabled = os.environ["M4_5_ENABLED"].lower() == "true"
          if m4_5_only and not m4_5_enabled:
              raise SystemExit("m4_5_only requires m4_5_enabled")
          if m4_5_enabled and not m4_5_only:
              raise SystemExit("M4-5's fixed frozen tuple requires m4_5_only so the Release-1 candidate remains unchanged")
          boundary = os.environ["M4_5_BOUNDARY"].strip()
          if "\n" in boundary or "\r" in boundary:
              raise SystemExit("m4_5_boundary must be a single executable path")
          try:
              boundary_args = json.loads(os.environ["M4_5_BOUNDARY_ARGS"] or "[]")
          except json.JSONDecodeError as exc:
              raise SystemExit("m4_5_boundary_args must be a JSON array") from exc
          if not isinstance(boundary_args, list) or any(
              not isinstance(arg, str) or not arg or "\n" in arg or "\r" in arg
              for arg in boundary_args
          ):
              raise SystemExit("m4_5_boundary_args must contain only non-empty strings")
          if m4_5_enabled:
              if not boundary:
                  raise SystemExit("m4_5_boundary is required when m4_5_enabled is true")
              if any(candidate.get(key) != value for key, value in journey_release2.RELEASE1_CANDIDATE.items()):
                  raise SystemExit("M4-5 requires its exact frozen Release-1 candidate tuple")
          matrix = [
              {"job_id":"direct-macos", "mode":"direct", "leg":"release0-to-release1", "runner":"macos-14", "shell":"sh", "os":"macos"},
              {"job_id":"direct-linux", "mode":"direct", "leg":"release0-to-release1", "runner":"ubuntu-24.04", "shell":"sh", "os":"linux"},
              {"job_id":"direct-windows", "mode":"direct", "leg":"release0-to-release1", "runner":"windows-2022", "shell":"powershell.exe", "os":"windows"},
              {"job_id":"pinokio-backend-macos", "mode":"pinokio-backend", "leg":"fresh-install", "runner":"macos-14", "shell":"sh", "os":"macos"},
              {"job_id":"pinokio-backend-linux", "mode":"pinokio-backend", "leg":"fresh-install", "runner":"ubuntu-24.04", "shell":"sh", "os":"linux"},
              {"job_id":"pinokio-backend-windows", "mode":"pinokio-backend", "leg":"fresh-install", "runner":"windows-2022", "shell":"powershell.exe", "os":"windows"},
              {"job_id":"pinokio-fully-local-macos", "mode":"pinokio-fully-local", "leg":"fresh-install", "runner":"macos-14", "shell":"sh", "os":"macos"},
              {"job_id":"pinokio-fully-local-linux", "mode":"pinokio-fully-local", "leg":"fresh-install", "runner":"ubuntu-24.04", "shell":"sh", "os":"linux"},
              {"job_id":"pinokio-fully-local-windows", "mode":"pinokio-fully-local", "leg":"fresh-install", "runner":"windows-2022", "shell":"powershell.exe", "os":"windows"},
          ]
          if backend_only:
              matrix = [row for row in matrix if row["mode"] == "pinokio-backend"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in (("candidate", candidate), ("driver_agent_ref", driver),
                                  ("old_launcher_ref", old_launcher),
                                  ("stopped_path_agent_ref", stopped_path),
                                  ("m4_4a_executor_configs", executor_configs),
                                  ("m4_4a_backend_only", str(backend_only).lower()),
                                  ("m4_5_enabled", str(m4_5_enabled).lower()),
                                  ("m4_5_only", str(m4_5_only).lower()),
                                  ("m4_5_boundary", boundary),
                                  ("m4_5_boundary_args", json.dumps(boundary_args, separators=(',', ':'))),
                                  ("m4_5_matrix", {"include": list(journey_matrix.M4_5_MATRIX)}),
                                  ("matrix", {"include": matrix})):
                  print(f"{key}={json.dumps(value, separators=(',', ':')) if isinstance(value, dict) else value}", file=output)
          PY

  journey:
    if: needs.config.outputs.m4_5_only != 'true'
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      # The driver itself is pinned to the reviewed workflow source.  Candidate
      # Agent is checked out separately so the receipt proves both identities.
      - name: Check out reviewed Agent receipt harness
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out frozen App candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/reigh-app
          ref: ${{ fromJSON(needs.config.outputs.candidate).app }}
          path: app
          persist-credentials: false
      - name: Check out frozen Agent candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ fromJSON(needs.config.outputs.candidate).agent }}
          path: candidate-agent
          # M4-4a proves the paired stopped-path commits are ancestors of the
          # frozen candidate rather than trusting a caller-supplied label.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out frozen Runtime candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ fromJSON(needs.config.outputs.candidate).runtime }}
          path: runtime
          persist-credentials: false
      - name: Check out frozen Pinokio candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ fromJSON(needs.config.outputs.candidate).pinokio }}
          path: pinokio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record effective immutable checkouts
        shell: bash
        run: |
          {
            echo "## Effective Release-1 journey tuple"
            echo "- Driver Agent: $(git -C agent rev-parse HEAD)"
            echo "- Candidate App: $(git -C app rev-parse HEAD)"
            echo "- Candidate Agent: $(git -C candidate-agent rev-parse HEAD)"
            echo "- Candidate Runtime: $(git -C runtime rev-parse HEAD)"
            echo "- Candidate Pinokio: $(git -C pinokio rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze and validate candidate inputs
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --prepare-only
      - name: Run the matrix-owned lifecycle driver
        env:
          ASTRID_CI_EXPECTED_RUNNER: ${{ matrix.runner }}
          M4_4A_EXECUTOR_CONFIGS: ${{ needs.config.outputs.m4_4a_executor_configs }}
        run: |
          $runRoot = Join-Path $env:RUNNER_TEMP "astrid-r1-${{ matrix.job_id }}"
          $release0Args = @()
          $oldLauncherArgs = @()
          if ('${{ matrix.mode }}' -eq 'pinokio-backend') {
            $oldLauncherArgs = @(
              '--old-launcher-ref', '${{ needs.config.outputs.old_launcher_ref }}',
              '--stopped-path-agent-ref', '${{ needs.config.outputs.stopped_path_agent_ref }}'
            )
          }
          if ('${{ matrix.leg }}' -eq 'release0-to-release1') {
            $release0Args = @(
              '--release0-fixture', "$pwd/agent/tests/fixtures/release0",
              '--allow-release0-to-release1'
            )
          }
          $backendConfigArgs = @()
          if ('${{ matrix.mode }}' -eq 'pinokio-backend') {
            $configs = ConvertFrom-Json $env:M4_4A_EXECUTOR_CONFIGS
            $backendConfigPath = Join-Path $env:RUNNER_TEMP 'm4-4a-executor-config.json'
            $backendConfigJson = $configs.'${{ matrix.os }}' | ConvertTo-Json -Depth 100 -Compress
            [IO.File]::WriteAllText($backendConfigPath, $backendConfigJson, [Text.UTF8Encoding]::new($false))
            $backendConfigArgs = @('--pinokio-backend-config', $backendConfigPath)
          }
          python -u agent/scripts/ci_journey.py `
            --job-id '${{ matrix.job_id }}' --mode '${{ matrix.mode }}' --leg '${{ matrix.leg }}' `
            --candidate "$env:RUNNER_TEMP/candidate.json" `
            --app-checkout "$pwd/app" --candidate-agent-checkout "$pwd/candidate-agent" `
            --candidate-runtime-checkout "$pwd/runtime" --pinokio-checkout "$pwd/pinokio" `
            --run-root $runRoot --root (Join-Path $runRoot program) --data-root (Join-Path $runRoot data) `
            --shell '${{ matrix.shell }}' @release0Args @oldLauncherArgs @backendConfigArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the matrix receipt even after a lifecycle failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-receipt-${{ matrix.job_id }}
          # Keep the job-id directory in the artifact so merge-multiple cannot
          # overwrite nine identically named journey-result.json files.
          path: ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}
          if-no-files-found: warn

  release2:
    if: needs.config.outputs.m4_5_enabled == 'true'
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.m4_5_matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed Agent receipt harness
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out frozen App candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/reigh-app
          ref: ${{ fromJSON(needs.config.outputs.candidate).app }}
          path: app
          persist-credentials: false
      - name: Check out frozen Agent candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ fromJSON(needs.config.outputs.candidate).agent }}
          path: candidate-agent
          persist-credentials: false
      - name: Check out frozen Runtime candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ fromJSON(needs.config.outputs.candidate).runtime }}
          path: runtime
          persist-credentials: false
      - name: Check out frozen Pinokio candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ fromJSON(needs.config.outputs.candidate).pinokio }}
          path: pinokio
          persist-credentials: false
      - name: Run the explicit M4-5 hosted boundary
        env:
          BOUNDARY: ${{ needs.config.outputs.m4_5_boundary }}
          BOUNDARY_ARGS: ${{ needs.config.outputs.m4_5_boundary_args }}
          CANDIDATE: ${{ needs.config.outputs.candidate }}
          SCENARIO_ID: ${{ matrix.scenario_id }}
          RUNNER_TEMP_PATH: ${{ runner.temp }}
          ASTRID_APP_CHECKOUT: ${{ github.workspace }}/app
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/candidate-agent
          ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/runtime
          ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/pinokio
        run: |
          $candidatePath = Join-Path $env:RUNNER_TEMP_PATH "m4-5-candidate.json"
          [IO.File]::WriteAllText($candidatePath, $env:CANDIDATE, [Text.UTF8Encoding]::new($false))
          $root = Join-Path $env:RUNNER_TEMP_PATH ("m4-5-" + $env:SCENARIO_ID)
          $executorArgs = @(
            "agent/scripts/ci_journey.py", "--shared-executor", "m4-5",
            "--scenario-id", $env:SCENARIO_ID, "--candidate", $candidatePath,
            "--boundary", $env:BOUNDARY, "--root", (Join-Path $root "install"),
            "--data-root", (Join-Path $root "data"), "--receipt", (Join-Path $root "journey-result.json"),
            "--evidence-kind", "hosted-lifecycle"
          )
          foreach ($boundaryArg in (ConvertFrom-Json $env:BOUNDARY_ARGS)) {
            $executorArgs += @("--boundary-arg", [string]$boundaryArg)
          }
          python -u @executorArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the M4-5 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-5-receipt-${{ matrix.scenario_id }}
          path: ${{ runner.temp }}/m4-5-${{ matrix.scenario_id }}/journey-result.json
          if-no-files-found: warn

  gate:
    if: always()
    needs: [config, journey, release2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject skipped, cancelled, or failed matrix dependencies
        shell: bash
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
          M4_5_ENABLED: ${{ needs.config.outputs.m4_5_enabled }}
          M4_5_ONLY: ${{ needs.config.outputs.m4_5_only }}
          RELEASE2_RESULT: ${{ needs.release2.result }}
        run: |
          test "$CONFIG_RESULT" = success
          if [ "$M4_5_ONLY" != true ]; then test "$JOURNEY_RESULT" = success; fi
          if [ "$M4_5_ENABLED" = true ]; then test "$RELEASE2_RESULT" = success; fi
      - name: Check out reviewed Agent receipt harness
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out frozen App candidate for aggregate validation
        uses: actions/checkout@v4
        with:
          repository: banodoco/reigh-app
          ref: ${{ fromJSON(needs.config.outputs.candidate).app }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download every per-job receipt
        uses: actions/download-artifact@v4
        with:
          pattern: journey-receipt-*
          path: receipts
          merge-multiple: true
      - name: Aggregate the exact Release-1 receipt matrix
        if: needs.config.outputs.m4_5_only != 'true' && needs.config.outputs.m4_4a_backend_only != 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results receipts --aggregate-release1
      - name: Aggregate the exact M4-4a Pinokio backend receipts
        if: needs.config.outputs.m4_5_only != 'true' && needs.config.outputs.m4_4a_backend_only == 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results receipts --aggregate-m4-4a
      - name: Reject skipped M4-5 matrix dependencies
        if: needs.config.outputs.m4_5_enabled == 'true'
        shell: bash
        env:
          RELEASE2_RESULT: ${{ needs.release2.result }}
        run: test "$RELEASE2_RESULT" = success
      - name: Download every M4-5 scenario receipt
        if: needs.config.outputs.m4_5_enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: m4-5-receipt-*
          path: release2-receipts
      - name: Aggregate the exact twelve M4-5 scenario receipts
        if: needs.config.outputs.m4_5_enabled == 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results release2-receipts --aggregate-m4-5
