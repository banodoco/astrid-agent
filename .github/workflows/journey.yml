name: macOS runner idle restart (manual only)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Schedule restart in a coordinated quiet window, or verify a previous run
        type: choice
        required: true
        options: [schedule, verify]
      scheduled_run:
        description: Scheduling run ID and attempt, e.g. 123456-1 (verify only)
        type: string
        required: false
permissions:
  contents: read
jobs:
  restart:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 5
    steps:
      - name: Schedule one-shot helper or inspect its result
        shell: bash
        working-directory: /
        env:
          RESTART_PHASE: ${{ inputs.phase }}
          RESTART_RUN: ${{ inputs.scheduled_run }}
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64, json, os, pwd, re, stat, subprocess
          from pathlib import Path
          UID = 503
          def owned(path, directory=False):
              st = path.lstat()
              good = stat.S_ISDIR(st.st_mode) if directory else stat.S_ISREG(st.st_mode)
              if not good or st.st_uid != UID or path != path.resolve():
                  raise RuntimeError("Unexpected runner-owned path")
          try:
              if os.getuid() != UID or os.environ.get("RUNNER_NAME") != "hannah-mac":
                  raise RuntimeError("Unexpected runner identity")
              home = Path(pwd.getpwuid(UID).pw_dir)
              owned(home, True)
              root = home / ".astrid-runner-restart"
              phase = os.environ["RESTART_PHASE"]
              if phase == "schedule":
                  run_id = os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
              elif phase == "verify":
                  run_id = os.environ["RESTART_RUN"]
              else:
                  raise RuntimeError("Unexpected phase")
              if not re.fullmatch(r"[0-9]+-[0-9]+", run_id):
                  raise RuntimeError("Invalid run identifier")
              if phase == "schedule" and not root.exists() and not root.is_symlink():
                  root.mkdir(mode=0o700)
              owned(root, True)
              if stat.S_IMODE(root.stat().st_mode) != 0o700:
                  raise RuntimeError("Unexpected helper directory mode")
              run = root / run_id
              if phase == "schedule":
                  run.mkdir(mode=0o700)
                  script = run / "helper.py"
                  data = base64.b64decode("", validate=True)
                  fd = os.open(str(script), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, "wb") as stream:
                      stream.write(data); stream.flush(); os.fsync(stream.fileno())
                  subprocess.run(["/usr/bin/python3", str(script), "schedule"], check=True, timeout=30)
              else:
                  owned(run, True)
                  script = run / "helper.py"
                  owned(script)
                  expected = base64.b64decode("", validate=True)
                  if script.read_bytes() != expected:
                      raise RuntimeError("Helper source changed")
                  subprocess.run(["/usr/bin/python3", str(script), "verify"], check=True, timeout=30)
          except Exception:
              print(json.dumps({"status": "refused", "reason": "Runner identity, helper schedule, or result check failed"}))
              raise SystemExit(1)
          PYCODE
          if [ "$RESTART_PHASE" = schedule ]; then
            printf '%s\n' 'The coordinator has 120 seconds to remove the custom runner label while this job remains active.'
            sleep 120
          fi
