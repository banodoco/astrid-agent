name: MAC-UPDATE-01 isolated diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 120
    steps:
      - name: Run isolated diagnostic and stage evidence
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, data in (("mac_update_outer.py", ""), ("mac_update_inner.py", "")):
              (temp / name).write_bytes(base64.b64decode(data, validate=True))
          raise SystemExit(subprocess.call(['/usr/bin/python3', '-u', str(temp / 'mac_update_outer.py')]))
          PYCODE
      - name: Upload sanitized evidence
        id: upload
        if: always() && env.R05_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.R05_UPLOAD }}
          if-no-files-found: error
      - name: Remove only verified task sandbox after upload
        if: always() && steps.upload.outcome == 'success' && env.WS02_TASK_ROOT != ''
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, 'mac-update-cleanup', 'exec'), {'__name__':'__main__'})
          PYCODE
