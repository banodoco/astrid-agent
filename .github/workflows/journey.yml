name: Runner-owned task-state inventory (manual)
on:
  workflow_dispatch:
concurrency:
  group: prelaunch-runner-maintenance
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 20
    steps:
      - name: Preserve small diagnostics and remove only verified task roots
        shell: bash
        working-directory: /
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.11.18/arm64/bin/python3.11" - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, "prelaunch-owned-clean", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload cleanup audit and checksum
        if: always() && env.PRELAUNCH_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: r1-task-inventory-${{ github.run_id }}
          path: ${{ env.PRELAUNCH_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
