name: R-18 macOS predicate capture (manual diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r18:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 100
    steps:
      - name: Run isolated R-18 diagnostic
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, "r18-diagnostic", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload redacted evidence and original hashes
        if: always() && env.R18_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: r18-macos-predicate-${{ github.run_id }}
          path: ${{ env.R18_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
