name: Release-1 installed lifecycle receipts

# This workflow is deliberately a receipt producer, not a release dispatcher.
# A caller or automatic resolver supplies one immutable candidate tuple; the
# final gate rejects any missing, skipped, failed, duplicate, or
# foreground-substituted matrix result.
on:
  push:
    branches:
      - int/r1
  schedule:
    - cron: '23 3 * * *'
  workflow_call:
    inputs:
      candidate:
        description: Frozen JSON with app, agent, runtime and pinokio full commit SHAs plus bootstrap hashes
        required: true
        type: string
      old_launcher_ref:
        description: Full SHA for the approved pre-self-pull Pinokio backend action (direct rows only; not used by pinokio-* rows)
        required: false
        type: string
      stopped_path_agent_ref:
        description: Full candidate Agent SHA containing the integrated A/B stopped path (direct rows only; not used by pinokio-* rows)
        required: false
        type: string
      m4_4a_executor_configs:
        description: JSON object keyed by linux/macos/windows containing complete explicit M4-4a executor configs
        required: false
        default: '{"linux":{},"macos":{},"windows":{}}'
        type: string
      diagnostic_leg:
        description: NON-PROOF diagnostic leg (release9-then-install, fresh-install, or both)
        required: false
        default: release9-then-install
        type: string
      diagnostic_keep_going:
        description: NON-PROOF disposable direct keep-going diagnostic
        required: false
        default: false
        type: boolean
      direct_only:
        description: Run only the five direct Release-1 rows (the full Release-1 gate; Pinokio is deferred to R1.1)
        required: false
        default: false
        type: boolean
      m4_4a_backend_only:
        description: Run and aggregate only the three M4-4a backend rows
        required: false
        default: false
        type: boolean
      m4_5_enabled:
        description: Run all twelve M4-5 hosted Release-2 scenarios (requires an installed boundary executable)
        required: false
        default: false
        type: boolean
      m4_5_only:
        description: Skip Release-1/M4-4a jobs and gates because M4-5 has its own frozen candidate tuple
        required: false
        default: false
        type: boolean
      m4_5_boundary:
        description: Explicit installed boundary executable available on each matrix runner
        required: false
        type: string
      m4_5_boundary_args:
        description: JSON array of separate argv strings passed to the boundary executable
        required: false
        default: "[]"
        type: string
      m4_4b_enabled:
        description: Run and locally aggregate the disposable POSIX M4-4b process smoke
        required: false
        default: false
        type: boolean
      m4_6_enabled:
        description: Run all nine local-disposable M4-6 executor slots; hosted gate remains fail-closed
        required: false
        default: false
        type: boolean
      m4_6_candidate:
        description: Explicit JSON tuple with app/agent/runtime/pinokio SHAs and manifest_sha256 for local M4-6
        required: false
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: Frozen candidate JSON; hosted results are evidence, never a publish action
        required: true
        type: string
      old_launcher_ref:
        description: Full SHA for the approved pre-self-pull Pinokio backend action (direct rows only; not used by pinokio-* rows)
        required: false
        type: string
      stopped_path_agent_ref:
        description: Full candidate Agent SHA containing the integrated A/B stopped path (direct rows only; not used by pinokio-* rows)
        required: false
        type: string
      m4_4a_executor_configs:
        description: JSON object keyed by linux/macos/windows containing complete explicit M4-4a executor configs
        required: false
        default: '{"linux":{},"macos":{},"windows":{}}'
        type: string
      diagnostic_leg:
        description: NON-PROOF diagnostic leg (release9-then-install, fresh-install, or both)
        required: false
        default: release9-then-install
        type: string
      diagnostic_keep_going:
        description: NON-PROOF disposable direct keep-going diagnostic
        required: false
        default: false
        type: boolean
      direct_only:
        description: Run only the five direct Release-1 rows (the full Release-1 gate; Pinokio is deferred to R1.1)
        required: false
        default: false
        type: boolean
      m4_4a_backend_only:
        description: Run and aggregate only the three M4-4a backend rows
        required: false
        default: false
        type: boolean
      m4_5_enabled:
        description: Run all twelve M4-5 hosted Release-2 scenarios (requires an installed boundary executable)
        required: false
        default: false
        type: boolean
      m4_5_only:
        description: Skip Release-1/M4-4a jobs and gates because M4-5 has its own frozen candidate tuple
        required: false
        default: false
        type: boolean
      m4_5_boundary:
        description: Explicit installed boundary executable available on each matrix runner
        required: false
        type: string
      m4_5_boundary_args:
        description: JSON array of separate argv strings passed to the boundary executable
        required: false
        default: "[]"
        type: string
      m4_4b_enabled:
        description: Run and locally aggregate the disposable POSIX M4-4b process smoke
        required: false
        default: false
        type: boolean
      m4_6_enabled:
        description: Run all nine local-disposable M4-6 executor slots; hosted gate remains fail-closed
        required: false
        default: false
        type: boolean
      m4_6_candidate:
        description: Explicit JSON tuple with app/agent/runtime/pinokio SHAs and manifest_sha256 for local M4-6
        required: false
        type: string
      row:
        description: Run one direct journey row, all nine direct rows, one pinokio-* row, all three R1.1 Pinokio rows, or one named direct row
        required: false
        default: direct
        type: choice
        options:
          - direct-linux
          - direct-macos
          - direct-windows
          - direct-linux-fresh
          - direct-macos-fresh
          - direct-linux-r9-install
          - direct-macos-r9-install
          - direct-linux-r11-update
          - direct-macos-r11-update
          - direct-linux-autostart-off
          - direct-macos-autostart-off
          - direct
          - pinokio-linux
          - pinokio-macos
          - pinokio-windows
          - pinokio

concurrency:
  group: reusable-journey-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.config.outputs.candidate }}
      driver_agent_ref: ${{ steps.config.outputs.driver_agent_ref }}
      old_launcher_ref: ${{ steps.config.outputs.old_launcher_ref }}
      stopped_path_agent_ref: ${{ steps.config.outputs.stopped_path_agent_ref }}
      m4_4a_executor_configs: ${{ steps.config.outputs.m4_4a_executor_configs }}
      m4_4a_backend_only: ${{ steps.config.outputs.m4_4a_backend_only }}
      pinokio_only: ${{ steps.config.outputs.pinokio_only }}
      pinokio_job_ids: ${{ steps.config.outputs.pinokio_job_ids }}
      m4_5_enabled: ${{ steps.config.outputs.m4_5_enabled }}
      m4_5_only: ${{ steps.config.outputs.m4_5_only }}
      m4_5_boundary: ${{ steps.config.outputs.m4_5_boundary }}
      m4_5_boundary_args: ${{ steps.config.outputs.m4_5_boundary_args }}
      m4_5_matrix: ${{ steps.config.outputs.m4_5_matrix }}
      m4_4b_enabled: ${{ steps.config.outputs.m4_4b_enabled }}
      m4_6_enabled: ${{ steps.config.outputs.m4_6_enabled }}
      m4_6_candidate: ${{ steps.config.outputs.m4_6_candidate }}
      m4_6_matrix: ${{ steps.config.outputs.m4_6_matrix }}
      matrix: ${{ steps.config.outputs.matrix }}
      release1_scope: ${{ steps.config.outputs.release1_scope }}
      wait_timeout: ${{ steps.config.outputs.wait_timeout }}
    steps:
      - name: Check out reviewed Agent matrix contracts
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - name: Check out latest App int/r1 manifest for automatic runs
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: int/r1
          path: automatic-app
          fetch-depth: 1
          persist-credentials: false
      - id: automatic_candidate
        name: Resolve the checked-out App manifest tuple for automatic runs
        if: github.event_name == 'push' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          app = Path("automatic-app")
          manifest_path = app / "public" / "install-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          app_ref = subprocess.check_output(
              ["git", "-C", str(app), "rev-parse", "HEAD"], text=True
          ).strip()
          manifest_pinokio = (manifest.get("pinokio") or {}).get("sha")
          if manifest_pinokio:
              pinokio_ref = manifest_pinokio
          else:
              pinokio_ref = subprocess.check_output(
                  [
                      "git", "ls-remote", "https://github.com/banodoco/astrid-pinokio.git",
                      "refs/heads/int/r1",
                  ], text=True,
              ).split()[0]
          candidate = {
              "app": app_ref,
              "agent": (manifest.get("agent") or {}).get("sha"),
              "runtime": (manifest.get("runtime") or {}).get("sha"),
              "pinokio": pinokio_ref,
              "manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "artifacts": {
                  path: hashlib.sha256((app / path).read_bytes()).hexdigest()
                  for path in ("public/install", "public/install.sh", "public/install.ps1")
              },
          }
          if any(not isinstance(candidate.get(key), str) or not candidate[key]
                 for key in ("app", "agent", "runtime", "pinokio", "manifest_sha256")):
              raise SystemExit("automatic App manifest resolution produced an incomplete candidate")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("candidate=" + json.dumps(candidate, separators=(",", ":")), file=output)
              print("agent=" + candidate["agent"], file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Automatic App manifest resolution\n\n")
              summary.write(f"- App: {candidate['app']}\n")
              summary.write(f"- Agent: {candidate['agent']}\n")
              summary.write(f"- Runtime: {candidate['runtime']}\n")
              summary.write(f"- Pinokio: {candidate['pinokio']}\n")
              summary.write(f"- Manifest SHA-256: {candidate['manifest_sha256']}\n")
          PY
      - id: config
        shell: bash
        env:
          CANDIDATE: ${{ steps.automatic_candidate.outputs.candidate || inputs.candidate }}
          DRIVER_AGENT_REF: ${{ github.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          # The pinned default is for automatic push/schedule runs only; a dispatched or called direct row must name it.
          OLD_LAUNCHER_REF: ${{ inputs.old_launcher_ref || ((github.event_name == 'push' || github.event_name == 'schedule') && 'bbba620e3d89eeff8021417f365e6ea584203105') || '' }}
          STOPPED_PATH_AGENT_REF: ${{ inputs.stopped_path_agent_ref || steps.automatic_candidate.outputs.agent }}
          M4_4A_EXECUTOR_CONFIGS: ${{ inputs.m4_4a_executor_configs || '{"linux":{},"macos":{},"windows":{}}' }}
          DIAGNOSTIC_KEEP_GOING: ${{ inputs.diagnostic_keep_going || false }}
          DIAGNOSTIC_LEG: ${{ inputs.diagnostic_leg || 'release9-then-install' }}
          DIRECT_ONLY: ${{ inputs.direct_only || false }}
          JOURNEY_ROW: ${{ inputs.row || '' }}
          M4_4A_BACKEND_ONLY: ${{ inputs.m4_4a_backend_only || false }}
          M4_5_ENABLED: ${{ inputs.m4_5_enabled || false }}
          M4_5_ONLY: ${{ inputs.m4_5_only || false }}
          M4_5_BOUNDARY: ${{ inputs.m4_5_boundary || '' }}
          M4_5_BOUNDARY_ARGS: ${{ inputs.m4_5_boundary_args || '[]' }}
          M4_4B_ENABLED: ${{ inputs.m4_4b_enabled || false }}
          M4_6_ENABLED: ${{ inputs.m4_6_enabled || false }}
          M4_6_CANDIDATE: ${{ inputs.m4_6_candidate || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          import sys
          sys.path.insert(0, "driver/scripts")
          import journey_matrix
          import journey_release2
          import journey_failure_modes
          candidate = json.loads(os.environ["CANDIDATE"])
          if not isinstance(candidate, dict) or any(
              not re.fullmatch(r"[0-9a-f]{40}", str(candidate.get(key, "")))
              for key in ("app", "agent", "runtime", "pinokio")
          ):
              raise SystemExit("a frozen candidate with app/agent/runtime/pinokio full commit SHAs is required")
          driver = os.environ["DRIVER_AGENT_REF"]
          if not re.fullmatch(r"[0-9a-f]{40}", driver):
              raise SystemExit("the reviewed Agent workflow SHA is required")
          if os.environ["WORKFLOW_REPOSITORY"] != "banodoco/astrid-agent":
              raise SystemExit("the receipt harness must run from banodoco/astrid-agent")
          journey_row = os.environ["JOURNEY_ROW"].strip()
          pinokio_job_ids = tuple(row["job_id"] for row in journey_matrix.RELEASE1_1_PINOKIO_MATRIX)
          # Pinokio-only rows run the launcher's own commands and need no old-launcher provenance.
          pinokio_only = journey_row == "pinokio" or journey_row in pinokio_job_ids
          old_launcher = os.environ["OLD_LAUNCHER_REF"]
          stopped_path = os.environ["STOPPED_PATH_AGENT_REF"]
          m4_5_only = os.environ["M4_5_ONLY"].lower() == "true"
          if not pinokio_only:
              if old_launcher != "bbba620e3d89eeff8021417f365e6ea584203105":
                  raise SystemExit("the approved old_launcher_ref SHA is required")
              if stopped_path != candidate["agent"]:
                  raise SystemExit("stopped_path_agent_ref must equal the frozen candidate Agent SHA")
              if not m4_5_only and stopped_path == "3cc84be5d8c565f1a4a500dcf713478498e34885":
                  raise SystemExit("the provisional Agent base lacks the integrated A/B stopped path")
          try:
              executor_configs = json.loads(os.environ["M4_4A_EXECUTOR_CONFIGS"])
          except json.JSONDecodeError as exc:
              raise SystemExit("m4_4a_executor_configs must be a JSON object") from exc
          if not isinstance(executor_configs, dict) or set(executor_configs) != {"linux", "macos", "windows"}:
              raise SystemExit("m4_4a_executor_configs must contain exactly linux, macos and windows")
          if not m4_5_only and any(not isinstance(value, dict) for value in executor_configs.values()):
              raise SystemExit("each M4-4a executor config must be a JSON object")
          direct_only = os.environ["DIRECT_ONLY"].lower() == "true"
          # The release11-then-update rows are a separate direct matrix, selected by name only.
          release11_job_ids = tuple(row["job_id"] for row in journey_matrix.RELEASE11_UPDATE_MATRIX)
          release11_only = journey_row in release11_job_ids
          valid_rows = {"", *journey_matrix.RELEASE1_JOB_IDS, "direct", "pinokio", *pinokio_job_ids, *release11_job_ids}
          if journey_row not in valid_rows:
              raise SystemExit("row must be one of " + ", ".join(sorted(valid_rows - {""})))
          if journey_row:
              direct_only = True
          if release11_only and os.environ["DIAGNOSTIC_KEEP_GOING"].lower() == "true":
              raise SystemExit("release11-then-update rows do not support non-proof keep-going diagnostics")
          diagnostic_leg = os.environ["DIAGNOSTIC_LEG"]
          if diagnostic_leg not in {"release9-then-install", "fresh-install", "both"}:
              raise SystemExit("invalid diagnostic_leg")
          if diagnostic_leg != "release9-then-install" and os.environ["DIAGNOSTIC_KEEP_GOING"].lower() != "true":
              raise SystemExit("fresh-install diagnostic_leg requires diagnostic_keep_going")
          backend_only = os.environ["M4_4A_BACKEND_ONLY"].lower() == "true"
          if pinokio_only and os.environ["DIAGNOSTIC_KEEP_GOING"].lower() == "true":
              raise SystemExit("pinokio rows do not support non-proof keep-going diagnostics")
          if os.environ.get("DIAGNOSTIC_KEEP_GOING", "false").lower() == "true" and not direct_only:
              raise SystemExit("diagnostic_keep_going requires direct_only")
          if direct_only and (backend_only or m4_5_only):
              raise SystemExit("direct_only cannot be combined with m4_4a_backend_only or m4_5_only")
          m4_5_enabled = os.environ["M4_5_ENABLED"].lower() == "true"
          if m4_5_only and not m4_5_enabled:
              raise SystemExit("m4_5_only requires m4_5_enabled")
          if m4_5_enabled and not m4_5_only:
              raise SystemExit("M4-5's fixed frozen tuple requires m4_5_only so the Release-1 candidate remains unchanged")
          boundary = os.environ["M4_5_BOUNDARY"].strip()
          if "\n" in boundary or "\r" in boundary:
              raise SystemExit("m4_5_boundary must be a single executable path")
          try:
              boundary_args = json.loads(os.environ["M4_5_BOUNDARY_ARGS"] or "[]")
          except json.JSONDecodeError as exc:
              raise SystemExit("m4_5_boundary_args must be a JSON array") from exc
          if not isinstance(boundary_args, list) or any(
              not isinstance(arg, str) or not arg or "\n" in arg or "\r" in arg
              for arg in boundary_args
          ):
              raise SystemExit("m4_5_boundary_args must contain only non-empty strings")
          if m4_5_enabled:
              if not boundary:
                  raise SystemExit("m4_5_boundary is required when m4_5_enabled is true")
              if any(candidate.get(key) != value for key, value in journey_release2.RELEASE1_CANDIDATE.items()):
                  raise SystemExit("M4-5 requires its exact frozen Release-1 candidate tuple")
          m4_4b_enabled = os.environ["M4_4B_ENABLED"].lower() == "true"
          m4_6_enabled = os.environ["M4_6_ENABLED"].lower() == "true"
          if pinokio_only and (backend_only or m4_5_enabled or m4_5_only or m4_4b_enabled or m4_6_enabled):
              raise SystemExit("pinokio rows run only the R1.1 Pinokio journey rows")
          m4_6_candidate = None
          if m4_6_enabled:
              try:
                  m4_6_candidate = json.loads(os.environ["M4_6_CANDIDATE"])
              except json.JSONDecodeError as exc:
                  raise SystemExit("m4_6_candidate must be a JSON object when M4-6 is enabled") from exc
              candidate_errors = journey_failure_modes.candidate_errors(m4_6_candidate)
              if candidate_errors:
                  raise SystemExit("invalid m4_6_candidate: " + "; ".join(candidate_errors))
          else:
              m4_6_candidate = {}
          # The Release-1 strict matrix is the five direct rows; each keeps its
          # own leg. The R1.1 Pinokio gate has its own independent matrix.
          if pinokio_only:
              matrix = [dict(row) for row in journey_matrix.RELEASE1_1_PINOKIO_MATRIX]
          elif backend_only:
              matrix = [dict(row) for row in journey_matrix.M4_4A_BACKEND_MATRIX]
          elif release11_only:
              matrix = [dict(row) for row in journey_matrix.RELEASE11_UPDATE_MATRIX]
          elif journey_row == "":
              # An automatic push or schedule runs the five rows that existed before the release9 and release11 legs.
              matrix = [dict(row) for row in journey_matrix.RELEASE1_AUTOMATIC_MATRIX]
          else:
              matrix = [dict(row) for row in journey_matrix.RELEASE1_MATRIX]
          if os.environ["DIAGNOSTIC_KEEP_GOING"].lower() == "true":
              # Keep-going diagnostics re-leg the original three direct rows.
              matrix = [row for row in matrix if row["job_id"] in journey_matrix.RELEASE1_LEGACY_JOB_IDS]
          if journey_row and journey_row not in {"direct", "pinokio"}:
              matrix = [row for row in matrix if row["job_id"] == journey_row]
          if os.environ["DIAGNOSTIC_KEEP_GOING"].lower() == "true" and diagnostic_leg in {"release9-then-install", "both"}:
              # Keep-going diagnostics stage only the Release 9 leg; the strict
              # r0-handoff-then-update rows are not staged by keep-going.
              for row in matrix:
                  # Windows R0 upgrades are deferred. Keep its diagnostic on
                  # the supported fresh-install path; the refusal is captured
                  # separately by the strict Windows lifecycle.
                  if row["job_id"] != "direct-windows":
                      row["leg"] = "release9-then-install"
          if diagnostic_leg == "fresh-install":
              for row in matrix:
                  row["leg"] = diagnostic_leg
          elif diagnostic_leg == "both":
              # Windows' direct row already represents the fresh lifecycle;
              # its required R0 refusal is collected alongside that receipt.
              # Only Linux and macOS have a separate fresh-install matrix row.
              matrix = matrix + [dict(row, leg="fresh-install") for row in matrix
                                if row["job_id"] != "direct-windows"]
          if journey_row and not matrix:
              raise SystemExit("row selection produced no direct journey rows")
          wait_timeout = "180" if journey_row in journey_matrix.RELEASE1_JOB_IDS else "900"
          # The Release-1 aggregate scope: an automatic run is the five rows; any other run is the nine.
          release1_scope = "five" if journey_row == "" else "nine"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in (("candidate", candidate), ("driver_agent_ref", driver),
                                  ("old_launcher_ref", old_launcher),
                                  ("stopped_path_agent_ref", stopped_path),
                                  ("m4_4a_executor_configs", executor_configs),
                                  ("m4_4a_backend_only", str(backend_only).lower()),
                                  ("pinokio_only", str(pinokio_only).lower()),
                                  ("pinokio_job_ids", ",".join(row["job_id"] for row in matrix) if pinokio_only else ""),
                                  ("m4_5_enabled", str(m4_5_enabled).lower()),
                                  ("m4_5_only", str(m4_5_only).lower()),
                                  ("m4_5_boundary", boundary),
                                  ("m4_5_boundary_args", json.dumps(boundary_args, separators=(',', ':'))),
                                  ("m4_5_matrix", {"include": list(journey_matrix.M4_5_MATRIX)}),
                                  ("m4_4b_enabled", str(m4_4b_enabled).lower()),
                                  ("m4_6_enabled", str(m4_6_enabled).lower()),
                                  ("m4_6_candidate", m4_6_candidate),
                                  ("m4_6_matrix", {"include": list(journey_matrix.M4_6_MATRIX)}),
                                  ("matrix", {"include": matrix}),
                                  ("wait_timeout", wait_timeout),
                                  ("release1_scope", release1_scope)):
                  print(f"{key}={json.dumps(value, separators=(',', ':')) if isinstance(value, dict) else value}", file=output)
          PY

  journey:
    if: needs.config.outputs.m4_5_only != 'true'
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_id == 'direct-windows' && 300 || 150 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      # The driver itself is pinned to the reviewed workflow source.  Candidate
      # Agent is checked out separately so the receipt proves both identities.
      - name: Check out reviewed Agent receipt harness
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out frozen App candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ fromJSON(needs.config.outputs.candidate).app }}
          path: app
          persist-credentials: false
      - name: Check out frozen Agent candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ fromJSON(needs.config.outputs.candidate).agent }}
          path: candidate-agent
          # M4-4a proves the paired stopped-path commits are ancestors of the
          # frozen candidate rather than trusting a caller-supplied label.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check out frozen Runtime candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ fromJSON(needs.config.outputs.candidate).runtime }}
          path: runtime
          persist-credentials: false
      - name: Check out frozen Pinokio candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ fromJSON(needs.config.outputs.candidate).pinokio }}
          path: pinokio
          persist-credentials: false
      - name: Check out the pinned Release 11 App for the release11-then-update leg
        if: matrix.leg == 'release11-then-update'
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          # The App commit that pins Release 11's manifest and bootstrap bytes (served tuple 57e200b4).
          ref: 57e200b45615a59181920192697a932400d985fc
          path: release11-app
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the pinned Release 9 App for the Release 9 and R0 handoff legs
        if: matrix.leg == 'release9-then-install' || matrix.leg == 'r0-handoff-then-update'
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          # The App commit that pins Release 9's manifest and bootstrap bytes.
          ref: 546c91b7aaf90835445136eb6e93459385ffe21c
          path: release9-app
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record effective immutable checkouts
        shell: bash
        run: |
          {
            echo "## Effective Release-1 journey tuple"
            echo "- Trigger: ${{ github.event_name }} / ${{ github.sha }}"
            echo "- Driver Agent: $(git -C agent rev-parse HEAD)"
            echo "- Candidate App: $(git -C app rev-parse HEAD)"
            echo "- Candidate Agent: $(git -C candidate-agent rev-parse HEAD)"
            echo "- Candidate Runtime: $(git -C runtime rev-parse HEAD)"
            echo "- Candidate Pinokio: $(git -C pinokio rev-parse HEAD)"
            echo "- Manifest SHA-256: $(python -c 'import hashlib; print(hashlib.sha256(open("app/public/install-manifest.json", "rb").read()).hexdigest())')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze and validate candidate inputs
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --prepare-only
      - name: Establish Linux user service manager
        if: matrix.mode == 'direct' && matrix.os == 'linux'
        shell: bash
        timeout-minutes: 3
        env:
          JOB_ID: ${{ matrix.job_id }}
        run: |
          # Hosted direct Linux rows only. Keep diagnostics outside the driver's fresh root.
          set -Eeuo pipefail
          diag="$RUNNER_TEMP/journey-manager-$JOB_ID"
          mkdir -p "$diag"
          exec > >(tee "$diag/prerequisite.log") 2>&1
          uid=$(id -u)
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          run_root="$RUNNER_TEMP/astrid-r1-$JOB_ID"
          config="$run_root/home/.config"
          data="$run_root/home/.local/share"
          probe="journey-manager-path-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          probe_dir="$config/systemd/user"
          probe_created=0

          diagnose() {
            local rc=$?
            trap - EXIT
            if (( probe_created )); then
              rm -f "$probe_dir/$probe"
              systemctl --user daemon-reload || true
              rmdir "$probe_dir" "$config/systemd" "$config" "$run_root/home" "$run_root" || true
            fi
            echo "setup_exit=$rc"
            timeout 10s loginctl show-user "$uid" -p Name -p Linger -p State -p RuntimePath || true
            timeout 10s sudo systemctl --no-pager --full status "user@$uid.service" | head -60 || true
            timeout 10s systemctl --user show -p Version -p UnitPath -p NFailedUnits || true
            timeout 10s systemctl --user show-environment || true
            exit "$rc"
          }
          trap diagnose EXIT

          probe_isolated_unit() {
            # Prove discovery from the exact future installation directory, not merely the bus: the
            # manager's own XDG_CONFIG_HOME/systemd/user must be the directory the installer writes to.
            manager_config=$(timeout 10s systemctl --user show-environment | sed -n 's/^XDG_CONFIG_HOME=//p')
            if [[ "$manager_config/systemd/user" != "$probe_dir" ]]; then
              echo "::error::Manager XDG_CONFIG_HOME/systemd/user is '$manager_config/systemd/user', not the probe directory $probe_dir"; exit 1
            fi
            mkdir -p "$probe_dir"
            probe_created=1
            printf '[Unit]\nDescription=Journey unit search path probe\n[Service]\nType=oneshot\nExecStart=/usr/bin/true\n' > "$probe_dir/$probe"
            timeout 10s systemctl --user daemon-reload
            fragment=$(timeout 10s systemctl --user show "$probe" --property=FragmentPath --value)
            test "$fragment" = "$probe_dir/$probe"
            timeout 30s systemctl --user start "$probe"
            rm "$probe_dir/$probe"
            timeout 10s systemctl --user daemon-reload
            rmdir "$probe_dir" "$config/systemd" "$config" "$run_root/home" "$run_root"
            probe_created=0
          }

          # The runtime drop-in is interpreted by systemd, so restrict it to the ordinary
          # GitHub runner temp path alphabet rather than accepting systemd specifiers.
          [[ "$run_root" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          test ! -e "$run_root"
          echo "uid=$uid runtime=$XDG_RUNTIME_DIR isolated_config=$config isolated_data=$data"
          timeout 20s sudo loginctl enable-linger "$uid"
          timeout 30s sudo systemctl start "user@$uid.service"
          for attempt in {1..20}; do
            if [[ -d "$XDG_RUNTIME_DIR" && -S "$XDG_RUNTIME_DIR/bus" ]] && \
               timeout 3s systemctl --user show-environment >/dev/null; then
              break
            fi
            sleep 1
          done
          test "$(stat -c %u "$XDG_RUNTIME_DIR")" = "$uid"
          test -S "$XDG_RUNTIME_DIR/bus"
          timeout 10s systemctl --user show-environment >/dev/null
          # Check the original manager before restarting it with a different search path.
          test ! -e "${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/astrid.service"
          original=$(timeout 10s systemctl --user show astrid.service --property=LoadState --value || true)
          test "$original" = not-found

          dropin="/run/systemd/system/user@$uid.service.d"
          sudo mkdir -p "$dropin"
          # An explicit unit search path survives the fresh-root cleanup between this
          # probe and the installer. The trailing colon retains systemd's default paths.
          printf '[Service]\nEnvironment="XDG_CONFIG_HOME=%s" "XDG_DATA_HOME=%s" "SYSTEMD_UNIT_PATH=%s:"\n' "$config" "$data" "$probe_dir" | sudo tee "$dropin/90-astrid-journey.conf" >/dev/null
          sudo systemctl daemon-reload
          timeout 30s sudo systemctl restart "user@$uid.service"
          for attempt in {1..20}; do
            if timeout 3s systemctl --user show-environment >/dev/null; then break; fi
            sleep 1
          done
          # The drop-in sets the manager process's own environment, which decides where it looks for
          # units. Units are started with the manager's activation environment, which is separate, so
          # give it the install's XDG variables too and fail loudly unless it reports exactly them.
          timeout 10s systemctl --user set-environment "XDG_CONFIG_HOME=$config" "XDG_DATA_HOME=$data"
          activation=$(timeout 10s systemctl --user show-environment)
          for expected in "XDG_CONFIG_HOME=$config" "XDG_DATA_HOME=$data"; do
            name=${expected%%=*}
            actual=$(printf '%s\n' "$activation" | sed -n "s/^$name=//p")
            if [[ -z "$actual" ]]; then
              echo "::error::The user manager's environment has no $name (expected ${expected#*=})"; exit 1
            fi
            if [[ "$actual" != "${expected#*=}" ]]; then
              echo "::error::The user manager's $name is $actual, not ${expected#*=}"; exit 1
            fi
          done
          probe_isolated_unit
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo 'Native systemd user manager discovered and started the isolated-path probe.'
      - name: Establish Windows Task Scheduler readiness
        if: matrix.job_id == 'direct-windows'
        shell: powershell
        timeout-minutes: 3
        run: |
          # Hosted direct Windows row only. This must run in Windows PowerShell 5.1,
          # like the driver's scheduled-task preflight.
          $ErrorActionPreference = 'Stop'
          $diag = Join-Path $env:RUNNER_TEMP 'journey-manager-direct-windows'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          Start-Transcript -Path (Join-Path $diag 'prerequisite.log') | Out-Null
          $taskName = 'Astrid-Journey-Manager-Probe-' + [guid]::NewGuid().ToString('N')
          $registered = $false
          $result = 1
          try {
              $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
              Write-Output "Identity: $identity"
              $service = Get-Service -Name Schedule -ErrorAction Stop
              Write-Output "Task Scheduler initial status: $($service.Status)"
              if ($service.Status -ne 'Running') { Start-Service -Name Schedule -ErrorAction Stop }
              $service.WaitForStatus([ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
              Write-Output "Task Scheduler status: $((Get-Service -Name Schedule).Status)"

              $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\cmd.exe" -Argument '/c exit 0'
              $principal = New-ScheduledTaskPrincipal -UserId $identity -LogonType Interactive
              Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -ErrorAction Stop | Out-Null
              $registered = $true
              $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
              if ($task.TaskName -ne $taskName) { throw 'Scheduled-task query returned an unexpected task.' }
              Write-Output 'Temporary task registration and query succeeded.'

              $result = 0
          } catch {
              Write-Output ("Prerequisite failure: " + ($_ | Out-String))
          } finally {
              if ($registered) {
                  try {
                      Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction Stop
                      Write-Output 'Temporary task removed.'
                  } catch {
                      Write-Output ("Temporary task cleanup failed: " + ($_ | Out-String))
                      $result = 1
                  }
              }
              Write-Output "setup_exit=$result"
              Stop-Transcript | Out-Null
          }
          exit $result
      - name: Capture Windows scheduled-task query diagnostics
        if: always() && matrix.job_id == 'direct-windows'
        shell: powershell
        env:
          JOURNEY_LEG: ${{ matrix.leg }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'journey-manager-direct-windows'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $stdout = Join-Path $evidence 'preflight-python-stdout.txt'
          $stderr = Join-Path $evidence 'preflight-python-stderr.txt'
          $status = Join-Path $evidence 'preflight-launch.json'
          $original = 'python -c "from pathlib import Path; import os; from scripts import ci_windows_journey as w; w.EVIDENCE = Path(os.environ[''RUNNER_TEMP'']) / ''journey-manager-direct-windows''; w.scheduled_task_preflight()"'
          $code = "from pathlib import Path; import os; from scripts import ci_windows_journey as w; w.EVIDENCE = Path(os.environ['RUNNER_TEMP']) / 'journey-manager-direct-windows'; w.scheduled_task_diagnostics(leg=os.environ['JOURNEY_LEG'])"
          # Start-Process passes this argument string to CreateProcess on Windows.
          $arguments = '-u -c "' + $code + '"'
          $record = [ordered]@{
            original_command = $original; executable = 'python'; arguments = $arguments
            stdout = $stdout; stderr = $stderr; exit_code = $null; exception = $null
            origin = [ordered]@{
              PSVersion = $PSVersionTable.PSVersion.ToString(); PSEdition = $PSVersionTable.PSEdition
              CommandType = $null; Source = $null; ModuleName = $null; ModulePath = $null
            }
            origin_exception = $null
          }
          function Save-PreflightLaunch {
            [IO.File]::WriteAllText($status, ($record | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          }
          [IO.File]::WriteAllText($stdout, '')
          [IO.File]::WriteAllText($stderr, '')
          Save-PreflightLaunch
          try {
            $command = Get-Command Get-ScheduledTask -ErrorAction Stop
            $record.origin.CommandType = [string]$command.CommandType
            $record.origin.Source = $command.Source
            $record.origin.ModuleName = $command.ModuleName
            $record.origin.ModulePath = $command.Module.Path
          } catch {
            $record.origin_exception = ($_ | Format-List * -Force | Out-String) + "`n" + $_.Exception.ToString()
          }
          Save-PreflightLaunch
          $env:PYTHONPATH = "$pwd/agent"
          try {
            $record.executable = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
            Save-PreflightLaunch
            $process = Start-Process -FilePath $record.executable -ArgumentList $arguments -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -ErrorAction Stop
            $record.exit_code = $process.ExitCode
          } catch {
            $record.exception = ($_ | Format-List * -Force | Out-String) + "`n" + $_.Exception.ToString()
          } finally {
            Save-PreflightLaunch
          }
          Write-Output "Windows preflight Python stdout:"
          Get-Content -LiteralPath $stdout | ForEach-Object { Write-Output $_ }
          Write-Output "Windows preflight Python stderr:"
          Get-Content -LiteralPath $stderr | ForEach-Object { Write-Output $_ }
          if ($null -ne $record.exception -or $record.exit_code -ne 0) { exit 1 }
      - name: Retain hosted service-manager prerequisite diagnostics
        if: always() && matrix.mode == 'direct' && (matrix.os == 'linux' || matrix.os == 'windows')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: journey-manager-${{ matrix.job_id }}${{ inputs.diagnostic_keep_going && format('-{0}', matrix.leg) || '' }}
          path: ${{ runner.temp }}/journey-manager-${{ matrix.job_id }}
          if-no-files-found: warn
      # The fresh Linux row updates by clicking Update now in the candidate's own hosted App build:
      # the driver serves this build at https://astrid.haus through the update leg's intercept.
      - name: Set up Node for the hosted App build
        if: matrix.job_id == 'direct-linux-fresh' || matrix.leg == 'fresh-install-autostart-off'
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - name: Build the candidate's hosted App and the browser that clicks it
        if: matrix.job_id == 'direct-linux-fresh' || matrix.leg == 'fresh-install-autostart-off'
        shell: bash
        working-directory: app
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          # The door port the build compiles in is the installed Runtime's default; nothing may override it.
          unset ASTRID_APP_DIRECT_DOOR_PORT
          npm run build:hosted
          test -f dist/index.html && test -f dist/build.json
          npx playwright install --with-deps chromium
          git status --porcelain --untracked-files=no | (! grep .)
      - name: Install the autostart-off capture browser
        if: matrix.leg == 'fresh-install-autostart-off'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/autostart-capture"
          npm install --prefix "$dir" --no-audit --no-fund playwright@1.47.2
          "$dir/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run the matrix-owned lifecycle driver
        if: ${{ !startsWith(matrix.job_id, 'pinokio-') }}
        env:
          ASTRID_CI_EXPECTED_RUNNER: ${{ matrix.runner }}
          ASTRID_CI_HOSTED_APP_DIST: ${{ (matrix.job_id == 'direct-linux-fresh' || matrix.leg == 'fresh-install-autostart-off') && format('{0}/app/dist', github.workspace) || '' }}
          ASTRID_CI_WAIT_READY_TIMEOUT: ${{ needs.config.outputs.wait_timeout }}
          ASTRID_AUTOSTART_CAPTURE_DIR: ${{ matrix.leg == 'fresh-install-autostart-off' && format('{0}/autostart-capture', runner.temp) || '' }}
          M4_4A_EXECUTOR_CONFIGS: ${{ needs.config.outputs.m4_4a_executor_configs }}
        run: |
          $runRoot = Join-Path $env:RUNNER_TEMP "astrid-r1-${{ matrix.job_id }}"
          $release0Args = @()
          $oldLauncherArgs = @()
          if ('${{ matrix.mode }}' -eq 'pinokio-backend') {
            $oldLauncherArgs = @(
              '--old-launcher-ref', '${{ needs.config.outputs.old_launcher_ref }}',
              '--stopped-path-agent-ref', '${{ needs.config.outputs.stopped_path_agent_ref }}'
            )
          }
          if ('${{ matrix.leg }}' -eq 'release11-then-update') {
            # The served Release 11 is installed from its pinned App commit, then updated by the candidate.
            $release0Args = @(
              '--release11-app-checkout', "$pwd/release11-app",
              '--allow-release11-to-candidate'
            )
          }
          if ('${{ matrix.leg }}' -eq 'release9-then-install') {
            $release0Args = @(
              '--release9-app-checkout', "$pwd/release9-app",
              '--allow-release0-to-release1'
            )
          }
          if ('${{ matrix.leg }}' -eq 'r0-handoff-then-update') {
            # The frozen R0 is handed off by the pinned Release 9 installer, then updated by the candidate.
            $release0Args = @(
              '--release0-fixture', "$pwd/agent/tests/fixtures/release0",
              '--release9-app-checkout', "$pwd/release9-app",
              '--allow-release0-to-release1'
            )
          }
          $backendConfigArgs = @()
          if ('${{ matrix.mode }}' -eq 'pinokio-backend') {
            $configs = ConvertFrom-Json $env:M4_4A_EXECUTOR_CONFIGS
            $backendConfigPath = Join-Path $env:RUNNER_TEMP 'm4-4a-executor-config.json'
            $backendConfigJson = $configs.'${{ matrix.os }}' | ConvertTo-Json -Depth 100 -Compress
            [IO.File]::WriteAllText($backendConfigPath, $backendConfigJson, [Text.UTF8Encoding]::new($false))
            $backendConfigArgs = @('--pinokio-backend-config', $backendConfigPath)
          }
          $keepGoingArgs = @()
          if ('${{ inputs.diagnostic_keep_going }}' -eq 'true') { $keepGoingArgs = @('--diagnostic-keep-going') }
          python -u agent/scripts/ci_journey.py `
            --job-id '${{ matrix.job_id }}' --mode '${{ matrix.mode }}' --leg '${{ matrix.leg }}' `
            --candidate "$env:RUNNER_TEMP/candidate.json" `
            --app-checkout "$pwd/app" --candidate-agent-checkout "$pwd/candidate-agent" `
            --candidate-runtime-checkout "$pwd/runtime" --pinokio-checkout "$pwd/pinokio" `
            --run-root $runRoot --root (Join-Path $runRoot program) --data-root (Join-Path $runRoot data) `
            --shell '${{ matrix.shell }}' @release0Args @oldLauncherArgs @backendConfigArgs @keepGoingArgs
          $freshExit = $LASTEXITCODE
          $runWindowsRefusal = '${{ matrix.job_id }}' -eq 'direct-windows' -and (
            ('${{ inputs.diagnostic_keep_going }}' -eq 'true' -and '${{ matrix.leg }}' -eq 'fresh-install') -or
            '${{ inputs.diagnostic_keep_going }}' -ne 'true'
          )
          if ($runWindowsRefusal) {
            $refusalRoot = Join-Path $env:RUNNER_TEMP 'astrid-r1-direct-windows-refusal'
            $env:ASTRID_CI_SANDBOX_PROFILE = '1'
            python -u agent/scripts/ci_journey.py `
              --job-id direct-windows --mode direct --leg windows-upgrade-refusal `
              --candidate "$env:RUNNER_TEMP/candidate.json" `
              --app-checkout "$pwd/app" --candidate-agent-checkout "$pwd/candidate-agent" `
              --candidate-runtime-checkout "$pwd/runtime" --pinokio-checkout "$pwd/pinokio" `
              --run-root $refusalRoot --root (Join-Path $refusalRoot program) --data-root (Join-Path $refusalRoot data) `
              --shell powershell.exe --release0-fixture "$pwd/agent/tests/fixtures/release0" --allow-release0-to-release1
            $refusalExit = $LASTEXITCODE
            $freshReceipt = Join-Path $runRoot 'evidence-upload/after-cleanup/journey-result.json'
            $refusalReceipt = Join-Path $refusalRoot 'evidence-upload/after-cleanup/journey-result.json'
            if (-not (Test-Path -LiteralPath $refusalReceipt)) {
              $refusalReceipt = Join-Path $refusalRoot 'evidence-upload/before-cleanup/journey-result.json'
            }
            if ((Test-Path -LiteralPath $freshReceipt) -and (Test-Path -LiteralPath $refusalReceipt)) {
              $fresh = Get-Content -LiteralPath $freshReceipt -Raw | ConvertFrom-Json
              $refusal = Get-Content -LiteralPath $refusalReceipt -Raw | ConvertFrom-Json
              $fresh | Add-Member -NotePropertyName windows_upgrade_refusal -NotePropertyValue $refusal
              [IO.File]::WriteAllText($freshReceipt, ($fresh | ConvertTo-Json -Depth 100), [Text.UTF8Encoding]::new($false))
            } else { $refusalExit = 1 }
            foreach ($name in @('refusal-update-bootstrap.log', 'scheduled-task-before.xml', 'scheduled-task-after.xml')) {
              $source = Join-Path (Split-Path $refusalReceipt) $name
              if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination (Split-Path $freshReceipt) }
            }
            if ($refusalExit -ne 0) { exit $refusalExit }
          }
          if ($freshExit -ne 0) { exit $freshExit }
      - name: Make sure the hosted-update intercept left no trace on the runner
        # The update leg maps astrid.haus to a local HTTPS stand-in with a CA only this runner trusts.
        # The driver removes both in a finally block; this repeats the removal if the driver was killed.
        if: ${{ always() && (matrix.job_id == 'direct-windows' || matrix.job_id == 'direct-linux-fresh' || matrix.job_id == 'direct-macos-fresh') }}
        timeout-minutes: 5
        run: python agent/scripts/journey_hosted_update.py revert
      - name: Run the Pinokio launcher row driver
        if: ${{ startsWith(matrix.job_id, 'pinokio-') }}
        shell: bash
        timeout-minutes: 120
        env:
          JOB_ID: ${{ matrix.job_id }}
          JOB_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          # Writes the single pinokio-row-v1 receipt where the evidence boundary expects it.
          run_root="$RUNNER_TEMP/astrid-r1-$JOB_ID"
          receipt="$run_root/evidence-upload/after-cleanup/journey-result.json"
          python3 -u agent/scripts/pinokio_row_driver.py \
            --job-id "$JOB_ID" --os "$JOB_OS" \
            --candidate "$RUNNER_TEMP/candidate.json" \
            --pinokio-checkout "$PWD/pinokio" --agent-checkout "$PWD/agent" --app-checkout "$PWD/app" \
            --run-root "$run_root" --receipt "$receipt"
      - name: Publish diagnostic table or pre-driver failure
        if: always() && inputs.diagnostic_keep_going == true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "astrid-r1-${{ matrix.job_id }}/evidence-upload/before-cleanup"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $report = Join-Path $dir 'keepgoing-report.json'
          $table = Join-Path $dir 'keepgoing-report.md'
          if (-not (Test-Path -LiteralPath $report)) {
            $errorText = 'Driver report unavailable; inspect preceding job steps for the exact error.'
            $row = @{stage='pre-driver-or-scope'; result='not-run'; forced_continuation_used=$false; first_error=$errorText; evidence_path='GitHub Actions job log'}
            $value = @{schema_version=1; proof_mode='keep-going-diagnostic'; classification='NON-PROOF'; status='fail'; qualification=@{eligible=$false}; job_id='${{ matrix.job_id }}'; stages=@($row)}
            $json = $value | ConvertTo-Json -Depth 10
            [IO.File]::WriteAllText($report, $json, [Text.UTF8Encoding]::new($false))
            $value.receipt_kind = 'diagnostic-only'
            [IO.File]::WriteAllText((Join-Path $dir 'journey-result.json'), ($value | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($table, "NON-PROOF`n`n| stage | result | forced-continuation-used | first error |`n| --- | --- | --- | --- |`n| pre-driver-or-scope | not-run | false | $errorText |`n", [Text.UTF8Encoding]::new($false))
          }
          if (Test-Path -LiteralPath $table) { Get-Content -LiteralPath $table | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY }
      - name: Validate the named lifecycle evidence artifact boundary
        id: evidence_boundary
        if: always()
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "astrid-r1-${{ matrix.job_id }}/evidence-upload"
          $allowedNames = @(
            'journey-result.json', 'keepgoing-report.json', 'keepgoing-report.md', 'project-create-capture-status.json', 'sdk-capture-status.json',
            'release1-task-sdk-invocation.json', 'release1-task-installed-source.json',
            'live-seed-failure.json', 'live-snapshot-failure.json', 'live-release1-snapshot-failure.json', 'windows-schema-acl.json', 'install.log', 'uninstall.log', 'final-uninstall.log',
            'install-bootstrap.log', 'update-bootstrap.log', 'release0-bootstrap.log', 'start.log',
            'install-bootstrap-process.json', 'install-bootstrap-stdout.log', 'install-bootstrap-stderr.log',
            'update-bootstrap-process.json', 'update-bootstrap-stdout.log', 'update-bootstrap-stderr.log',
            'verify-install.json', 'verify-install.log', 'verify-update.json', 'verify-update.log',
            'verify-observe.json', 'verify-observe.log', 'windows-update-manifest.json',
            'windows-update-SHA256SUMS', 'windows-update-scheduler-events.json', 'windows-update-process-capture.json', 'windows-update-wait.jsonl', 'windows-update-job.log', 'windows-update-wrapper.log', 'windows-update-stop-task-state.json', 'update-task-labels.log', 'update-task-state.log', 'update-service-labels.log',
            'service-manager-prerequisite.log', 'direct-service-ownership.log',
            'preflight-scheduled-task.txt', 'refusal-update-bootstrap.log',
            'update-job-journal.log', 'update-job-record.json', 'update-transaction.json',
            'update-button.json', 'update-button.png',
            'update-transaction-status.json', 'runtime-data-runtime.log', 'runtime-real-home-runtime.log', 'macos-file-listing.txt',
            'scheduled-task-before.xml', 'scheduled-task-after.xml',
            'runtime-owner-processes.json', 'runtime-owner-selection.json',
            'runtime-owner-workspace.json',
            'runtime-owner-selection-context.json', 'runtime-service-runtime.log', 'runtime-service-native.log', 'service-pack-host.log', 'windows-service-log-status.json',
            'windows-real-profile-pack-host-before-cleanup.json', 'windows-real-profile-pack-host-after-cleanup.json',
            'windows-pack-host-update-before.json', 'windows-pack-host-update-after.json',
            'manager-state-before-cleanup.json', 'manager-state-after-cleanup.json',
            'manager-state-before-cleanup.log', 'manager-state-after-cleanup.log',
            'unit-file-before-cleanup.txt', 'unit-file-after-cleanup.txt'
          )
          $maxArtifactBytes = 49000000
          # Reserve 1 KiB per file for the stored ZIP entry and central directory.
          $estimatedArtifactBytes = 0L
          $receiptCount = 0
          if (Test-Path -LiteralPath $evidenceRoot) {
            foreach ($file in Get-ChildItem -LiteralPath $evidenceRoot -File -Recurse -Force) {
              $relative = [IO.Path]::GetRelativePath($evidenceRoot, $file.FullName).Replace('\', '/')
              if ($relative -notmatch '^(before-cleanup|after-cleanup)/([^/]+)$') {
                throw "Unexpected staged evidence path: $relative"
              }
              $name = $Matches[2]
              if ($name -notin $allowedNames -and $name -notmatch '^runtime-service-service-.+\.log$' -and $name -notmatch '^keepgoing-stage-[0-9]{2}\.log$') {
                throw "Unexpected staged evidence filename: $relative"
              }
              if (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Staged evidence must be a regular file: $relative"
              }
              if ($name -in @('project-create-capture-status.json', 'sdk-capture-status.json')) {
                if ($file.Length -gt 1024) { throw "Oversized SDK capture receipt: $relative" }
                try { $capture = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json }
                catch { throw "Malformed SDK capture receipt: $relative" }
                $keys = @($capture.PSObject.Properties.Name)
                $expectedKeys = @('schema', 'exit_condition', 'response_size', 'json_object', 'ok', 'task_refs')
                if ($capture -isnot [PSCustomObject] -or $keys.Count -ne $expectedKeys.Count) {
                  throw "Invalid SDK capture receipt: $relative"
                }
                foreach ($key in $expectedKeys) {
                  if ($keys -cnotcontains $key) { throw "Invalid SDK capture fields: $relative" }
                }
                if ($capture.schema -isnot [string] -or
                    $capture.schema -cne 'astrid.sdk-capture-status.v1' -or
                    $capture.exit_condition -isnot [string] -or
                    @('success', 'failure', 'timeout') -cnotcontains $capture.exit_condition -or
                    $capture.response_size -isnot [string] -or
                    @('empty', 'within_limit', 'over_limit', 'unavailable') -cnotcontains $capture.response_size -or
                    ($null -ne $capture.json_object -and $capture.json_object -isnot [bool]) -or
                    ($null -ne $capture.ok -and $capture.ok -isnot [bool]) -or
                    $capture.task_refs -isnot [string] -or
                    @('zero', 'one', 'multiple', 'unknown') -cnotcontains $capture.task_refs) {
                  throw "Invalid SDK capture values: $relative"
                }
              }
              if ($name -eq 'release1-task-sdk-invocation.json' -and $file.Length -gt 131072) {
                throw "Oversized release-1 task invocation capture: $relative"
              }
              if ($name -eq 'release1-task-installed-source.json') {
                if ($file.Length -gt 1024) { throw "Oversized installed source receipt: $relative" }
                try { $source = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json }
                catch { throw "Malformed installed source receipt: $relative" }
                $keys = @($source.PSObject.Properties.Name)
                $expectedKeys = @('schema', 'release', 'agent_sha', 'runtime_sha', 'manifest_sha256')
                if ($source -isnot [PSCustomObject] -or $keys.Count -ne $expectedKeys.Count) {
                  throw "Invalid installed source receipt: $relative"
                }
                foreach ($key in $expectedKeys) {
                  if ($keys -cnotcontains $key) { throw "Invalid installed source fields: $relative" }
                }
                if ($source.schema -isnot [string] -or $source.schema -cne 'astrid.failed-release1-task-source.v1' -or
                    ($source.release -isnot [int] -and $source.release -isnot [long]) -or $source.release -ne 1 -or
                    $source.agent_sha -isnot [string] -or $source.agent_sha -cnotmatch '^[0-9a-f]{40}$' -or
                    $source.runtime_sha -isnot [string] -or $source.runtime_sha -cnotmatch '^[0-9a-f]{40}$' -or
                    $source.manifest_sha256 -isnot [string] -or $source.manifest_sha256 -cnotmatch '^[0-9a-f]{64}$') {
                  throw "Invalid installed source values: $relative"
                }
              }
              if ($name -in @('live-seed-failure.json', 'live-snapshot-failure.json', 'live-release1-snapshot-failure.json')) {
                if ($file.Length -gt 4096) { throw "Oversized live workspace failure diagnostic: $relative" }
                try { $diagnostic = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json }
                catch { throw "Malformed live workspace failure diagnostic: $relative" }
                $keys = @($diagnostic.PSObject.Properties.Name)
                $expectedKeys = @('schema', 'error_type', 'frames', 'http_status', 'runtime_code')
                if ($diagnostic.schema -ceq 'astrid.live-workspace-failure.v2') {
                  $expectedKeys += 'missing_field'
                }
                if ($diagnostic.schema -ceq 'astrid.live-workspace-failure.v3') {
                  $expectedKeys += @('missing_field', 'snapshot_lookup')
                }
                if ($diagnostic -isnot [PSCustomObject] -or $keys.Count -ne $expectedKeys.Count) {
                  throw "Invalid live workspace failure diagnostic: $relative"
                }
                foreach ($key in $expectedKeys) {
                  if ($keys -cnotcontains $key) { throw "Invalid live workspace failure fields: $relative" }
                }
                $allowedErrorTypes = @('HTTPError', 'URLError', 'TimeoutError', 'JSONDecodeError', 'KeyError',
                  'ValueError', 'TypeError', 'RuntimeError', 'OSError', 'FileNotFoundError', 'PermissionError', 'other')
                $allowedFunctions = @('main', 'execute', 'selection_for', 'check_selection', 'request', 'seed', 'snapshot')
                $allowedRuntimeCodes = @('runtime_error', 'unauthorized', 'conflict', 'validation_error', 'forbidden',
                  'unavailable', 'not_found', 'retired_route', 'owner_busy', 'realm_admission_failed',
                  'lease_fenced', 'protocol_error', 'invalid_request')
                $allowedSnapshotFields = @('project', 'timeline', 'object_digest', 'task_id', 'id', 'slug', 'name',
                  'metadata', 'content', 'version', 'status', 'task', 'schema_version', 'target_schema_version',
                  'project_id', 'timeline_id', 'cas_sha256', 'head_revision_id')
                if ($diagnostic.schema -isnot [string] -or
                    $diagnostic.schema -cnotin @('astrid.live-workspace-failure.v1', 'astrid.live-workspace-failure.v2', 'astrid.live-workspace-failure.v3') -or
                    $diagnostic.error_type -isnot [string] -or
                    $allowedErrorTypes -cnotcontains $diagnostic.error_type -or
                    $diagnostic.frames -isnot [array] -or $diagnostic.frames.Count -gt 10 -or
                    ($null -ne $diagnostic.http_status -and
                      (($diagnostic.http_status -isnot [int] -and $diagnostic.http_status -isnot [long]) -or
                        $diagnostic.http_status -lt 100 -or $diagnostic.http_status -gt 599)) -or
                    ($null -ne $diagnostic.runtime_code -and
                      ($diagnostic.runtime_code -isnot [string] -or $allowedRuntimeCodes -cnotcontains $diagnostic.runtime_code)) -or
                    ($diagnostic.schema -cin @('astrid.live-workspace-failure.v2', 'astrid.live-workspace-failure.v3') -and $null -ne $diagnostic.missing_field -and
                      ($diagnostic.missing_field -isnot [string] -or $allowedSnapshotFields -cnotcontains $diagnostic.missing_field))) {
                  throw "Invalid live workspace failure values: $relative"
                }
                if ($diagnostic.schema -ceq 'astrid.live-workspace-failure.v3') {
                  $lookup = $diagnostic.snapshot_lookup
                  $lookupKeys = @('timeline_type', 'timeline_head_revision_id', 'keys_type', 'keys_revision')
                  $allowedJsonTypes = @('null', 'boolean', 'number', 'string', 'object', 'array', 'other')
                  if ($lookup -isnot [PSCustomObject] -or
                      @($lookup.PSObject.Properties.Name).Count -ne $lookupKeys.Count) {
                    throw "Invalid live workspace snapshot lookup: $relative"
                  }
                  foreach ($key in $lookupKeys) {
                    if (@($lookup.PSObject.Properties.Name) -cnotcontains $key) {
                      throw "Invalid live workspace snapshot lookup fields: $relative"
                    }
                  }
                  if ($lookup.timeline_type -isnot [string] -or $allowedJsonTypes -cnotcontains $lookup.timeline_type -or
                      $lookup.keys_type -isnot [string] -or $allowedJsonTypes -cnotcontains $lookup.keys_type) {
                    throw "Invalid live workspace snapshot lookup types: $relative"
                  }
                  foreach ($fieldName in @('timeline_head_revision_id', 'keys_revision')) {
                    $field = $lookup.$fieldName
                    $fieldKeys = @($field.PSObject.Properties.Name)
                    if ($field -isnot [PSCustomObject] -or $fieldKeys.Count -ne 2 -or
                        $fieldKeys -cnotcontains 'present' -or $fieldKeys -cnotcontains 'type' -or
                        $field.present -isnot [bool] -or
                        ($null -ne $field.type -and ($field.type -isnot [string] -or $allowedJsonTypes -cnotcontains $field.type)) -or
                        ($field.present -and $null -eq $field.type) -or (-not $field.present -and $null -ne $field.type)) {
                      throw "Invalid live workspace snapshot lookup field: $relative"
                    }
                  }
                }
                foreach ($frame in $diagnostic.frames) {
                  $frameKeys = @($frame.PSObject.Properties.Name)
                  if ($frame -isnot [PSCustomObject] -or $frameKeys.Count -ne 2 -or
                      $frameKeys -cnotcontains 'function' -or $frameKeys -cnotcontains 'line' -or
                      $frame.function -isnot [string] -or $allowedFunctions -cnotcontains $frame.function -or
                      ($frame.line -isnot [int] -and $frame.line -isnot [long]) -or
                      $frame.line -le 0 -or $frame.line -ge 10000) {
                    throw "Invalid live workspace failure frame: $relative"
                  }
                }
              }
              if ($name -eq 'journey-result.json') { $receiptCount++ }
              $estimatedArtifactBytes += [long]$file.Length + 1024
            }
          }
          if ($receiptCount -eq 0) {
            throw "No staged journey-result.json receipt exists under $evidenceRoot"
          }
          if ($estimatedArtifactBytes -ge $maxArtifactBytes) {
            throw "Named journey artifact estimate is $estimatedArtifactBytes bytes; limit is below $maxArtifactBytes bytes"
          }
          Write-Host "Validated named lifecycle artifact estimate: $estimatedArtifactBytes bytes (< $maxArtifactBytes)."
      - name: Retain only the named lifecycle evidence after a lifecycle failure
        if: always() && steps.evidence_boundary.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: journey-receipt-${{ matrix.job_id }}${{ inputs.diagnostic_keep_going && format('-{0}', matrix.leg) || '' }}
          # The collector stages only allowlisted names in these two phase folders.
          # Keep the job-id directory in the artifact to avoid receipt collisions.
          path: ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/evidence-upload
          if-no-files-found: warn
          compression-level: 0
      - name: Upload the Pinokio row's working evidence
        if: always() && startsWith(matrix.job_id, 'pinokio-')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: pinokio-work-${{ matrix.job_id }}
          path: |
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/work/evidence
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/work/*.log
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/home/.local/state/astrid-runtime/logs
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/pinokio-home/api/astrid-row/app/astrid/*.log
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/home/AppData/Local/**/*.log
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/home/Library/Logs/Astrid Runtime/*.log
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/home/AppData/Local/Astrid Runtime/runtime/generic-host*.json
            ${{ runner.temp }}/astrid-r1-${{ matrix.job_id }}/home/AppData/Local/Astrid Runtime/runtime/pack-host-job-cleanup.json
          if-no-files-found: warn

  release2:
    if: needs.config.outputs.m4_5_enabled == 'true'
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.m4_5_matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed Agent receipt harness
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out frozen App candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ fromJSON(needs.config.outputs.candidate).app }}
          path: app
          persist-credentials: false
      - name: Check out frozen Agent candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ fromJSON(needs.config.outputs.candidate).agent }}
          path: candidate-agent
          persist-credentials: false
      - name: Check out frozen Runtime candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ fromJSON(needs.config.outputs.candidate).runtime }}
          path: runtime
          persist-credentials: false
      - name: Check out frozen Pinokio candidate
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ fromJSON(needs.config.outputs.candidate).pinokio }}
          path: pinokio
          persist-credentials: false
      - name: Run the explicit M4-5 hosted boundary
        env:
          BOUNDARY: ${{ needs.config.outputs.m4_5_boundary }}
          BOUNDARY_ARGS: ${{ needs.config.outputs.m4_5_boundary_args }}
          CANDIDATE: ${{ needs.config.outputs.candidate }}
          SCENARIO_ID: ${{ matrix.scenario_id }}
          RUNNER_TEMP_PATH: ${{ runner.temp }}
          ASTRID_APP_CHECKOUT: ${{ github.workspace }}/app
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/candidate-agent
          ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/runtime
          ASTRID_PINOKIO_CHECKOUT: ${{ github.workspace }}/pinokio
        run: |
          $candidatePath = Join-Path $env:RUNNER_TEMP_PATH "m4-5-candidate.json"
          [IO.File]::WriteAllText($candidatePath, $env:CANDIDATE, [Text.UTF8Encoding]::new($false))
          $root = Join-Path $env:RUNNER_TEMP_PATH ("m4-5-" + $env:SCENARIO_ID)
          $executorArgs = @(
            "agent/scripts/ci_journey.py", "--shared-executor", "m4-5",
            "--scenario-id", $env:SCENARIO_ID, "--candidate", $candidatePath,
            "--boundary", $env:BOUNDARY, "--root", (Join-Path $root "install"),
            "--data-root", (Join-Path $root "data"), "--receipt", (Join-Path $root "journey-result.json"),
            "--evidence-kind", "hosted-lifecycle"
          )
          foreach ($boundaryArg in (ConvertFrom-Json $env:BOUNDARY_ARGS)) {
            $executorArgs += @("--boundary-arg", [string]$boundaryArg)
          }
          python -u @executorArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the M4-5 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: m4-5-receipt-${{ matrix.scenario_id }}
          path: ${{ runner.temp }}/m4-5-${{ matrix.scenario_id }}/journey-result.json
          if-no-files-found: warn

  m4_4b_local:
    if: needs.config.outputs.m4_4b_enabled == 'true'
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed shared driver
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build marker-attested disposable checkout and state roots
        shell: bash
        run: |
          root="$RUNNER_TEMP/m4-4b-local"
          checkout="$root/checkout"
          state="$root/state"
          mkdir -p "$checkout" "$state" "$RUNNER_TEMP/m4-4b-results"
          git -C "$checkout" init --quiet --initial-branch=main
          git -C "$checkout" config user.name "M4-4b local smoke"
          git -C "$checkout" config user.email "m4-4b@example.invalid"
          printf 'm4-4b-disposable\n' > "$checkout/.m4-4b-disposable"
          printf 'disposable editor checkout\n' > "$checkout/editor.txt"
          git -C "$checkout" add .m4-4b-disposable editor.txt
          git -C "$checkout" commit -m 'mark disposable M4-4b checkout'
          git init --quiet --bare "$root/origin.git"
          git -C "$checkout" remote add origin "$root/origin.git"
          printf 'm4-4b-disposable\n' > "$state/.m4-4b-disposable"
      - name: Run real M4-4b local-process executor
        shell: bash
        run: |
          python -u agent/scripts/ci_journey.py --shared-executor m4-4b \
            --checkout "$RUNNER_TEMP/m4-4b-local/checkout" \
            --state-root "$RUNNER_TEMP/m4-4b-local/state" \
            --output "$RUNNER_TEMP/m4-4b-results/m4-4b-local-result.json"
      - name: Retain local-only M4-4b output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: m4-4b-local-m4-4b-fully-local-linux-smoke
          path: ${{ runner.temp }}/m4-4b-results
          if-no-files-found: warn

  failure_modes:
    if: needs.config.outputs.m4_6_enabled == 'true'
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.m4_6_matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed shared driver
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out exact M4-6 candidate Agent history
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ fromJSON(needs.config.outputs.m4_6_candidate).agent }}
          path: candidate-agent
          # Keep the candidate checkout shallow; release-0 is provisioned
          # explicitly below and is never inferred from candidate ancestry.
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact M4-6 candidate Runtime history
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ fromJSON(needs.config.outputs.m4_6_candidate).runtime }}
          path: runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Provision and attest immutable release-0 Git objects
        shell: bash
        env:
          RELEASE0_AGENT_REF: 3204bb00135bec8ee2d2d3fb21eed5abfceca649
          RELEASE0_RUNTIME_REF: 6d53a19070faf63fc15ae1f81417722edc2c8a5f
        run: |
          set -euo pipefail
          # A shallow candidate checkout does not imply that either historical
          # object exists. Fetch each exact full SHA into the repository that
          # the executor will receive, then verify both object identity and
          # object type before any disposable execution root is created.
          git -C "$GITHUB_WORKSPACE/candidate-agent" fetch --no-tags --depth=1 origin "$RELEASE0_AGENT_REF"
          git -C "$GITHUB_WORKSPACE/runtime" fetch --no-tags --depth=1 origin "$RELEASE0_RUNTIME_REF"
          agent_resolved="$(git -C "$GITHUB_WORKSPACE/candidate-agent" rev-parse "$RELEASE0_AGENT_REF^{commit}")"
          runtime_resolved="$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse "$RELEASE0_RUNTIME_REF^{commit}")"
          test "$agent_resolved" = "$RELEASE0_AGENT_REF"
          test "$runtime_resolved" = "$RELEASE0_RUNTIME_REF"
          test "$(git -C "$GITHUB_WORKSPACE/candidate-agent" cat-file -t "$RELEASE0_AGENT_REF")" = commit
          test "$(git -C "$GITHUB_WORKSPACE/runtime" cat-file -t "$RELEASE0_RUNTIME_REF")" = commit
          {
            echo "## Effective M4-6 historical source provisioning"
            echo "- Agent repository: $GITHUB_WORKSPACE/candidate-agent"
            echo "- Agent ref: $agent_resolved (commit)"
            echo "- Runtime repository: $GITHUB_WORKSPACE/runtime"
            echo "- Runtime ref: $runtime_resolved (commit)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run local-disposable M4-6 executor slot on POSIX
        if: matrix.os != 'windows'
        shell: bash
        env:
          M4_6_CANDIDATE: ${{ needs.config.outputs.m4_6_candidate }}
          SLOT_ID: ${{ matrix.job_id }}
        run: |
          root="$RUNNER_TEMP/m4-6-$SLOT_ID"
          mkdir -p "$root/output"
          printf '%s' "$M4_6_CANDIDATE" > "$root/candidate.json"
          python -u agent/scripts/ci_journey.py --shared-executor m4-6 \
            --slot-id "$SLOT_ID" --candidate "$root/candidate.json" \
            --fixture "$GITHUB_WORKSPACE/agent/tests/fixtures/release0" \
            --output "$root/output/m4-6-local-result.json" \
            --work-root "$RUNNER_TEMP/$SLOT_ID-work" \
            --agent-repo "$GITHUB_WORKSPACE/candidate-agent" \
            --release0-runtime-repo "$GITHUB_WORKSPACE/runtime"
      - name: Run local-disposable M4-6 executor slot on Windows PowerShell 5.1
        if: matrix.os == 'windows'
        shell: powershell
        env:
          M4_6_CANDIDATE: ${{ needs.config.outputs.m4_6_candidate }}
          SLOT_ID: ${{ matrix.job_id }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("m4-6-" + $env:SLOT_ID)
          $outputRoot = Join-Path $root "output"
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $candidatePath = Join-Path $root "candidate.json"
          [IO.File]::WriteAllText($candidatePath, $env:M4_6_CANDIDATE, [Text.UTF8Encoding]::new($false))
          $executorArgs = @(
            "agent/scripts/ci_journey.py", "--shared-executor", "m4-6",
            "--slot-id", $env:SLOT_ID, "--candidate", $candidatePath,
            "--fixture", "$pwd/agent/tests/fixtures/release0",
            "--output", (Join-Path $outputRoot "m4-6-local-result.json"),
            "--work-root", (Join-Path $env:RUNNER_TEMP ($env:SLOT_ID + "-work")),
            "--agent-repo", "$pwd/candidate-agent", "--release0-runtime-repo", "$pwd/runtime"
          )
          python -u @executorArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain local-disposable M4-6 output separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: m4-6-local-${{ matrix.job_id }}
          path: ${{ runner.temp }}/m4-6-${{ matrix.job_id }}/output
          if-no-files-found: warn

  gate:
    name: Journey evidence (exact tuple)
    if: always()
    needs: [config, journey, release2, m4_4b_local, failure_modes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject skipped, cancelled, or failed matrix dependencies
        shell: bash
        env:
          DIAGNOSTIC_KEEP_GOING: ${{ inputs.diagnostic_keep_going || false }}
          CONFIG_RESULT: ${{ needs.config.result }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
          M4_5_ENABLED: ${{ needs.config.outputs.m4_5_enabled }}
          M4_5_ONLY: ${{ needs.config.outputs.m4_5_only }}
          M4_4B_ENABLED: ${{ needs.config.outputs.m4_4b_enabled }}
          M4_4B_RESULT: ${{ needs.m4_4b_local.result }}
          M4_6_ENABLED: ${{ needs.config.outputs.m4_6_enabled }}
          M4_6_RESULT: ${{ needs.failure_modes.result }}
          RELEASE2_RESULT: ${{ needs.release2.result }}
        run: |
          test "$DIAGNOSTIC_KEEP_GOING" != true # NON-PROOF, even when artifacts are absent
          test "$CONFIG_RESULT" = success
          if [ "$M4_5_ONLY" != true ]; then test "$JOURNEY_RESULT" = success; fi
          if [ "$M4_5_ENABLED" = true ]; then test "$RELEASE2_RESULT" = success; fi
          if [ "$M4_4B_ENABLED" = true ]; then test "$M4_4B_RESULT" = success; fi
          if [ "$M4_6_ENABLED" = true ]; then test "$M4_6_RESULT" = success; fi
      - name: Check out reviewed Agent receipt harness
        if: always()
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ needs.config.outputs.driver_agent_ref }}
          path: agent
          persist-credentials: false
      - name: Check out frozen App candidate for aggregate validation
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ fromJSON(needs.config.outputs.candidate).app }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.11"
      - name: Download every per-job receipt
        uses: actions/download-artifact@v4
        with:
          pattern: journey-receipt-*
          path: receipts
          merge-multiple: false
      - name: Aggregate the exact Release-1 receipt matrix
        if: needs.config.outputs.m4_5_only != 'true' && needs.config.outputs.m4_4a_backend_only != 'true' && needs.config.outputs.pinokio_only != 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
          RELEASE1_SCOPE: ${{ needs.config.outputs.release1_scope }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results receipts --aggregate-release1 --release1-scope "$RELEASE1_SCOPE"
      - name: Aggregate the exact M4-4a Pinokio backend receipts
        if: needs.config.outputs.m4_5_only != 'true' && needs.config.outputs.m4_4a_backend_only == 'true' && needs.config.outputs.pinokio_only != 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results receipts --aggregate-m4-4a
      - name: Aggregate the exact selected Pinokio receipts
        if: needs.config.outputs.pinokio_only == 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
          PINOKIO_JOB_IDS: ${{ needs.config.outputs.pinokio_job_ids }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results receipts --aggregate-release1-1-pinokio --pinokio-job-ids "$PINOKIO_JOB_IDS"
      - name: Reject skipped M4-5 matrix dependencies
        if: needs.config.outputs.m4_5_enabled == 'true'
        shell: bash
        env:
          RELEASE2_RESULT: ${{ needs.release2.result }}
        run: test "$RELEASE2_RESULT" = success
      - name: Download every M4-5 scenario receipt
        if: needs.config.outputs.m4_5_enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: m4-5-receipt-*
          path: release2-receipts
      - name: Aggregate the exact twelve M4-5 scenario receipts
        if: needs.config.outputs.m4_5_enabled == 'true'
        shell: bash
        env:
          CANDIDATE: ${{ needs.config.outputs.candidate }}
        run: |
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/candidate.json" --app-checkout app --results release2-receipts --aggregate-m4-5
      - name: Download local-only M4-4b output
        if: always() && needs.config.outputs.m4_4b_enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: m4-4b-local-m4-4b-fully-local-linux-smoke
          path: m4-4b-local-results
      - name: Aggregate M4-4b only as local-process evidence
        if: always() && needs.config.outputs.m4_4b_enabled == 'true'
        shell: bash
        run: python agent/scripts/check_journey_evidence.py --results m4-4b-local-results --aggregate-m4-4b-local
      - name: Download all separately retained local M4-6 outputs
        if: always() && needs.config.outputs.m4_6_enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: m4-6-local-*
          path: m4-6-local-results
      - name: Aggregate M4-6 disposable execution outputs
        if: always() && needs.config.outputs.m4_6_enabled == 'true'
        shell: bash
        env:
          M4_6_CANDIDATE: ${{ needs.config.outputs.m4_6_candidate }}
        run: |
          printf '%s' "$M4_6_CANDIDATE" > "$RUNNER_TEMP/m4-6-candidate.json"
          python agent/scripts/check_journey_evidence.py --candidate "$RUNNER_TEMP/m4-6-candidate.json" --results m4-6-local-results --aggregate-m4-6-local
      - name: Fail closed on the unavailable hosted M4-6 native-service aggregate
        if: always() && needs.config.outputs.m4_6_enabled == 'true'
        shell: bash
        env:
          M4_6_CANDIDATE: ${{ needs.config.outputs.m4_6_candidate }}
          NEEDS_PATH: ${{ runner.temp }}/m4-6-hosted-needs.json
        run: |
          printf '%s' "$M4_6_CANDIDATE" > "$RUNNER_TEMP/m4-6-hosted-candidate.json"
          mkdir -p m4-6-hosted-results
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          slots = ("direct-macos", "direct-linux", "direct-windows",
                   "pinokio-backend-macos", "pinokio-backend-linux", "pinokio-backend-windows",
                   "pinokio-fully-local-macos", "pinokio-fully-local-linux", "pinokio-fully-local-windows")
          Path(os.environ["NEEDS_PATH"]).write_text(
              json.dumps({slot: {"result": "skipped"} for slot in slots}), encoding="utf-8")
          PY
          python agent/scripts/check_failure_receipts.py --candidate "$RUNNER_TEMP/m4-6-hosted-candidate.json" --results m4-6-hosted-results --needs "$RUNNER_TEMP/m4-6-hosted-needs.json"
