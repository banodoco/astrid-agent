name: R1FIX stopped-owner macOS diagnostic (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 100
    steps:
      - name: Execute capture and stage sanitized structured evidence
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, "r05-capture", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload sanitized capture and checksums
        if: always() && env.R05_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: r1fix-stopped-macos-${{ github.run_id }}
          path: ${{ env.R05_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
