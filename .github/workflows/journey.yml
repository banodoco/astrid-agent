name: Guarded exact R25 orphan stop (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 5
    steps:
      - name: Verify and stop only the exact previously observed R25 process tree
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          code = base64.b64decode("", validate=True)
          exec(compile(code, "guarded-r25-stop", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload action audit
        if: always() && env.R25_STOP_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: guarded-r25-stop-${{ github.run_id }}
          path: ${{ env.R25_STOP_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
