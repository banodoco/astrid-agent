name: MAC-UPDATE-04 guarded recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 20
    steps:
      - name: Stop the verified task service
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64, os, pathlib, pwd
          home=pathlib.Path(pwd.getpwuid(503).pw_dir)
          pyroot=home/'actions-runner/_work/_tool/Python/3.11.18/arm64';py=pyroot/'bin/python3.11'
          if os.getuid()!=503 or pyroot.is_symlink() or pyroot.resolve()!=pyroot or pyroot.stat().st_uid!=503 or not py.resolve().is_relative_to(pyroot) or py.stat().st_uid!=503:raise SystemExit('Runner Python identity not verified')
          source=base64.b64decode("",validate=True).decode()
          os.execv(str(py),[str(py),'-I','-c',source])
          PYCODE
      - name: Upload sanitized recovery audit
        id: upload
        if: always() && env.MAC04_STOP_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-update04-recovery-${{ github.run_id }}
          path: ${{ env.MAC04_STOP_UPLOAD }}
          if-no-files-found: error
      - name: Remove verified sandbox after audit upload
        if: always() && steps.upload.outcome == 'success' && env.MAC04_STOP_UPLOAD != ''
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64, os, pathlib, pwd
          home=pathlib.Path(pwd.getpwuid(503).pw_dir)
          pyroot=home/'actions-runner/_work/_tool/Python/3.11.18/arm64';py=pyroot/'bin/python3.11'
          if os.getuid()!=503 or pyroot.is_symlink() or pyroot.resolve()!=pyroot or pyroot.stat().st_uid!=503 or not py.resolve().is_relative_to(pyroot) or py.stat().st_uid!=503:raise SystemExit('Runner Python identity not verified')
          source=base64.b64decode("",validate=True).decode()
          os.execv(str(py),[str(py),'-I','-c',source])
          PYCODE
