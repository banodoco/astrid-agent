name: R1 macOS backup integrity diagnostic (manual)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select the exact Agent or Runtime task
        type: choice
        required: true
        options: [runtime]
concurrency:
  group: r1-mac-full-suites
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  full:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 360
    steps:
      - name: Clone pinned siblings and run the selected full default suite
        shell: bash
        working-directory: /
        env:
          R1_FULL_SUITE: ${{ inputs.suite }}
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, "r1-full-macos", "exec"), {"__name__": "__main__"})
          PYCODE
      - name: Upload sanitized output and checksums
        if: always() && env.R1_FULL_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: r1-full-${{ inputs.suite }}-${{ github.run_id }}
          path: ${{ env.R1_FULL_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
