name: macOS runner prerequisites (manual only)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Stage, verify after an idle service restart, or rollback
        type: choice
        required: true
        options: [diagnose, stage, verify, rollback]
permissions:
  contents: read
jobs:
  diagnose:
    if: inputs.phase == 'diagnose'
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 5
    steps:
      - name: Inspect runner service identity without changing it
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, plistlib, pwd, re, stat, subprocess
          from pathlib import Path
          try:
              if os.getuid() != 503 or os.environ.get("RUNNER_NAME") != "hannah-mac":
                  raise ValueError("Unexpected runner identity")
              home = Path(pwd.getpwuid(503).pw_dir)
              root = home / "actions-runner"
              service = root / ".service"
              st = service.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_uid != 503:
                  raise ValueError("Invalid runner service record")
              path = Path(service.read_text().strip())
              if path.parent != home / "Library/LaunchAgents" or path.suffix != ".plist":
                  raise ValueError("Unexpected runner service location")
              st = path.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_uid != 503:
                  raise ValueError("Invalid runner service plist")
              data = path.read_bytes()
              plist = plistlib.loads(data)
              label = plist.get("Label")
              if not isinstance(label, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+", label) or path.name != label + ".plist":
                  raise ValueError("Unexpected runner service label")
              args = plist.get("ProgramArguments", [])
              expected = str(root / "runsvc.sh")
              loaded = subprocess.run(["/bin/launchctl", "print", "gui/503/" + label], text=True, capture_output=True, timeout=15)
              print(json.dumps({"status": "observed", "label_sha256": hashlib.sha256(label.encode()).hexdigest(),
                  "plist_sha256": hashlib.sha256(data).hexdigest(), "expected_runner_command_in_plist": expected in args,
                  "launchctl_loaded": loaded.returncode == 0,
                  "expected_runner_command_in_loaded_service": expected in loaded.stdout,
                  "service_configured_run_at_load": plist.get("RunAtLoad"), "service_keep_alive": plist.get("KeepAlive")}))
          except Exception:
              print(json.dumps({"status": "refused", "reason": "Runner service identity could not be established"}))
              raise SystemExit(1)
          PY
  stage_or_rollback:
    if: inputs.phase == 'stage' || inputs.phase == 'rollback'
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 20
    steps:
      - name: Apply runner-owned prerequisite phase without restarting service
        shell: bash
        working-directory: /
        env:
          PREREQ_PHASE: ${{ inputs.phase }}
        run: |
          /usr/bin/python3 - "$PREREQ_PHASE" <<'PY'
          #!/usr/bin/env python3
          """Stage runner-owned Python/pwsh and service settings; never restart the runner."""
          import ctypes
          import errno
          import hashlib
          import json
          import os
          import posixpath
          import pwd
          import shutil
          import stat
          import subprocess
          import sys
          import tarfile
          from pathlib import Path
          
          UID = 503
          PY_VERSION = "3.11.18"
          PY_URL = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.11.18%2B20261026-aarch64-apple-darwin-install_only.tar.gz"
          PY_SHA = "cba3455e18516fbe8668cff2820c9b6a53447c552d612443c2b2fb60d390a908"
          PS_URL = "https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-osx-arm64.tar.gz"
          PS_SHA = "a1c7e98ac403da4be5ba75c1c5855af272de7787a91d478c4267466fe58fc1af"
          
          
          def real_dir(path):
              st = path.lstat()
              if not stat.S_ISDIR(st.st_mode) or st.st_uid != UID or path != path.resolve():
                  raise RuntimeError("Expected a runner-owned real directory")
          
          
          def owned_subdir(parent, name):
              real_dir(parent)
              path = parent / name
              if path.exists() or path.is_symlink():
                  real_dir(path)
              else:
                  path.mkdir(mode=0o700)
                  real_dir(path)
              return path
          
          
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def extract_safe(archive, dest):
              """Extract a checksum-verified archive with no external link or path targets."""
              with tarfile.open(str(archive), "r:gz") as tf:
                  members = tf.getmembers()
                  links = set()
                  normalized = []
                  for item in members:
                      if ".." in item.name.split("/"):
                          raise RuntimeError("Archive has an unsafe raw member path")
                      name = posixpath.normpath(item.name)
                      if name == "." and item.isdir():
                          continue
                      if name in ("", ".") or name.startswith("/") or name == ".." or name.startswith("../"):
                          raise RuntimeError("Archive has an unsafe member path")
                      if not (item.isfile() or item.isdir() or item.issym() or item.islnk()):
                          raise RuntimeError("Archive contains an unsupported entry")
                      normalized.append((name, item))
                      if item.issym() or item.islnk():
                          links.add(name)
                  for name, item in normalized:
                      components = name.split("/")
                      if any("/".join(components[:i]) in links for i in range(1, len(components))):
                          raise RuntimeError("Archive member traverses a link")
                      if item.issym() or item.islnk():
                          link = item.linkname
                          if link.startswith("/"):
                              raise RuntimeError("Archive has an absolute link")
                          base = posixpath.dirname(name) if item.issym() else ""
                          resolved = posixpath.normpath(posixpath.join(base, link))
                          if resolved == ".." or resolved.startswith("../"):
                              raise RuntimeError("Archive link escapes staging")
                          # Inspect every raw traversal component before collapsing '..'.
                          # A symlink in a later-cancelled component still changes its meaning.
                          stack = [part for part in base.split("/") if part and part != "."]
                          for part in link.split("/"):
                              if not part or part == ".":
                                  continue
                              if "/".join(stack) in links:
                                  raise RuntimeError("Archive link target traverses another link")
                              if part == "..":
                                  if not stack:
                                      raise RuntimeError("Archive link escapes staging")
                                  stack.pop()
                              else:
                                  stack.append(part)
                  tf.extractall(str(dest))
          
          
          
          def download(url, target, digest):
              subprocess.run(["/usr/bin/curl", "-q", "--proto", "=https", "--proto-redir", "=https",
                              "-fsSL", "--retry", "3", "--output", str(target), url],
                             env={"PATH": "/usr/bin:/bin", "HOME": str(target.parent)},
                             check=True, timeout=300, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if sha(target) != digest:
                  raise RuntimeError("Downloaded archive checksum differs")
          
          
          def read_owned(path):
              if not path.exists() and not path.is_symlink():
                  return None, None
              st = path.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_uid != UID:
                  raise RuntimeError("Runner settings file is not runner-owned")
              return path.read_bytes(), stat.S_IMODE(st.st_mode)
          
          
          def replace_owned(path, content, mode, tempdir):
              real_dir(tempdir)
              temporary = tempdir / "path.next"
              if temporary.exists() or temporary.is_symlink():
                  stale, _ = read_owned(temporary)
                  if stale is None:
                      raise RuntimeError("Unsafe interrupted settings file")
                  temporary.unlink()
              fd = os.open(str(temporary), os.O_WRONLY | os.O_CREAT | os.O_EXCL, mode)
              try:
                  os.fchmod(fd, mode)
                  with os.fdopen(fd, "wb") as stream:
                      stream.write(content)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(str(temporary), str(path))
              finally:
                  if temporary.exists(): temporary.unlink()
          
          
          def rename_exclusive(source, target):
              """Darwin atomic no-replace rename; fail closed when unavailable."""
              libc = ctypes.CDLL(None, use_errno=True)
              rename = getattr(libc, "renamex_np", None)
              if rename is None:
                  raise RuntimeError("Exclusive rename is unavailable")
              rename.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_uint]
              rename.restype = ctypes.c_int
              if rename(os.fsencode(str(source)), os.fsencode(str(target)), 4) != 0:
                  error = ctypes.get_errno()
                  raise OSError(error, os.strerror(error))
          
          
          def write_journal(path, journal):
              """Write and fsync a journal within its exclusively owned directory."""
              temp = path.with_name("journal.next")
              payload = (json.dumps(journal, sort_keys=True) + "\n").encode()
              fd = os.open(str(temp), os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, "wb") as out:
                  out.write(payload); out.flush(); os.fsync(out.fileno())
              os.replace(str(temp), str(path))
              dirfd = os.open(str(path.parent), os.O_RDONLY)
              try: os.fsync(dirfd)
              finally: os.close(dirfd)
          
          
          def publish_cache_marker(root, marker, run_id):
              marker_temp = root / "cache-marker.next"
              fd = os.open(str(marker_temp), os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
              with os.fdopen(fd, "w") as stream:
                  stream.write(run_id); stream.flush(); os.fsync(stream.fileno())
              rename_exclusive(marker_temp, marker)
          
          def stage(home, runner, toolcache, temp, run_id=None):
              run_id = run_id or os.urandom(16).hex()
              if shutil.disk_usage(home).free < 10_000_000_000:
                  raise RuntimeError("Insufficient disk for runner prerequisites")
              real_dir(home); real_dir(runner); real_dir(toolcache); real_dir(temp)
              if os.environ.get("RUNNER_TOOL_CACHE") != str(toolcache) or os.environ.get("RUNNER_TEMP") != str(temp):
                  raise RuntimeError("Runner tool cache or temp differs from expected work directory")
              root = home / ".astrid-runner-prereqs-v1"
              if root.exists() or root.is_symlink():
                  raise RuntimeError("Prerequisite journal already exists; inspect before retry")
              python_root = owned_subdir(toolcache, "Python")
              py_parent = owned_subdir(python_root, PY_VERSION)
              py_dest = py_parent / "arm64"
              marker = py_parent / "arm64.complete"
              if py_dest.exists() or py_dest.is_symlink() or marker.exists() or marker.is_symlink():
                  raise RuntimeError("Python cache entry already exists; refusing replacement")
              original_path, original_mode = read_owned(runner / ".path")
              if original_path is None: raise RuntimeError("Runner .path is absent")
              old_path = original_path.decode("utf-8").strip()
              ps_dest = root / "powershell-7.6.9"
              if not old_path or "\n" in old_path or str(ps_dest) in old_path.split(":"):
                  raise RuntimeError("Runner PATH is empty, invalid or already configured")
              new_path = (str(ps_dest) + ":" + old_path + "\n").encode("utf-8")
              preparing = root.with_name(root.name + ".preparing-" + run_id)
              preparing.mkdir(mode=0o700)
              backup = preparing / "path.backup"
              backup.write_bytes(original_path); backup.chmod(0o600)
              journal = {"schema": 1, "state": "staging", "run_id": run_id, "before": {"path": {
                             "exists": True, "mode": original_mode, "sha256": hashlib.sha256(original_path).hexdigest()}},
                         "new_sha256": {"path": hashlib.sha256(new_path).hexdigest()},
                         "python_source": "astral-python-build-standalone-20261026",
                         "python_version": PY_VERSION, "python_sha256": PY_SHA,
                         "powershell_version": "7.6.9", "powershell_sha256": PS_SHA}
              journal_path = preparing / "journal.json"
              write_journal(journal_path, journal)
              rename_exclusive(preparing, root)
              journal_path = root / "journal.json"
              archives = root / "staging"; archives.mkdir(mode=0o700)
              pyarchive = archives / "python.tar.gz"; psarchive = archives / "powershell.tar.gz"
              download(PY_URL, pyarchive, PY_SHA); download(PS_URL, psarchive, PS_SHA)
              pyextract = archives / "python-extract"; pyextract.mkdir(mode=0o700)
              psextract = archives / "powershell-extract"; psextract.mkdir(mode=0o700)
              extract_safe(pyarchive, pyextract); extract_safe(psarchive, psextract)
              py_src = pyextract / "python"; psbin = psextract / "pwsh"
              if not py_src.is_dir() or py_src.is_symlink() or not psbin.is_file() or psbin.is_symlink():
                  raise RuntimeError("Downloaded runtime layout is unexpected")
              psbin.chmod(psbin.stat().st_mode | stat.S_IXUSR)
              if subprocess.check_output([str(psbin), "-NoLogo", "-NoProfile", "-Command", "$PSVersionTable.PSVersion.ToString()"], text=True).strip() != "7.6.9":
                  raise RuntimeError("PowerShell version check failed")
              # Prepare ownership markers before the atomic exclusive move.
              def move_to_new_owned_dir(source, destination):
                  owner = source / ".astrid-prereq-owner"
                  fd = os.open(str(owner), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, "w") as f:
                      f.write(journal["run_id"]); f.flush(); os.fsync(f.fileno())
                  rename_exclusive(source, destination)
              move_to_new_owned_dir(py_src, py_dest)
              code = ("import json,platform,sqlite3,ssl,sys; print(json.dumps({"
                      "'version':platform.python_version(),'arch':platform.machine(),"
                      "'prefix':sys.prefix}))")
              info = json.loads(subprocess.check_output([str(py_dest / "bin/python"), "-I", "-c", code], text=True))
              if info != {"version": PY_VERSION, "arch": "arm64", "prefix": str(py_dest)}:
                  raise RuntimeError("Runner-owned standalone Python failed identity checks")
              move_to_new_owned_dir(psextract, ps_dest)
              publish_cache_marker(root, marker, journal["run_id"])
              current_path, current_mode = read_owned(runner / ".path")
              if current_path != original_path or current_mode != original_mode:
                  raise RuntimeError("Runner PATH changed during staging")
              replace_owned(runner / ".path", new_path, original_mode, root)
              journal["state"] = "pending-restart"
              write_journal(journal_path, journal)
              print(json.dumps({"status": "pending-restart", "python_version": PY_VERSION,
                                "python_provenance": journal["python_source"], "powershell_version": "7.6.9",
                                "tool_cache_writable": os.access(str(toolcache), os.W_OK),
                                "runner_temp_writable": os.access(str(temp), os.W_OK)}))
          
          
          def rollback(home, runner, toolcache):
              """Restore unchanged settings and remove only journalled owned tools."""
              real_dir(home); real_dir(runner); real_dir(toolcache)
              root = home / ".astrid-runner-prereqs-v1"; real_dir(root)
              journal_path = root / "journal.json"
              journal_data, _ = read_owned(journal_path)
              if journal_data is None: raise RuntimeError("Prerequisite journal is absent")
              journal = json.loads(journal_data)
              if journal.get("schema") != 1 or journal.get("state") not in {"staging", "pending-restart", "rollback-in-progress"}:
                  raise RuntimeError("Prerequisite journal is not rollback-ready")
              run_id = journal.get("run_id")
              if not isinstance(run_id, str) or len(run_id) != 32 or any(c not in "0123456789abcdef" for c in run_id):
                  raise RuntimeError("Prerequisite journal identity is invalid")
              before = journal["before"]["path"]
              backup, _ = read_owned(root / "path.backup")
              if backup is None or hashlib.sha256(backup).hexdigest() != before["sha256"]:
                  raise RuntimeError("Runner settings backup is missing or changed")
              current, mode = read_owned(runner / ".path")
              if (current is None or mode != before["mode"] or hashlib.sha256(current).hexdigest()
                      not in {before["sha256"], journal["new_sha256"]["path"]}):
                  raise RuntimeError("Runner settings changed since staging; refusing rollback")
              py = toolcache / "Python" / PY_VERSION / "arm64"
              marker = py.parent / "arm64.complete"
              ps = root / "powershell-7.6.9"
              paths = {"python": py, "powershell": ps}
              quarantine = {key: path.parent / (".astrid-rollback-" + run_id + "-" + key)
                            for key, path in paths.items()}
              if marker.exists() or marker.is_symlink():
                  marker_data, _ = read_owned(marker)
                  if marker_data is None or marker_data.decode("ascii") != run_id:
                      raise RuntimeError("Cache marker is invalid")
              if not shutil.rmtree.avoids_symlink_attacks:
                  raise RuntimeError("Safe directory removal is unavailable")
              if journal["state"] != "rollback-in-progress":
                  identities = {}
                  for key, directory in paths.items():
                      if quarantine[key].exists() or quarantine[key].is_symlink():
                          raise RuntimeError("Rollback quarantine unexpectedly exists")
                      if directory.exists() or directory.is_symlink():
                          real_dir(directory)
                          owner, _ = read_owned(directory / ".astrid-prereq-owner")
                          if owner is None or owner.decode("ascii") != run_id:
                              raise RuntimeError("Prerequisite owner marker is missing or changed")
                          st = directory.stat()
                          identities[key] = [st.st_dev, st.st_ino]
                      else:
                          identities[key] = None
                  journal["rollback_dirs"] = identities
                  journal["state"] = "rollback-in-progress"
                  write_journal(journal_path, journal)
              identities = journal.get("rollback_dirs")
              if not isinstance(identities, dict) or set(identities) != set(paths):
                  raise RuntimeError("Rollback identities are missing")
              for key, original in paths.items():
                  renamed = quarantine[key]
                  a = original.exists() or original.is_symlink()
                  b = renamed.exists() or renamed.is_symlink()
                  if a and b:
                      raise RuntimeError("Both original and quarantine exist")
                  if not (a or b):
                      continue
                  directory = original if a else renamed
                  real_dir(directory)
                  st = directory.stat()
                  if identities[key] != [st.st_dev, st.st_ino]:
                      raise RuntimeError("Rollback directory identity changed")
                  if a:
                      owner, _ = read_owned(original / ".astrid-prereq-owner")
                      if owner is None or owner.decode("ascii") != run_id:
                          raise RuntimeError("Original prerequisite owner marker changed")
                  result = subprocess.run(["/usr/sbin/lsof", "-n", "+D", str(directory)], capture_output=True,
                                          text=True, timeout=60, check=False)
                  if result.returncode != 1 or result.stdout.strip() or result.stderr.strip():
                      raise RuntimeError("A prerequisite is in use or cannot be checked")
              if current != backup:
                  replace_owned(runner / ".path", backup, before["mode"], root)
              if marker.exists(): marker.unlink()
              for key, original in paths.items():
                  renamed = quarantine[key]
                  if original.exists(): rename_exclusive(original, renamed)
                  if renamed.exists(): shutil.rmtree(str(renamed))
              journal["state"] = "rolled-back-restart-required"
              write_journal(journal_path, journal)
              print(json.dumps({"status": "rolled-back-restart-required"}))
          
          
          def main():
              if os.getuid() != UID or os.environ.get("RUNNER_NAME") != "hannah-mac":
                  raise RuntimeError("Wrong runner identity")
              home = Path(pwd.getpwuid(UID).pw_dir)
              runner = home / "actions-runner"
              if sys.argv[1:] == ["stage"]:
                  token = os.urandom(16).hex()
                  try:
                      stage(home, runner, runner / "_work/_tool", runner / "_work/_temp", token)
                  except Exception:
                      journal_path = home / ".astrid-runner-prereqs-v1/journal.json"
                      try:
                          raw, _ = read_owned(journal_path)
                          if raw and json.loads(raw).get("run_id") == token:
                              rollback(home, runner, runner / "_work/_tool")
                      except Exception:
                          print(json.dumps({"status": "automatic-rollback-failed", "reason": "Manual review of runner-owned journal required"}))
                      raise
              elif sys.argv[1:] == ["rollback"]:
                  rollback(home, runner, runner / "_work/_tool")
              else:
                  raise RuntimeError("Expected stage or rollback")
          
          
          if __name__ == "__main__":
              try: main()
              except Exception:
                  print(json.dumps({"status": "failed", "reason": "Operation refused or failed; inspect runner-owned journal before retry"}))
                  raise SystemExit(1)
          PY
  verify:
    if: inputs.phase == 'verify'
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 10
    steps:
      - name: Verify restarted service paths and PowerShell
        shell: bash
        working-directory: /
        run: |
          set -euo pipefail
          test "$(id -u)" = 503
          test "$RUNNER_TOOL_CACHE" = "$HOME/actions-runner/_work/_tool"
          test "$RUNNER_TEMP" = "$HOME/actions-runner/_work/_temp"
          test -w "$RUNNER_TOOL_CACHE"
          test -w "$RUNNER_TEMP"
          test "$(command -v pwsh)" = "$HOME/.astrid-runner-prereqs-v1/powershell-7.6.9/pwsh"
          test "$(pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" = 7.6.9
          id
          printf 'HOME=%s\n' "$HOME"
          printf 'macOS=%s architecture=%s\n' "$(sw_vers -productVersion)" "$(uname -m)"
          command -v pwsh
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          echo 'Runner tool cache and temporary directory are writable'
      - name: Verify real setup-python action against preseeded cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          check-latest: false
      - name: Verify selected runner-owned standalone Python
        shell: bash
        working-directory: /
        run: |
          python -I -c 'import os,platform,sqlite3,ssl,sys; assert platform.python_version()=="3.11.18"; assert platform.machine()=="arm64"; assert os.path.realpath(sys.prefix)==os.path.realpath(os.path.join(os.environ["RUNNER_TOOL_CACHE"],"Python","3.11.18","arm64")); print("Python 3.11.18 runner-owned standalone cache: PASS")'
