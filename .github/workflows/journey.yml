name: MAC-UPDATE-01 guarded recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, macOS, astrid-mac]
    timeout-minutes: 20
    steps:
      - name: Stop only the verified task-owned service
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, 'mac-update-recovery', 'exec'), {'__name__':'__main__'})
          PYCODE
      - name: Upload recovery audit
        id: upload
        if: always() && env.MAC_STOP_UPLOAD != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-recovery-${{ github.run_id }}
          path: ${{ env.MAC_STOP_UPLOAD }}
          if-no-files-found: error
      - name: Remove verified task sandbox after audit upload
        if: always() && steps.upload.outcome == 'success' && env.MAC_STOP_UPLOAD != ''
        shell: bash
        working-directory: /
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import base64
          source = base64.b64decode("", validate=True)
          exec(compile(source, 'mac-update-recovery-cleanup', 'exec'), {'__name__':'__main__'})
          PYCODE
