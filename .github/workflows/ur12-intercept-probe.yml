name: UR-12 hosted update intercept probe

# Probe only.  Answers whether a runner can map astrid.haus to a local HTTPS
# server using a certificate only that runner trusts.  Changes no existing
# workflow and no product code; holds no secret.
on:
  workflow_dispatch:
  push:
    branches: [ur-12-stand-in-probe]

permissions:
  contents: read

jobs:
  probe:
    name: Intercept probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - name: Probe (POSIX, root for hosts file, port 443 and trust store)
        if: runner.os != 'Windows'
        shell: bash
        run: sudo -E "$(command -v python)" scripts/ci_hosted_update_intercept_probe.py | tee probe-result.json
      - name: Probe (Windows, runner is Administrator)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/ci_hosted_update_intercept_probe.py | Tee-Object probe-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ur12-probe-${{ runner.os }}
          path: probe-result.json
