name: Windows schema ACL controls

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-schema-acl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-schema-acl:
    name: Windows schema ACL controls
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the dispatched Agent commit
        uses: actions/checkout@v4

      - name: Record the checked-out Agent commit
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          "Agent: $head" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Agent test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install the pinned Runtime and client
        run: python scripts/ci_install_runtime.py

      - name: Run the exact Windows schema ACL selectors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest -q -rA `
            --junitxml=test-results/windows-schema-acl.xml `
            'tests/core/rendering/test_local_schema.py::test_windows_native_schema_path_acl_controls' `
            'tests/core/rendering/test_local_schema.py::test_windows_native_schema_dacl_allows_privileged_and_rejects_foreign'

      - name: Upload Windows schema ACL JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-schema-acl-junit
          retention-days: 30
          path: test-results/windows-schema-acl.xml
          if-no-files-found: error
