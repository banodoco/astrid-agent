name: Windows task host journey

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Optional full 40-character banodoco/astrid-app commit SHA; defaults to main
        required: false
        type: string
  push:
    # Existing supported branches remain: branches: [main, release-1, "windows/**"]
    branches: [main, release-1, int/r1, "windows/**", "venue/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-journey:
    name: Windows task host journey (${{ matrix.installer-shell }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        installer-shell: [powershell.exe, pwsh.exe]
    steps:
      - name: Check out this Agent commit
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/heads/venue/') && '3693e6c8b5bb9c83588f1e65d1dc8495f6145f84' || github.sha }}

      - name: Resolve App ref
        id: app-ref
        shell: pwsh
        env:
          INPUT_APP_REF: ${{ inputs.app_ref || (startsWith(github.ref, 'refs/heads/venue/') && '9d3ccda1e81383082258943207745086da2aabe4') || '' }}
        run: |
          $appRef = if ([string]::IsNullOrWhiteSpace($env:INPUT_APP_REF)) { "main" } else { $env:INPUT_APP_REF.Trim() }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_APP_REF) -and $appRef -notmatch '^[0-9a-fA-F]{40}$') {
            throw "app_ref must be a full 40-character commit SHA (or empty for main)"
          }
          "ref=$appRef" >> $env:GITHUB_OUTPUT

      - name: Set up the journey driver (not the installed Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the pinned Runtime commit from the Agent lock
        id: runtime-ref
        shell: pwsh
        run: |
          $lock = Get-Content runtime.lock.json -Raw | ConvertFrom-Json
          $runtimeRef = $lock.source_commit
          if ($runtimeRef -notmatch '^[0-9a-f]{40}$') {
            throw "runtime.lock.json source_commit is not a full commit SHA"
          }
          "ref=$runtimeRef" >> $env:GITHUB_OUTPUT

      - name: Check out the selected Runtime
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-ref.outputs.ref }}
          path: journey-runtime

      - name: Check out the selected App installer
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: journey-app

      - name: Record checked-out refs
        shell: pwsh
        run: |
          $agentRef = git rev-parse HEAD
          $runtimeRef = git -C journey-runtime rev-parse HEAD
          $appRef = git -C journey-app rev-parse HEAD
          @(
            "## Effective checked-out refs"
            "- Agent: $agentRef"
            "- Runtime: $runtimeRef"
            "- App: $appRef"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install py-spy in the journey driver environment
        run: python -m pip install py-spy==0.4.2

      - name: Install with the real App install.ps1 / ${{ matrix.installer-shell }}
        id: install
        run: python -u scripts/ci_windows_journey.py install --installer-shell ${{ matrix.installer-shell }}

      - name: Start Runtime through its installed Scheduled Task
        id: start
        run: python -u scripts/ci_windows_journey.py start

      - name: Wait for health on 127.0.0.1:17340
        id: health
        run: python -u scripts/ci_windows_journey.py health

      - name: Wait for pack-host running and its ready file
        id: host
        run: python -u scripts/ci_windows_journey.py host

      - name: Run an installed-profile SDK invocation through settlement
        id: task
        run: python -u scripts/ci_windows_journey.py task

      - name: Disable Scheduled Task restarts and run Runtime down
        id: down
        if: always()
        run: python -u scripts/ci_windows_journey.py down

      - name: Verify no Astrid or Runtime processes remain
        id: stopped
        if: always()
        run: python -u scripts/ci_windows_journey.py stopped

      - name: Collect install logs, Runtime logs, health and process lists
        id: collect
        if: always()
        run: python -u scripts/ci_windows_journey.py collect

      # The driver predates the canonical journey-result.json contract.  Keep
      # it untouched and export this small adapter after cleanup: the receipt
      # binds the checked-out App/Agent/Runtime tuple, manifest and bootstrap
      # hashes to the raw X5 evidence and the inner command outcomes.
      - name: Export canonical Windows task-host receipt
        id: receipt
        if: always()
        shell: pwsh
        env:
          STEP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          STEP_INSTALL_CONCLUSION: ${{ steps.install.conclusion }}
          STEP_START_OUTCOME: ${{ steps.start.outcome }}
          STEP_START_CONCLUSION: ${{ steps.start.conclusion }}
          STEP_HEALTH_OUTCOME: ${{ steps.health.outcome }}
          STEP_HEALTH_CONCLUSION: ${{ steps.health.conclusion }}
          STEP_HOST_OUTCOME: ${{ steps.host.outcome }}
          STEP_HOST_CONCLUSION: ${{ steps.host.conclusion }}
          STEP_TASK_OUTCOME: ${{ steps.task.outcome }}
          STEP_TASK_CONCLUSION: ${{ steps.task.conclusion }}
          STEP_DOWN_OUTCOME: ${{ steps.down.outcome }}
          STEP_DOWN_CONCLUSION: ${{ steps.down.conclusion }}
          STEP_STOPPED_OUTCOME: ${{ steps.stopped.outcome }}
          STEP_STOPPED_CONCLUSION: ${{ steps.stopped.conclusion }}
          STEP_COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          STEP_COLLECT_CONCLUSION: ${{ steps.collect.conclusion }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "X5-windows-journey"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          function Git-Sha([string] $directory) {
            try {
              $value = (& git -C $directory rev-parse HEAD 2>$null).Trim().ToLowerInvariant()
              if ($value -match '^[0-9a-f]{40}$') { return $value }
            } catch {}
            return $null
          }
          function File-Sha256([string] $path) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { return $null }
            return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $app = Join-Path $env:GITHUB_WORKSPACE "journey-app"
          $runtime = Join-Path $env:GITHUB_WORKSPACE "journey-runtime"
          $manifestPath = Join-Path $app "public/install-manifest.json"
          $artifacts = [ordered]@{}
          foreach ($relative in @("public/install", "public/install.sh", "public/install.ps1")) {
            $artifacts[$relative] = File-Sha256 (Join-Path $app $relative)
          }

          # ci_windows_journey verifies this manifest during install but does
          # not retain the installed copy.  Export it here without changing
          # the driver so the receipt can prove installed source identity.
          try {
            $programRoot = Join-Path $env:LOCALAPPDATA "Astrid"
            $current = (Get-Content -LiteralPath (Join-Path $programRoot "current") -Raw).Trim()
            $installedManifest = Join-Path (Join-Path (Join-Path $programRoot "versions") $current) "manifest.json"
            if (Test-Path -LiteralPath $installedManifest -PathType Leaf) {
              Copy-Item -LiteralPath $installedManifest -Destination (Join-Path $evidence "installed-manifest.json") -Force
            }
          } catch {}

          $steps = [ordered]@{
            install = @{ command = "python -u scripts/ci_windows_journey.py install --installer-shell ${{ matrix.installer-shell }}"; outcome = $env:STEP_INSTALL_OUTCOME; conclusion = $env:STEP_INSTALL_CONCLUSION }
            start = @{ command = "python -u scripts/ci_windows_journey.py start"; outcome = $env:STEP_START_OUTCOME; conclusion = $env:STEP_START_CONCLUSION }
            health = @{ command = "python -u scripts/ci_windows_journey.py health"; outcome = $env:STEP_HEALTH_OUTCOME; conclusion = $env:STEP_HEALTH_CONCLUSION }
            host = @{ command = "python -u scripts/ci_windows_journey.py host"; outcome = $env:STEP_HOST_OUTCOME; conclusion = $env:STEP_HOST_CONCLUSION }
            task = @{ command = "python -u scripts/ci_windows_journey.py task"; outcome = $env:STEP_TASK_OUTCOME; conclusion = $env:STEP_TASK_CONCLUSION }
            down = @{ command = "python -u scripts/ci_windows_journey.py down"; outcome = $env:STEP_DOWN_OUTCOME; conclusion = $env:STEP_DOWN_CONCLUSION }
            stopped = @{ command = "python -u scripts/ci_windows_journey.py stopped"; outcome = $env:STEP_STOPPED_OUTCOME; conclusion = $env:STEP_STOPPED_CONCLUSION }
            collect = @{ command = "python -u scripts/ci_windows_journey.py collect"; outcome = $env:STEP_COLLECT_OUTCOME; conclusion = $env:STEP_COLLECT_CONCLUSION }
          }
          $allPassed = -not (@($steps.Values | ForEach-Object {
            $_.outcome -ne "success" -or $_.conclusion -ne "success"
          }) -contains $true)
          try {
            $os = Get-CimInstance Win32_OperatingSystem
            $osBuild = "Windows-$($os.Version)-$($os.BuildNumber)"
          } catch {
            $osBuild = "Windows-unavailable"
          }

          $requiredEvidence = @(
            "install-manifest.json", "installed-manifest.json", "sources.json", "bootstrap.log",
            "start.log", "health.json", "pack-host-ready.json", "processes-host-ready.json",
            "installed-profile-binding-summary.json", "sdk-invocation.json", "task-settled.json",
            "disable-scheduled-task.log", "down.json", "processes-after-down.json", "collection.json"
          )
          $evidenceRoot = [IO.Path]::GetFullPath($evidence).TrimEnd([char[]]"\\/")
          $evidenceFiles = @(
            Get-ChildItem -LiteralPath $evidence -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne "journey-result.json" } |
              Sort-Object FullName |
              ForEach-Object {
                $relative = $_.FullName.Substring($evidenceRoot.Length).TrimStart([char[]]"\\/") -replace "\\", "/"
                @{ path = $relative; sha256 = (File-Sha256 $_.FullName); bytes = [int64]$_.Length }
              }
          )
          $receipt = [ordered]@{
            schema_version = 1
            receipt_kind = "windows-task-host-journey"
            scenario = "windows-task-host"
            status = if ($allPassed) { "pass" } else { "fail" }
            evidence_class = "hosted-installed-task-host"
            source_override_test_mode = $false
            shell = "${{ matrix.installer-shell }}"
            runner_selector = "windows-latest"
            runner_provenance = @{ RUNNER_OS = $env:RUNNER_OS; ImageOS = $env:ImageOS; ImageVersion = $env:ImageVersion }
            os_build = $osBuild
            workflow = @{
              repository = $env:GITHUB_REPOSITORY; commit = $env:GITHUB_SHA; workflow_sha = $env:GITHUB_WORKFLOW_SHA
              workflow_ref = $env:GITHUB_WORKFLOW_REF; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            }
            candidate = @{
              app = Git-Sha $app; agent = Git-Sha $env:GITHUB_WORKSPACE; runtime = Git-Sha $runtime
              manifest_sha256 = File-Sha256 $manifestPath; artifacts = $artifacts
            }
            inner_steps = $steps
            coverage = @{ journey = "windows-task-host"; platform = "windows"; installer_shell = "${{ matrix.installer-shell }}"; required_evidence = $requiredEvidence }
            limitations = @(
              "Hosted Windows runner evidence only; this receipt does not claim Windows client coverage.",
              "This task-host journey does not exercise Pinokio lifecycle ownership."
            )
            evidence_files = $evidenceFiles
          }
          $receipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $evidence "journey-result.json") -Encoding utf8

      - name: Upload Windows task host journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: Windows-task-host-journey-${{ matrix.installer-shell }}
          path: ${{ runner.temp }}/X5-windows-journey/
          if-no-files-found: error

  publish-venue-results:
    name: Publish venue results
    if: ${{ always() && startsWith(github.ref, 'refs/heads/venue/') }}
    needs: [windows-journey]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow commit
        uses: actions/checkout@v4
      - name: Download matrix evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: Windows-task-host-journey-*
          path: ${{ runner.temp }}/venue-evidence/artifacts
      - name: Capture Actions identities and completed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          MATRIX_RESULT: ${{ needs.windows-journey.result }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/venue-evidence/api" "$RUNNER_TEMP/venue-evidence/logs"
          python3 - <<'PYTHON'
          import json, os, pathlib, urllib.error, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'venue-evidence'
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          run = os.environ['GITHUB_RUN_ID']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          errors = []
          def fetch(path, dest):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=90) as response:
                      data = response.read()
                  dest.write_bytes(data)
                  return data
              except Exception as exc:
                  errors.append({'path': path, 'error': str(exc)})
                  return None
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          jobs = fetch(f'/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100', root / 'api/jobs.json')
          fetch(f'/actions/runs/{run}/artifacts?per_page=100', root / 'api/artifacts.json')
          fetch(f'/actions/runs/{run}', root / 'api/run.json')
          if jobs:
              for job in json.loads(jobs).get('jobs', []):
                  if job.get('name', '').startswith('Windows task host journey ('):
                      fetch(f"/actions/jobs/{job['id']}/logs", root / 'logs' / f"job-{job['id']}.log")
          (root / 'api/publisher.json').write_text(json.dumps({'matrix_result': os.environ['MATRIX_RESULT'], 'download_outcome': os.environ['DOWNLOAD_OUTCOME'], 'errors': errors}, indent=2) + '\n')
          PYTHON
      - name: Commit checksummed evidence to results branch
        shell: bash
        run: |
          set -euo pipefail
          result_branch="venue-results/M-VENUE-V-10-WINDOWS-SIGNAL-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result_path="runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan "$result_branch"
          mkdir -p "$result_path"
          cp -a "$RUNNER_TEMP/venue-evidence/." "$result_path/"
          (cd "$result_path" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          git add "$result_path"
          git commit -m "Retain Windows task-host evidence for run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$result_branch"
          echo "Results branch: $result_branch" >> "$GITHUB_STEP_SUMMARY"
