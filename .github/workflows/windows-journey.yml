name: Windows task host journey

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      app_ref:
        description: Optional full 40-character banodoco/astrid-app commit SHA; defaults to main
        required: false
        type: string
  push:
    branches: [main, release-1, "windows/**", "release/*/main", "release/*/plan-*"]
  pull_request:
    branches: [main, "release/*/main", "release/*/plan-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

permissions:
  contents: read

jobs:
  windows-journey:
    name: Windows task host journey (${{ matrix.installer-shell }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        installer-shell: [powershell.exe, pwsh.exe]
    env:
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
    steps:
      - name: Check out this Agent commit
        uses: actions/checkout@v4

      - name: Resolve App ref
        id: app-ref
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-01 --shell pwsh "{0}"
        env:
          INPUT_APP_REF: ${{ inputs.app_ref }}
        run: |
          $appRef = if ([string]::IsNullOrWhiteSpace($env:INPUT_APP_REF)) { "main" } else { $env:INPUT_APP_REF.Trim() }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_APP_REF) -and $appRef -notmatch '^[0-9a-fA-F]{40}$') {
            throw "app_ref must be a full 40-character commit SHA (or empty for main)"
          }
          "ref=$appRef" >> $env:GITHUB_OUTPUT

      - name: Set up the journey driver (not the installed Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the pinned Runtime commit from the Agent lock
        id: runtime-ref
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-03 --shell pwsh "{0}"
        run: |
          $lock = Get-Content runtime.lock.json -Raw | ConvertFrom-Json
          $runtimeRef = $lock.source_commit
          if ($runtimeRef -notmatch '^[0-9a-f]{40}$') {
            throw "runtime.lock.json source_commit is not a full commit SHA"
          }
          "ref=$runtimeRef" >> $env:GITHUB_OUTPUT

      - name: Check out the selected Runtime
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-ref.outputs.ref }}
          path: journey-runtime

      - name: Check out the selected App installer
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: journey-app

      - name: Record checked-out refs
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell pwsh "{0}"
        run: |
          $agentRef = git rev-parse HEAD
          $runtimeRef = git -C journey-runtime rev-parse HEAD
          $appRef = git -C journey-app rev-parse HEAD
          @(
            "## Effective checked-out refs"
            "- Agent: $agentRef"
            "- Runtime: $runtimeRef"
            "- App: $appRef"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install py-spy in the journey driver environment
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-07 --shell pwsh "{0}"
        run: python -m pip install py-spy==0.4.2

      - name: Install with the real App install.ps1 / ${{ matrix.installer-shell }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-08 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py install --installer-shell ${{ matrix.installer-shell }}

      - name: Start Runtime through its installed Scheduled Task
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-09 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py start

      - name: Wait for health on 127.0.0.1:17340
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-10 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py health

      - name: Wait for pack-host running and its ready file
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-11 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py host

      - name: Run an installed-profile SDK invocation through settlement
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-12 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py task

      - name: Disable Scheduled Task restarts and run Runtime down
        if: always()
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-13 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py down

      - name: Verify no Astrid or Runtime processes remain
        if: always()
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-14 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py stopped

      - name: Collect install logs, Runtime logs, health and process lists
        if: always()
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-15 --shell pwsh "{0}"
        run: python -u scripts/ci_windows_journey.py collect

      - name: Upload Windows task host journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          name: Windows-task-host-journey-${{ matrix.installer-shell }}
          path: ${{ runner.temp }}/X5-windows-journey/
          if-no-files-found: error
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error
