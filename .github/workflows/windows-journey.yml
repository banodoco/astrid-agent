name: Windows task host journey

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Optional full 40-character banodoco/astrid-app commit SHA; defaults to main
        required: false
        type: string
  push:
    branches: [main, release-1, "int/**"]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Windows task host journey / Select affected paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      typescript: ${{ steps.paths.outputs.typescript }}
      appui: ${{ steps.paths.outputs.appui }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            // An absent output means run everything. Never trust a partial file list.
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number});
            const count = pr.data.changed_files;
            if (!Number.isInteger(count) || count < 1 || count >= 3000) return;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number, per_page: 100});
            if (files.length !== count || files.some(f =>
              !['added', 'modified'].includes(f.status) || typeof f.filename !== 'string')) return;
            const paths = files.map(f => f.filename);
            core.setOutput('docs', String(paths.every(p =>
              p === 'README.md' || /^docs\/.*\.md$/i.test(p))));
            core.setOutput('typescript', String(paths.every(p => p.startsWith('packages/typescript/'))));
            core.setOutput('appui', String(paths.every(p =>
              p.startsWith('src/features/') || p.startsWith('src/pages/'))));
  windows-journey:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    name: Windows task host journey (${{ matrix.installer-shell }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        installer-shell: [powershell.exe, pwsh.exe]
    steps:
      - name: Check out this Agent commit
        uses: actions/checkout@v4

      - name: Resolve App ref
        id: app-ref
        shell: pwsh
        env:
          INPUT_APP_REF: ${{ inputs.app_ref }}
        run: |
          $appRef = if ([string]::IsNullOrWhiteSpace($env:INPUT_APP_REF)) { "main" } else { $env:INPUT_APP_REF.Trim() }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_APP_REF) -and $appRef -notmatch '^[0-9a-fA-F]{40}$') {
            throw "app_ref must be a full 40-character commit SHA (or empty for main)"
          }
          "ref=$appRef" >> $env:GITHUB_OUTPUT

      - name: Set up the journey driver (not the installed Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the pinned Runtime commit from the Agent lock
        id: runtime-ref
        shell: pwsh
        run: |
          $lock = Get-Content runtime.lock.json -Raw | ConvertFrom-Json
          $runtimeRef = $lock.source_commit
          if ($runtimeRef -notmatch '^[0-9a-f]{40}$') {
            throw "runtime.lock.json source_commit is not a full commit SHA"
          }
          "ref=$runtimeRef" >> $env:GITHUB_OUTPUT

      - name: Check out the selected Runtime
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.runtime-ref.outputs.ref }}
          path: journey-runtime

      - name: Check out the selected App installer
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: ${{ steps.app-ref.outputs.ref }}
          path: journey-app

      - name: Record checked-out refs
        shell: pwsh
        run: |
          $agentRef = git rev-parse HEAD
          $runtimeRef = git -C journey-runtime rev-parse HEAD
          $appRef = git -C journey-app rev-parse HEAD
          @(
            "## Effective checked-out refs"
            "- Agent: $agentRef"
            "- Runtime: $runtimeRef"
            "- App: $appRef"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install py-spy in the journey driver environment
        run: python -m pip install py-spy==0.4.2

      - name: Install with the real App install.ps1 / ${{ matrix.installer-shell }}
        run: python -u scripts/ci_windows_journey.py install --installer-shell ${{ matrix.installer-shell }}

      - name: Start Runtime through its installed Scheduled Task
        run: python -u scripts/ci_windows_journey.py start

      - name: Wait for health on 127.0.0.1:17340
        run: python -u scripts/ci_windows_journey.py health

      - name: Wait for pack-host running and its ready file
        run: python -u scripts/ci_windows_journey.py host

      - name: Run an installed-profile SDK invocation through settlement
        run: python -u scripts/ci_windows_journey.py task

      - name: Disable Scheduled Task restarts and run Runtime down
        if: always()
        run: python -u scripts/ci_windows_journey.py down

      - name: Verify no Astrid or Runtime processes remain
        if: always()
        run: python -u scripts/ci_windows_journey.py stopped

      - name: Collect install logs, Runtime logs, health and process lists
        if: always()
        run: python -u scripts/ci_windows_journey.py collect

      - name: Upload Windows task host journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-task-host-journey-${{ matrix.installer-shell }}
          path: ${{ runner.temp }}/X5-windows-journey/
          if-no-files-found: error

  pr-gate:
    name: Windows task host journey / PR aggregate
    if: ${{ always() }}
    needs: [changes, windows-journey]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes'].get('outputs', {})
          is_pr = os.environ['EVENT'] == 'pull_request'
          classes = {'windows-journey': ''}
          for job, special in classes.items():
              skipped = is_pr and (outputs.get('docs') == 'true' or
                                    (special and outputs.get(special) == 'true'))
              expected = 'skipped' if skipped else 'success'
              result = needs[job]['result']
              if result != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {result}")
          PYCODE
