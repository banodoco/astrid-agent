[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "astrid"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "A harness toolkit for agents and humans to make art"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.55,<3",
    "scenedetect[opencv-headless]==0.6.4",
    "anthropic>=0.40.0",
    "google-genai>=1.15.0",
    "filelock>=3.13",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "referencing>=0.30",
    "pillow>=12.2,<13",
    "python-dotenv>=1.0",
    "fal-client>=0.7.0",
    "xxhash>=3.4",
    "PyJWT[crypto]>=2.8",
    # VibeComfy is installed with --no-deps by the managed installer.
    "huggingface_hub[hf_xet]>=0.32.0",
    # pyannote.audio is intentionally excluded from core metadata.
    # It is an optional/heavy dependency; install separately if needed.
    # "pyannote.audio==3.3.2",
    #
    # Keep runpod-lifecycle optional for runtime installs; its test dependency is
    # pinned from upstream in the dev extra below.
    # "runpod-lifecycle>=0.3.1.dev0,<0.4",
]

[project.scripts]
# ``astrid-tools`` is the direct Astrid product gateway.  Keep ``python -m astrid``
# as the package gateway, while the shorter ``astrid`` command opens the
# named Astrid OMP agent (see ``astrid.omp_agent``).
astrid-tools = "astrid.core.gateway:main"
astrid = "astrid.console:main"
astrid-credential = "astrid.core.util.credential_store:main"
astrid-with-credential = "astrid.core.util.credential_exec:main"
astrid-upgrade = "astrid.sdk.upgrade:main"
build-h3-release = "astrid.packs.runpod.h3_release:main"

[project.optional-dependencies]
dev = [
    "fonttools[woff]>=4.0",
    # tests/test_wan2gp_lifecycle.py canonicalizes generated MP4 metadata with mutagen.
    "mutagen>=1.47",
    # The RunPod claim script is exercised by unit and Darwin CI tests. Pin
    # the lifecycle implementation because it is not published on PyPI.
    "runpod-lifecycle @ git+https://github.com/banodoco/runpod-lifecycle.git@db79345536985c701b7aff2eb5eec36667aae204",
    "mypy==1.17.0",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-split==0.11.0",
    # The runtime keeps the canonical Banodoco schema optional, but the full
    # development/CI suite must exercise timeline validation against one exact
    # compatible contract instead of an ambient sibling checkout or an older
    # transitive Remotion copy.
    "banodoco-timeline-schema @ git+https://github.com/banodoco/astrid-agent.git@242f9c4306bf3b501222cb041a9eb246ef47bc85#subdirectory=packages/timeline-schema/python",
    # Default per-test timeout for the whole suite (see [tool.pytest.ini_options]
    # timeout/timeout_method below). Converts ANY hanging test into a fast,
    # diagnosable failure with a thread stack dump, so a single wedged test can
    # never wedge the suite for callers (CI, the megaplan baseline capture,
    # humans). This is the architectural guard against the "hung suite" class.
    "pytest-timeout>=2.4",
    # QUIC provider fixtures use the maintained aioquic implementation to
    # prove a real handshake; UDP-shaped payloads are not sufficient evidence.
    "aioquic>=1.2,<2",
    "ruff==0.12.0",
    "build==1.4.0",
    # Offline wheel resource tests use the release build backend directly.
    "setuptools==80.9.0",
    "wheel==0.46.3",
]

# Runtime installs need a configured package index or local wheelhouse because
# runpod-lifecycle is not published on public PyPI.
# Install: pip install 'astrid[runpod]'
runpod = [
    "runpod-lifecycle>=0.3.1.dev0,<0.4",
]

[tool.setuptools]
# Only the package-data patterns below are release inputs.  In particular,
# do not let setuptools' VCS/egg-info package-data defaults pull authoring
# files from namespace-like directories such as packs/*/golden or packs/*/tests.
include-package-data = false

[tool.setuptools.packages.find]
include = ["astrid*", "astrid_runtime_client*"]
exclude = [
    # Tests are not part of the installed product.  Keeping this exclusion
    # explicit prevents a future in-tree pack test package from becoming a
    # runtime dependency by accident.
    "astrid.*.tests*",
    # Golden provider examples and pack skills are authoring material, not
    # installed runtime modules.
    "astrid.*.golden*",
    "astrid.*.skill*",
]

[tool.setuptools.exclude-package-data]
astrid = [
    # Defensive exclusions for non-package directories that may be surfaced
    # by a source/VCS manifest in a future setuptools release.
    "**/__pycache__/*",
    "packs/**/tests/*",
    "packs/**/golden/*",
    "packs/**/build/*",
]

[tool.setuptools.package-data]
astrid = [
    # Core data consumed through Path(__file__) or importlib.resources.
    # Python modules are discovered above; these patterns deliberately name
    # data formats rather than copying documentation, skills, tests, caches,
    # or build/planning material into the wheel.
    "core/**/*.json",
    "core/**/*.sql",
    "core/**/*.yaml",
    "core/rendering/fixtures/renderer_parity/*",
    "core/rendering/schemas/v1/*.json",

    # The named OMP profile is a runtime resource, not a user-home seed.
    "agent_profiles/*.md",
    "agent_profiles/*.identity.json",
    "omp_extensions/*.ts",
    # Native build pins for explicitly selected OMP fork sources.
    "installer/omp/*.json",

    # Installed service declarations launch this prebuilt Bun bundle. Ship its
    # local-only configuration and third-party notices alongside it.
    "chat/service.mjs",
    "chat/astrid-acp-local-only.yml",
    "chat/THIRD_PARTY_LICENSES.txt",

    # Capability manifests, runtime data, and agent-facing pack guidance.
    # V3 docs, action guides, and declared requirements are release inputs;
    # golden logs and other authoring-only material remain excluded below.
    "packs/**/pack.yaml",
    "tools/*.json",
    # Agent-facing pack skills are shipped with the product.  They are
    # discovered from the installed package on a fresh machine, so they
    # cannot remain authoring-only source files.
    "packs/**/skill/*",
    "packs/**/skill/**/*",
    "packs/**/docs/*",
    "packs/**/docs/**/*",
    "packs/**/actions/**/*.md",
    "packs/**/actions/**/*.txt",
    "packs/**/requirements.txt",
    # Resolved Linux cu130 engine dependency lock consumed by the packaged recipe.
    "packs/runpod/requirements.linux-cu130.lock",
    "packs/**/requirements.windows-nvidia.txt",
    "packs/**/rendering/**/*.md",
    "packs/**/AGENTS.md",
    "packs/**/README.md",
    "packs/**/*.yaml",
    "packs/**/*.json",
    # Runtime mask resources used by the packaged LanPaint compiler.
    "packs/h3_av/workflows/lanpaint_h3_av_generalized/mask_full_frame.png",
    "packs/h3_av/workflows/lanpaint_h3_av_generalized/mask_preserve.png",
    # The accepted V3 local pack declares these seven ignored release assets
    # beneath its rendering root; keep the allow-list narrow and explicit.
    "packs/local/rendering/elements/effects/frame-overlay/assets/frame.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-0.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-1.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-2.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-3.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-4.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-5.png",
    # Additional resources are declared by the V3 pack manifests/elements;
    # keep these exact directories/files narrow so no unrelated media enters
    # the wheel.
    "packs/astrid_motion/preview/render.mjs",
    "packs/blender/server/blender-render-api.service",
    "packs/rendering/actions/timeline_visualize/motion/element_motion.mjs",
    "packs/local/rendering/elements/effects/end-codex-transform/assets/*.png",
    "packs/local/rendering/elements/effects/end-codex-transform/assets/plate.mp4",
    "packs/local/rendering/elements/effects/end-mid-combined/assets/*.png",
    "packs/local/rendering/elements/effects/end-minimax-animate/assets/*.png",
    "packs/local/rendering/elements/effects/end-minimax-animate/assets/plate.mp4",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-*-canonical-mink.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-6.png",
    "packs/local/rendering/elements/effects/end-spanning-layer/assets/card-7.png",
    "packs/local/rendering/elements/effects/ending-carousel/assets/*.png",
    "packs/local/rendering/elements/effects/ending-carousel/assets/plate.mp4",
    "packs/text_analysis/fixtures/*.txt",
    "packs/**/*.html",
    "packs/**/*.css",
    "packs/**/*.js",
    "packs/**/*.ts",
    "packs/**/*.tsx",
    "packs/**/*.ttf",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Evidence: advisory lint scope was introduced in 7d343bc with only reshape/concurrency paths.
# Inference: astrid/ was left out to keep the initial S0 gate narrow while known backlog remained.
include = [
    "astrid/**/*.py",
    "scripts/reshape/**/*.py",
    "tests/reshape/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.coverage.run]
source = ["astrid"]
omit = [
    ".megaplan/*",
    "out/*",
    "runs/*",
    ".venv/*",
    "venv/*",
    "*/venv/*",
    "*/.venv/*",
    "remotion/*",
    "tests/*",
    "*/tests/*",
    "scripts/*",
    "*/site-packages/*",
    "node_modules/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.11"
# The Darwin custody modules raise on every other platform, so mypy would skip their bodies as
# unreachable and the exact-count gate (scripts/reshape/baselines/mypy_astrid.json) would differ
# between macOS and Linux CI. Pin one platform so the count is the same everywhere.
platform = "darwin"
# Evidence: 7d343bc created this config with files = ["scripts/reshape"] alongside the first advisory CI gate.
# Inference: core astrid typing was intentionally excluded at that point rather than accidentally omitted.
files = ["astrid", "scripts/reshape"]
follow_imports = "skip"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
pretty = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
# Passed test sandboxes can contain full wheels, virtualenvs, rendered media,
# and adversarial package copies. Remove each passed tmp_path at teardown so a
# complete suite does not retain gigabytes until session end. Failed sandboxes
# remain available for diagnosis.
tmp_path_retention_policy = "failed"
# --- Suite-wide hang guard (architectural root fix) ---
# A DEFAULT per-test timeout applies to every test in the suite. Any test that
# hangs (spawns a server/subprocess and waits forever, deadlocks, blocks on a
# socket, etc.) is killed at this bound and reported as a failure with a full
# thread stack dump -- instead of wedging the whole `pytest` invocation
# indefinitely. This is what stops one bad test from hanging CI, the megaplan
# `finalize` test-baseline capture, or a human's local run for ~an hour.
#
# 600s is many times the slowest legitimate test, even on a loaded machine
# (testing plan R-10: durations never fail a run; only a genuine hang does). Override per-test with @pytest.mark.timeout(N) (the
# `timeout` marker is registered below); set timeout(0) to disable for a
# specific deliberately-long test.
#
# timeout_method is left unset so pytest-timeout picks its platform default:
# "signal" where SIGALRM exists (Unix), "thread" on Windows, which has no SIGALRM.
# On Unix, a SIGALRM is delivered to the test on the main thread and raised AS A
# TEST FAILURE, so the hung test is actually ABORTED and the suite CONTINUES. This
# is the property that makes the suite unable to hang.
# (The "thread" method only DUMPS a stack from a watchdog thread; it cannot
# interrupt a blocked call, so a non-daemon hung test can still wedge the whole
# `pytest` process at exit -- which is precisely the failure that wedged the
# megaplan baseline capture for ~an hour.) A test that legitimately runs longer
# should raise its own bound with @pytest.mark.timeout(N).
timeout = 600
# Lanes (testing plan R-2): the default run leaves out the default_off lanes of tests/lanes.py (a Runtime checkout,
# macOS, the Remotion install, credentials, a GPU, the owner's workstation files); each is run by the CI job named in the registry or by hand.
# --strict-markers: a lane marker must be one the registry declares.
addopts = "--strict-markers -m 'not integration and not darwin_native and not opt_in and not installed and not remotion and not chrome and not codex_cli and not workstation and not omp and not gpu and not app_checkout'"
# Scope collection to Astrid's own tests; exclude vendored upstream test trees
# (e.g. any pack's `ai_toolkit/upstream` submodule, which targets the upstream
# project, needs heavy deps like torch, and is not part of Astrid's suite).
testpaths = [
    "tests",
    "tools/astrid-rename/tests",
]
norecursedirs = [
    "astrid/packs/*/ai_toolkit/upstream",
    ".claude",
    ".git",
    ".venv",
    "node_modules",
]
# The lane markers (integration, darwin_native, opt_in, ...) are registered by
# tests/lanes.py, the single source for them.
markers = [
    "timeout: per-test timeout marker used when pytest-timeout is installed",
]
