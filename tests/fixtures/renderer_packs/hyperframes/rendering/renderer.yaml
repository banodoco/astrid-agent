schema_version: 1
id: hyperframes.renderer
name: HyperFrames Renderer
version: 1.0.0
protocol_version: 1
command: [python3, render.py]
operations: [support, render]
description: >-
  Renders a bounded text/silent-media subset of an Astrid timeline through
  the HyperFrames HTML-to-MP4 engine (heygen-com/hyperframes, pinned version).
  The adapter maps canvas -> composition root, text clips -> .clip windows
  (data-start/data-duration), silent media clips -> <video> clip elements
  (data-mediaStart/data-playback-rate source trimming), and rejects audible
  media, effect/audio clips and fades/transitions with a clear support
  reason.  Output is a visual-only MP4 (audio_ownership: none).
capabilities:
  clip_types: [text, media]
  track_types: [visual]
  output_profiles: [video/mp4]
  # Host-sliced segment renderer: the service materializes a per-window
  # timeline and passes window=None, exactly like the built-in backends.
  supports_windows: false
  supports_full_timeline: false
  # The renderer always emits a visual-only MP4; it satisfies both a
  # visual-only request and a rendered request (the finalizer synthesizes
  # silent audio onto the visual-only segment in the mixed case).
  audio_ownership:
    - none
    - rendered
  features:
    media: true
    bounded_css: true
  # Node.js >= 22 is required to run the pinned hyperframes CLI; FFmpeg is
  # required by hyperframes for muxing.  support() fails closed when either
  # is absent.
required_binaries: [node, ffmpeg]
required_permissions:
  - subprocess
  - project_files
