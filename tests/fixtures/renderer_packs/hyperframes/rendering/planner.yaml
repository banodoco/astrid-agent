schema_version: 1
id: hyperframes.planner
name: HyperFrames/Remotion Hybrid Planner
version: 1.0.0
protocol_version: 1
command: [python3, plan.py]
operations: [plan, support]
description: >-
  Plans a mixed timeline into non-overlapping frame windows: isolated text
  and SILENT media clips render through the HyperFrames backend
  (hyperframes.renderer, which maps media clips to <video> elements with
  source trimming), and audible-media/effect/transition/mixed windows render
  through Remotion (rendering.remotion).  The plan pins
  rendering.ffmpeg-finalizer, which concatenates the segment videos (and
  synthesizes silent audio onto visual-only HyperFrames segments).  Occupancy
  tiling: no text handles, so HyperFrames windows never bleed adjacent media.
  V1 forbids overlay compositing — overlapping text-on-media stays on
  Remotion.
capabilities:
  policies: [hyper_remotion]
  features:
    integer_frame_windows: true
    occupancy_tiling: true
    explicit_finalizer: true
    non_recursive_dispatch: true
required_permissions:
  - project_files
  - subprocess
