schema_version: 3
id: hyperframes
name: HyperFrames Renderer Pack
version: 1.0.0
pack_api: "2.0"
description: >-
  Third-party renderer pack adapting Astrid timelines to the HyperFrames
  HTML-to-MP4 renderer (heygen-com/hyperframes).  render.py is a pure-stdlib
  raw-command backend: it reads the v1 request JSON, converts a bounded
  text/background subset of the timeline into a HyperFrames composition,
  runs `npx hyperframes render`, and writes the validated RenderResult.
permissions:
  - id: subprocess
    reason: Run the pinned hyperframes CLI (npx) as a subprocess.
  - id: project_files
    reason: Read the invocation request JSON, write the composition, and
      emit the rendered MP4 into the request workspace.
aliases: []
rendering:
  renderer:
    type: renderer
    path: rendering/renderer.yaml
  planner:
    type: planner
    path: rendering/planner.yaml
