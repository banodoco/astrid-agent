schema_version: 1
id: raw_command.renderer
name: Raw Command Fixture Renderer
version: 1.0.0
protocol_version: 1
command: [python3, backend.py]
operations: [render, support]
description: >-
  Deterministic pure-stdlib renderer implementing the v1 raw command protocol.
  Generates a solid-color H.264/PCM MP4 without ffmpeg and without importing
  the Astrid SDK.
capabilities:
  clip_types: [media]
  track_types: [visual, audio]
  features:
    media: true
    audio_mode: rendered
    deterministic: true
  supports_full_timeline: true
  supports_windows: true
  output_profiles: [video/mp4]
  audio_ownership: [rendered]
required_permissions: [subprocess, project_files]
