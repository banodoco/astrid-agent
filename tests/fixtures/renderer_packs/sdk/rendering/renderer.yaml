schema_version: 1
id: sdk.renderer
name: SDK Conformance Fixture Renderer
version: 1.0.0
protocol_version: 1
command: [python3, render.py]
operations: [render, support]
description: >-
  Deterministic conformance renderer implementing the v1 raw command protocol
  with a shared runner. The manifest command is the raw-command entrypoint
  (render.py); the SDK entrypoint (sdk_render.py) is the same renderer driven
  through astrid.sdk.rendering.renderer_main and is exercised by the
  conformance harness via CommandTransport. Generates a solid-color H.264 MP4
  without ffmpeg. Renders rendered / passthrough / none audio modes and
  optional named attachments; support is request-sensitive and commits only to
  the window [0, 48) @ 24fps combination.
capabilities:
  clip_types: [media]
  track_types: [visual, audio]
  features:
    media: true
    audio_mode: dynamic
    deterministic: true
  supports_full_timeline: false
  supports_windows: true
  output_profiles: [video/mp4]
  audio_ownership: [rendered, passthrough, none]
required_permissions: [subprocess, project_files]
