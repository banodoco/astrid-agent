schema_version: 3
id: sdk
name: SDK Conformance Fixture Pack
version: 1.0.0
pack_api: "2.0"
description: >-
  Shared raw/SDK conformance fixture (T6.4) for the frozen v1 wire protocol.
  The pack ships ONE canonical implementation (_shared.py) behind TWO thin
  backends that must emit semantically identical RenderResult/SupportReport/
  RendererError JSON for the same request:

    * render.py     - raw-command backend (pure stdlib, never imports the
                      Astrid SDK, never touches the Astrid ledger).
    * sdk_render.py - SDK backend: delegates the whole protocol to
                      astrid.sdk.rendering.renderer_main (T6.2 shared
                      contract) and is driven through CommandTransport by
                      tests/core/rendering/test_conformance.py.

  The renderer is deterministic (fixed 1920x1080@24fps H.264/PCM MP4) and is
  request-sensitive: support commits only to the window [0, 48) @ 24fps
  combination, while render implements rendered / passthrough / none audio
  modes and optional named attachments.
permissions:
  - id: subprocess
    reason: Run the pack-owned render.py / sdk_render.py command as a subprocess.
  - id: project_files
    reason: Read the invocation request JSON and write generated artifacts into the request workspace.
aliases: []
rendering:
  renderer:
    type: renderer
    path: rendering/renderer.yaml
