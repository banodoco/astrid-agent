# Deliberate r4 changes. Keep one reason and the replacement spelling for each.
- feature: "deliberate: test_fast_lane_words.py::test_a_changed_layer_under_an_opaque_higher_layer_is_named_as_hidden"
  card: CHANGE-VIEW
  reason: "Cached component boxes/kinds cannot prove opacity, sprite holes, crop/mask or occlusion. Remove the private hidden-under guess; the actual shared scene answer is explicit unknown offline. The admitted evaluator does not supply an occluder identity."
  alias: "astrid.core.timeline.change_intervals.layer_visibility"
- feature: "deliberate: timelines.edit --set KEY=null"
  card: UX-CLEAR
  reason: "Null is refused when the field schema disallows it; clear it explicitly with --clear (F-099, spec-agent §5.2)."
  alias: "--clear"
- feature: "deliberate: --remove on a picture clip"
  card: M4
  reason: "A picture clip cannot silently erase its cut; use lift cNN to preserve the cut boundary."
  alias: "lift"
- feature: "deliberate: two 0.5-opacity layers count as covered"
  card: SCENE-PLAN
  reason: "Opacity summing is unsound; report coverage as unknown instead (spec-rendering §4)."
  alias: "unknown coverage"
- feature: "deliberate: core/timeline/inverses.py"
  card: M2
  reason: "Inverses move into the edit registry; the module had only a test caller and no user-visible caller (architecture §4)."
  alias: "edit registry inverse"
- feature: "deliberate: stale draft expiry"
  card: TL-LIFECYCLE
  reason: "Draft expiry is deliberate lifecycle cleanup; list unpublished edits in status before expiry."
  alias: "draft lifecycle expiry"
- feature: "sdk:Checkout.publish"
  card: COMMIT
  reason: "Publish retains its existing arguments and adds optional dry_run=False for the single COMMIT preview route; saved requests use authenticated durable envelopes."
  alias: "sdk:Checkout.publish"
- feature: "sdk:StepSequence.fit"
  card: MOTION
  reason: "Adds the optional curve keyword to the existing fit method; all previous arguments and defaults remain available."
  alias: "sdk:StepSequence.fit"
- feature: "argument:timelines.undo:steps"
  card: UNDO-REVERT
  reason: "Undo retains positive numeric edit counts and extends the optional positional to exact publication IDs. --steps retains the original positive-integer spelling."
  alias: "--steps"
- feature: "sdk:Checkout.undo"
  card: UNDO-REVERT
  reason: "Undo retains steps=1 and adds optional client/publication keywords for staging verified publication inverses."
  alias: "sdk:Checkout.undo"
- feature: "sdk:Checkout.adopt"
  card: BED-ADOPT
  reason: "Retains timeline/revision/client adoption and adds optional authored music sources, switches, alignment and common_basis through the same timeline.adopt OpCall."
  alias: "sdk:Checkout.adopt"

- feature: "sdk:Checkout.remove_line"
  card: CUTS
  reason: "Adds optional visuals=orphan|remove; the existing segment argument, music policy, and default orphan behavior remain accepted (spec-timing 6.3)."
  alias: "sdk:Checkout.remove_line"

