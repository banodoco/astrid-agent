id: look.entrance.card-fade-ease-out
source: new
intent: Fade the c2 card title in over 12 frames with an ease-out (clip-level entrance with params.easing, not an element
  param).
fixture: tiny
expect: change
cli: edit --clip c2.card --entrance fade 12f ease=out
sheet:
  text: 'edit {"op": "clip.set-look", "select": "c2.card", "args": {"entrance": "fade 12f ease=out"}}

    '
python: 'tl.clip(''c2.card'').set_look(**{''entrance'': ''fade 12f ease=out''})

  '
check:
- 'tl.clip("c2.card").data.get("entrance") == {"type": "fade", "duration": 0.4, "params": {"easing": "out"}}'
