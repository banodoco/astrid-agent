id: look.look.rocket-opacity
source: new
intent: Set the c1 rocket to 60 percent opacity; the clip-level look must show as a change in the diff, status and the change
  list.
fixture: tiny_publishable
expect: change
cli: edit --clip c1.rocket --opacity 0.6
sheet:
  text: 'edit {"op": "clip.set-look", "select": "c1.rocket", "args": {"opacity": 0.6}}

    '
python: 'tl.clip("c1.rocket").set_look(opacity=0.6)

  '
check:
- tl.clip("c1.rocket").data.get("opacity") == 0.6
- any("opacity" in line for line in tl.changes())
- tl.edits()["changes"]
