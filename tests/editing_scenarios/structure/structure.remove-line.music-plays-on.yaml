id: structure.remove-line.music-plays-on
source: W2 (new)
intent: Remove narration line s1 with --music plays-on, so the bed keeps playing unchanged (the old behaviour, now opt-in),
  so it runs past the film's new end.
fixture: tiny
expect: change
cli: 'edit --command ''{"op": "timeline.batch", "select": null, "args": {"commands": [{"op": "clip.set-duration", "select":
  "a-music", "args": {"seconds": 8}}, {"op": "timeline.remove-line", "select": null, "args": {"segment": "s1", "music": "plays_on"}}]}}'''
sheet:
  text: 'edit {"op": "clip.set-duration", "select": "a-music", "args": {"seconds": 8}}

    edit {"op": "timeline.remove-line", "select": null, "args": {"segment": "s1", "music": "plays_on"}}

    '
python: 'tl.clip("a-music").set_duration(8)  # setup, as the CLI''s --for

  tl.remove_line("s1", music="plays_on")

  '
check:
- '"s1" not in [v.segment for v in tl.lines()]'
- len([c for c in tl.clips() if c.track == "music"]) == 1
- max(c.end for c in tl.clips() if c.track == "music") > tl.duration + 1
