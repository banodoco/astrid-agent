schema_version: 3
id: wan2gp
name: Astrid Wan2GP
version: 1.0.0
status: active
domain: generation
stability: experimental
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Wan2GP native Python engine (shared.api / WanGPSession) for video generation.
  - id: project_files
    reason: Reads input images/videos and writes generated outputs to private spool.
  - id: accelerator
    reason: May use GPU for Wan2GP model inference when available.
description: Native Wan2GP video generation through the GenericPackHost-owned shared.api session (official upstream API candidate f3f204e5). The host retains the native interpreter; Runtime owns task authority and attempt publication.
keywords:
  - wan2gp
  - wan
  - video
  - generation
  - gpu
capabilities:
  - generate_video
  - validate_settings
agent:
  purpose: Choose this pack to generate video via the native Wan2GP engine (Wan2GP, not fal/cloud). GenericPackHost admits the explicitly provided upstream session and maps native jobs through ManagedToolSession; this pack does not claim model residency or warm reuse.
  do_not_use_for: Do not use for VibeComfy/ComfyUI workflows (use vibecomfy) or fal/cloud video (use generation); this is the native Wan2GP engine seam only.
  normal_entrypoints:
    - wan2gp.generate_video
    - wan2gp.validate_settings
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  generate_video:
    name: Wan2GP Generate Video
    version: 0.1.0
    short_description: Host-mediated native Wan2GP video generation.
    description: Generate a short video through the GenericPackHost-owned native Wan2GP session.
    keywords:
      - wan2gp
      - wan
      - video
      - generate
      - gpu
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.wan2gp.actions.generate_video.run
        input_args:
          - {input: prompt, flag: --prompt}
          - {input: model, flag: --model, optional: true}
          - {input: negative_prompt, flag: --negative-prompt, optional: true}
          - {input: resolution, flag: --resolution, optional: true}
          - {input: frames, flag: --frames, optional: true}
          - {input: fps, flag: --fps, optional: true}
          - {input: seed, flag: --seed, optional: true}
          - {input: guidance_scale, flag: --guidance-scale, optional: true}
          - {input: steps, flag: --steps, optional: true}
          - {input: loras, flag: --loras, optional: true}
    inputs:
      - name: prompt
        type: string
        required: true
        description: Text prompt for video generation.
        artifact_type: prompt
      - name: model
        type: string
        required: false
        default: wan-2.2
        description: Wan2GP model identifier (e.g. wan-2.2).
      - name: negative_prompt
        type: string
        required: false
        default: ""
        description: Negative prompt.
        artifact_type: prompt
      - name: resolution
        type: string
        required: false
        default: ""
        description: Output resolution WxH (e.g. 1280x720).
      - name: frames
        type: integer
        required: false
        default: ""
        description: Number of frames / video_length.
      - name: fps
        type: string
        required: false
        default: ""
        description: Frames per second (stringified to force_fps).
      - name: seed
        type: integer
        required: false
        default: ""
        description: Deterministic seed.
      - name: guidance_scale
        type: number
        required: false
        default: ""
        description: Guidance scale.
      - name: steps
        type: integer
        required: false
        default: ""
        description: Sampling steps (num_inference_steps alias).
      - name: loras
        type: string
        required: false
        default: ""
        description: LoRAs JSON or path.
    outputs:
      - name: generated_videos
        type: file
        mode: create_or_replace
        artifact_type: video/clip
        description: Generated video file listed in the result manifest.
      - name: video_manifest
        type: file
        mode: create_or_replace
        path_template: "{out}/manifest.json"
        description: Universal result manifest for this generation.
    resources:
      - kind: implementation
        path: actions/generate_video/run.py
      - kind: documentation
        path: actions/generate_video/STAGE.md
    cache:
      mode: none
    conditions:
      - input: prompt
        kind: requires_input
      - input: model
        kind: requires_input
    graph:
      consumes:
        - prompt
      provides:
        - generated_videos
        - video_manifest
    isolation:
      mode: subprocess
      requirements: []
    metadata:
      host_session: wan2gp
      output_result_manifest: true
      pack_id: wan2gp
      runtime_file: actions/generate_video/run.py
      runtime_module: astrid.packs.wan2gp.actions.generate_video.run
  validate_settings:
    name: Wan2GP Validate Settings
    version: 0.1.0
    short_description: Compile and validate Wan2GP settings (no engine execution).
    description: Validate and compile Wan2GP settings without executing the engine.
    keywords:
      - wan2gp
      - validate
      - settings
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.wan2gp.actions.validate_settings.run
          - --prompt
          - "{prompt}"
          - --model
          - "{model}"
        input_args:
          - {input: negative_prompt, flag: --negative-prompt, optional: true}
          - {input: resolution, flag: --resolution, optional: true}
          - {input: frames, flag: --frames, optional: true}
          - {input: seed, flag: --seed, optional: true}
    inputs:
      - name: prompt
        type: string
        required: true
        description: Text prompt.
        artifact_type: prompt
      - name: model
        type: string
        required: false
        default: wan-2.2
        description: Model id.
      - name: negative_prompt
        type: string
        required: false
        default: ""
        description: Negative prompt.
      - name: resolution
        type: string
        required: false
        default: ""
        description: Resolution WxH.
      - name: frames
        type: integer
        required: false
        default: ""
        description: Frames / video_length.
      - name: seed
        type: integer
        required: false
        default: ""
        description: Deterministic seed.
    outputs: []
    resources:
      - kind: implementation
        path: actions/validate_settings/run.py
      - kind: documentation
        path: actions/validate_settings/STAGE.md
    cache:
      mode: none
    conditions:
      - input: prompt
        kind: requires_input
    graph:
      consumes:
        - prompt
      provides:
        - wan2gp_settings
        - portable_digest
    isolation:
      mode: subprocess
      requirements: []
    metadata:
      pack_id: wan2gp
      runtime_file: actions/validate_settings/run.py
      runtime_module: astrid.packs.wan2gp.actions.validate_settings.run
resources:
  - kind: documentation
    path: docs/SKILL.md
  - kind: support
    path: src/compiler.py
  - kind: support
    path: src/driver.py
  - kind: support
    path: src/persistent.py
