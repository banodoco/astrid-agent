{
  "schema_version": 3,
  "id": "music",
  "name": "Music",
  "version": "0.1.0",
  "status": "active",
  "domain": "media",
  "stability": "experimental",
  "support": "core",
  "visibility": "visible",
  "description": "Analyze imported music and bake speech-keyed ducking for timeline clips.",
  "keywords": [
    "music",
    "alignment",
    "midi",
    "loudness",
    "beats",
    "downbeats",
    "ducking",
    "speech"
  ],
  "capabilities": [
    "align",
    "level",
    "beats",
    "duck"
  ],
  "permissions": [
    {
      "id": "project_files",
      "reason": "Reads managed timeline audio and writes analysis JSON and ducked WAV as managed outputs."
    },
    {
      "id": "subprocess",
      "reason": "Uses ffmpeg to decode audio and measure EBU R128 loudness."
    }
  ],
  "documentation": {
    "kind": "skill",
    "path": "docs/SKILL.md"
  },
  "agent": {
    "purpose": "Align a MIDI transcription or one recording to another, measure the loudness of the source span used by a clip, and derive a beat grid for imported music. Bake speech-keyed music ducking from current timeline placements.",
    "do_not_use_for": "Music synthesis or sound effects (use chiptune), or final timeline rendering (use rendering).",
    "normal_entrypoints": [
      "music.align",
      "music.level",
      "music.beats",
      "music.duck"
    ]
  },
  "dependencies": {
    "packs": [
      "chiptune"
    ],
    "python_requirements": [
      "numpy"
    ]
  },
  "actions": {
    "align": {
      "name": "Music Align",
      "version": "0.1.0",
      "short_description": "Find the offset and tempo ratio between MIDI/audio or two recordings.",
      "description": "Aligns onset events for MIDI to audio, or chroma features for audio to audio.",
      "keywords": [
        "music",
        "align",
        "midi",
        "chroma",
        "synchronization"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.music.actions.align.run",
            "--reference",
            "{reference}",
            "--target",
            "{target}",
            "--window-s",
            "{window_s}",
            "--out",
            "{out}"
          ],
          "input_args": [
            {
              "input": "ref_s",
              "flag": "--ref-s",
              "optional": true
            }
          ]
        }
      },
      "inputs": [
        {
          "name": "reference",
          "type": "file",
          "required": true,
          "description": "Reference MIDI or audio file."
        },
        {
          "name": "target",
          "type": "file",
          "required": true,
          "description": "Target audio file."
        },
        {
          "name": "ref_s",
          "type": "number",
          "required": false,
          "description": "Reference time to match, in seconds. Audio defaults to its midpoint; MIDI defaults to the full transcription."
        },
        {
          "name": "window_s",
          "type": "number",
          "required": false,
          "default": 20,
          "description": "Reference window duration around ref_s, in seconds."
        }
      ],
      "outputs": [
        {
          "name": "alignment",
          "type": "file",
          "path_template": "{out}/alignment.json",
          "description": "JSON offset_s, tempo_ratio, score, shuffled baseline, confidence, and matched times."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false,
        "binaries": [
          "ffmpeg"
        ]
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/align/run.py",
        "runtime_module": "astrid.packs.music.actions.align.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/align/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_analysis.py"
        },
        {
          "kind": "documentation",
          "path": "actions/align/STAGE.md"
        }
      ]
    },
    "level": {
      "name": "Music Level",
      "version": "0.1.0",
      "short_description": "Measure integrated EBU R128 loudness for a clip's used source span.",
      "description": "Reports integrated LUFS and gain to a target, without changing the audio.",
      "keywords": [
        "music",
        "loudness",
        "lufs",
        "gain",
        "ebu-r128"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.music.actions.level.run",
            "--audio",
            "{audio}",
            "--from-s",
            "{from_s}",
            "--to-s",
            "{to_s}",
            "--target-lufs",
            "{target_lufs}",
            "--out",
            "{out}"
          ]
        }
      },
      "inputs": [
        {
          "name": "audio",
          "type": "file",
          "required": true,
          "description": "Source audio file."
        },
        {
          "name": "from_s",
          "type": "number",
          "required": true,
          "description": "Used source span start in seconds."
        },
        {
          "name": "to_s",
          "type": "number",
          "required": true,
          "description": "Used source span end in seconds."
        },
        {
          "name": "target_lufs",
          "type": "number",
          "required": false,
          "default": -16,
          "description": "Desired integrated loudness in LUFS."
        }
      ],
      "outputs": [
        {
          "name": "level",
          "type": "file",
          "path_template": "{out}/level.json",
          "description": "Measured integrated LUFS and required gain in dB."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false,
        "binaries": [
          "ffmpeg"
        ]
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/level/run.py",
        "runtime_module": "astrid.packs.music.actions.level.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/level/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_analysis.py"
        },
        {
          "kind": "documentation",
          "path": "actions/level/STAGE.md"
        }
      ]
    },
    "beats": {
      "name": "Music Beats",
      "version": "0.1.0",
      "short_description": "Infer beats, downbeats, and bars for imported music.",
      "description": "Uses onset flux, tempo autocorrelation, dynamic beat tracking, and four-beat accent phase.",
      "keywords": [
        "music",
        "beats",
        "tempo",
        "downbeats",
        "timeline"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.music.actions.beats.run",
            "--audio",
            "{audio}",
            "--out",
            "{out}"
          ]
        }
      },
      "inputs": [
        {
          "name": "audio",
          "type": "file",
          "required": true,
          "description": "Source audio file."
        }
      ],
      "outputs": [
        {
          "name": "beats",
          "type": "file",
          "path_template": "{out}/beats.json",
          "description": "chiptune.compose-compatible beat grid in source seconds."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false,
        "binaries": [
          "ffmpeg"
        ]
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/beats/run.py",
        "runtime_module": "astrid.packs.music.actions.beats.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/beats/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/_analysis.py"
        },
        {
          "kind": "documentation",
          "path": "actions/beats/STAGE.md"
        }
      ]
    },
    "duck": {
      "name": "Music Duck",
      "version": "0.1.0",
      "short_description": "Bake smooth speech-keyed ducking into a timeline music asset.",
      "description": "Analyzes a pinned timeline-audio snapshot and returns a source-clock WAV with speech-keyed, slew-limited gain and source-digest provenance. Use duck_timeline(client, project, timeline) for one-call capture and invocation. Does not edit the timeline.",
      "keywords": [
        "music",
        "ducking",
        "speech",
        "loudness",
        "ebu-r128"
      ],
      "invocation": {
        "kind": "command",
        "command": {
          "argv": [
            "{python_exec}",
            "-m",
            "astrid.packs.music.actions.duck.run",
            "--snapshot",
            "{snapshot}",
            "--bed-lu",
            "{bed_lu}",
            "--out",
            "{out}"
          ]
        }
      },
      "inputs": [
        {
          "name": "snapshot",
          "type": "file",
          "required": true,
          "description": "Pinned timeline and digest-verified audio ZIP prepared by duck_timeline(client, project, timeline)."
        },
        {
          "name": "bed_lu",
          "type": "number",
          "required": false,
          "default": 8,
          "description": "Integrated voice-minus-music gap in LU."
        }
      ],
      "outputs": [
        {
          "name": "music",
          "type": "file",
          "path_template": "{out}/music.wav",
          "description": "Dithered source-length WAV with source-digest RIFF INFO provenance."
        },
        {
          "name": "duck",
          "type": "file",
          "path_template": "{out}/duck.json",
          "description": "Parameters, line gaps, floor holds, curve bounds, and true peak."
        },
        {
          "name": "manifest",
          "type": "file",
          "path_template": "{out}/artifacts/manifest.json",
          "description": "Managed run manifest for the ducked WAV and analysis report."
        }
      ],
      "cache": {
        "mode": "none"
      },
      "isolation": {
        "mode": "subprocess",
        "network": false,
        "binaries": [
          "ffmpeg",
          "ffprobe"
        ]
      },
      "metadata": {
        "runtime_entrypoint": "main",
        "runtime_file": "actions/duck/run.py",
        "runtime_module": "astrid.packs.music.actions.duck.run",
        "output_result_manifest": true
      },
      "resources": [
        {
          "kind": "implementation",
          "path": "actions/duck/run.py"
        },
        {
          "kind": "implementation",
          "path": "actions/duck/api.py"
        },
        {
          "kind": "implementation",
          "path": "actions/duck/core.py"
        },
        {
          "kind": "implementation",
          "path": "actions/duck/_audio.py"
        },
        {
          "kind": "documentation",
          "path": "actions/duck/STAGE.md"
        }
      ]
    }
  }
}
