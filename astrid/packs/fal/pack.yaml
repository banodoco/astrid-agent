schema_version: 3
id: fal
name: Astrid fal
version: 1.0.0
status: active
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs fal.ai media generation executors.
  - id: network
    reason: Calls fal.ai Foley and MiniMax H3 APIs.
  - id: project_files
    reason: Reads input video clips and writes generated audio files.
  - id: environment
    reason: Reads FAL_KEY for fal.ai API authentication.
description: fal.ai integration for clip Foley and MiniMax H3 video generation.
keywords: [fal, foley, audio, hunyuan, minimax, h3, video, api, integration]
capabilities: [generate_clip_foley, generate_h3_video]
agent:
  purpose: "Use for fal.ai Hunyuan Foley or MiniMax H3 text/reference video generation (requires FAL_KEY)."
  do_not_use_for: "Full spatial-Foley orchestration (use foley.foley_map) or general image/video generation already covered by the generation pack."
  normal_entrypoints: [fal.fal_foley, fal.h3_video]
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  fal_foley:
    name: fal Hunyuan-Video Foley
    version: 0.1.0
    short_description: Generate Foley audio for one short video clip via fal.ai's hunyuan-video-foley model.
    description: Generate Foley audio for one short video clip via fal.ai's hunyuan-video-foley model. Takes a clip plus a text prompt and returns one audio file matched to the clip's duration.
    keywords:
      - fal
      - foley
      - audio
      - video
      - hunyuan
      - generate
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.fal.actions.fal_foley.run
          - --clip
          - "{clip}"
          - --prompt
          - "{prompt}"
          - --out
          - "{out}/audio.wav"
        input_args:
          - input: clip
            flag: --clip
            optional: false
          - input: prompt
            flag: --prompt
            optional: false
          - input: env_file
            flag: --env-file
            optional: true
    inputs:
      - name: clip
        type: file
        required: true
        description: Video clip to score with Foley audio (mp4/mov/webm, <=15s recommended).
      - name: prompt
        type: string
        required: true
        artifact_type: prompt
        description: Text description of the Foley to generate.
      - name: env_file
        type: file
        required: false
        description: Optional env file containing FAL_KEY for this invocation.
    outputs:
      - name: audio
        type: file
        path_template: "{out}/audio.wav"
        artifact_type: audio
        mode: create_or_replace
      - name: audio_manifest
        type: file
        path_template: "{out}/manifest.json"
        mode: create_or_replace
      - name: audio_provenance
        type: file
        path_template: "{out}/audio.wav.fal.json"
        artifact_type: application/json
        mode: create_or_replace
    scoped_configs:
      - credentials.fal
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
    metadata:
      env:
        - FAL_KEY
      fal_model_id: fal-ai/hunyuan-video-foley
      pricing: "$0.10 per 10s of input video"
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/fal_foley/run.py
      runtime_module: astrid.packs.fal.actions.fal_foley.run
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - queue.fal.run:443
          - fal.run:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
    resources:
      - kind: implementation
        path: actions/fal_foley/__init__.py
      - kind: implementation
        path: actions/fal_foley/run.py
      - kind: documentation
        path: actions/fal_foley/STAGE.md
  h3_video:
    name: fal MiniMax H3 video
    version: 0.1.0
    short_description: Generate MiniMax H3 text-to-video or multimodal reference-to-video clips through fal.ai.
    description: Validates and stages an exact prompt plus optional ordered image, video, and audio references; calls the appropriate MiniMax H3 fal.ai endpoint; downloads the 2K result; and emits a provenance manifest.
    keywords:
      - fal
      - minimax
      - h3
      - hailuo-03
      - text-to-video
      - reference-to-video
      - video
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.fal.actions.h3_video.run
          - --out
          - "{out}"
        input_args:
          - input: mode
            flag: --mode
            optional: false
          - input: prompt_file
            flag: --prompt-file
            optional: false
          - input: image_ref
            flag: --image-ref
            repeatable: true
            optional: true
          - input: video_ref
            flag: --video-ref
            repeatable: true
            optional: true
          - input: audio_ref
            flag: --audio-ref
            repeatable: true
            optional: true
          - input: duration
            flag: --duration
            optional: true
          - input: aspect_ratio
            flag: --aspect-ratio
            optional: true
          - input: env_file
            flag: --env-file
            optional: true
          - input: timeout_seconds
            flag: --timeout-seconds
            optional: true
          - input: dry_run
            flag: --dry-run
            optional: true
    inputs:
      - name: mode
        type: string
        required: true
        description: "H3 endpoint mode: text-to-video or reference-to-video."
      - name: prompt_file
        type: file
        required: true
        description: UTF-8 prompt file, captured exactly; H3 accepts at most 2,000 characters.
      - name: image_ref
        type: file
        required: false
        description: Ordered image reference for reference-to-video; repeat up to nine times.
      - name: video_ref
        type: file
        required: false
        description: Ordered video reference for reference-to-video; repeat up to three times.
      - name: audio_ref
        type: file
        required: false
        description: Ordered audio reference for reference-to-video; repeat up to three times.
      - name: duration
        type: integer
        required: false
        default: 15
        description: Generated duration from 5 through 15 seconds.
      - name: aspect_ratio
        type: string
        required: false
        default: "16:9"
        description: Output aspect ratio. Reference mode also accepts adaptive.
      - name: env_file
        type: file
        required: false
        description: Optional env file containing FAL_KEY.
      - name: timeout_seconds
        type: integer
        required: false
        default: 3600
        description: Bounded fal queue and download timeout.
      - name: dry_run
        type: boolean
        required: false
        default: false
        description: Stage and validate without submitting a paid request.
    outputs:
      - name: generated_videos
        type: file
        artifact_type: video/clip
        description: Generated H3 video identified by its typed receipt entry.
        mode: create_or_replace
      - name: video_manifest
        type: file
        path_template: "{out}/manifest.json"
        description: Exact prompt, staged references, request record, and typed generated-video receipt.
        mode: create_or_replace
    graph:
      consumes:
        - prompt
        - appearance_reference
        - motion_reference
        - audio_reference
      depends_on: []
      provides:
        - generation_result_manifest
    isolation:
      mode: subprocess
      network: true
      secrets_required:
        - FAL_KEY
      requirements:
        - PyYAML>=6,<7
    cache:
      mode: none
    conditions:
      - kind: requires_input
        input: mode
      - kind: requires_input
        input: prompt_file
    scoped_configs:
      - credentials.fal
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/h3_video/run.py
      runtime_module: astrid.packs.fal.actions.h3_video.run
      fal_model_ids:
        - minimax/h3/text-to-video
        - minimax/h3/reference-to-video
      pricing_note: "At creation time, public fal launch pricing states $0.26 per generated second at 2K."
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - queue.fal.run:443
          - fal.run:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
    resources:
      - kind: implementation
        path: actions/h3_video/__init__.py
      - kind: implementation
        path: actions/h3_video/run.py
      - kind: documentation
        path: actions/h3_video/STAGE.md
