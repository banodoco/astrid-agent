schema_version: 3
id: editorial
name: Astrid Editorial
version: 1.0.0
status: active
domain: editorial
stability: stable
support: core
visibility: visible
permissions:
- id: subprocess
  reason: Runs Editorial actions as subprocesses for transcription, review, and arrangement.
- id: project_files
  reason: Reads and writes transcripts, scenes, arrangements, and review artifacts.
- id: network
  reason: Sends source audio to the configured transcription provider.
- id: environment
  reason: Reads scoped transcription-provider credentials from the environment.
description: Transcript-to-cut editorial pipeline — transcribe, detect scenes/shots, arrange clip pools, run heuristic and
  human review, and validate the rendered cut.
keywords:
- transcribe
- scenes
- shots
- arrange
- review
- validate
- transcript
- editorial
capabilities:
- transcribe_audio
- detect_scenes
- slice_shots
- arrange_clips
- refine_arrangement
- grade_quality_zones
- run_editor_review
- collect_human_review
- ingest_human_notes
- scout_quotes
- generate_script
- inspect_cut
- validate_cut
agent:
  purpose: 'Use for the narrative-editing workflow: turning source video/audio into a structured cut — transcription, scene/shot
    detection, clip-pool arrangement, reviewer notes (heuristic or human-in-the-loop), and final cut validation.'
  do_not_use_for: Generating new image/video frames (use the generation pack), Foley/spatial audio (use the foley pack), or
    raw lossless trimming (use the media pack).
  normal_entrypoints:
  - editorial.transcribe
  - editorial.scenes
  - editorial.shots
  - editorial.arrange
  - editorial.validate
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  arrange:
    cache:
      always_run: false
      mode: sentinel
      per_brief: true
      sentinels:
      - arrangement.json
    clip_kinds_supported:
    - video
    - image
    - audio
    - text
    - effect
    conditions:
    - input: brief
      kind: requires_input
    description: Compose a brief-specific arrangement from the source pool.
    graph:
      consumes: []
      depends_on:
      - editorial.transcribe
      - editorial.scenes
      - editorial.quality_zones
      - editorial.shots
      - editorial.triage
      - understanding.scene_describe
      - editorial.quote_scout
      - training.pool_build
      - training.pool_merge
      provides:
      - arrangement
    inputs:
    - description: ''
      name: pool
      required: false
      type: file
    - description: ''
      name: brief
      required: true
      type: file
    - description: Optional explicit runtime-materialized theme.json; no workspace/theme slug fallback.
      name: theme
      required: false
      type: file
    - description: ''
      name: target_duration
      required: false
      type: number
    - description: ''
      name: env_file
      required: false
      type: file
    isolation:
      binaries: []
      mode: subprocess
      network: false
      requirements: []
    keywords:
    - arrange
    - pipeline
    - video
    - edit
    - pool
    - brief
    metadata:
      output_result_manifest: true
      command_builder: astrid.packs.video_editing.actions.hype.run.build_pool_steps
      pipeline_step: arrange
      pipeline_step_order: 9
      runtime_entrypoint: main
      runtime_file: actions/arrange/run.py
      runtime_module: astrid.packs.editorial.actions.arrange.run
    name: Arrange
    outputs:
    - description: ''
      mode: create_or_replace
      name: arrangement
      path_template: '{brief_out}/arrangement.json'
      type: file
    pipeline_requirements:
    - brief
    - pool
    short_description: Compose a brief-specific shot arrangement from runtime-materialized inputs.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.arrange.run
        - --out
        - '{brief_out}'
    resources:
    - kind: documentation
      path: actions/arrange/STAGE.md
    - kind: implementation
      path: actions/arrange/__init__.py
    - kind: implementation
      path: actions/arrange/run.py
  boundary_candidates:
    cache:
      mode: none
    description: Package candidate video frames for visual boundary review.
    inputs:
    - description: Source video.
      name: video
      type: file
    - description: Boundary manifest input.
      name: manifest
      type: file
    isolation:
      mode: subprocess
    keywords:
    - video
    - scenes
    - boundary
    - frames
    - analyze
    - review
    metadata:
      output_result_manifest: true
      runtime_file: actions/boundary_candidates/run.py
      runtime_module: astrid.packs.editorial.actions.boundary_candidates.run
    name: Boundary Candidates
    outputs:
    - name: boundaries
      path_template: '{out}/boundary_candidates.json'
      type: file
    short_description: Package candidate video frames for visual scene-boundary review.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.boundary_candidates.run
        - --video
        - '{video}'
        - --manifest
        - '{manifest}'
        - --out
        - '{out}/boundary_candidates.json'
    resources:
    - kind: documentation
      path: actions/boundary_candidates/STAGE.md
    - kind: implementation
      path: actions/boundary_candidates/__init__.py
    - kind: implementation
      path: actions/boundary_candidates/run.py
  editor_review:
    cache:
      always_run: false
      mode: sentinel
      per_brief: true
      sentinels:
      - editor_review.json
    clip_kinds_supported:
    - video
    - image
    - audio
    - text
    - effect
    conditions: []
    graph:
      consumes: []
      depends_on:
      - editorial.transcribe
      - editorial.scenes
      - editorial.quality_zones
      - editorial.shots
      - editorial.triage
      - understanding.scene_describe
      - editorial.quote_scout
      - training.pool_build
      - training.pool_merge
      - editorial.arrange
      - video_editing.cut
      - editorial.refine
      - rendering.render
      provides:
      - editor_review
    description: Run heuristic editorial reviewers over a rendered arrangement and emit notes.
    inputs:
    - description: ''
      name: brief_dir
      required: false
      type: directory
    - description: ''
      name: run_dir
      required: false
      type: directory
    - description: ''
      name: env_file
      required: false
      type: file
    isolation:
      binaries: []
      mode: subprocess
      network: false
      requirements: []
    keywords:
    - edit
    - review
    - video
    - arrangement
    - notes
    - pipeline
    metadata:
      output_result_manifest: true
      command_builder: astrid.packs.video_editing.actions.hype.run.build_pool_steps
      pipeline_step: editor_review
      pipeline_step_order: 13
      runtime_entrypoint: main
      runtime_file: actions/editor_review/run.py
      runtime_module: astrid.packs.editorial.actions.editor_review.run
    name: Editor Review
    outputs:
    - description: ''
      mode: create_or_replace
      name: editor_review
      path_template: '{brief_out}/editor_review.json'
      type: file
    pipeline_requirements:
    - rendered_video
    - timeline
    - source_audio
    short_description: Run heuristic editorial reviewers over an arrangement and emit notes.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.editor_review.run
        - --out
        - '{brief_out}'
    resources:
    - kind: documentation
      path: actions/editor_review/STAGE.md
    - kind: implementation
      path: actions/editor_review/__init__.py
    - kind: implementation
      path: actions/editor_review/run.py
  human_notes:
    cache:
      mode: none
    description: Convert human editorial notes into structured inputs for the pipeline.
    inputs:
    - description: Human notes file.
      name: notes
      type: file
    outputs: []
    isolation:
      mode: subprocess
    keywords:
    - notes
    - human
    - edit
    - input
    - pipeline
    - text
    metadata:
      output_result_manifest: true
      runtime_file: actions/human_notes/run.py
      runtime_module: astrid.packs.editorial.actions.human_notes.run
    name: Human Notes
    short_description: Convert human editorial notes into structured pipeline inputs.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.human_notes.run
        - --notes
        - '{notes}'
        - --out
        - '{out}'
    resources:
    - kind: documentation
      path: actions/human_notes/STAGE.md
    - kind: implementation
      path: actions/human_notes/__init__.py
    - kind: implementation
      path: actions/human_notes/run.py
  human_review:
    name: Human Review
    version: '1.0'
    short_description: Serve a small HTML page locally, collect human decisions as JSON, block until submit.
    description: Generic human-gate primitive. Spins up a localhost HTTP server, serves a project-supplied --html page, exposes
      --data as /data.json (read-only), accepts POST /save (partial state, per keypress) and POST /submit (final, schema-validated,
      server exits 0). Reusable by any orchestrator that needs a human in the loop — dataset review, eval-grid pick, arrangement
      approval. Token-authenticated POSTs.
    keywords:
    - human
    - review
    - gate
    - browser
    - form
    - annotate
    - attested
    inputs:
    - name: html
      type: file
      required: false
      description: Direct HTML file or directory served at /. Omit when assets_bundle supplies the HTML directory.
    - name: data
      type: file
      required: true
      description: JSON file served read-only at /data.json.
    - name: serve
      type: string
      required: false
      default: __none__
      description: Repeatable static mount as <prefix>=<dir> (e.g. /clips=runs/x/accepted).
    - name: state
      type: file
      required: false
      description: Partial-state path. POST /save writes here per keystroke; GET /state.json returns contents or 404.
    - name: assets_bundle
      type: file
      required: false
      description: Bounded ZIP containing human-review-assets.json, an HTML directory root, and optional static mounts.
    - name: state_schema_bundle
      type: file
      required: false
      description: Bounded ZIP containing the unchanged M17 run-state, review-decision, and filter-stats schemas.
    - name: state_schema_entry
      type: string
      required: false
      default: run-state.schema.json
      description: Entry schema name inside state_schema_bundle.
    - name: response_schema
      type: file
      required: false
      description: Optional JSON schema validating /submit bodies (jsonschema strict mode).
    - name: port
      type: integer
      required: false
      default: 0
      description: Explicit port, or 0 for auto-pick. Default 0.
    - name: no_open
      type: boolean
      required: false
      default: false
      description: Skip auto-launching the browser. Default false.
    - name: timeout
      type: integer
      required: false
      default: 0
      description: Exit nonzero if no /submit by this many seconds. 0 = unlimited.
    outputs:
    - name: decisions
      type: file
      path_template: '{out}/human_review.final.json'
      description: Validated submit body.
    - name: state_result
      type: file
      path_template: '{out}/state_result.json'
      description: Optional final validated state when a state file exists.
    isolation:
      mode: subprocess
      network: false
    cache:
      mode: none
    metadata:
      runtime_module: astrid.packs.editorial.actions.human_review.run
      runtime_file: actions/human_review/run.py
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.human_review.run
        - --out
        - '{decisions}'
        input_args:
        - input: html
          flag: --html
          optional: true
        - input: data
          flag: --data
        - input: serve
          flag: --serve
          optional: true
          repeatable: true
        - input: state
          flag: --state
          optional: true
        - input: assets_bundle
          flag: --assets-bundle
          optional: true
        - input: state_schema_bundle
          flag: --state-schema-bundle
          optional: true
        - input: state_schema_entry
          flag: --state-schema-entry
          optional: true
        - input: response_schema
          flag: --response-schema
          optional: true
        - input: port
          flag: --port
          optional: true
        - input: no_open
          flag: --no-open
          optional: true
        - input: timeout
          flag: --timeout
          optional: true
    resources:
    - kind: documentation
      path: actions/human_review/STAGE.md
    - kind: implementation
      path: actions/human_review/__init__.py
    - kind: implementation
      path: actions/human_review/run.py
  inspect_cut:
