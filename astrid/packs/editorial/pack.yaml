  script_pipeline:
    name: Script Pipeline
    version: 0.1.0
    short_description: Generate short scripts through rough attempts, synthesis, style pass, and optional judging.
    description: Preset-driven creative-writing pipeline. Runs parallel rough attempts, synthesizes a draft, applies a voice/style
      pass, optionally judges multiple candidates, and writes candidate markdown, selected markdown, and manifest.json. DeepSeek
      is the initial live provider; --fake mode is available for no-network smoke tests.
    keywords:
    - script
    - writing
    - deepseek
    - creative
    - preset
    inputs:
    - name: preset
      type: string
      required: false
      description: Built-in preset name or path to YAML/JSON preset.
    - name: prompt
      type: string
      required: false
      description: Scene brief override.
    - name: candidates
      type: integer
      required: false
      description: Complete pipeline candidates to generate.
    - name: rough_attempts
      type: integer
      required: false
      description: Parallel rough attempts per candidate.
    - name: fake
      type: boolean
      required: false
      description: Use deterministic no-network provider outputs.
    outputs:
    - name: selected_scene
      type: file
      path_template: '{out}/produces/selected_scene.md'
    - name: manifest
      type: file
      path_template: '{out}/produces/manifest.json'
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
    metadata:
      runtime_module: astrid.packs.editorial.actions.script_pipeline.run
      runtime_file: actions/script_pipeline/run.py
      output_result_manifest: true
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.deepseek.com:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.script_pipeline.run
        - --produces-dir
        - '{out}/produces'
    resources:
    - kind: documentation
