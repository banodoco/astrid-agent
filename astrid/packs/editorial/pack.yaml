    - kind: implementation
      path: actions/inspect_cut/run.py
  pacing:
    cache:
      mode: none
    conditions: []
    description: Render a deterministic rhythm sheet from one Runtime-admitted immutable authoring bundle without mutating the timeline.
    graph:
      consumes:
      - runtime/admitted-authoring-bundle
      depends_on: []
      provides:
      - pacing_png
      - pacing_md
      - pacing_json
    inputs:
    - description: Owning project identity supplied by the invocation.
      name: project
      required: true
      type: string
    - description: Timeline slug, UUID, or ULID bound by the invocation.
      name: timeline_ref
      required: true
      type: string
    - description: Optional JSON [start, end] window in seconds.
      name: window
      required: false
      type: string
    - artifact_type: runtime/admitted-authoring-bundle
      description: Host-admitted immutable authoring bundle; ambient Runtime reads are not allowed.
      name: bundle
      required: true
      type: file
    isolation:
      binaries: []
      mode: subprocess
      network: false
      requirements:
      - Pillow
    keywords:
    - pacing
    - rhythm
    - editorial
    - timeline
    metadata:
      output_result_manifest: true
      read_authority: runtime-admitted-bundle
      runtime_entrypoint: main
      runtime_file: actions/pacing/run.py
      runtime_module: astrid.packs.editorial.actions.pacing.run
    name: Pacing
    outputs:
    - artifact_type: image
      description: Deterministic 2400x1350 rhythm sheet.
      mode: create_or_replace
      name: pacing_png
      path_template: '{out}/pacing.png'
      type: file
    - description: Human-readable rhythm summary and cut table.
      mode: create_or_replace
      name: pacing_md
      path_template: '{out}/pacing.md'
      type: file
    - artifact_type: editorial/pacing
      description: Machine-readable editorial.pacing/v1 model.
      mode: create_or_replace
      name: pacing_json
      path_template: '{out}/pacing.json'
      type: file
    short_description: Render an immutable timeline rhythm sheet for editorial review.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.editorial.actions.pacing.run
        - --project
        - '{project}'
        - --timeline-ref
        - '{timeline_ref}'
        - --out
        - '{out}'
        input_args:
        - input: window
          flag: --window
          optional: true
        - input: bundle
          flag: --bundle
          optional: false
    resources:
    - kind: documentation
      path: actions/pacing/STAGE.md
    - kind: implementation
      path: actions/pacing/__init__.py
    - kind: implementation
      path: actions/pacing/model.py
    - kind: implementation
      path: actions/pacing/reader.py
    - kind: implementation
      path: actions/pacing/run.py
    - kind: implementation
      path: actions/pacing/sheet.py
    - kind: implementation
      path: shared/rhythm.py
