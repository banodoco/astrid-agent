    - timeline
    - debug
    - report
    metadata:
      runtime_file: actions/inspect_cut/run.py
      runtime_module: astrid.packs.editorial.actions.inspect_cut.run
    name: Inspect Cut
    short_description: Inspect a generated cut run directory and report timeline/asset health.
    version: '1.0'
