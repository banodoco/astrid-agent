  "version": "0.1.0",
  "status": "experimental",
  "domain": "media",
  "stability": "experimental",
  "support": "project",
  "visibility": "visible",
  "description": "Reusable Remotion elements for the Pixel Modernism explainer look: stepped pixel plates and sprites, editorial type, callouts, wipes, and motion graphics.",
  "keywords": [
    "motion",
    "pixel",
    "remotion",
    "element",
    "explainer",
    "callout"
  ],
  "permissions": [
    {
      "id": "project_files",
      "reason": "Provides render-time visual element definitions consumed by the rendering pack; managed media arrives through clip asset keys."
    }
  ],
  "documentation": {
    "kind": "skill",
    "path": "docs/SKILL.md"
  },
  "agent": {
    "purpose": "Use when a timeline needs a Pixel Modernism motion building block such as pixel plates, stepped transparent sprites, editorial type, floating callouts, or pixel-block wipes.",
    "do_not_use_for": "This pack provides effect elements only. Use pixel or generation packs to prepare artwork and the rendering pack to render the timeline.",
    "normal_entrypoints": [

    ]
  },
