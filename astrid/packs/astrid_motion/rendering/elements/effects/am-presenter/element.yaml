schema_version: 1
id: am-presenter
kind: effect
pack_id: astrid_motion
short_description: Animated pixel presenter overlay with mouth, blinks, bob, punch and crisp REC/label chrome.
description: Draws the speaker's pixel mouth (closed, half, open on a 3-frame cycle in word spans), blinks, a 1 px bob on stressed words and an optional zoom punch over an am-snap-plate presenter plate. Pixels use the plate's view geometry. The plate needs the same zoom, focus, punchAt, words, seed and bob, with pan 0. Also draws the label chip, crop marks, REC timecode and a status chip.
# Mouth inspection pads the shared erase rect by 1 px horizontally and 2 vertically.
# Drawing normalization remains semantic; compatibility inspection preserves the
# absent/default skip, partial legacy width 16, and malformed-input refusal.
# Presence is unknown, opaqueSupport is none; legacy crop equivalence is separately qualified.
keywords:
- presenter
- talking-head
- mouth
- lip-sync
- blink
- bob
- punch
- placeholder
- pixel
outputs:
- name: clip
  type: clip
  artifact_type: clip/visual
  description: Transparent presenter overlay for the full frame, drawn above the plate.
metadata:
  label: AM Presenter
  description: Pixel presenter overlay (mouth, blinks, bob, punch) and placeholder slate chrome.
  whenToUse: Use on the track above an am-snap-plate presenter plate, for every talking-head shot. Pass the same zoom, focus, punchAt, words, seed and bob to both clips. Feed words from Edge TTS word boundaries (clip-relative seconds). Use label to name the take.
  coverage: "picture"
defaults:
  zoom: 1
  focus:
    x: 160
    y: 90
  mouth:
    x: 151
    y: 104
    w: 19
  skin: '#EDB98E'
  lip: '#2B1A14'
  inner: '#7A3510'
  edge: '#25241F'
  words: []
  eyes:
  - x: 146
    y: 85
    w: 3
  - x: 171
    y: 85
    w: 3
  blinkEvery: 3.4
  noBlink: []
  seed: 7
  bob: 0
  punchAt: []
  label: PLACEHOLDER · POM ON CAMERA · TAKE 03
  timecodeStart: 01:02:14:00
  chip: null
dependencies:
  js_packages: []
  python_requirements: []
schema:
  type: object
  additionalProperties: true
  properties:
    zoom:
      type: integer
      enum:
      - 1
      - 2
      - 3
      description: Base zoom. A punch lifts it by one (capped at 4) for PUNCH_FRAMES frames.
    focus:
      type: object
      description: Logical px (320x180 space) at the view centre. Clamped to the plate.
      properties:
        x:
          type: number
        y:
          type: number
    mouth:
      type: object
      description: Closed mouth line on the native plate; x,y top-left px, w width px.
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
    skin:
      type: string
      description: Hex fill that erases the plate's mouth and blink eyes.
    lip:
      type: string
      description: Hex, the dark opening and the lid line.
    inner:
      type: string
      description: Hex, the 1 px interior line inside an open mouth.
    edge:
      type: string
      description: Hex painted in the strip a bob uncovers at the top edge.
    words:
      type: array
      description: '[start_s, end_s] word spans, seconds from clip start (Edge TTS word boundaries).'
      items:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
    eyes:
      type: array
      description: Eye anchors {x, y, w} (top row of each eye).
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
          w:
            type: integer
    blinkEvery:
      type: number
      description: Mean seconds between blinks (+/-30% seeded jitter). 0 disables blinks.
    noBlink:
      type: array
      description: '[start_s, end_s] spans in which no blink may start.'
      items:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 2
    seed:
      type: integer
      description: Seed for blink jitter, mouth-cycle offsets and bob phase.
    bob:
      type: integer
      enum:
      - 0
      - 1
      description: Logical px nudge (down) on the first frame of every 3rd word.
    punchAt:
      type: array
      description: Clip frames where the whole presenter snaps zoom+1 for 6 frames.
      items:
        type: integer
        minimum: 0
    label:
      type: string
      description: Placeholder slate text, shown uppercase bottom-left.
    timecodeStart:
      type: string
      description: HH:MM:SS:FF timecode at clip start; the REC timecode runs from here.
    chip:
      type:
      - object
      - 'null'
      description: Optional top-right status chip {text, swapTo?, swapAt?}. swapAt is a clip frame; the text swaps on that frame with a two-frame orange flash.
      properties:
        text:
          type: string
        swapTo:
          type: string
        swapAt:
          type: integer
          minimum: 0
    push:
      type: object
      description: 'Slow continuous push {to, frames, at}: zoom moves linearly to `to` over `frames` from clip frame `at`. Give presenter and plate the same value. Prefer it to hard zoom changes.'
    chrome:
      type: string
      enum:
      - full
      - label
      - none
