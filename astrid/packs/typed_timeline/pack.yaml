schema_version: 3
id: typed_timeline
name: Typed Timeline Mapper
version: "1.0.0"
status: active
domain: system
stability: stable
support: core
visibility: visible
permissions:
  - id: project_files
    reason: Reads typed rows and writes timeline/assets into the run.
  - id: subprocess
    reason: Map action may invoke ffmpeg to generate silent audio for smoke tests.
description: Generic typed-row to timeline mapper with Runaway colour and text mappings.
keywords:
  - timeline
  - mapper
  - typed
  - runaway
  - colour
capabilities:
  - map
agent:
  purpose: Map typed DB rows to validated timelines for the runtime render task.
  do_not_use_for: Direct timeline hand-editing.
  normal_entrypoints:
    - typed_timeline.map
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  map:
    name: Typed Timeline Map
    version: "1.0.0"
    short_description: Map typed rows to a validated timeline JSON.
    description: Generic mapper from host-admitted typed rows to timeline JSON via mapping YAML. Supports aggregated and per-row scopes.
    keywords:
      - timeline
      - mapper
      - typed
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - -m
          - astrid.packs.typed_timeline.actions.map.run
          - --source
          - "{source}"
          - --mapping
          - "{mapping}"
          - --out
          - "{out}"
        input_args:
          - input: run_id
            flag: --run-id
            optional: true
          - input: project
            flag: --project
            optional: true
          - input: json_path
            flag: --json-path
            optional: true
          - input: json_rows
            flag: --json-rows
            optional: true
    inputs:
      - name: source
        type: string
        required: true
        description: "Admitted row contract: runaway or json"
      - name: mapping
        type: string
        required: true
        description: "Mapping name or path: runaway_colour, runaway_text"
      - name: run_id
        type: string
        required: false
        description: Optional run_id filter for runaway source
      - name: project
        type: string
        required: false
        description: Project id override
      - name: json_path
        type: string
        required: false
        artifact_type: timeline/typed_rows
        description: Project-owned staged rows artifact
      - name: json_rows
        type: json
        required: false
        description: Bounded rows admitted inline by the host
    outputs:
      - name: timeline
        type: file
        path_template: "{out}/timeline.json"
        mode: create_or_replace
        artifact_type: timeline
      - name: assets
        type: file
        path_template: "{out}/assets.json"
        mode: create_or_replace
        artifact_type: timeline/assets
    resources:
      - kind: implementation
        path: actions/map/run.py
      - kind: documentation
        path: actions/map/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries: []
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/map/run.py
      runtime_module: astrid.packs.typed_timeline.actions.map.run
      output_result_manifest: true
resources:
  - kind: documentation
    path: docs/SKILL.md
  - kind: support
    path: common.py
  - kind: support
    path: frames.py
  - kind: support
    path: mapper.py
  - kind: support
    path: prompts.py
  - kind: support
    path: sources.py
  - kind: mapping
    path: mappings/runaway_colour.yaml
  - kind: mapping
    path: mappings/runaway_text.yaml
