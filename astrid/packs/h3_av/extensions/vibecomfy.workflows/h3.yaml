api: 1
summary: MiniMax H3 audiovisual transformation (i2v, v2v, video-edit) on the one generate path.
example: astrid media generate video --entry h3 --request request.json --asset-map assets.json
effects: none
ready_root: ../../workflows
entries:
  - id: h3
    kind: video
    modes: [i2v, v2v, video-edit]
    bundle: native_h3_continuation
    # build picks the graph from the request, so the mode does not change the run.
    default_mode: v2v
    # No model needs are declared here: build's graph carries its own model rows (requirements()).
    needs: []
    inputs:
      - {name: request, type: file, required: true, description: "H3 request document (request.v1 or request.v2 JSON)."}
      - {name: asset_map, type: file_map, required: true, description: "Map of the request's asset ids to local files."}
    binds: {}
    defaults: {}
    # MiniMax H3 is the video default; a user pin (astrid generate defaults set) overrides it.
    default_for:
      - {kind: video, mode: i2v, priority: 100}
      - {kind: video, mode: v2v, priority: 100}
      - {kind: video, mode: video-edit, priority: 100}
build: hooks.py:build
after_outputs: hooks.py:after_outputs
