profile: h3_av.native.v2
workflow: workflows/native_h3_continuation_refs
operations: [transform]
fps: 24
sample_rate: 48000
# Default working size. The v2 compiler accepts output.size on image-guided
# generation, masked edit and Character Swap. Each dimension is a multiple of
# 32 from 32 through 16384 inclusive. Continuation uses the default.
resolution: 1024x576
reference_audio_default: true
mask_polarity: black_preserve_white_edit
branches: [source_free, audio_only, extension_context, source_backed_v2v]
defaults:
  model: minimax_h3_ref2va_pruned_int8_convrot.safetensors
  steps: 8
  sampler: res_multistep
  seed: 123456789
  scheduler: simple
  cfg: 1.0
  video_shift: 12.0
  audio_shift: 3.0
  turbo: {enabled: true, lora: pika_flex_8step, strength: 1.0}
