schema_version: 3
id: h3_av
name: Astrid H3 audiovisual transformations
version: 0.1.0
status: experimental
domain: generation
stability: experimental
support: project
visibility: visible
permissions:
- id: project_files
  reason: Reads source media, references, masks, and writes attempt-local preparation and
    result artifacts.
- id: subprocess
  reason: Uses ffprobe/ffmpeg and the VibeComfy executor for media preparation and generation.
- id: accelerator
  reason: H3 generation requires a CUDA-capable ComfyUI runtime.
- id: network
  reason: The transform process opens no sockets itself; it coordinates runpod.* and vibecomfy
    child capabilities, which declare their own network_policy for the RunPod control plane
    (api.runpod.io and related hosts) and the managed ComfyUI session. Model and custom-node
    sources (huggingface.co, github.com) are declared for the managed worker, not fetched here.
- id: external_services
  reason: The transform may target a managed RunPod worker through the existing runtime contract.
description: Prepare, compile, execute, compose, and verify flexible MiniMax H3 audiovisual
  transformations from one bounded request contract.
keywords:
- h3
- minimax
- video
- audio
- mask
- continuation
- inpaint
- comfyui
- runpod
capabilities:
- prepare_transform
- compile_transform
- compose_transform
- verify_transform
- finalize_publication
- transform
agent:
  purpose: Use this pack for request-driven H3 video/audio continuation, editing, masking,
    and reference-guided continuation.
  do_not_use_for: Do not use this pack for editorial timeline cutting, generic raw ComfyUI
    graph authoring, or final media publication.
  normal_entrypoints:
  - h3_av.transform
  - h3_av.prepare
  - h3_av.compile
  required_context:
  - schemas/request.v1.json
  - profiles/native-v1.yaml
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  publication_finalizer:
    name: Finalize verified H3 publication
    version: 0.1.0
    short_description: Copy one verified H3 candidate into the Runtime publication spool.
    description: Verify candidate identity and lifecycle evidence, copy the candidate into
      the attempt-local publication spool, and emit the existing result manifest.
    keywords:
    - h3
    - publication
    - verification
    - result-manifest
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.h3_av.actions.publication_finalizer.run
        - --candidate
        - '{candidate}'
        - --verification
        - '{verification}'
        - --expected-request-digest
        - '{expected_request_digest}'
        - --out
        - '{out}'
    inputs:
    - name: candidate
      type: file
      required: true
      artifact_type: video
      description: Managed H3 candidate whose bytes must match verification.
    - name: verification
      type: file
      required: true
      artifact_type: h3_av/verification
      description: Verified lifecycle report with matching request and candidate digests.
    - name: expected_request_digest
      type: string
      required: true
      description: Expected request SHA-256 from the final publication intent.
    - name: generation_intent
      type: json
      required: true
      description: Sealed publication intent retained by the transform handoff and Runtime
        contract; the byte finalizer does not reinterpret it.
    outputs:
    - name: verified_candidate
      type: file
      mode: create_or_replace
      path_template: '{out}/verified-candidate.media'
      artifact_type: h3_av/candidate
      description: Verified candidate copied into the Runtime publication spool.
    - name: manifest
      type: file
      mode: create_or_replace
      path_template: '{out}/manifest.json'
      artifact_type: metadata/result-manifest
      description: Existing deterministic publication result manifest.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/publication_finalizer/run.py
      runtime_module: astrid.packs.h3_av.actions.publication_finalizer.run
      output_result_manifest: true
      mutation_authority: workspace_runtime
      generation_publication:
        version: 1
        modality: video
        output_port: verified_candidate
    resources:
    - kind: implementation
      path: actions/publication_finalizer/run.py
    - kind: documentation
      path: actions/publication_finalizer/STAGE.md
  prepare:
    name: Prepare H3 audiovisual request
    version: 0.1.0
    short_description: Normalize an H3 audiovisual request into masks and asset evidence.
    description: Build deterministic video/audio delivery permissions and an attempt-local
      preparation manifest without submitting a runtime job.
    keywords:
    - h3
    - video
    - audio
    - mask
    - prepare
    inputs:
    - name: request
      type: file
      required: true
      description: H3 request v1 JSON or YAML document.
    - name: input_bundle
      type: file
      required: true
      description: Hash-verified archive of all declared source, reference, and mask assets.
    - name: fps
      type: number
      required: false
      default: 24
    - name: width
      type: integer
      required: false
      default: 1024
    - name: height
      type: integer
      required: false
      default: 576
    - name: sample_rate
      type: integer
      required: false
      default: 48000
    outputs:
    - name: preparation
      type: file
      path_template: '{out}/preparation.json'
      artifact_type: h3_av/preparation
      description: Deterministic request, asset, and mask schedule manifest.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_module: astrid.packs.h3_av.actions.prepare.run
      runtime_file: actions/prepare/run.py
      output_result_manifest: true
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.h3_av.actions.prepare.run
        - --request
        - '{request}'
        - --out
        - '{out}/preparation.json'
        input_args:
        - input: input_bundle
          flag: --input-bundle
        - input: fps
          flag: --fps
          optional: true
        - input: width
          flag: --width
          optional: true
        - input: height
          flag: --height
          optional: true
        - input: sample_rate
          flag: --sample-rate
          optional: true
    resources:
    - kind: implementation
      path: actions/prepare/run.py
    - kind: implementation
      path: actions/prepare/prepare.py
    - kind: implementation
      path: actions/prepare/masks.py
    - kind: documentation
      path: actions/prepare/STAGE.md
  compile:
    name: Compile H3 audiovisual continuation
    version: 0.1.0
    short_description: Compile a prepared request into the repaired H3 workflow bindings and
      managed assets.
    description: Fail closed unless the selected repaired Seitanism graph can represent the
      normalized request exactly.
    keywords:
    - h3
    - minimax
    - compile
    - vibecomfy
    inputs:
    - name: preparation
      type: file
      required: true
      description: preparation.json emitted by h3_av.prepare.
    - name: input_bundle
      type: file
      required: true
      description: The same immutable dependency bundle used by prepare.
    outputs:
    - name: compilation
      type: file
      path_template: '{out}/compilation.json'
      artifact_type: h3_av/compilation
    - name: managed_assets
      type: file
      path_template: '{out}/managed-assets.zip'
      artifact_type: h3_av/managed-assets
    - name: python
      type: file
      path_template: '{out}/workflow.py'
      artifact_type: text/x-python
      description: Selected packaged canonical workflow.py member.
    - name: companion
      type: file
      path_template: '{out}/workflow.vibe.json'
      artifact_type: application/json
      description: Selected packaged canonical workflow.vibe.json member.
    - name: source
      type: file
      path_template: '{out}/source.json'
      artifact_type: application/json
      description: Selected packaged canonical source.json member.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      env_passthrough:
      - ASTRID_H3_CANDIDATE_MANIFEST
      - ASTRID_H3_T9_MODEL_SUBSTITUTE_PROFILE
    metadata:
      runtime_module: astrid.packs.h3_av.actions.compile.run
      runtime_file: actions/compile/run.py
      output_result_manifest: true
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.h3_av.actions.compile.run
        - --preparation
        - '{preparation}'
        - --input-bundle
        - '{input_bundle}'
        - --out
        - '{out}'
    resources:
    - kind: implementation
      path: actions/compile/run.py
    - kind: implementation
      path: actions/compile/compile.py
    - kind: documentation
      path: actions/compile/STAGE.md
  compose:
    name: Compose H3 audiovisual candidate
    version: 0.1.0
    short_description: Settle an H3 candidate with explicit changed and protected permissions.
    description: Copy a generated candidate into an attempt-local result directory and publish
      deterministic composition evidence without inventing preservation claims.
    keywords:
    - h3
    - video
    - audio
    - compose
    - evidence
    inputs:
    - name: preparation
      type: file
      required: true
      description: Preparation manifest produced by h3_av.prepare.
    - name: input_bundle
      type: file
      required: false
      description: Immutable input bundle used to rehydrate managed timeline and mask assets.
    - name: generated
      type: file
      required: true
      description: Generated candidate media artifact.
    - name: source
      type: file
      required: false
      description: Source media for protected material.
    - name: preservation_evidence
      type: file
      required: false
      description: Optional JSON permission evidence from a media compositor.
    outputs:
    - name: candidate
      type: file
      path_template: '{out}/candidate.media'
      artifact_type: h3_av/candidate
      description: Composed audiovisual bytes; container is detected from media content.
    - name: composition
      type: file
      path_template: '{out}/composition-manifest.json'
      artifact_type: h3_av/composition
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_module: astrid.packs.h3_av.actions.compose.run
      runtime_file: actions/compose/run.py
      output_result_manifest: true
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.h3_av.actions.compose.run
        - --preparation
        - '{preparation}'
        - --generated
        - '{generated}'
        - --out
        - '{out}'
        input_args:
        - input: source
          flag: --source
          optional: true
        - input: preservation_evidence
          flag: --preservation-evidence
          optional: true
        - input: input_bundle
          flag: --input-bundle
          optional: true
    resources:
    - kind: implementation
      path: actions/compose/run.py
    - kind: documentation
      path: actions/compose/STAGE.md
  verify:
    name: Verify H3 audiovisual candidate
    version: 0.1.0
    short_description: Verify H3 artifact custody and protected-source evidence.
    description: Fail closed when a candidate, preparation, composition, or preservation claim
      is missing or contradictory.
    keywords:
    - h3
    - video
    - audio
    - verify
    - preservation
    - evidence
    inputs:
    - name: preparation
      type: file
      required: true
      description: Preparation manifest produced by h3_av.prepare.
    - name: input_bundle
      type: file
      required: false
      description: Immutable input bundle used to rehydrate managed timeline and mask assets.
    - name: composition
      type: file
      required: true
      description: Composition manifest produced by h3_av.compose.
    - name: candidate
      type: file
      required: true
      description: Settled candidate media output from compose, materialized in this attempt.
    - name: source
      type: file
      required: false
      description: Source media required for exact whole-file preservation verification.
    outputs:
    - name: verification
      type: file
      path_template: '{out}/verification.json'
      artifact_type: h3_av/verification
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_module: astrid.packs.h3_av.actions.verify.run
      runtime_file: actions/verify/run.py
      output_result_manifest: true
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.h3_av.actions.verify.run
        - --preparation
        - '{preparation}'
        - --composition
        - '{composition}'
        - --candidate
        - '{candidate}'
        - --out
        - '{out}/verification.json'
        input_args:
        - input: source
          flag: --source
          optional: true
        - input: input_bundle
          flag: --input-bundle
          optional: true
    resources:
    - kind: implementation
      path: actions/verify/run.py
    - kind: documentation
      path: actions/verify/STAGE.md
    - kind: implementation
      path: actions/verify/verify.py
  transform:
    name: Transform with H3 audiovisual continuation
    version: 0.1.0
    short_description: Prepare, compile, validate, run, compose, and verify one bounded H3
      continuation.
    description: Coordinates pack executors and VibeComfy through SDK capability invocation;
      it creates no second task authority.
    keywords:
    - h3
    - minimax
    - continuation
    - vibecomfy
    - runpod
    inputs:
    - name: request
      type: file
      required: true
      description: H3 audiovisual request v1 or v2, including opt-in Character Swap settings.
    - name: asset_map
      type: file
      required: true
      description: JSON map from request asset ids to runtime-managed local input paths.
    - name: execution_request
      type: file
      required: false
      description: Optional normalized target/lifecycle request for the VibeComfy child.
    - name: project
      type: string
      required: false
      description: Optional project identity forwarded to child capability invocations.
    - name: worker_qualification
      type: file
      required: false
      description: Optional deployment-owned qualified-worker receipt.
    - name: prepared_worker
      type: file
      required: false
      description: Prepared RunPod deployment selection for canonical VibeComfy task admission.
    - name: cleanup_receipt
      type: file
      required: false
      description: Optional receipt containing exact owned-resource cleanup postconditions.
    - name: require_worker_qualification
      type: boolean
      required: false
      default: false
      description: Require a valid worker qualification receipt before admission.
    - name: editorial_approved
      type: boolean
      required: false
      default: false
      description: Record explicit editorial approval in the final receipt.
    - name: resume
      type: boolean
      required: false
      default: false
      description: Resume delivery from a saved canonical run result without resampling.
    - name: dry_run
      type: boolean
      required: false
      default: false
      description: Preview child dispatch without provider execution.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
      - VIBECOMFY_CHECKOUT
      - PYTHONPATH
      - VIBECOMFY_HEADLESS
      - ASTRID_RUNPOD_ACCOUNT_REF
      - ASTRID_H3_CANDIDATE_MANIFEST
      - ASTRID_H3_T9_MODEL_SUBSTITUTE_PROFILE
      - ASTRID_RUNTIME_DATA_ROOT
      requirements:
      - vibecomfy
    metadata:
      local_orchestrator: true
      runtime_entrypoint: main
      runtime_file: actions/transform/run.py
      runtime_module: astrid.packs.h3_av.actions.transform.run
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.h3_av.actions.transform.run
        - --request
        - '{request}'
        - --asset-map
        - '{asset_map}'
        - --out
        - '{out}'
        input_args:
        - input: execution_request
          flag: --execution-request
          optional: true
        - input: project
          flag: --project
          optional: true
        - input: worker_qualification
          flag: --worker-qualification
          optional: true
        - input: cleanup_receipt
          flag: --cleanup-receipt
          optional: true
        - input: require_worker_qualification
          flag: --require-worker-qualification
          optional: true
        - input: editorial_approved
          flag: --editorial-approved
          optional: true
        - input: resume
          flag: --resume
          optional: true
        - input: dry_run
          flag: --dry-run
          optional: true
        - input: prepared_worker
          flag: --prepared-worker
          optional: true
    outputs: []
    graph:
      child_actions:
      - h3_av.prepare
      - h3_av.compile
      - vibecomfy.validate
      - vibecomfy.run
      - h3_av.compose
      - h3_av.verify
      - h3_av.publication_finalizer
      child_orchestrators: []
    resources:
    - kind: implementation
      path: actions/transform/run.py
    - kind: documentation
      path: actions/transform/STAGE.md
    - kind: implementation
      path: actions/transform/operation.py
    - kind: implementation
      path: actions/transform/receipt.py
resources:
- kind: documentation
  path: README.md
- kind: implementation
  path: __init__.py
- kind: profile
  path: profiles/native-v1.yaml
- kind: profile
  path: profiles/native-v2.yaml
- kind: schema
  path: schemas/request.v1.json
- kind: schema
  path: schemas/request.v2.json
- kind: implementation
  path: shared/__init__.py
- kind: implementation
  path: shared/errors.py
- kind: implementation
  path: shared/compose.py
- kind: implementation
  path: shared/generation.py
- kind: implementation
  path: shared/input_bundle.py
- kind: implementation
  path: shared/request.py
- kind: implementation
  path: shared/request_v2.py
- kind: implementation
  path: shared/timing.py
- kind: asset
  path: workflows/lanpaint_h3_av_generalized/mask_full_frame.png
- kind: asset
  path: workflows/lanpaint_h3_av_generalized/mask_preserve.png
- kind: workflow
  path: workflows/lanpaint_h3_av_generalized/source.json
- kind: workflow
  path: workflows/lanpaint_h3_av_generalized/workflow.py
- kind: workflow
  path: workflows/lanpaint_h3_av_generalized/workflow.vibe.json
- kind: workflow
  path: workflows/native_h3_continuation/source.json
- kind: workflow
  path: workflows/native_h3_continuation/workflow.py
- kind: workflow
  path: workflows/native_h3_continuation/workflow.vibe.json
- kind: workflow
  path: workflows/native_h3_continuation_refs/source.json
- kind: workflow
  path: workflows/native_h3_continuation_refs/workflow.py
- kind: workflow
  path: workflows/native_h3_continuation_refs/workflow.vibe.json
