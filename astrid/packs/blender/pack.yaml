schema_version: 3
id: blender
name: Astrid Blender
version: 1.0.0
status: active
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs the blender binary (local render) and ffmpeg (animation encode).
  - id: project_files
    reason: Reads scene/blend inputs and writes rendered image/video output.
  - id: network
    reason: Cloud execution POSTs to a remote Blender render API host (an SSH host or RunPod).
description: Render 3D scenes with Blender, locally or on a remote cloud render host (an SSH host or an on-demand RunPod GPU pod).
keywords:
  - blender
  - render
  - 3d
  - cycles
  - eevee
  - animation
  - runpod
  - cloud-render
capabilities:
  - render_scene
agent:
  purpose: Choose this pack to render a Blender scene (declarative spec or .blend file) to a still image or animation, either on this machine or on a remote GPU/CPU render host.
  do_not_use_for: Not for timeline/video-edit rendering (use rendering.render); this pack renders standalone 3D scenes.
  normal_entrypoints:
    - blender.render
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        render:
          reasons:
          - GPU
          - external-escape-hatch
          note: Runs Blender locally or through an external render host and does not
            yet write the universal result manifest.
actions:
  render:
    name: Blender Render
    version: "1.0"
    short_description: Render a Blender scene (declarative spec or .blend file) to a still or animation, locally or on a cloud render host.
    description: Renders a Blender scene either locally (runs the blender binary on this machine) or on a cloud render host (HTTP POST to a Blender render API such as an SSH-deployed host or a RunPod GPU pod). Accepts a declarative scene spec JSON or an existing .blend file; emits a still PNG (--frames 1) or an mp4 animation (--frames N>1) plus a manifest.
    keywords:
      - blender
      - render
      - 3d
      - cycles
      - eevee
      - animation
      - runpod
      - cloud
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.blender.actions.render.run
          - "--out"
          - "{out}"
          - "--execution"
          - "{execution}"
        input_args:
          - input: scene
            flag: --scene
            optional: true
            repeatable: false
          - input: blend
            flag: --blend
            optional: true
            repeatable: false
          - input: engine
            flag: --engine
            optional: true
            repeatable: false
          - input: device
            flag: --device
            optional: true
            repeatable: false
          - input: samples
            flag: --samples
            optional: true
            repeatable: false
          - input: resolution
            flag: --resolution
            optional: true
            repeatable: false
          - input: frames
            flag: --frames
            optional: true
            repeatable: false
          - input: fps
            flag: --fps
            optional: true
            repeatable: false
          - input: denoise
            flag: --denoise
            optional: true
            repeatable: false
          - input: blender
            flag: --blender
            optional: true
            repeatable: false
          - input: cloud_url
            flag: --cloud-url
            optional: true
            repeatable: false
          - input: cloud_token
            flag: --cloud-token
            optional: true
            repeatable: false
          - input: cloud_timeout
            flag: --cloud-timeout
            optional: true
            repeatable: false
          - input: preset
            flag: --preset
            optional: true
            repeatable: false
          - input: mesh_url
            flag: --mesh-url
            optional: true
            repeatable: false
          - input: sketchfab_uid
            flag: --sketchfab-uid
            optional: true
            repeatable: false
          - input: head_yaw_deg
            flag: --head-yaw-deg
            optional: true
            repeatable: false
          - input: body_yaw_deg
            flag: --body-yaw-deg
            optional: true
            repeatable: false
    inputs:
      - name: execution
        type: string
        required: true
        description: local = run blender on this machine; cloud = POST to a Blender render API host (--cloud-url).
      - name: scene
        type: file
        required: false
        description: Declarative scene spec JSON (see render_core.DEFAULT_SCENE). Mutually exclusive with --blend.
      - name: blend
        type: file
        required: false
        description: Existing .blend file to render (overrides --scene).
        artifact_type: image
      - name: engine
        type: string
        required: false
        description: cycles (default), eevee, or workbench.
      - name: device
        type: string
        required: false
        description: cpu (default) or gpu (Cycles only).
      - name: samples
        type: integer
        required: false
        description: Cycles samples (default 64).
      - name: resolution
        type: string
        required: false
        description: WxH, e.g. 1920x1080 (default 1280x720).
      - name: frames
        type: integer
        required: false
        description: 1 = still PNG; >1 = mp4 animation (default 1).
      - name: fps
        type: integer
        required: false
        description: Frames per second for animation (default 24).
      - name: denoise
        type: boolean
        required: false
        description: Enable Cycles denoising (needs an OIDN-enabled blender build).
      - name: blender
        type: string
        required: false
        description: Path to blender executable (local mode).
      - name: cloud_url
        type: string
        required: false
        description: Base URL of the Blender render API host (cloud mode), e.g. http://host:8778.
      - name: cloud_token
        type: string
        required: false
        description: Bearer token if the render host requires auth.
      - name: cloud_timeout
        type: integer
        required: false
        description: Cloud request timeout in seconds (default 1800).
      - name: preset
        type: string
        required: false
        description: Named render preset from astrid.packs.blender.renders (e.g. wink_turn). Overrides scene/blend.
      - name: mesh_url
        type: string
        required: false
        description: Direct mesh URL (.glb/.gltf/.fbx/.zip) used by presets.
      - name: sketchfab_uid
        type: string
        required: false
        description: Sketchfab model uid; resolved to a mesh_url via the API token.
      - name: head_yaw_deg
        type: number
        required: false
        description: "wink_turn: head turn angle in degrees."
      - name: body_yaw_deg
        type: number
        required: false
        description: "wink_turn: body facing flip in degrees."
    outputs:
      - name: render
        type: directory
        mode: create_or_replace
        path_template: "{out}/render"
        description: Rendered still (render.png) or animation (render.mp4).
        artifact_type: image
      - name: manifest
        type: file
        mode: create_or_replace
        path_template: "{out}/manifest.json"
        description: Run manifest (engine, execution, timing, output type).
    resources:
      - kind: implementation
        path: actions/render/__init__.py
      - kind: implementation
        path: actions/render/run.py
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      binaries:
        - blender
        - ffmpeg
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/render/run.py
      runtime_module: astrid.packs.blender.actions.render.run
      requires_timeline: false
      output_result_manifest: true
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - 127.0.0.1:8778
        allow_redirects: false
    conditions:
      - input: execution
        kind: requires_input
resources:
  - kind: documentation
    path: README.md
  - kind: support
    path: actions/__init__.py
  - kind: support
    path: __init__.py
  - kind: support
    path: deploy.py
  - kind: support
    path: mesh_fetch.py
  - kind: support
    path: render_core.py
  - kind: documentation
    path: renders/README.md
  - kind: support
    path: renders/__init__.py
  - kind: support
    path: renders/wink_turn.py
  - kind: support
    path: server/__init__.py
  - kind: support
    path: server/blender-render-api.service
  - kind: support
    path: server/blender_render_server.py
