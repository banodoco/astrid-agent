  html_canvas_effect:
    name: HTML Canvas Effect
    version: '1.0'
    short_description: Scaffold a local Remotion HTML-in-canvas effect element.
    description: Create a user-editable local effect element that wraps DOM content
      in Remotion HtmlInCanvas for optional canvas/WebGL-style post-processing.
    keywords:
    - html
    - canvas
    - remotion
    - effect
    - element
    - shader
    inputs:
    - name: effect_id
      type: string
      description: Bare effect id to create under the local pack, e.g. glass-product-card.
    outputs:
    - name: report
      type: file
      path_template: '{out}/html_canvas_effect.report.json'
    - name: timeline
      type: file
      path_template: '{out}/timeline.json'
      artifact_type: timeline
    - name: assets
      type: file
      path_template: '{out}/assets.json'
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_module: astrid.packs.rendering.actions.html_canvas_effect.run
      runtime_file: actions/html_canvas_effect/run.py
      creates: astrid/packs/local/rendering/elements/effects/<effect_id>
      render_path: rendering.render remains the final Remotion compositor.
      remotion_min_version: 4.0.455
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.rendering.actions.html_canvas_effect.run
        - --effect-id
        - '{effect_id}'
        - --out
        - '{report}'
        - --timeline
        - '{timeline}'
        - --assets
        - '{assets}'
    resources:
    - kind: documentation
      path: actions/html_canvas_effect/STAGE.md
    - kind: implementation
      path: actions/html_canvas_effect/run.py
    - kind: asset
      path: actions/html_canvas_effect/templates/card/component.tsx
  timeline_storyboard:
    name: Timeline Storyboard
    version: '1.0'
    short_description: Build a static visual storyboard of image inputs associated
      with timeline shots.
    description: Read a timeline and asset registry, resolve each pinned shot's ordered
      image inputs, and write a read-only JSON view model plus static HTML storyboard.
    keywords:
    - timeline
    - storyboard
    - preview
    - image
    - shot
    - range
    - input
    inputs:
    - name: timeline
      type: file
      required: true
      artifact_type: timeline
      description: Timeline JSON containing clips and pinnedShotGroups.
    - name: assets_registry
      type: file
      required: true
      artifact_type: timeline/assets
      description: Asset registry JSON used to resolve input image references.
    - name: shot_id
      type: string
      required: false
      description: Optional pinned shot id to preview; all pinned shots are included
        when omitted.
    outputs:
    - name: preview_json
      type: file
      path_template: '{out}/preview.json'
      description: Normalized read-only storyboard view model.
    - name: preview_png
      type: file
      path_template: '{out}/preview.png'
      description: Deterministic two-column contact sheet of resolved input images.
    - name: preview_html
      type: file
      path_template: '{out}/preview.html'
      description: Static visual storyboard with clickable input images.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/timeline_storyboard/run.py
      runtime_module: astrid.packs.rendering.actions.timeline_storyboard.run
      output_result_manifest: true
      requires_timeline: false
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.rendering.actions.timeline_storyboard.run
        - --timeline
        - '{timeline}'
        - --assets-registry
        - '{assets_registry}'
        - --out
        - '{out}'
        input_args:
        - flag: --shot-id
          input: shot_id
          optional: true
          repeatable: false
    resources:
    - kind: documentation
      path: actions/timeline_storyboard/STAGE.md
    - kind: implementation
      path: actions/timeline_storyboard/__init__.py
    - kind: implementation
      path: actions/timeline_storyboard/run.py
  render:
    cache:
      always_run: false
      mode: sentinel
      per_brief: true
      sentinels:
      - hype.mp4
    clip_kinds_supported:
    - video
    - image
    - audio
    - text
    - effect
    conditions: []
    description: Render the brief timeline through the selected backend. Opaque output
      defaults to MP4; explicitly alpha-stamped layers may publish ProRes 4444 MOV.
    graph:
      consumes: []
      depends_on:
      - editorial.transcribe
      - editorial.scenes
      - editorial.quality_zones
      - editorial.shots
      - editorial.triage
      - understanding.scene_describe
      - editorial.quote_scout
      - training.pool_build
      - training.pool_merge
      - editorial.arrange
      - video_editing.cut
      - editorial.refine
      provides:
      - rendered_video
    inputs:
    - description: Optional file-mode timeline document, admitted and materialized
        through the normal file-input boundary; mutually exclusive with timeline_ref.
      name: timeline
      required: false
      type: file
      artifact_type: timeline/document
    - description: Explicit canonical runtime timeline slug, UUID, or ULID.
      name: timeline_ref
      required: false
      type: string
    - description: Optional CAS pin for managed timeline_ref mode; stale values fail
        before run admission.
      name: expected_version
      required: false
      type: integer
    - description: Kernel-resolved timeline identity and content hashes stamped into
        render provenance.
      name: timeline_authority
      required: false
      type: json
    - description: ''
      name: assets_registry
      required: false
      type: file
      artifact_type: timeline/assets
    - description: One separately admitted media file for a registry bound to media_dependency.
        Its CAS identity and byte size must match every registry media asset.
      name: media_dependency
      required: false
      type: file
    - description: ''
      name: theme
      required: false
      type: file
    - description: 'Qualified renderer id: rendering.remotion, rendering.ffmpeg, or
        rendering.threejs.'
      name: selector
      required: false
      type: string
    - description: JSON object keyed by qualified backend id with per-backend configuration.
        The facade forwards only the selected implementation's namespace.
      name: backend_config
      required: false
      type: json
    - description: Requested render profile mapping. The selected backend validates
        it against the media it can actually produce.
      name: profile
      required: false
      type: json
    - description: Plain output filename with no separators or traversal. Defaults
        to hype.mp4. A timeline stamped metadata.astrid_layer.alpha=true may request
        .mov for ProRes 4444/PCM output; an explicit profile must match that alpha
        mux.
      name: output_name
      required: false
      type: string
      default: hype.mp4
    - description: Preserve previous provenance-linked hype.mp4 outputs for the same
        timeline.
      name: keep_previous_renders
      required: false
      type: boolean
    - description: Host-owned attempt-local managed object root.
      name: materialized_root
      required: false
      type: file
    - description: Host-owned object-id to attempt-local path handoff.
      name: materialized_objects
      required: false
      type: json
    - name: review
      type: boolean
      required: false
      description: Render-only shot-name and timeline-clock overlay.
    - name: review_context
      type: json
      required: false
      description: Admission-owned snapshot of registered shot names and timeline
        ranges.
    - name: delivery_audio
      type: json
      required: false
      description: 'Opt-in final audio master: lufs target and true_peak ceiling; video is stream-copied. Omit for no mastering.'
    - name: speech_annotations
      type: json
      required: false
      description: Explicit verified speech annotations retained in the immutable
        render envelope.
    - name: speech_occurrences
      type: json
      required: false
      description: Explicit render occurrences linked to verified speech annotations.
    - name: source_audio_digest
      type: string
      required: false
      description: Hash-bound source media digest for frozen speech projection.
    - name: transcript_digest
      type: string
      required: false
      description: Hash-bound transcript digest for frozen speech projection.
    - name: annotation_digest
      type: string
      required: false
      description: Hash-bound annotation-source digest for frozen speech projection.
    - name: correction_version
      type: integer
      required: false
      description: Frozen correction revision for the verified speech annotation set.
    - name: timing_method
      type: string
      required: false
      description: Frozen timing method for explicit speech projection.
    - name: speech_coverage
      type: json
      required: false
      description: Frozen speech projection coverage summary.
    isolation:
      binaries: []
      mode: subprocess
      network: false
      requirements: []
    keywords:
    - render
    - video
    - timeline
    - hype
    - mp4
    - backend
    metadata:
      auto_forward_skip:
      - timeline_ref
      - expected_version
      - speech_annotations
      - speech_occurrences
      - source_audio_digest
      - transcript_digest
      - annotation_digest
      - correction_version
      - timing_method
      - speech_coverage
      requires_remotion: true
      requires_timeline: false
      command_builder: astrid.packs.video_editing.actions.hype.run.build_pool_steps
      pipeline_step: render
      pipeline_step_order: 12
      runtime_entrypoint: main
      runtime_file: actions/render/run.py
      runtime_module: astrid.packs.rendering.actions.render.run
    name: Render
    outputs:
    - description: ''
      mode: create_or_replace
      name: video
      path_template: '{out}/{output_name}'
      type: file
      artifact_type: clip/visual
    - description: Render provenance sidecar for the video output.
      mode: create_or_replace
      name: provenance
      path_template: '{out}/{output_name}.provenance.json'
      type: file
      artifact_type: metadata/provenance
    pipeline_requirements:
    - timeline
    - assets
    - theme
    short_description: Render a hype timeline to opaque MP4 or explicitly stamped
      alpha MOV through the selected backend.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.rendering.actions.render.run
        - --timeline
        - '{timeline}'
        - --out
        - '{out}/{output_name}'
        input_args:
        - input: assets_registry
          flag: --assets
          optional: true
          before: --out
        - input: media_dependency
          flag: --media-dependency
          optional: true
        - input: theme
          flag: --theme
          optional: true
        - input: selector
          flag: --selector
          optional: true
        - input: backend_config
          flag: --backend-config
          optional: true
        - input: profile
          flag: --profile
          optional: true
        - input: output_name
          flag: --output-name
          optional: true
        - input: keep_previous_renders
          flag: --keep-previous-renders
          optional: true
        - input: timeline_authority
          flag: --timeline-authority
          optional: true
        - input: materialized_root
          flag: --materialized-root
          optional: true
        - input: materialized_objects
          flag: --materialized-objects
          optional: true
        - input: review
          flag: --review
          optional: true
        - input: review_context
          flag: --review-context
          optional: true
        - input: delivery_audio
          flag: --delivery-audio
          optional: true
    resources:
    - kind: documentation
      path: actions/render/STAGE.md
    - kind: implementation
      path: actions/render/__init__.py
    - kind: implementation
      path: actions/render/audio_reactive_colour.py
    - kind: implementation
      path: actions/render/managed_timeline.py
    - kind: implementation
      path: actions/render/run.py
    - kind: implementation
      path: actions/render/task_adapter.py
  sprite_sheet:
    cache:
      mode: none
    description: Generate, slice, and preview GPT Image sprite sheets.
    inputs:
    - description: Animation to depict across frames.
      name: animation
      type: string
    - description: Character or object being animated.
      name: subject
      type: string
    - default: ''
      description: Optional reference image for preserving the character/object identity
        while generating the sprite sheet.
      name: reference_image
      required: false
      type: path
      artifact_type: image
    isolation:
      binaries:
      - ffmpeg
      mode: subprocess
      network: true
    keywords:
    - image
    - sprite
    - openai
    - gpt-image
    - slice
    - batch
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_file: actions/sprite_sheet/run.py
      runtime_module: astrid.packs.rendering.actions.sprite_sheet.run
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.openai.com:443
        - queue.fal.run:443
        - fal.run:443
        - storage.fal.run:443
        allow_redirects: false
    name: Sprite Sheet
    outputs:
    - description: Manifest for generated sprite assets.
      name: sprite_manifest
      path_template: '{out}/sprite_manifest.json'
      type: file
    - description: Generated sprite atlas.
      name: sprite_sheet
      path_template: '{out}/sprite_sheet.png'
      type: file
      artifact_type: image
    - description: Alpha-processed sprite atlas.
      name: sprite_sheet_alpha
      path_template: '{out}/sprite_sheet_alpha.png'
      type: file
      artifact_type: image
    - description: MP4 preview of the sliced animation.
      name: preview
      path_template: '{out}/sprite_preview.mp4'
      type: file
      artifact_type: video/clip
    short_description: Generate, slice, and preview GPT Image sprite sheets for batch
      image work.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.rendering.actions.sprite_sheet.run
        - --animation
        - '{animation}'
        - --subject
        - '{subject}'
        - --reference-image
        - '{reference_image}'
        - --out-dir
        - '{out}'
    resources:
    - kind: documentation
      path: actions/sprite_sheet/STAGE.md
    - kind: implementation
      path: actions/sprite_sheet/__init__.py
    - kind: implementation
      path: actions/sprite_sheet/png_io.py
    - kind: implementation
