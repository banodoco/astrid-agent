schema_version: 3
id: rendering
name: Astrid Rendering
version: 1.0.0
status: active
domain: media
stability: stable
support: core
visibility: visible
permissions:
- id: subprocess
  reason: Runs Remotion render process and ffmpeg sprite processing.
- id: project_files
  reason: Reads timeline, asset, and theme files; writes rendered video.
- id: network
  reason: Sprite sheet executor calls OpenAI GPT Image API.
description: Author, inspect, preview, and render runtime-owned timelines; visualize
  them as deterministic evidence packs; generate GPT-Image sprite sheets; and supply
  render-time animation/transition/effect elements.
keywords:
- render
- remotion
- video
- mp4
- timeline
- visualize
- evidence
- sprite-sheet
- gpt-image
- animation
capabilities:
- render_timeline
- generate_sprite_sheet
- scaffold_html_canvas_effect
agent:
  purpose: Choose this pack for runtime-owned timeline authoring and inspection, candidate
    preview/publication, finished video rendering, deterministic visual evidence,
    GPT Image sprite sheets, or canvas/WebGL post-processing effects.
  do_not_use_for: Publishing rendered output to external services.
  normal_entrypoints:
  - rendering.render
  - rendering.sprite_sheet
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  timeline:
    checks:
      - extensions/timeline.check/damaged_art.yaml
actions:
  assemble_timeline:
    name: Assemble Canonical Timeline
    version: '1.0'
    short_description: Author a canonical two-child timeline from runtime-resolved
      visual outputs.
    description: Validate a fenced two-child runtime continuation and emit a deterministic
      canonical timeline authoring proposal. Timeline mutation and rendering remain
      runtime-owned.
    keywords:
    - timeline
    - assemble
    - continuation
    - runtime
    - canonical
    - video
    inputs:
    - name: resolved_children
      type: json
      required: true
      artifact_type: runtime/resolved-children
      description: Runtime-resolved continuation graph, terminal child outputs, and
        ordered CAS aggregation.
    outputs:
    - name: timeline
      type: file
      mode: create_or_replace
      path_template: '{out}/timeline.json'
      artifact_type: timeline
      description: Deterministic canonical TimelineConfig proposal.
    - name: assets
      type: file
      mode: create_or_replace
      path_template: '{out}/assets.json'
      artifact_type: timeline/assets
      description: Runtime-managed media registry proposal for the timeline clips.
    - name: authoring_proposal
      type: file
      mode: create_or_replace
      path_template: '{out}/authoring-proposal.json'
      artifact_type: timeline/authoring-proposal
      description: Typed runtime publication handoff containing the timeline and registry.
    graph:
      consumes:
      - runtime/resolved-children
      provides:
      - timeline
      - timeline/assets
      - timeline/authoring-proposal
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/assemble_timeline/run.py
      runtime_module: astrid.packs.rendering.actions.assemble_timeline.run
      output_result_manifest: true
      requires_timeline: false
      mutation_authority: workspace_runtime
      continuation_shape: two-child-ordered-cas-v1
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.rendering.actions.assemble_timeline.run
        - --resolved-children
        - '{resolved_children}'
        - --out
        - '{out}'
    resources:
    - kind: implementation
      path: actions/assemble_timeline/run.py
  timeline_visualize:
    name: Timeline Visualize
    version: '1.0'
    short_description: Private backend for composed timeline visualization.
    description: Internal managed executor used by the canonical timelines.visualize
      operation to inspect an exact admitted render or produce a structural revision
      diff from two host-compiled immutable bundles. This backend is not a public
      capability and must not be invoked directly.
    keywords:
    - timeline
    - visualize
    - evidence
    - agent
    - png
    inputs:
    - name: project_slug
      type: string
      required: false
      description: Owning Astrid project slug. In a project-scoped SDK invocation
        this is derived from project=<slug>; pass it for a standalone runner invocation.
    - name: timeline_slug
      type: string
      required: false
      description: Managed timeline reference by slug, UUID, or ULID; omission selects
        the project default.
    - name: shot
      type: string
      required: false
      description: Authored pinnedShotGroups[].shotId to focus.
    - name: range
      type: string
      required: false
      description: Closed-open START..END window; times are seconds or [HH:]MM:SS[.fff].
    - name: at
      type: string
      required: false
      description: Timestamp to inspect, in seconds or [HH:]MM:SS[.fff].
    - name: frame
      type: integer
      required: false
      description: Exact rendered frame number to capture; mutually exclusive with
        range and at.
    - name: clip
      type: string
      required: false
      description: Authored clip id to focus.
    - name: asset
      type: string
      required: false
      description: Canonical asset key to inspect with every timeline use.
    - name: show
      type: string
      required: false
      description: 'Add synchronized components (repeatable/comma-separated): output,
        text, audio, or inputs.'
    - name: hide
      type: string
      required: false
      description: Hide synchronized components (repeatable/comma-separated).
    - name: track
      type: string
      required: false
      description: Restrict input lanes to one or more track ids.
    - name: detail
      type: boolean
      required: false
      default: false
      description: Request detail treatment for the shared current selection.
    - name: context
      type: number
      required: false
      default: 3.0
      description: Symmetric context seconds for clip or timestamp focus.
    - name: neighbors
      type: integer
      required: false
      default: 0
      description: Previous and next clips retained on a focused clip's track.
    - name: formats
      type: string
      required: false
      description: Optional presentation format list. Choices are png or md (default
        png,md). Core machine artifacts are always written.
    - name: rendered_video
      type: file
      required: false
      description: Host-injected attempt-local rendered video; callers select it with
        render_run.
    - name: materialized_root
      type: file
      required: false
      description: Host-owned attempt-local managed object root.
    - name: materialized_objects
      type: json
      required: false
      description: Host-owned object-id to attempt-local path handoff.
    - name: timeline
      type: file
      required: false
      description: Host-injected materialized canonical timeline config for composed
        frame capture.
    - name: assets_registry
      type: file
      required: false
      description: Host-injected materialized asset registry for composed frame capture.
    - name: transcript.json
      type: file
      required: false
      description: Host-staged bytes for the hash-bound config.app.transcript declaration;
        callers cannot provide this path.
    - name: view
      type: string
      required: false
      description: 'Presentation: filmstrip (default), contact overview, bounded motion sheet, or immutable revision diff.'
      default: filmstrip
    - name: before_revision_id
      type: string
      required: false
      description: Required with view=diff; exact immutable before revision selector with no current-head fallback.
    - name: after_revision_id
      type: string
      required: false
      description: Required with view=diff; exact immutable after revision selector with no current-head fallback.
    - name: edited
      type: string
      required: false
      description: 'Diff view only: the cut numbers you meant to edit (comma-separated); a change anywhere else is a SCOPE warning.'
    - name: revision_diff
      type: json
      required: false
      description: Host-injected compiled astrid.timeline_revision_diff.v1 JSON; caller-supplied values are rejected by native preflight.
    - name: cut
      type: string
      required: false
      description: Motion cut number, picture clip id, or @seconds selector.
    - name: layers
      type: string
      required: false
      description: Repeatable/comma-separated registered visualization layer names.
    - name: beats
      type: json
      required: false
      description: Caller-resolved beats object containing beats, downbeats, and hits.
    - name: frame_budget
      type: integer
      required: false
      description: Motion frame budget, bounded to 1–120 by the action.
    - name: preset
      type: string
      required: false
      description: 'Motion window preset: scan, motion, beat, frame, or cut.'
    - name: window_s
      type: number
      required: false
      description: Motion window width in seconds around an at selector.
    - name: rules
      type: json
      required: false
      description: Caller-resolved visualization rules object.
    - name: highlight
      type: string
      required: false
      description: A clip id to outline over the frames (the client resolves --highlight
        c41.tool-16); turns on the bounds layer.
    - name: cuts
      type: string
      required: false
      description: Contact-only positive cut numbers, comma-separated and bounded to 120.
    - name: render_every
      type: number
      required: false
      description: 'Contact view of a render (render_run): seconds between sampled
        frames (default 5, 0.5 to 60).'
    - name: preview
      type: boolean
      required: false
      default: false
      description: Motion-only timing-faithful GIF from already captured frames.
    - name: sample
      type: string
      required: false
      description: 'Filmstrip sampling: interval (default), clips (picture clips),
        cuts (cut boundaries), or shots (authored story beats).'
    - name: every
      type: number
      required: false
      description: Filmstrip interval in seconds (default 0.5 when every_frames is
        absent).
    - name: every_frames
      type: integer
      required: false
      description: Positive integer rendered frame interval, mutually exclusive with
        every.
    - name: include_cuts
      type: boolean
      required: false
      default: false
      description: For interval sampling, explicitly include visual cut-neighbor frames.
    - name: render_run
      type: string
      required: false
      description: Exact successful rendering.render run id, or latest; filmstrip
        defaults to latest matching timeline render.
    - name: include_media
      type: boolean
      required: false
      default: false
      description: Explicitly include a relative, digest-verified copy of the admitted
        rendered video for offline playback.
    - name: columns
      type: integer
      required: false
      description: Filmstrip contact sheet columns, default 5.
    - name: page_size
      type: integer
      required: false
      description: Filmstrip static page card count, default 50.
    - name: resolution
      type: string
      required: false
      description: Optional exact filmstrip frame resolution WIDTHxHEIGHT; recorded
        separately and applied by the frame extractor.
    - name: filmstrip_authority
      type: string
      required: false
      description: Internal SDK-injected trusted filmstrip snapshot manifest. Public
        caller values are rejected.
    outputs:
    - name: pack_root
      type: directory
      mode: create_or_replace
      path_template: '{out}/filmstrip-view'
      artifact_type: evidence/timeline-visualization
      description: Browsable deterministic evidence-pack directory. Kernel SDK invocations
        materialize this as a durable, non-authoritative project cache; use manifest_path
        for navigation authority.
    - name: manifest_path
      type: file
      mode: create_or_replace
      path_template: '{out}/filmstrip-view/manifest.json'
      artifact_type: metadata/result-manifest
      description: Durable managed result manifest and authoritative agent navigation
        handle.
    - name: filmstrip_bundle
      type: file
      mode: create_or_replace
      path_template: '{out}/filmstrip-bundle.zip'
      artifact_type: archive/filmstrip
      description: Rendered filmstrip delivery artifact; produced for view=filmstrip.
    - name: filmstrip_manifest
      type: file
      mode: create_or_replace
      path_template: '{out}/filmstrip-view/manifest.json'
      artifact_type: metadata/result-manifest
      description: Rendered filmstrip delivery artifact; produced for view=filmstrip.
    cache:
      mode: none
    conditions: []
    graph:
      consumes:
      - runtime_timeline_documents
      depends_on: []
      provides:
      - timeline_visualization_evidence
    isolation:
      mode: subprocess
      network: false
      binaries:
      - ffmpeg
      requirements: []
      env_passthrough:
      - ASTRID_NODE_EXECUTABLE
      - ASTRID_REMOTION_PROJECT_DIR
      - ASTRID_TIMELINE_SCHEMA_PYTHONPATH
      - PYTHONPATH
    metadata:
      visibility: internal
      runtime_entrypoint: run_sdk
      runtime_file: actions/timeline_visualize/run.py
      runtime_module: astrid.packs.rendering.actions.timeline_visualize.run
      output_result_manifest: true
      requires_timeline: false
      run_metadata:
        evidence: true
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.rendering.actions.timeline_visualize.run
        - --out
        - '{out}'
        input_args:
