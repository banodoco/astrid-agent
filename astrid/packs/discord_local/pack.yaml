schema_version: 3
id: discord_local
name: Personal Discord Browser Adapter
version: 0.1.0
status: experimental
domain: integration
stability: experimental
support: project
extensions:
  astrid:
    project_scope: optional
visibility: visible
description: Personal, bounded Discord slash-command generation and result-recovery adapter.
keywords:
  - discord
  - browser
  - generation
  - experiment
  - watcher
capabilities:
  - run_discord_generation
  - recover_discord_generation
permissions:
  - id: network
    reason: Uses Discord and downloads completed Discord attachments.
  - id: subprocess
    reason: Runs the local Node browser controller and headed Chrome.
  - id: project_files
    reason: Reads command/reference files and writes experiment-ready run artifacts.
  - id: external_services
    reason: Uses the signed-in Discord account and the selected Discord generation bot.
agent:
  purpose: Use for one bounded personal Discord generation preview, submission, or completed-result recovery.
  do_not_use_for: Do not use for unattended queues, indefinite watching, Discord account setup, or non-generation chat automation.
  normal_entrypoints:
    - discord_local.command
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  command:
    name: Personal Discord generation
    version: 0.1.0
    short_description: Preview, submit once, or recover one Discord generation as an experiment-ready run.
    description: Wraps the local headed Chrome Discord runner as one bounded attempt. It stages ordered references, watches for one correlated response, downloads media, and emits a sanitized universal result manifest.
    keywords:
      - discord
      - browser
      - generation
      - experiment
      - watcher
      - recover
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.discord_local.actions.command.run
          - "--out"
          - "{out}"
        input_args:
          - input: mode
            flag: --mode
            optional: false
          - input: channel_url
            flag: --channel-url
            optional: true
          - input: variant
            flag: --variant
            optional: true
          - input: command_file
            flag: --command-file
            optional: true
          - input: after
            flag: --after
            optional: true
          - input: match
            flag: --match
            optional: true
          - input: link_match
            flag: --link-match
            optional: true
          - input: expected_author
            flag: --expected-author
            optional: true
          - input: response_message_id
            flag: --response-message-id
            optional: true
          - input: exclude_filenames
            flag: --exclude-filenames
            optional: true
          - input: timeout_seconds
            flag: --timeout-seconds
            optional: true
          - input: profile_dir
            flag: --profile-dir
            optional: true
          - input: runner_script
            flag: --runner-script
            optional: false
          - input: cdp_port
            flag: --cdp-port
            optional: true
    inputs:
      - name: mode
        type: string
        required: true
        description: preview, queue, submit, or fetch.
      - name: channel_url
        type: string
        required: false
        description: Explicit Discord channel URL. Omit when selecting a configured variant.
      - name: variant
        type: string
        required: false
        description: Configured model/channel profile such as v1 or v2.
      - name: command_file
        type: file
        required: false
        description: Slash-command text file. Required for preview/submit and recommended for fetch provenance.
      - name: after
        type: string
        required: false
        description: ISO timestamp boundary required by fetch mode.
      - name: match
        type: string
        required: false
        description: Required substring in the response message or attachment URL.
      - name: link_match
        type: string
        required: false
        description: Required substring in an attachment URL, such as .mp4.
      - name: expected_author
        type: string
        required: false
        description: Visible author label required on a matching response.
      - name: response_message_id
        type: string
        required: false
        description: Known Discord response snowflake to deep-link before a fetch.
      - name: exclude_filenames
        type: string
        required: false
        description: Comma-separated input basenames to exclude from watcher matches.
      - name: timeout_seconds
        type: integer
        required: false
        description: Bounded browser/watcher timeout, 30 through 7200 seconds.
      - name: profile_dir
        type: directory
        required: false
        description: Dedicated persistent Chrome profile directory; defaults to the user state directory under ~/.astrid.
      - name: runner_script
        type: file
        required: true
        description: Explicit path to the separately installed discord-command-poc.mjs runner script.
      - name: cdp_port
        type: integer
        required: false
        description: Localhost Chrome DevTools port; defaults to 9333.
    outputs:
      - name: run_bundle
        type: directory
        path_template: "{out}"
        mode: create_or_replace
        description: Canonical result, manifest, staged inputs, generated outputs, and debug evidence.
    resources:
      - kind: implementation
        path: actions/command/__init__.py
      - kind: implementation
        path: actions/command/run.py
      - kind: documentation
        path: actions/command/STAGE.md
    graph:
      consumes:
        - discord_command
        - reference_media
      depends_on: []
      provides:
        - generation_result_manifest
    isolation:
      mode: subprocess
      network: true
      binaries:
        - node
      requirements:
        - PyYAML>=6,<7
    cache:
      mode: none
    conditions:
      - kind: requires_input
        input: mode
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/command/run.py
      runtime_module: astrid.packs.discord_local.actions.command.run
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - discord.com:443
        - cdn.discordapp.com:443
        - cdn.discordapp.net:443
        - media.discordapp.com:443
        - media.discordapp.net:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
resources:
  - kind: configuration
    path: model_variants.json
  - kind: documentation
    path: README.md
  - kind: agents
    path: AGENTS.md
