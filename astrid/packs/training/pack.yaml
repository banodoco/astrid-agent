schema_version: 3
id: training
name: Astrid Training
version: 1.0.0
status: active
domain: development
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs training dataset and pool actions as subprocesses.
  - id: project_files
    reason: Reads and writes candidate pools, datasets, and training artifacts.
  - id: network
    reason: Training actions may provision RunPod GPUs, download checkpoints, or query Hugging Face when requested.
  - id: environment
    reason: Reads RunPod and optional Hugging Face API credentials for declared operations.
description: Build video training datasets and run LoRA training end to end — clip pools, captioning/review, RunPod-backed trainer execution, and checkpoint registration.
keywords:
  - training
  - lora
  - dataset
  - captioning
  - runpod
  - checkpoint
  - pool
  - huggingface
capabilities:
  - build_dataset
  - run_training
  - build_clip_pool
  - merge_clip_pool
  - search_loras
agent:
  purpose: Choose this pack to assemble a video training dataset (acquire, split, caption, review) or to run a LoRA training job that provisions GPUs, executes the trainer remotely, pulls checkpoints, and registers artifacts.
  do_not_use_for: Not for raw GPU provisioning or one-off remote script execution on its own; use the runpod pack for bare pod lifecycle control.
  normal_entrypoints:
    - training.training_run
    - training.dataset_build
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  pool_build:
    name: Pool Build
    version: "1.0"
    short_description: Build the candidate clip pool from triaged source-video scenes.
    description: Build the candidate clip pool from triaged source-video scenes.
    keywords: [pool, video, scenes, build, clips, pipeline]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.training.actions.pool_build.run
          - "--out"
          - "{out}/pool.json"
          - "--source-slug"
          - "{source_slug}"
        input_args:
          - {input: triage, flag: --triage, optional: true}
          - {input: scene_descriptions, flag: --scene-descriptions, optional: true}
          - {input: quote_candidates, flag: --quote-candidates, optional: true}
          - {input: transcript, flag: --transcript, optional: true}
          - {input: scenes, flag: --scenes, optional: true}
    inputs:
      - {name: triage, type: file, required: false, description: Scene triage decisions.}
      - {name: scene_descriptions, type: file, required: false, description: Vision-model scene captions.}
      - {name: quote_candidates, type: file, required: false, description: Quote-scout candidate selections.}
      - {name: transcript, type: file, required: false, description: Whisper transcript JSON.}
      - {name: scenes, type: file, required: false, description: Scene boundary manifest.}
    outputs:
      - name: pool
        type: file
        path_template: "{out}/pool.json"
        mode: create_or_replace
        artifact_type: pool
        description: Candidate clip pool.
    clip_kinds_supported: [video, audio]
    pipeline_requirements: [scene_triage, scene_descriptions, quote_candidates]
    conditions: []
    graph:
      consumes: []
      depends_on:
        - editorial.transcribe
        - editorial.scenes
        - editorial.quality_zones
        - editorial.shots
        - editorial.triage
        - understanding.scene_describe
        - editorial.quote_scout
      provides: [pool]
    cache:
      always_run: false
      mode: sentinel
      per_brief: false
      sentinels: [pool.json]
    isolation:
      binaries: []
      mode: subprocess
      network: false
      requirements: []
    metadata:
      output_result_manifest: true
      command_builder: astrid.packs.video_editing.actions.hype.run.build_pool_steps
      pipeline_step: pool_build
      pipeline_step_order: 7
      runtime_entrypoint: main
      runtime_file: actions/pool_build/run.py
      runtime_module: astrid.packs.training.actions.pool_build.run
    resources:
      - {kind: implementation, path: actions/pool_build/__init__.py}
      - {kind: implementation, path: actions/pool_build/run.py}
      - {kind: documentation, path: actions/pool_build/STAGE.md}
  pool_merge:
    name: Pool Merge
    version: "1.0"
    short_description: Merge multiple candidate clip pools into a unified pool for arrangement.
    description: Merge multiple candidate clip pools into a unified pool for arrangement.
    keywords: [pool, merge, clips, video, pipeline, arrange]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.training.actions.pool_merge.run
          - "--out"
          - "{out}/pool.json"
        input_args:
          - {input: pool, flag: --pool, optional: true}
          - {input: theme, flag: --theme, optional: true}
    inputs:
      - {name: pool, type: file, required: false, description: Input pool(s) to merge.}
      - {name: theme, type: file, required: false, description: Theme configuration file.}
    outputs:
      - name: pool
        type: file
        path_template: "{out}/pool.json"
        mode: mutate
        description: Unified merged clip pool.
    clip_kinds_supported: [video, image, audio, text, effect]
    pipeline_requirements: [brief]
    conditions: []
    graph:
      consumes: []
      depends_on:
        - editorial.transcribe
        - editorial.scenes
        - editorial.quality_zones
        - editorial.shots
        - editorial.triage
        - understanding.scene_describe
        - editorial.quote_scout
        - training.pool_build
      provides: [pool]
    cache:
      always_run: true
      mode: always_run
      per_brief: false
      sentinels: []
    isolation:
      binaries: []
      mode: subprocess
      network: false
      requirements: []
    metadata:
      command_builder: astrid.packs.video_editing.actions.hype.run.build_pool_steps
      output_result_manifest: true
      pipeline_step: pool_merge
      pipeline_step_order: 8
      runtime_entrypoint: main
      runtime_file: actions/pool_merge/run.py
      runtime_module: astrid.packs.training.actions.pool_merge.run
    resources:
      - {kind: implementation, path: actions/pool_merge/__init__.py}
      - {kind: implementation, path: actions/pool_merge/run.py}
      - {kind: documentation, path: actions/pool_merge/STAGE.md}
  search_loras:
    name: Search LoRAs
    version: "1.0"
    short_description: Search Hugging Face Hub for LoRAs associated with a base model.
    description: Search Hugging Face Hub for LoRA adapter repositories associated with a provided base model.
    keywords: [huggingface, hub, lora, adapter, search, model]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.training.actions.search_loras.run
          - --mode
          - "{mode}"
          - --base-model
          - "{base_model}"
          - --query
          - "{query}"
          - --match
          - "{match}"
          - --match-mode
          - "{match_mode}"
          - --limit
          - "{limit}"
          - --fetch-limit
          - "{fetch_limit}"
          - --sort
          - "{sort}"
          - --direction
          - "{direction}"
          - --base-model-match
          - "{base_model_match}"
          - --out
          - "{out}/search-loras.json"
    inputs:
      - {name: base_model, type: string, required: false, default: "", description: Hugging Face base model repo id.}
      - {name: mode, type: string, required: false, default: search, description: Search or base-model discovery mode.}
      - {name: query, type: string, required: false, default: "", description: Optional Hugging Face API text search.}
      - {name: match, type: string, required: false, default: "", description: Comma-separated local match terms.}
      - {name: match_mode, type: string, required: false, default: all, description: Local match mode.}
      - {name: limit, type: integer, required: false, default: 0, description: Maximum result count.}
      - {name: fetch_limit, type: integer, required: false, default: 0, description: Hub fetch limit before local matching.}
      - {name: sort, type: string, required: false, default: downloads, description: Hub sort field.}
      - {name: direction, type: string, required: false, default: "-1", description: Sort direction.}
      - {name: base_model_match, type: string, required: false, default: "", description: Base-model id substring filter.}
    outputs:
      - name: results
        type: file
        path_template: "{out}/search-loras.json"
        mode: create_or_replace
        description: Hugging Face LoRA search results.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
    metadata:
      requires_timeline: false
      api_provider: huggingface
      env: [HF_TOKEN, HUGGING_FACE_HUB_TOKEN]
      runtime_entrypoint: main
      runtime_file: actions/search_loras/run.py
      runtime_module: astrid.packs.training.actions.search_loras.run
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [huggingface.co:443, cdn-lfs.huggingface.co:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
    resources:
      - {kind: implementation, path: actions/search_loras/__init__.py}
      - {kind: implementation, path: actions/search_loras/run.py}
      - {kind: documentation, path: actions/search_loras/STAGE.md}
  dataset_build:
    name: Dataset Build
    version: 0.1.0
    short_description: Build a generic reviewed video training dataset from configured sources.
    description: Coordinates source acquisition, scene splitting, filtering, captioning, human review, and manifest export for generic built-in video training datasets.
    keywords: [dataset, training, video, captioning, review, manifest]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.training.actions.dataset_build.run
          - --config
          - "{config}"
          - --out
          - "{out}"
    inputs:
      - {name: config, type: path, required: true, description: Dataset build config JSON or YAML.}
      - {name: out, type: path, required: true, description: Run output directory.}
    outputs:
      - {name: final.manifest.json, type: json, mode: create_or_replace, path_template: "{out}/final.manifest.json", description: Canonical manifest containing accepted dataset clips.}
      - {name: ai_toolkit_ltx_manifest, type: json, mode: create_or_replace, path_template: "{out}/manifests/ai-toolkit-ltx/manifest.json", description: Adapter manifest for ai-toolkit LTX training.}
      - {name: quality_report.json, type: json, mode: create_or_replace, path_template: "{out}/quality_report.json", description: "Dataset quality report with filter, caption-validation, budget, and shortfall observations."}
    graph:
      child_actions:
        - youtube.youtube_audio
        - editorial.scenes
        - editorial.transcribe
        - understanding.visual_understand
        - understanding.video_understand
        - editorial.human_review
      child_orchestrators: []
    cache:
      mode: none
    metadata:
      plan_builder_entrypoint: build_plan_v2
      plan_builder_module: astrid.packs.training.actions.dataset_build.plan_template
      runtime_module: astrid.packs.training.actions.dataset_build.run
      runtime_file: actions/dataset_build/run.py
      runtime_entrypoint: main
      package_paths:
        source_providers: actions/dataset_build/source_providers/
        caption_providers: actions/dataset_build/caption_providers/
        filter_stages: actions/dataset_build/filter_stages/
        manifest_adapters: shared/manifest_adapters/
        review_ui: actions/dataset_build/review_ui/
        schemas: actions/dataset_build/schemas/
    resources:
      - {kind: implementation, path: actions/dataset_build/__init__.py}
      - {kind: implementation, path: actions/dataset_build/acquisition.py}
      - {kind: implementation, path: actions/dataset_build/artifacts.py}
      - {kind: implementation, path: actions/dataset_build/budget.py}
      - {kind: implementation, path: actions/dataset_build/caption_providers/__init__.py}
      - {kind: implementation, path: actions/dataset_build/caption_providers/understanding.py}
      - {kind: implementation, path: actions/dataset_build/caption_validation.py}
      - {kind: implementation, path: actions/dataset_build/config.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/__init__.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/_common.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/black_frame.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/bucket_judge.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/content_hash.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/duration.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/near_duplicate.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/resolution.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/rights.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/semantic.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/source_cap.py}
      - {kind: implementation, path: actions/dataset_build/filter_stages/transcript_keyword.py}
      - {kind: implementation, path: actions/dataset_build/media.py}
      - {kind: implementation, path: actions/dataset_build/phases.py}
      - {kind: implementation, path: actions/dataset_build/reports/__init__.py}
      - {kind: implementation, path: actions/dataset_build/reports/quality_report.py}
      - {kind: implementation, path: actions/dataset_build/review.py}
      - {kind: implementation, path: actions/dataset_build/run.py}
      - {kind: implementation, path: actions/dataset_build/services.py}
      - {kind: implementation, path: actions/dataset_build/source_providers/__init__.py}
      - {kind: implementation, path: actions/dataset_build/source_providers/local_folder.py}
      - {kind: implementation, path: actions/dataset_build/source_providers/youtube.py}
      - {kind: implementation, path: actions/dataset_build/state.py}
      - {kind: documentation, path: actions/dataset_build/STAGE.md}
      - {kind: ui, path: actions/dataset_build/review_ui/app.js}
      - {kind: ui, path: actions/dataset_build/review_ui/index.html}
      - {kind: ui, path: actions/dataset_build/review_ui/styles.css}
      - {kind: schema, path: actions/dataset_build/schemas/ai-toolkit-adapter-manifest.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/candidate-item.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/dataset-config.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/filter-stats.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/manifest.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/review-decision.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/review-item.schema.json}
      - {kind: schema, path: actions/dataset_build/schemas/run-state.schema.json}
  training_run:
    name: Training Run
    version: 0.1.0
    short_description: Run a generic LoRA training job from a prepared dataset manifest.
    description: Coordinates generic manifest normalization, compute provisioning, remote trainer execution, artifact pulls, review, and registration for built-in LoRA training runs.
    keywords: [training, lora, runpod, checkpoint, manifest, artifact]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.training.actions.training_run.run
          - --config
          - "{config}"
        input_args:
          - {input: out, flag: --out, optional: true}
    inputs:
      - {name: config, type: path, required: true, description: Training run config JSON or YAML.}
      - {name: out, type: path, required: false, description: Optional output directory override; defaults to output.run_dir in config.}
    outputs:
      - {name: run_state, type: json, mode: create_or_replace, path_template: "{out}/last_run.json", description: Training-run state and resumability metadata.}
      - {name: normalized_manifest, type: json, mode: create_or_replace, path_template: "{out}/manifests/ai-toolkit-ltx/manifest.json", description: Training-run-owned normalized ai-toolkit LTX manifest copy.}
      - {name: review_index, type: html, mode: create_or_replace, path_template: "{out}/review/index.html", description: Local review page referencing downloaded checkpoint sample assets.}
      - {name: registered_lora, type: json, mode: create_or_replace, path_template: "{out}/registered_lora.json", artifact_type: lora, description: Registration metadata for the selected LoRA checkpoint.}
    graph:
      child_actions:
        - runpod.provision
        - runpod.exec
        - runpod.pull
        - runpod.teardown
        - editorial.human_review
      child_orchestrators: []
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      requirements: [jsonschema]
    metadata:
      plan_builder_entrypoint: build_plan_v2
      plan_builder_module: astrid.packs.training.actions.training_run.plan_template
      runtime_module: astrid.packs.training.actions.training_run.run
      runtime_file: actions/training_run/run.py
      runtime_entrypoint: main
      package_paths:
        schemas: actions/training_run/schemas/
        manifests: actions/training_run/manifests/
        state: actions/training_run/last_run.json
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [api.runpod.io:443, rest.runpod.io:443, graphql.runpod.io:443, runpod.io:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
    resources:
      - {kind: implementation, path: actions/training_run/__init__.py}
      - {kind: implementation, path: actions/training_run/ai_toolkit/__init__.py}
      - {kind: implementation, path: actions/training_run/ai_toolkit/register.py}
      - {kind: implementation, path: actions/training_run/ai_toolkit/review.py}
      - {kind: implementation, path: actions/training_run/ai_toolkit/stage.py}
      - {kind: implementation, path: actions/training_run/ai_toolkit/train.py}
      - {kind: implementation, path: actions/training_run/compute_backends.py}
      - {kind: implementation, path: actions/training_run/config.py}
      - {kind: implementation, path: actions/training_run/defaults.py}
      - {kind: implementation, path: actions/training_run/manifest.py}
      - {kind: implementation, path: actions/training_run/manifest_input.py}
      - {kind: implementation, path: actions/training_run/run.py}
      - {kind: implementation, path: actions/training_run/state.py}
      - {kind: implementation, path: actions/training_run/trainer_adapters/__init__.py}
      - {kind: implementation, path: actions/training_run/trainer_adapters/ai_toolkit_ltx.py}
      - {kind: schema, path: actions/training_run/schemas/training-run-config.schema.json}
      - {kind: documentation, path: actions/training_run/STAGE.md}
resources:
  - {kind: implementation, path: shared/__init__.py}
  - {kind: implementation, path: shared/interfaces.py}
  - {kind: implementation, path: shared/items.py}
  - {kind: implementation, path: shared/manifest.py}
  - {kind: implementation, path: shared/manifest_adapters/__init__.py}
  - {kind: implementation, path: shared/manifest_adapters/ai_toolkit_ltx.py}
  - {kind: documentation, path: docs/SKILL.md}
