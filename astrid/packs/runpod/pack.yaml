schema_version: 3
id: runpod
name: Astrid RunPod
version: 1.0.0
status: active
domain: infrastructure
stability: stable
support: core
visibility: visible
permissions:
- id: subprocess
  reason: Runs RunPod CLI commands as subprocesses.
- id: network
  reason: Calls RunPod GraphQL API for pod provisioning and management.
- id: environment
  reason: Reads RUNPOD_API_KEY for authentication.
- id: external_services
  reason: Manages cloud GPU infrastructure on RunPod.
description: Provision RunPod GPU pods, ship and run scripts on them, pull artifacts,
  and tear pods down — including a guaranteed-cleanup composite session.
keywords:
- runpod
- gpu
- provision
- exec
- pull
- teardown
- session
- ssh
capabilities:
- provision_pod
- exec_on_pod
- pull_artifacts
- teardown_pod
- run_pod_session
agent:
  purpose: Choose this pack when you need ephemeral cloud GPU compute on RunPod —
    to spin up a pod, run a script remotely, retrieve artifacts/checkpoints, and shut
    it down. Prefer runpod.session for one-shot jobs that should always clean up.
  do_not_use_for: Not for orchestrating LoRA training workflows end to end; use the
    training pack, which drives RunPod under the hood.
  normal_entrypoints:
  - runpod.session
  - runpod.provision
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  provision:
    name: RunPod Provision
    version: 0.1.0
    short_description: Provision a RunPod GPU pod and emit a pod handle for later
      exec/teardown.
    description: Provision a RunPod GPU pod and emit a pod_handle.json artifact. Does
      not terminate.
    keywords:
    - runpod
    - gpu
    - provision
    - pod
    - launch
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.runpod.actions.provision.run
        - provision
        - --produces-dir
        - '{out}/produces'
        input_args:
        - input: compute_profile
          flag: --compute-profile
          optional: true
        - input: gpu_type
          flag: --gpu-type
          optional: true
        - input: allowed_cuda_versions
          flag: --allowed-cuda-versions
          optional: true
        - input: storage_name
          flag: --storage-name
          optional: true
        - input: max_runtime_seconds
          flag: --max-runtime-seconds
          optional: true
        - input: name_prefix
          flag: --name-prefix
          optional: true
        - input: image
          flag: --image
          optional: true
        - input: container_disk_gb
          flag: --container-disk-gb
          optional: true
        - input: volume_in_gb
          flag: --volume-in-gb
          optional: true
        - input: volume_mount_path
          flag: --volume-mount-path
          optional: true
        - input: datacenter_id
          flag: --datacenter-id
          optional: true
        - input: ports
          flag: --ports
          optional: true
    inputs:
    - description: Named user compute profile. This explicit selector takes precedence
        over ASTRID_COMPUTE_PROFILE.
      name: compute_profile
      required: false
      type: string
    - description: GPU type to request (e.g. RTX 4090, A100).
      name: gpu_type
      required: false
      type: string
    - description: Comma-separated CUDA host versions for RunPod placement (e.g. 12.4,12.6).
      name: allowed_cuda_versions
      required: false
      type: string
    - description: Name of a pre-existing RunPod network storage volume.
      name: storage_name
      required: false
      type: string
    - description: Maximum runtime in seconds before the pod guard triggers.
      name: max_runtime_seconds
      required: false
      type: integer
    - description: Name prefix for the pod (used for grouping and sweeper correlation).
      name: name_prefix
      required: false
      type: string
    - description: Docker image to run on the pod.
      name: image
      required: false
      type: string
    - description: Container disk size in GB.
      name: container_disk_gb
      required: false
      type: integer
    - description: Local or network volume size in GB.
      name: volume_in_gb
      required: false
      type: integer
    - description: Mount path for the local or network volume.
      name: volume_mount_path
      required: false
      type: string
    - description: RunPod datacenter ID.
      name: datacenter_id
      required: false
      type: string
    - description: 'Comma-separated port spec for the pod (default: ''8888/http,22/tcp'').'
      name: ports
      required: false
      type: string
    outputs:
    - name: pod_handle
      type: file
      path_template: '{out}/produces/pod_handle.json'
      mode: create_or_replace
      artifact_type: runpod/pod-handle
      description: Secret-safe durable pod handle for later exec, pull, or teardown.
    - name: cost
      type: file
      path_template: '{out}/produces/cost.json'
      mode: create_or_replace
      artifact_type: runpod/cost
      description: Local cost sidecar for the provision operation.
    resources:
    - kind: implementation
      path: actions/provision/__init__.py
    - kind: implementation
      path: actions/provision/run.py
    cache:
      mode: none
    conditions: []
    graph:
      consumes: []
      provides:
      - pod_handle
      - cost
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
      - RUNPOD_SSH_IDENTITY_PUBLIC_PATH
      - RUNPOD_SSH_IDENTITY_PATH
      requirements:
      - runpod-lifecycle>=0.3.1.dev0,<0.4
    metadata:
      catalog_source: none_declared
      homepage: https://github.com/peteromallet/runpod-lifecycle
      manifest_only: true
      network_behavior:
        provision: true
        exec: true
        teardown: true
        pull: true
        session: true
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.runpod.io:443
        - rest.runpod.io:443
        - graphql.runpod.io:443
        - runpod.io:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
      output_result_manifest: true
      requirements_source: shared/requirements.txt
      runtime_entrypoint: main
      runtime_file: actions/provision/run.py
      runtime_module: astrid.packs.runpod.actions.provision.run
  exec:
    name: RunPod Exec
    version: 0.1.0
    short_description: Execute a script on an existing RunPod pod and download artifacts.
    description: Reattach to a provisioned pod, ship a script, execute it, and download
      artifacts. Leaves pod alive.
    keywords:
    - runpod
    - gpu
    - exec
    - execute
    - script
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.runpod.actions.exec.run
        - exec
        - --produces-dir
        - '{out}/produces'
        input_args:
        - input: pod_handle
          flag: --pod-handle
        - input: local_root
          flag: --local-root
          optional: true
        - input: remote_root
          flag: --remote-root
          optional: true
        - input: remote_script
          flag: --remote-script
          optional: true
        - input: timeout
          flag: --timeout
          optional: true
        - input: upload_mode
          flag: --upload-mode
          optional: true
        - input: excludes
          flag: --excludes
          optional: true
    inputs:
    - description: Path to the pod_handle.json from a prior provision step.
      name: pod_handle
      required: true
      type: file
    - description: Local directory to upload to the pod.
      name: local_root
      required: false
      type: path
    - description: Remote path on the pod where the script runs.
      name: remote_root
      required: false
      type: string
    - description: Path to the script to execute on the pod.
      name: remote_script
      required: false
      type: file
    - description: Execution timeout in seconds.
      name: timeout
      required: false
      type: integer
    - description: 'Upload mode: sftp_walk or tarball.'
      name: upload_mode
      required: false
      type: string
    - description: Glob patterns to exclude from upload.
      name: excludes
      required: false
      type: string
    outputs:
    - name: exec_result
      type: file
      path_template: '{out}/produces/exec_result.json'
      mode: create_or_replace
      artifact_type: runpod/exec-result
      description: Remote execution result and fixed detached artifact records.
    - name: artifact_dir
      type: directory
      path_template: '{out}/produces/artifact_dir'
      mode: create_or_replace
      artifact_type: runpod/artifacts
      description: Mirrored artifact root returned by runpod-lifecycle v0.3.
    - name: cost
      type: file
      path_template: '{out}/produces/cost.json'
      mode: create_or_replace
      artifact_type: runpod/cost
      description: Local cost sidecar for the exec operation.
    resources:
    - kind: implementation
      path: actions/exec/__init__.py
    - kind: implementation
      path: actions/exec/run.py
    cache:
      mode: none
    conditions:
    - input: pod_handle
      kind: requires_input
    graph:
      consumes:
      - pod_handle
      provides:
      - exec_result
      - artifact_dir
      - cost
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
      - RUNPOD_SSH_IDENTITY_PATH
      requirements:
      - runpod-lifecycle>=0.3.1.dev0,<0.4
    metadata:
      catalog_source: none_declared
      homepage: https://github.com/peteromallet/runpod-lifecycle
      manifest_only: true
      network_behavior:
        provision: true
        exec: true
        teardown: true
        pull: true
        session: true
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.runpod.io:443
        - rest.runpod.io:443
        - graphql.runpod.io:443
        - runpod.io:443
        dynamic_route_resolver: runpod_pod_handle_ssh
        dynamic_tcp_inputs:
        - pod_handle
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-and-tcp-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-and-tcp-routes
          wrapper: astrid-generic-host
      output_result_manifest: true
      requirements_source: shared/requirements.txt
      runtime_entrypoint: main
      runtime_file: actions/exec/run.py
      runtime_module: astrid.packs.runpod.actions.exec.run
  pull:
    name: RunPod Pull
    version: 0.1.0
    short_description: Pull artifacts from an existing RunPod pod into local storage.
    description: Pull one or more remote artifacts from an existing RunPod pod using
      pod_handle.json SSH details.
    keywords:
    - runpod
    - gpu
    - pull
    - scp
    - artifact
    - checkpoint
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.runpod.actions.pull.run
        - pull
        - --produces-dir
        - '{out}/produces'
        input_args:
        - input: pod_handle
          flag: --pod-handle
        - input: remote_path
          flag: --remote-path
          repeatable: true
        - input: local_dir
          flag: --local-dir
        - input: ssh_key
          flag: --ssh-key
          optional: true
    inputs:
    - description: Path to the pod_handle.json from a prior provision step.
      name: pod_handle
      required: true
      type: file
    - description: Remote file or directory to pull. Repeatable on the raw CLI.
      name: remote_path
      required: true
      type: string
    - description: Local destination directory.
      name: local_dir
      required: true
      type: path
    - description: Optional private SSH key path.
      name: ssh_key
      required: false
      type: file
    outputs:
    - name: artifact_pull
      type: file
      path_template: '{out}/produces/artifact_pull.json'
      mode: create_or_replace
      artifact_type: runpod/artifact-pull
      description: Manifest of requested remote paths and local fetch status.
    - name: artifact_dir
      type: directory
      path_template: '{out}/produces/artifact_dir'
      mode: create_or_replace
      artifact_type: runpod/artifacts
      description: Default local destination for pulled artifacts.
    resources:
    - kind: implementation
      path: actions/pull/__init__.py
    - kind: implementation
      path: actions/pull/run.py
    cache:
      mode: none
    conditions:
    - input: pod_handle
      kind: requires_input
    graph:
      consumes:
      - pod_handle
      provides:
      - artifact_pull
      - artifact_dir
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
      - RUNPOD_SSH_IDENTITY_PATH
      requirements:
      - runpod-lifecycle>=0.3.1.dev0,<0.4
    metadata:
      catalog_source: none_declared
      homepage: https://github.com/peteromallet/runpod-lifecycle
      manifest_only: true
      network_behavior:
        provision: true
        exec: true
        pull: true
        teardown: true
        session: true
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.runpod.io:443
        - rest.runpod.io:443
        - graphql.runpod.io:443
        - runpod.io:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
      output_result_manifest: true
      requirements_source: shared/requirements.txt
      runtime_entrypoint: main
      runtime_file: actions/pull/run.py
      runtime_module: astrid.packs.runpod.actions.pull.run
  teardown:
    name: RunPod Teardown
    version: 0.1.0
    short_description: Terminate a RunPod pod. Idempotent.
    description: Terminate a RunPod pod by pod_handle. Idempotent — 'not found' is
      a no-op.
    keywords:
    - runpod
    - gpu
    - teardown
    - terminate
    - stop
    - cleanup
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.runpod.actions.teardown.run
        - teardown
        - --produces-dir
        - '{out}/produces'
        input_args:
        - input: pod_handle
          flag: --pod-handle
    inputs:
    - description: Path to the pod_handle.json from a prior provision step.
      name: pod_handle
      required: true
      type: file
    outputs:
    - name: teardown_receipt
      type: file
      path_template: '{out}/produces/teardown_receipt.json'
      mode: create_or_replace
      artifact_type: runpod/teardown-receipt
      description: Idempotent pod termination receipt.
    - name: cost
      type: file
      path_template: '{out}/produces/cost.json'
      mode: create_or_replace
      artifact_type: runpod/cost
      description: Local cost sidecar for the teardown operation.
    resources:
    - kind: implementation
      path: actions/teardown/__init__.py
    - kind: implementation
      path: actions/teardown/run.py
    cache:
      mode: none
    conditions:
    - input: pod_handle
      kind: requires_input
    graph:
      consumes:
      - pod_handle
      provides:
      - teardown_receipt
      - cost
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
      - RUNPOD_SSH_IDENTITY_PATH
      requirements:
      - runpod-lifecycle>=0.3.1.dev0,<0.4
    metadata:
      catalog_source: none_declared
      homepage: https://github.com/peteromallet/runpod-lifecycle
      manifest_only: true
      network_behavior:
        provision: true
        exec: true
        teardown: true
        pull: true
        session: true
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.runpod.io:443
        - rest.runpod.io:443
        - graphql.runpod.io:443
        - runpod.io:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
      output_result_manifest: true
      requirements_source: shared/requirements.txt
      runtime_entrypoint: main
      runtime_file: actions/teardown/run.py
      runtime_module: astrid.packs.runpod.actions.teardown.run
  session:
    name: RunPod Session
    version: 0.1.0
    short_description: Composite provision → exec → teardown session with guaranteed
      cleanup.
    description: Composite provision → exec → download → terminate session with guaranteed
      cleanup via try/finally. Writes pod_handle.json as a sweeper breadcrumb immediately
      after provision and deletes it on graceful teardown.
    keywords:
    - runpod
    - gpu
    - session
    - provision
    - exec
    - teardown
    - composite
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.runpod.actions.session.run
        - session
        - --produces-dir
        - '{out}/produces'
        input_args:
        - input: compute_profile
          flag: --compute-profile
          optional: true
        - input: gpu_type
          flag: --gpu-type
          optional: true
        - input: allowed_cuda_versions
          flag: --allowed-cuda-versions
          optional: true
        - input: storage_name
          flag: --storage-name
          optional: true
        - input: max_runtime_seconds
          flag: --max-runtime-seconds
          optional: true
        - input: name_prefix
          flag: --name-prefix
          optional: true
        - input: image
          flag: --image
          optional: true
        - input: container_disk_gb
          flag: --container-disk-gb
          optional: true
        - input: volume_in_gb
          flag: --volume-in-gb
          optional: true
        - input: volume_mount_path
          flag: --volume-mount-path
          optional: true
        - input: datacenter_id
          flag: --datacenter-id
          optional: true
        - input: ports
          flag: --ports
          optional: true
        - input: local_root
          flag: --local-root
          optional: true
        - input: remote_root
          flag: --remote-root
          optional: true
        - input: remote_script
          flag: --remote-script
          optional: true
        - input: timeout
          flag: --timeout
          optional: true
        - input: upload_mode
          flag: --upload-mode
          optional: true
        - input: excludes
          flag: --excludes
          optional: true
    inputs:
    - description: Named user compute profile. This explicit selector takes precedence
        over ASTRID_COMPUTE_PROFILE.
      name: compute_profile
      required: false
      type: string
    - description: GPU type to request (e.g. RTX 4090, A100).
      name: gpu_type
      required: false
      type: string
    - description: Comma-separated CUDA host versions for RunPod placement (e.g. 12.4,12.6).
      name: allowed_cuda_versions
      required: false
      type: string
    - description: Name of a pre-existing RunPod network storage volume.
      name: storage_name
      required: false
      type: string
    - description: Maximum runtime in seconds before the pod guard triggers.
      name: max_runtime_seconds
      required: false
      type: integer
    - description: Name prefix for the pod.
      name: name_prefix
      required: false
      type: string
    - description: Docker image to run on the pod.
      name: image
      required: false
      type: string
    - description: Container disk size in GB.
      name: container_disk_gb
      required: false
      type: integer
    - description: Local or network volume size in GB.
      name: volume_in_gb
      required: false
      type: integer
    - description: Mount path for the local or network volume.
      name: volume_mount_path
      required: false
      type: string
    - description: RunPod datacenter ID.
      name: datacenter_id
      required: false
      type: string
    - description: 'Comma-separated port spec for the pod (default: ''8888/http,22/tcp'').'
      name: ports
      required: false
      type: string
    - description: Local directory to upload to the pod.
      name: local_root
      required: false
      type: path
    - description: Remote path on the pod where the script runs.
      name: remote_root
      required: false
      type: string
    - description: Path to the script to execute on the pod.
      name: remote_script
      required: false
      type: file
    - description: Execution timeout in seconds.
      name: timeout
      required: false
      type: integer
    - description: 'Upload mode: sftp_walk or tarball.'
      name: upload_mode
      required: false
      type: string
    - description: Glob patterns to exclude from upload.
      name: excludes
      required: false
      type: string
    outputs:
    - name: exec_result
      type: file
      path_template: '{out}/produces/exec_result.json'
      mode: create_or_replace
      artifact_type: runpod/exec-result
      description: Remote execution result and fixed detached artifact records.
    - name: artifact_dir
      type: directory
      path_template: '{out}/produces/artifact_dir'
      mode: create_or_replace
      artifact_type: runpod/artifacts
      description: Mirrored artifact root returned by runpod-lifecycle v0.3.
    - name: cost
      type: file
      path_template: '{out}/produces/cost.json'
      mode: create_or_replace
      artifact_type: runpod/cost
      description: Local cost sidecar for the full session.
    resources:
    - kind: implementation
      path: actions/session/__init__.py
    - kind: implementation
      path: actions/session/run.py
    cache:
      mode: none
    conditions: []
    graph:
      consumes: []
      provides:
      - exec_result
      - artifact_dir
      - cost
    isolation:
      mode: subprocess
      network: true
      env_passthrough:
      - RUNPOD_SSH_IDENTITY_PUBLIC_PATH
      - RUNPOD_SSH_IDENTITY_PATH
      requirements:
      - runpod-lifecycle>=0.3.1.dev0,<0.4
    metadata:
      catalog_source: none_declared
      homepage: https://github.com/peteromallet/runpod-lifecycle
      manifest_only: true
      network_behavior:
        provision: true
        exec: true
        teardown: true
        pull: true
        session: true
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.runpod.io:443
        - rest.runpod.io:443
        - graphql.runpod.io:443
        - runpod.io:443
        dynamic_route_resolver: runpod_pod_handle_ssh
        dynamic_tcp_inputs:
        - pod_handle
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-and-tcp-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-and-tcp-routes
          wrapper: astrid-generic-host
      output_result_manifest: true
      requirements_source: shared/requirements.txt
      runtime_entrypoint: main
      runtime_file: actions/session/run.py
      runtime_module: astrid.packs.runpod.actions.session.run
  status:
    name: Retained target status
    version: 0.1.0
    short_description: Inspect the retained target and optionally observe an offer.
    description: Read the retained host's target custody and current offer.
    inputs:
    - name: target_policy
      type: string
      required: true
      description: Provider policy snapshot.
    - name: include_quote
      type: boolean
      default: false
      required: false
      description: Observe the current offer.
    outputs: []
    resources: []
    cache: {mode: none}
    conditions: []
    graph: {consumes: [], provides: []}
    isolation: {mode: subprocess, network: false}
    metadata: {host_target_operation: status}
    invocation:
      kind: command
      command:
        argv: ['{python_exec}', '-c', 'pass']
  release:
    name: Retained target release
    version: 0.1.0
    short_description: Release the exact retained target.
    description: Ask the retained host to drain and verify release of its target.
    inputs:
    - name: target_policy
      type: string
      required: true
      description: Provider policy snapshot.
    outputs: []
    resources: []
    cache: {mode: none}
    conditions: []
    graph: {consumes: [], provides: []}
    isolation: {mode: subprocess, network: false}
    metadata: {host_target_operation: release}
    invocation:
