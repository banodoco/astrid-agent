schema_version: 3
id: understanding
name: Astrid Understanding
version: 1.0.0
status: active
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs audio, visual, video, and scene-understanding actions in isolated subprocesses.
  - id: project_files
    reason: Reads audio, video, image, scene, and triage files and writes declared analysis artifacts.
  - id: network
    reason: Sends media to the declared OpenAI and Gemini understanding APIs when a live action is requested.
  - id: environment
    reason: Reads OPENAI_API_KEY or GEMINI_API_KEY and an optional explicitly supplied environment file.
description: LLM-based audio, image, and video understanding — caption, query, and structured extraction over media.
keywords:
  - understanding
  - caption
  - vision
  - audio
  - video
  - transcribe-scene
  - llm
  - structured-output
capabilities:
  - understand_media
  - understand_audio
  - understand_image
  - understand_video
  - describe_scene
agent:
  purpose: Choose this pack to inspect or describe media content — caption images/scenes, query audio or synchronized audio+video windows, or extract schema-constrained structured fields from a clip via an LLM.
  do_not_use_for: Do not use to edit, cut, or render video (use video_editing) or to generate new media (use generation; use vibecomfy only for raw ComfyUI workflow graphs).
  normal_entrypoints:
    - understanding.understand
    - understanding.audio_understand
    - understanding.visual_understand
    - understanding.video_understand
    - understanding.scene_describe
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        understand:
          reasons:
          - paid
          note: Dispatch router delegating to paid audio/visual/video understanding
            executors (OpenAI, etc.).
actions:
  audio_understand:
    name: Audio Understand
    version: "1.0"
    short_description: Inspect audio clips or sampled windows with an audio-understanding LLM.
    description: Query an OpenAI audio-native model against source audio or extracted video-audio windows, preserving audition-reel, provenance, and result-manifest behavior.
    keywords: [audio, understand, llm, analyze, transcript, describe]
    invocation:
      kind: command
      command:
        argv: ["{python_exec}", -m, astrid.packs.understanding.actions.audio_understand.run, --out-dir, "{out}", --out, "{out}/analysis.json"]
        input_args:
          - {input: query, flag: --query, optional: true}
          - {input: audio, flag: --audio, optional: true, repeatable: true}
          - {input: video, flag: --video, optional: true}
          - {input: at, flag: --at, optional: true, repeatable: true}
          - {input: start, flag: --start, optional: true}
          - {input: end, flag: --end, optional: true}
          - {input: window_sec, flag: --window-sec, optional: true}
          - {input: chunk_sec, flag: --chunk-sec, optional: true}
          - {input: max_chunks, flag: --max-chunks, optional: true}
          - {input: max_clip_sec, flag: --max-clip-sec, optional: true}
          - {input: audition_reel, flag: --audition-reel, optional: true}
          - {input: reel_gap_sec, flag: --reel-gap-sec, optional: true}
          - {input: sample_rate, flag: --sample-rate, optional: true}
          - {input: mode, flag: --mode, optional: true}
          - {input: model, flag: --model, optional: true}
          - {input: compare_model, flag: --compare-model, optional: true, repeatable: true}
          - {input: env_file, flag: --env-file, optional: true}
          - {input: max_tokens, flag: --max-tokens, optional: true}
          - {input: timeout, flag: --timeout, optional: true}
          - {input: force, flag: --force, optional: true}
          - {input: dry_run, flag: --dry-run, optional: true}
    inputs:
      - {name: audio, type: file, required: false, artifact_type: audio, description: Audio clip to inspect; repeat for comparison inputs.}
      - {name: video, type: file, required: false, artifact_type: video/clip, description: Video whose audio track should be inspected.}
      - {name: query, type: string, required: false, description: Question or editorial rubric for the audio model.}
      - {name: at, type: string, required: false, description: Center timestamp; repeat or comma-separate values.}
      - {name: start, type: string, required: false, description: Optional source range start timestamp.}
      - {name: end, type: string, required: false, description: Optional source range end timestamp.}
      - {name: window_sec, type: number, required: false, description: Window length around each timestamp.}
      - {name: chunk_sec, type: number, required: false, description: Automatic chunk length when no timestamps are provided.}
      - {name: max_chunks, type: integer, required: false, description: Maximum number of planned windows.}
      - {name: max_clip_sec, type: number, required: false, description: Optional trim length for repeated audio clips.}
      - {name: audition_reel, type: string, required: false, description: Whether to build a numbered comparison reel.}
      - {name: reel_gap_sec, type: number, required: false, description: Silence after each audition candidate.}
      - {name: sample_rate, type: integer, required: false, description: Extracted audio sample rate.}
      - {name: mode, type: string, required: false, description: "Model preset, fast or best."}
      - {name: model, type: string, required: false, description: Explicit OpenAI audio model override.}
      - {name: compare_model, type: string, required: false, description: Additional model to query against the same windows.}
      - {name: env_file, type: file, required: false, description: Optional Runtime-managed environment file containing OPENAI_API_KEY.}
      - {name: max_tokens, type: integer, required: false, description: Maximum response tokens.}
      - {name: timeout, type: integer, required: false, description: Provider request timeout in seconds.}
      - {name: force, type: boolean, required: false, description: Rebuild extracted windows and reels.}
      - {name: dry_run, type: boolean, required: false, description: Print the planned request and stop before credential or provider use.}
    outputs:
      - {name: analysis, type: file, path_template: "{out}/analysis.json", mode: create_or_replace, artifact_type: understanding/audio, description: Structured audio-understanding result.}
      - {name: manifest, type: file, path_template: "{out}/manifest.json", mode: create_or_replace, artifact_type: metadata/result-manifest, description: Universal result manifest and provenance.}
    resources:
      - {kind: implementation, path: actions/audio_understand/__init__.py}
      - {kind: implementation, path: actions/audio_understand/run.py}
      - {kind: documentation, path: actions/audio_understand/STAGE.md}
    scoped_configs: [credentials.openai]
    cache: {mode: none}
    isolation:
      mode: subprocess
      network: true
      secrets_required: [OPENAI_API_KEY]
    metadata:
      api_provider: openai
      env: [OPENAI_API_KEY]
      required_permissions: [network, environment]
      requires_timeline: false
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/audio_understand/run.py
      runtime_module: astrid.packs.understanding.actions.audio_understand.run
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [api.openai.com:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
  visual_understand:
    name: Visual Understand
    version: "1.0"
    short_description: Inspect images or sampled video frames with a vision LLM — free-text or JSON-schema-constrained.
    description: Query OpenAI vision models with one image or an ordered frame/contact sheet, retaining prompt/image hashes, sidecars, structured output validation, and result manifests.
    keywords: [vision, image, video, understand, llm, describe, json_schema, structured_output, vocabulary]
    invocation:
      kind: command
      command:
        argv: ["{python_exec}", -m, astrid.packs.understanding.actions.visual_understand.run, --out-dir, "{out}", --out, "{out}/result.json"]
        input_args:
          - {input: query, flag: --query, optional: false}
          - {input: image, flag: --image, optional: true, repeatable: true}
          - {input: video, flag: --video, optional: true}
          - {input: at, flag: --at, optional: true, repeatable: true}
          - {input: mode, flag: --mode, optional: true}
          - {input: model, flag: --model, optional: true}
          - {input: compare_model, flag: --compare-model, optional: true, repeatable: true}
          - {input: detail, flag: --detail, optional: true}
          - {input: cols, flag: --cols, optional: true}
          - {input: tile_width, flag: --tile-width, optional: true}
          - {input: max_images, flag: --max-images, optional: true}
          - {input: label_prefix, flag: --label-prefix, optional: true}
          - {input: contact_sheet, flag: --contact-sheet, optional: true}
          - {input: crop_aspect, flag: --crop-aspect, optional: true, repeatable: true}
          - {input: crop_position, flag: --crop-position, optional: true, repeatable: true}
          - {input: response_schema, flag: --response-schema, optional: true}
          - {input: env_file, flag: --env-file, optional: true}
          - {input: max_output_tokens, flag: --max-output-tokens, optional: true}
          - {input: timeout, flag: --timeout, optional: true}
          - {input: force, flag: --force, optional: true}
          - {input: dry_run, flag: --dry-run, optional: true}
    inputs:
      - {name: image, type: file, required: false, artifact_type: image, description: Image input; repeat to preserve ordered-image evidence.}
      - {name: video, type: file, required: false, artifact_type: video/clip, description: Video from which frames are sampled.}
      - {name: query, type: string, required: true, description: Question or instruction for the vision model.}
      - {name: at, type: string, required: false, description: Frame timestamp; repeat or comma-separate values when using video.}
      - {name: mode, type: string, required: false, description: "Model preset, fast or best."}
      - {name: model, type: string, required: false, description: Explicit OpenAI vision model override.}
      - {name: compare_model, type: string, required: false, description: Additional model to query against the same image/contact sheet.}
      - {name: detail, type: string, required: false, description: "Image detail level: low, high, or auto."}
      - {name: cols, type: integer, required: false, description: Contact-sheet column count.}
      - {name: tile_width, type: integer, required: false, description: Contact-sheet tile width.}
      - {name: max_images, type: integer, required: false, description: Maximum source images or frames.}
      - {name: label_prefix, type: string, required: false, description: Label prefix for ordered frames.}
      - {name: contact_sheet, type: file, required: false, description: Optional contact-sheet output path.}
      - {name: crop_aspect, type: string, required: false, description: Crop aspect ratio; repeat for variants.}
      - {name: crop_position, type: string, required: false, description: Crop alignment; repeat for variants.}
      - {name: response_schema, type: file, required: false, description: JSON schema constraining structured output.}
      - {name: env_file, type: file, required: false, description: Optional Runtime-managed environment file containing OPENAI_API_KEY.}
      - {name: max_output_tokens, type: integer, required: false, description: Maximum structured or free-text response tokens.}
      - {name: timeout, type: integer, required: false, description: Provider request timeout in seconds.}
      - {name: force, type: boolean, required: false, description: Rebuild frames and contact sheets.}
      - {name: dry_run, type: boolean, required: false, description: Print the planned request and stop before credential or provider use.}
    outputs:
      - {name: result, type: file, path_template: "{out}/result.json", mode: create_or_replace, artifact_type: understanding/visual, description: Vision result including ordered evidence and structured answer.}
      - {name: manifest, type: file, path_template: "{out}/manifest.json", mode: create_or_replace, artifact_type: metadata/result-manifest, description: Universal result manifest with input/output provenance and hashes.}
      - {name: contact_sheet, type: file, path_template: "{out}/contact-sheet.jpg", mode: create_or_replace, artifact_type: understanding/visual-contact-sheet, description: Generated contact sheet when multiple images or frames are queried.}
      - {name: crop_contact_sheet, type: file, path_template: "{out}/crop-contact-sheet.jpg", mode: create_or_replace, artifact_type: understanding/visual-crop-contact-sheet, description: Generated contact sheet for crop variants.}
      - {name: crops, type: directory, path_template: "{out}/crops", mode: create_or_replace, artifact_type: understanding/visual-crops, description: Generated crop image files.}
      - {name: frames, type: directory, path_template: "{out}/frames", mode: create_or_replace, artifact_type: understanding/visual-frames, description: Extracted video frame image files.}
    resources:
      - {kind: implementation, path: actions/visual_understand/__init__.py}
      - {kind: implementation, path: actions/visual_understand/run.py}
      - {kind: documentation, path: actions/visual_understand/STAGE.md}
    scoped_configs: [credentials.openai]
    cache: {mode: none}
    isolation:
      mode: subprocess
      network: true
      secrets_required: [OPENAI_API_KEY]
    metadata:
      api_provider: openai
      env: [OPENAI_API_KEY]
      required_permissions: [network, environment]
      requires_timeline: false
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/visual_understand/run.py
      runtime_module: astrid.packs.understanding.actions.visual_understand.run
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [api.openai.com:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
  video_understand:
    name: Video Understand
    version: "1.0"
    short_description: Inspect synchronized audio/video windows with a video-understanding model.
    description: Extract synchronized video windows and query Gemini with optional JSON response-schema constraints, preserving window placement, result output, manifest, and failure behavior.
    keywords: [video, understand, llm, audio, describe, analyze]
    invocation:
      kind: command
      command:
        argv: ["{python_exec}", -m, astrid.packs.understanding.actions.video_understand.run, --out-dir, "{out}", --out, "{out}/result.json"]
        input_args:
          - {input: video, flag: --video, optional: false}
          - {input: query, flag: --query, optional: true}
          - {input: at, flag: --at, optional: true, repeatable: true}
          - {input: start, flag: --start, optional: true}
          - {input: end, flag: --end, optional: true}
          - {input: window_sec, flag: --window-sec, optional: true}
          - {input: chunk_sec, flag: --chunk-sec, optional: true}
          - {input: max_chunks, flag: --max-chunks, optional: true}
          - {input: max_width, flag: --max-width, optional: true}
          - {input: mode, flag: --mode, optional: true}
          - {input: model, flag: --model, optional: true}
          - {input: compare_model, flag: --compare-model, optional: true, repeatable: true}
          - {input: response_schema, flag: --response-schema, optional: true}
          - {input: env_file, flag: --env-file, optional: true}
          - {input: timeout, flag: --timeout, optional: true}
          - {input: force, flag: --force, optional: true}
          - {input: dry_run, flag: --dry-run, optional: true}
    inputs:
      - {name: video, type: file, required: true, artifact_type: video/clip, description: Video to inspect.}
      - {name: query, type: string, required: false, description: Question or evaluation rubric.}
      - {name: at, type: string, required: false, description: Center timestamp; repeat or comma-separate values.}
      - {name: start, type: string, required: false, description: Optional source range start timestamp.}
      - {name: end, type: string, required: false, description: Optional source range end timestamp.}
      - {name: window_sec, type: number, required: false, description: Window length around each timestamp.}
      - {name: chunk_sec, type: number, required: false, description: Automatic chunk length.}
      - {name: max_chunks, type: integer, required: false, description: Maximum number of extracted windows.}
      - {name: max_width, type: integer, required: false, description: Maximum extracted width; zero preserves source width.}
      - {name: mode, type: string, required: false, description: "Model preset, fast or best."}
      - {name: model, type: string, required: false, description: Explicit Gemini model override.}
      - {name: compare_model, type: string, required: false, description: Additional model to query against each window.}
      - {name: response_schema, type: file, required: false, description: JSON schema constraining Gemini response output.}
      - {name: env_file, type: file, required: false, description: Optional Runtime-managed environment file containing GEMINI_API_KEY.}
      - {name: timeout, type: integer, required: false, description: Reserved provider request timeout in seconds.}
      - {name: force, type: boolean, required: false, description: Rebuild extracted windows.}
      - {name: dry_run, type: boolean, required: false, description: Print the planned windows and stop before credential or provider use.}
    outputs:
      - {name: windows, type: directory, path_template: "{out}/video-windows", mode: create_or_replace, artifact_type: understanding/video-windows, description: Extracted synchronized video windows.}
      - {name: result, type: file, path_template: "{out}/result.json", mode: create_or_replace, artifact_type: understanding/video, description: Video-understanding result.}
      - {name: manifest, type: file, path_template: "{out}/manifest.json", mode: create_or_replace, artifact_type: metadata/result-manifest, description: Universal result manifest with window provenance.}
    resources:
      - {kind: implementation, path: actions/video_understand/__init__.py}
      - {kind: implementation, path: actions/video_understand/run.py}
      - {kind: documentation, path: actions/video_understand/STAGE.md}
    scoped_configs: [credentials.gemini]
    cache: {mode: none}
    isolation:
      mode: subprocess
      network: true
      secrets_required: [GEMINI_API_KEY]
    metadata:
      api_provider: gemini
      env: [GEMINI_API_KEY]
      required_permissions: [network, environment]
      requires_timeline: false
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/video_understand/run.py
      runtime_module: astrid.packs.understanding.actions.video_understand.run
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [generativelanguage.googleapis.com:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
  scene_describe:
    name: Scene Describe
    version: "1.0"
    short_description: Caption each detected scene with a vision model for downstream selection.
    description: Run the scene-description pipeline over scenes and triage survivors, preserving its step order, cache sentinel, scene_descriptions schema, and result manifest.
    keywords: [scenes, describe, vision, video, caption, llm]
    invocation:
      kind: command
      command:
        argv: ["{python_exec}", -m, astrid.packs.understanding.actions.scene_describe.run, --scenes, "{scenes}", --triage, "{triage}", --video, "{video}", --out, "{out}"]
        input_args:
          - {input: top_n, flag: --top-n, optional: true}
          - {input: env_file, flag: --env-file, optional: true}
          - {input: model, flag: --model, optional: true}
    inputs:
      - {name: video, type: file, required: true, artifact_type: video/clip, description: Source video for scene clips.}
      - {name: scenes, type: file, required: true, description: Editorial scene list.}
      - {name: triage, type: file, required: true, description: Scene triage payload used to select survivors.}
      - {name: top_n, type: integer, required: false, description: Number of triage survivors to describe.}
      - {name: env_file, type: file, required: false, description: Optional Runtime-managed environment file containing GEMINI_API_KEY.}
      - {name: model, type: string, required: false, description: Gemini model override.}
    outputs:
      - {name: scene_descriptions, type: file, path_template: "{out}/scene_descriptions.json", mode: create_or_replace, artifact_type: understanding/scene-descriptions, description: Versioned scene descriptions payload.}
      - {name: manifest, type: file, path_template: "{out}/manifest.json", mode: create_or_replace, artifact_type: metadata/result-manifest, description: Universal result manifest.}
    graph:
      consumes: []
      depends_on: [editorial.transcribe, editorial.scenes, editorial.quality_zones, editorial.shots, editorial.triage]
      provides: [scene_descriptions]
    pipeline_requirements: [scenes, scene_triage]
    resources:
      - {kind: implementation, path: actions/scene_describe/__init__.py}
      - {kind: implementation, path: actions/scene_describe/run.py}
      - {kind: documentation, path: actions/scene_describe/STAGE.md}
    scoped_configs: [credentials.gemini]
    cache:
      always_run: false
      mode: sentinel
      per_brief: false
      sentinels: [scene_descriptions.json]
    isolation:
      mode: subprocess
      network: true
      secrets_required: [GEMINI_API_KEY]
    metadata:
      api_provider: gemini
      env: [GEMINI_API_KEY]
      required_permissions: [network, environment]
      command_builder: astrid.packs.video_editing.actions.hype.run.build_pool_steps
      pipeline_step: scene_describe
      pipeline_step_order: 5
      requires_timeline: false
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/scene_describe/run.py
      runtime_module: astrid.packs.understanding.actions.scene_describe.run
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [generativelanguage.googleapis.com:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
  understand:
    name: Understand
    version: "1.0"
    short_description: Dispatch to the audio, visual, or video understanding action based on --mode.
    description: Legacy modality dispatcher preserving exact --mode routing and forwarding to the public audio, visual, or video action runner.
    keywords: [understand, dispatch, audio, video, image, llm]
    invocation:
      kind: command
      command:
        argv: ["{python_exec}", -m, astrid.packs.understanding.actions.understand.run, --mode, "{mode}"]
        input_args:
          - {input: audio, flag: --audio, optional: true, repeatable: true}
          - {input: image, flag: --image, optional: true, repeatable: true}
          - {input: video, flag: --video, optional: true}
          - {input: at, flag: --at, optional: true, repeatable: true}
          - {input: query, flag: --query, optional: true}
    inputs:
      - {name: mode, type: string, required: true, description: "Modality: audio, image, visual, or video."}
      - {name: audio, type: file, required: false, artifact_type: audio, description: Audio input forwarded for mode=audio.}
      - {name: image, type: file, required: false, artifact_type: image, description: Image input forwarded for mode=image or visual.}
      - {name: video, type: file, required: false, artifact_type: video/clip, description: Video input forwarded for mode=video.}
      - {name: at, type: string, required: false, description: Timestamp forwarded unchanged to the selected action.}
      - {name: query, type: string, required: false, description: Query forwarded unchanged to the selected action.}
    resources:
      - {kind: implementation, path: actions/understand/__init__.py}
      - {kind: implementation, path: actions/understand/run.py}
      - {kind: documentation, path: actions/understand/STAGE.md}
    outputs: []
    cache: {mode: none}
    isolation:
      mode: subprocess
      network: true
      secrets_required: [OPENAI_API_KEY]
    metadata:
      env: [OPENAI_API_KEY]
      required_permissions: [network, environment]
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/understand/run.py
      runtime_module: astrid.packs.understanding.actions.understand.run
      input_choices:
        mode: [audio, image, video, visual]
      input_requirements_by_choice:
        mode: {audio: [audio], image: [image], visual: [image], video: [video]}
      network_policy:
        allowed_protocols: [dns, tcp]
        allowed_destinations: [api.openai.com:443]
        allow_redirects: false
        broker: {host_managed: true, kind: broker, enforced: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
        descendant_enforcement: {kind: broker, validated: true, observable: true, route: declared-http-routes, wrapper: astrid-generic-host}
resources:
  - {kind: documentation, path: docs/SKILL.md}
  - {kind: support, path: shared/_common.py}
