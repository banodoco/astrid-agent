schema_version: 3
id: vibecomfy
name: Astrid VibeComfy
version: 1.0.0
status: active
domain: integration
stability: stable
support: core
visibility: visible
permissions:
- id: subprocess
  reason: Runs ComfyUI and VibeComfy workflow executors.
- id: network
  reason: May download models and access network during ComfyUI workflow setup.
- id: project_files
  reason: Reads workflow JSON files and writes generated outputs.
- id: accelerator
  reason: May use GPU for ComfyUI model inference.
description: Import, inspect, edit, validate, and run ComfyUI / VibeComfy workflows
  using canonical editable bundles.
keywords:
- comfyui
- vibecomfy
- workflow
- generate
- image
- video
- gpu
- runpod
capabilities:
- import_workflow
- inspect_workflow_ir
- edit_workflow_ir
- run_workflow
- validate_workflow
- video_enhance
- character_animation
agent:
  purpose: Choose this pack to import, inspect, typed-edit or capture, validate, or
    execute a ComfyUI/VibeComfy workflow.
  do_not_use_for: Do not use to understand existing media (use understanding) or to
    cut/render timelines (use video_editing); it runs workflow graphs, not editorial
    pipelines.
  normal_entrypoints:
  - vibecomfy.import
  - vibecomfy.inspect
  - vibecomfy.edit
  - vibecomfy.run
  - vibecomfy.validate
  - vibecomfy.video_enhance
  - vibecomfy.character_animation
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  import:
    name: VibeComfy Import
    version: 1.0.0
    short_description: Import a ComfyUI workflow into VibeComfy's canonical editable
      bundle.
    description: Record an origin workflow by preserving its exact source JSON and
      emitting the canonical Python/companion pair plus an origin report.
    keywords:
    - comfyui
    - vibecomfy
    - workflow
    - import
    - origin
    inputs:
    - name: source
      type: file
      required: true
      artifact_type: application/json
      description: Immutable raw ComfyUI workflow JSON admitted to this task.
    - name: workflow_id
      type: string
      required: true
      description: Stable workflow identity used by subsequent edit and capture tasks.
    outputs:
    - name: python
      type: file
      path_template: '{out}/workflow.py'
      artifact_type: text/x-python
      description: Canonical editable VibeComfy workflow source.
    - name: companion
      type: file
      path_template: '{out}/workflow.vibe.json'
      artifact_type: application/json
      description: Canonical revision and UI identity companion for workflow.py.
    - name: source
      type: file
      path_template: '{out}/source.json'
      artifact_type: application/json
      description: Byte-identical admitted source workflow JSON.
    - name: report
      type: file
      path_template: '{out}/edit-report.json'
      artifact_type: vibecomfy/workflow-transition-report
      description: Origin identity, readiness, parent lineage, revision, and exact
        member digests.
    cache:
      mode: none
    conditions:
    - kind: requires_input
      input: source
    graph:
      consumes:
      - source
      - workflow_id
      provides:
      - vibecomfy_canonical_bundle
      - vibecomfy_workflow_transition_report
    isolation:
      mode: subprocess
      network: false
      requirements:
      - vibecomfy
    metadata:
      pack_id: vibecomfy
      runtime_module: astrid.packs.vibecomfy.actions.import.run
      runtime_file: actions/import/run.py
      vibecomfy_command: import_origin
      authority: input_source_json
      transition_kind: origin
      mutation: canonical_bundle_origin
      service: vibecomfy.porting.import_service.import_workflow_bytes
      network: false
      outputs_are_atomic: true
      runtime_entrypoint: main
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.vibecomfy.actions.import.run
        - --source
        - '{source}'
        - --workflow-id
        - '{workflow_id}'
        - --out
        - '{out}'
    resources:
    - kind: documentation
      path: actions/import/STAGE.md
    - kind: implementation
      path: actions/import/__init__.py
    - kind: implementation
      path: actions/import/run.py
  inspect:
    name: VibeComfy Inspect
    version: 1.0.0
    short_description: Render a ComfyUI workflow as readable Python-like VibeComfy
      IR.
    description: Read an admitted UI workflow statically, or load a canonical Python/companion/source
      bundle with explicit consent; emit the VibeComfy census, readable surface, and
      complete computed topology without mutation.
    keywords:
    - comfyui
    - vibecomfy
    - workflow
    - inspect
    - ir
    inputs:
    - name: workflow
      type: file
      required: false
      default: ''
      artifact_type: vibecomfy/ui-workflow
      description: Optional runtime-admitted ComfyUI UI workflow JSON.
    - name: python
      type: file
      required: false
      default: ''
      artifact_type: text/x-python
      description: Optional canonical workflow.py bundle member.
    - name: companion
      type: file
      required: false
      default: ''
      artifact_type: application/json
      description: Optional canonical workflow.vibe.json bundle member.
    - name: source
      type: file
      required: false
      default: ''
      artifact_type: application/json
      description: Optional byte-identical source.json bundle member.
    - name: python_execution_consent
      type: string
      required: false
      description: On canonical Python bundle inputs, must be explicitly supplied
        as exactly confirmed. Omit for static UI JSON inspection.
    outputs:
    - name: projection
      type: file
      path_template: '{out}/workflow-ir.py'
      artifact_type: text/x-python
      description: Read-only Python-like IR projection.
    - name: inspection
      type: file
      path_template: '{out}/inspection.json'
      artifact_type: vibecomfy/ir-inspection
      description: Structured census, surface, topology, authority, consent input,
        and audited gate decisions.
    cache:
      mode: none
    graph:
      consumes:
      - workflow
      - python
      - companion
      - source
      - python_execution_consent
      provides:
      - vibecomfy_ir_projection
    isolation:
      mode: subprocess
      network: false
      requirements:
      - vibecomfy
    metadata:
      pack_id: vibecomfy
      runtime_module: astrid.packs.vibecomfy.actions.inspect.run
      runtime_file: actions/inspect/run.py
      vibecomfy_command: inspect_ir
      authority: input_ui_graph_or_canonical_bundle
      mutation: none
      runtime_entrypoint: main
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.vibecomfy.actions.inspect.run
        - --workflow
        - '{workflow}'
        - --python
        - '{python}'
        - --companion
        - '{companion}'
        - --source
        - '{source}'
        - --out
        - '{out}'
        input_args:
        - input: python_execution_consent
          flag: --python-execution-consent
          optional: true
    resources:
    - kind: documentation
      path: actions/inspect/STAGE.md
    - kind: implementation
      path: actions/inspect/__init__.py
    - kind: implementation
      path: actions/inspect/run.py
  edit:
    name: VibeComfy Edit
    version: 1.0.0
    short_description: Create an immutable canonical successor through a typed edit
      or explicit capture.
    description: Consume one canonical Python/companion/source parent, apply one ordered
      typed batch or explicitly capture direct Python/UI changes, and emit the complete
      successor bundle with task lineage and exact member digests.
    keywords:
    - comfyui
    - vibecomfy
    - workflow
    - edit
    - typed-delta
    - capture
    - history
    inputs:
    - name: python
      type: file
      required: true
      artifact_type: text/x-python
      description: Immutable parent workflow.py artifact.
    - name: companion
      type: file
      required: true
      artifact_type: application/json
      description: Immutable parent workflow.vibe.json artifact.
    - name: source
      type: file
      required: true
      artifact_type: application/json
      description: Immutable source.json artifact, preserved byte-for-byte.
    - name: workflow_id
      type: string
      required: true
      description: Stable workflow identity from the origin transition.
    - name: parent_revision
      type: string
      required: true
      description: Exact canonical revision represented by the parent trio.
    - name: parent_task_id
      type: string
      required: true
      description: Astrid task ID whose settled outputs are these parent members.
    - name: origin_task_id
      type: string
      required: true
      description: Astrid origin import task ID for this workflow history.
    - name: transition_kind
      type: string
      required: true
      description: typed_edit or manual_capture.
    - name: python_execution_consent
      type: string
      required: true
      description: Explicit consent to load canonical workflow Python; must be exactly
        confirmed. Never inferred from task admission.
    - name: operations
      type: file
      required: false
      default: ''
      artifact_type: vibecomfy/typed-edit-batch
      description: 'Typed edit JSON: {schema_version:1, expected_revision:0, ops:[...]};
        required for typed_edit.'
    - name: capture_python
      type: file
      required: false
      default: ''
      artifact_type: text/x-python
      description: Separate manually edited candidate workflow.py; used with manual_capture.
    - name: capture_graph
      type: file
      required: false
      default: ''
      artifact_type: vibecomfy/ui-workflow
      description: Separate ComfyUI canvas candidate JSON; used with manual_capture.
    outputs:
    - name: python
      type: file
      path_template: '{out}/workflow.py'
      artifact_type: text/x-python
      description: Canonical successor Python source.
    - name: companion
      type: file
      path_template: '{out}/workflow.vibe.json'
      artifact_type: application/json
      description: Canonical successor revision and UI identity companion.
    - name: source
      type: file
      path_template: '{out}/source.json'
      artifact_type: application/json
      description: Byte-identical source workflow preserved from the origin bundle.
    - name: report
      type: file
      path_template: '{out}/edit-report.json'
      artifact_type: vibecomfy/workflow-transition-report
      description: Exact before/after member digests, revision/task lineage, ordered
        operations or capture diff, explicit Python execution consent, audited gate
        decisions, validation/readiness, and diagnostics.
    cache:
      mode: none
    graph:
      consumes:
      - python
      - companion
      - source
      - workflow_id
      - parent_revision
      - parent_task_id
      - origin_task_id
      - transition_kind
      - python_execution_consent
      - operations
      - capture_python
      - capture_graph
      provides:
      - vibecomfy_canonical_bundle
      - vibecomfy_workflow_transition_report
    isolation:
      mode: subprocess
      network: false
      requirements:
      - vibecomfy
    metadata:
      pack_id: vibecomfy
      runtime_module: astrid.packs.vibecomfy.actions.edit.run
      runtime_file: actions/edit/run.py
      vibecomfy_command: canonical_transition
      authority: canonical_parent_bundle
      accepted_transition_kinds:
      - typed_edit
      - manual_capture
      accepted_tools:
      - edit_node
      - add_node
      - remove_node
      - upsert_link
      - remove_link
      - set_node_mode
      batching_tool: edit_batch
      atomic: true
      mutation: canonical_successor
      event_owner: astrid_runtime_task_lifecycle
      runtime_entrypoint: main
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.vibecomfy.actions.edit.run
        - --python
        - '{python}'
        - --companion
        - '{companion}'
        - --source
        - '{source}'
        - --workflow-id
        - '{workflow_id}'
        - --parent-revision
        - '{parent_revision}'
        - --parent-task-id
        - '{parent_task_id}'
        - --origin-task-id
        - '{origin_task_id}'
        - --transition-kind
        - '{transition_kind}'
        - --python-execution-consent
        - '{python_execution_consent}'
        - --operations
        - '{operations}'
        - --capture-python
        - '{capture_python}'
        - --capture-graph
        - '{capture_graph}'
        - --out
        - '{out}'
    resources:
    - kind: documentation
      path: actions/edit/STAGE.md
    - kind: implementation
      path: actions/edit/__init__.py
    - kind: implementation
      path: actions/edit/run.py
  run:
    cache:
      mode: none
    description: Run a VibeComfy workflow through the VibeComfy CLI.
    graph:
      consumes:
      - workflow
      - python
      - companion
      - source
      - source_video
      - managed_assets
      provides:
      - vibecomfy_run
      - result_manifest
    inputs:
    - default: ''
      description: Optional VibeComfy UI workflow JSON. Use this or all three canonical
        members.
      name: workflow
      required: false
      type: file
    - default: ''
      description: Optional managed source video staged into the Comfy input directory.
      name: source_video
      required: false
      type: file
    - default: '99'
      description: Node id receiving the managed source video basename.
      name: source_video_node
      required: false
      type: string
    - default: video
      description: Input field on the source-video node.
      name: source_video_widget
      required: false
      type: string
    - default: ''
      description: Optional deterministic ZIP containing manifest.json and runtime-managed
        workflow media inputs.
      name: managed_assets
      required: false
      type: file
    - default: '{}'
      description: JSON object of scalar public workflow inputs. Media inputs are
        supplied by managed_assets.
      name: workflow_inputs
      required: false
      type: string
    - default: ''
      description: Optional URL for an existing loopback ComfyUI server.
      name: comfy_url
      required: false
      type: string
    - default: ''
      description: Optional absolute path to an existing external ComfyUI output directory.
      name: comfy_output_dir
      required: false
      type: string
    - default: ''
      description: Optional canonical workflow.py member.
      name: python
      required: false
      type: file
    - default: ''
      description: Optional canonical workflow.vibe.json companion member.
      name: companion
      required: false
      type: file
    - default: ''
      description: Optional byte-identical source.json member.
      name: source
      required: false
      type: file
    - description: Host-issued task identity for the production engine adapter.
      name: task_identity
      required: false
      type: string
    - description: Host-issued attempt identity for stale-result fencing.
      name: attempt_identity
      required: false
      type: string
    - description: Host-issued canonical workflow execution identity.
      name: execution_identity
      required: false
      type: string
    - description: Worker-issued readiness profile path for owned checkout execution.
      name: readiness_profile_path
      required: false
      type: string
    - description: Hash paired with the Worker-issued readiness profile.
      name: readiness_profile_hash
      required: false
      type: string
    isolation:
      mode: subprocess
      network: true
      requirements:
      - vibecomfy
      env_passthrough:
      - ASTRID_H3_CANDIDATE_MANIFEST
      - ASTRID_H3_T9_MODEL_SUBSTITUTE_PROFILE
    keywords:
    - comfyui
    - vibecomfy
    - workflow
    - image
    - video
    - generate
    - run
    metadata:
      catalog_source: none_declared
      cli_module: vibecomfy.cli
      command_names:
      - run
      - validate
      homepage: https://github.com/peteromallet/VibeComfy
      network_behavior:
        run: true
        validate: false
      nodes: []
      pack_id: vibecomfy
      prompts: []
      requirements:
      - vibecomfy
      runtime_file: actions/run/run.py
      runtime_module: astrid.packs.vibecomfy.actions.run.run
      output_result_manifest: true
      vibecomfy_command: run
      workflow_input_contract:
        description: UI JSON or complete canonical Python/companion/source sibling
          bundle.
        format: ComfyUI/VibeComfy workflow JSON or canonical bundle
        name: workflow
        required: false
        type: file
      workflows: []
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - 127.0.0.1:8188
        allow_redirects: false
      runtime_entrypoint: main
    name: VibeComfy Run
    outputs:
    - description: Workflow result files identified by receipt entries.
      mode: create_or_replace
      name: vibecomfy_run
      type: file
    - description: Universal result manifest for this workflow run.
      mode: create_or_replace
      name: result_manifest
      path_template: '{out}/manifest.json'
      type: file
    short_description: Run a VibeComfy / ComfyUI workflow and settle its artifact
      inventory.
    version: 0.1.0
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.vibecomfy.actions.run.run
        - run
        - '{workflow}'
        - --python
        - '{python}'
        - --companion
        - '{companion}'
        - --source
        - '{source}'
        - --out
        - '{out}'
        - --task-identity
        - '{task_identity}'
        - --attempt-identity
        - '{attempt_identity}'
        - --execution-identity
        - '{execution_identity}'
        - --readiness-profile-path
        - '{readiness_profile_path}'
        - --readiness-profile-hash
        - '{readiness_profile_hash}'
        - --source-video
        - '{source_video}'
        - --source-video-node
        - '{source_video_node}'
        - --source-video-widget
        - '{source_video_widget}'
        - --managed-assets
        - '{managed_assets}'
        - --workflow-inputs
        - '{workflow_inputs}'
        - --comfy-url
        - '{comfy_url}'
        - --comfy-output-dir
        - '{comfy_output_dir}'
        env:
          VIBECOMFY_HEADLESS: '1'
    resources:
    - kind: documentation
      path: actions/run/STAGE.md
    - kind: implementation
      path: actions/run/__init__.py
    - kind: implementation
      path: actions/run/run.py
  validate:
    cache:
      mode: none
    description: Validate UI JSON or canonical bundle structure offline. Canonical
      Python requires python_execution_consent=confirmed through VibeComfy's audited
      CLI gate with --no-schema. Runtime/session and target-schema validation are
      deferred to vibecomfy.run.
    graph:
      consumes:
      - workflow
      - python
      - companion
      - source
      - python_execution_consent
      - workflow_inputs
      provides:
      - vibecomfy_validation
    inputs:
    - default: ''
      description: Optional VibeComfy UI workflow JSON. Use this or all three canonical
        members.
      name: workflow
      required: false
      type: file
    - default: ''
      description: Optional canonical workflow.py member.
      name: python
      required: false
      type: file
    - default: ''
      description: Optional canonical workflow.vibe.json companion member.
      name: companion
      required: false
      type: file
    - default: ''
      description: Optional byte-identical source.json member.
      name: source
      required: false
      type: file
    - description: Required only for canonical Python bundles; exact accepted value
        is confirmed. Omit for static UI JSON validation.
      name: python_execution_consent
      required: false
      type: string
    - description: Optional concrete JSON bindings. When supplied, validation resolves
        the declared model root through the same public bundle compiler used by execution.
      name: workflow_inputs
      required: false
      type: string
    outputs:
    - name: validation
      type: file
      path_template: '{out}/validation-report.json'
      artifact_type: vibecomfy/workflow-validation-report
      description: Structural validation status (canonical_bundle_structural for Python
        bundles), issues, consent and gate audit; runtime_validation is explicitly
        deferred to vibecomfy.run. Success does not establish runtime readiness.
    isolation:
      mode: subprocess
      network: false
      requirements:
      - vibecomfy
    keywords:
    - comfyui
    - vibecomfy
    - workflow
    - validate
    - check
    - json
    metadata:
      catalog_source: none_declared
      cli_module: vibecomfy.cli
      command_names:
      - run
      - validate
      homepage: https://github.com/peteromallet/VibeComfy
      network_behavior:
        run: true
        validate: false
      nodes: []
      pack_id: vibecomfy
      prompts: []
      requirements:
      - vibecomfy
      runtime_file: actions/validate/run.py
      runtime_module: astrid.packs.vibecomfy.actions.validate.run
      vibecomfy_command: validate
      workflow_input_contract:
        description: UI JSON or complete canonical Python/companion/source sibling
          bundle.
        format: ComfyUI/VibeComfy workflow JSON
        name: workflow
        required: false
        type: file
      workflows: []
      runtime_entrypoint: main
    name: VibeComfy Validate
    short_description: Validate workflow structure offline; runtime checks belong
      to vibecomfy.run.
    version: 0.1.0
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.vibecomfy.actions.validate.run
        - validate
        - '{workflow}'
        - --python
        - '{python}'
        - --companion
        - '{companion}'
        - --source
        - '{source}'
        - --out
        - '{out}'
        input_args:
        - input: python_execution_consent
          flag: --python-execution-consent
          optional: true
        - input: workflow_inputs
          flag: --workflow-inputs
          optional: true
    resources:
    - kind: documentation
      path: actions/validate/STAGE.md
    - kind: implementation
      path: actions/validate/__init__.py
    - kind: implementation
      path: actions/validate/run.py
  video_enhance:
    cache:
      mode: none
    conditions:
    - input: video_ref
      kind: requires_input
    description: Bounded typed VibeComfy video upscale with source-FPS/audio preservation;
      nonmaximum quality is fail-closed.
    graph:
      consumes:
      - video_ref
      provides:
      - enhanced_video
      - video_manifest
    name: VibeComfy Video Enhance
    inputs:
    - name: video_ref
      required: true
      type: file
      artifact_type: video
    - name: enable_upscale
      default: true
      required: false
      type: boolean
    - name: upscale_factor
      default: 2
      required: false
      type: number
    - name: color_fix
      default: false
      required: false
      type: boolean
    - name: output_quality
      default: maximum
      required: false
      type: string
    - name: task_identity
      required: false
      type: string
    - name: readiness_profile_path
      required: false
      type: string
    - name: readiness_profile_hash
      required: false
      type: string
    isolation:
      mode: subprocess
      network: false
      requirements:
      - vibecomfy
    metadata:
      generation_publication:
        version: 1
        modality: video
        output_port: enhanced_video
      storage_estimate_required: true
      storage_estimate_exact: true
      storage_input_max_bytes:
        video_ref: 67108864
      estimated_scratch_bytes: 606076928
      estimated_output_bytes: 269484032
      hc04_param_ports:
      - video_ref
      - enable_upscale
      - upscale_factor
      - color_fix
      - output_quality
      hc04_cas_param_ports:
      - video_ref
      runtime_file: actions/video_enhance/run.py
      runtime_module: astrid.packs.vibecomfy.actions.video_enhance.run
      output_result_manifest: true
      runtime_entrypoint: main
    outputs:
    - name: enhanced_video
      path_template: '{out}/output.mp4'
      type: file
      artifact_type: video
      mode: create_or_replace
    - name: video_manifest
      path_template: '{out}/manifest.json'
      type: file
      mode: create_or_replace
    short_description: Bounded VibeComfy video upscale with source-FPS/audio preservation.
    version: '1.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.vibecomfy.actions.video_enhance.run
        - --capability
        - vibecomfy.video_enhance
        - --profile
        - pip_embedded
        - --task-identity
        - '{task_identity}'
        - --readiness-profile-path
        - '{readiness_profile_path}'
        - --readiness-profile-hash
        - '{readiness_profile_hash}'
        - --out
        - '{out}'
        - --video-ref
        - '{video_ref}'
        - --enable-upscale
        - '{enable_upscale}'
        - --scale
        - '{upscale_factor}'
        - --color-fix
        - '{color_fix}'
        - --output-quality
        - '{output_quality}'
    resources:
    - kind: implementation
      path: actions/video_enhance/__init__.py
    - kind: implementation
      path: actions/video_enhance/run.py
  character_animation:
    cache:
      mode: none
    conditions:
    - input: reference_image_ref
      kind: requires_input
    - input: driving_video_ref
      kind: requires_input
    description: Bounded typed Wan 2.2 Animate execution with ordered image/video
      CAS custody; animate mode is admitted and replacement mode is fail-closed.
    graph:
      consumes:
      - reference_image_ref
      - driving_video_ref
