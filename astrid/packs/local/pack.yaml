schema_version: 3
id: local
name: Personal
version: 0.1.0
status: active
domain: media
stability: stable
support: project
visibility: hidden
permissions:
- id: project_files
  reason: Provides render-time visual element definitions consumed by the rendering
    pack.
description: Personal reusable visual elements and their versioned assets for
  Remotion timelines.
keywords:
- element
- effect
- remotion
- overlay
- text-card
- chart
- canvas
capabilities:
- render_text_card
- render_neon_orbit_card
- render_model_trends_chart
agent:
  purpose: Use when a Remotion timeline needs one of this pack's visual overlay elements
    — an anchored/faded text card, a DOM-to-canvas post-processed 'neon orbit' card,
    or an animated model-trends stacked-area chart.
  do_not_use_for: This is a rendering-elements pack, not an executor; use generation
    or rendering capabilities for generation, editing, and final video rendering.
  normal_entrypoints: []
documentation:
  kind: skill
  path: docs/SKILL.md
