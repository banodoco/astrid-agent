schema_version: 3
id: moirae
name: Astrid Moirae
version: 1.0.0
status: active
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Moirae terminal-as-cinema renderer with asciinema and ffmpeg.
  - id: project_files
    reason: Reads screenplay files and writes rendered video.
description: Renders a YAML screenplay into a terminal-as-cinema video via Moirae (asciinema, agg, ffmpeg).
keywords:
  - moirae
  - terminal
  - screenplay
  - asciinema
  - render
  - video
  - demo
  - cinema
capabilities:
  - render_screenplay
  - produce_terminal_video
agent:
  purpose: "Use to turn a Moirae screenplay file into a scripted terminal/CLI demo video (typewriter text, simulated agent Q&A, camera moves). External pack — requires the moirae package plus asciinema, agg, and ffmpeg binaries."
  do_not_use_for: "Not for trimming real video files (use the media pack) or assembling iteration videos from run provenance (use the iteration pack)."
  normal_entrypoints:
    - moirae.moirae
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        moirae:
          reasons:
          - paid
          - GPU
          - external-escape-hatch
          note: External Moirae screenplay-to-video tool requiring paid API access and
            GPU infrastructure.
actions:
  moirae:
    name: Moirae
    version: 0.1.0
    short_description: Run a Moirae screenplay through the terminal-as-cinema renderer to produce a video.
    description: Curated metadata for running Moirae against a screenplay to create a video. The MVP manifest does not install Moirae or its external binaries.
    keywords:
      - moirae
      - terminal
      - video
      - screenplay
      - asciinema
      - render
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.moirae.actions.moirae.run
          - "{screenplay}"
          - "-o"
          - "{out}/terminal.mp4"
    inputs:
      - name: screenplay
        type: file
        required: true
        description: Screenplay file consumed by Moirae.
    outputs:
      - name: video
        type: file
        path_template: "{out}/terminal.mp4"
        mode: create_or_replace
        artifact_type: clip/visual
        description: Rendered video path produced by Moirae.
    resources:
      - kind: implementation
        path: actions/moirae/__init__.py
      - kind: implementation
        path: actions/moirae/run.py
      - kind: documentation
        path: actions/moirae/STAGE.md
      - kind: dependency
        path: actions/moirae/requirements.txt
    cache:
      mode: none
    conditions:
      - input: screenplay
        kind: requires_input
    graph:
      consumes:
        - screenplay
      provides:
        - video
    isolation:
      mode: subprocess
      network: false
      binaries:
        - asciinema
        - agg
        - ffmpeg
      requirements:
        - moirae
    metadata:
      binary_requirements_enforced: explicit_check_only
      homepage: https://github.com/peteromallet/Moirae
      manifest_only: true
      output_result_manifest: true
      requirements_source: actions/moirae/requirements.txt
      runtime_entrypoint: main
      runtime_file: actions/moirae/run.py
      runtime_module: astrid.packs.moirae.actions.moirae.run
resources:
  - kind: documentation
    path: docs/SKILL.md
