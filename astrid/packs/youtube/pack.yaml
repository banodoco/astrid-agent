schema_version: 3
id: youtube
name: Astrid YouTube
version: 1.0.0
status: active
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs yt-dlp for audio acquisition and upload scripts.
  - id: network
    reason: Downloads YouTube audio and uploads via Zapier social integration.
  - id: project_files
    reason: Reads video files for upload and writes downloaded audio.
  - id: environment
    reason: Reads YouTube and social API credentials.
description: Acquire YouTube media (audio MP3 / video MP4 via yt-dlp) and publish finished videos to YouTube.
keywords:
- youtube
- yt-dlp
- download
- audio
- upload
- publish
- mp3
- zapier
capabilities:
- download_youtube_audio
- download_youtube_video
- upload_youtube_video
agent:
  purpose: Choose this pack to fetch a YouTube video's audio or video (by search query or URL) for downstream use, or to publish a finished video to YouTube.
  do_not_use_for: Do not use to edit or render the video itself (use video_editing) or to analyze its content (use understanding); this pack only ingests and publishes.
  normal_entrypoints:
  - youtube.youtube_audio
  - youtube.upload
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        upload:
          reasons:
          - paid
          - external-escape-hatch
          note: Uploads finished video to YouTube via Zapier integration requiring paid
            API access.
actions:
  youtube_audio:
    name: YouTube Audio
    version: "0.1.0"
    short_description: Download a YouTube video's audio (MP3) or video (MP4) — by search query or direct URL.
    description: Wraps yt-dlp to fetch the top YouTube search result or a direct HTTP(S) URL supplied through query, in audio-extraction mode (MP3) or raw-video mode (MP4).
    keywords:
      - youtube
      - audio
      - video
      - download
      - yt-dlp
      - mp3
      - mp4
      - music
      - search
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - -m
          - astrid.packs.youtube.actions.youtube_audio.run
          - --query
          - "{query}"
          - --mode
          - "{mode}"
          - --out
          - "{out}/media"
    inputs:
      - name: query
        type: string
        required: true
        description: Free-text YouTube search query, or a direct HTTP(S) YouTube URL.
      - name: mode
        type: string
        required: false
        default: audio
        description: "audio (default — extract to MP3) or video (download MP4 without audio extraction)."
    outputs:
      - name: media
        type: file
        artifact_type: media
        mode: create_or_replace
        description: Downloaded MP3 in audio mode or MP4 in video mode, named by the result manifest with its actual extension.
      - name: media_manifest
        type: file
        path_template: "{out}/manifest.json"
        artifact_type: metadata/result-manifest
        mode: create_or_replace
        description: Durable download manifest containing the mode, target, output provenance, hash, and byte count.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      binaries:
        - yt-dlp
        - ffmpeg
    conditions:
      - kind: requires_input
        input: query
    metadata:
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/youtube_audio/run.py
      runtime_module: astrid.packs.youtube.actions.youtube_audio.run
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - youtube.com:443
          - www.youtube.com:443
          - youtu.be:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: youtube-media
          wrapper: yt-dlp
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: youtube-media
          wrapper: yt-dlp
    resources:
      - kind: implementation
        path: actions/youtube_audio/__init__.py
      - kind: implementation
        path: actions/youtube_audio/run.py
      - kind: documentation
        path: actions/youtube_audio/STAGE.md
  upload:
    name: Upload to YouTube
    version: "1.0"
    short_description: Upload a finished video to YouTube via the shared banodoco-social Zapier integration.
    description: Publishes a reachable video URL through the shared banodoco-social YouTube publisher and returns its JSON result.
    keywords:
      - youtube
      - upload
      - video
      - publish
      - social
      - zapier
    invocation:
      kind: python
      path: actions/upload/run.py
      function: run
    inputs:
      - name: video_url
        type: string
        required: true
        description: Reachable HTTP(S) URL for the finished video.
      - name: title
        type: string
        required: true
        description: YouTube video title.
      - name: description
        type: string
        required: true
        description: YouTube video description.
      - name: tag
        type: string
        required: false
        description: YouTube tag; may be repeated or supplied as a list.
      - name: tags
        type: string
        required: false
        description: Comma-separated YouTube tags; may be repeated or supplied as a list.
      - name: privacy_status
        type: string
        required: false
        default: private
        description: private, unlisted, or public.
      - name: playlist_id
        type: string
        required: false
        description: Optional YouTube playlist ID.
      - name: made_for_kids
        type: boolean
        required: false
        default: false
        description: Mark the video as made for kids.
    outputs:
      type: object
      description: The JSON result returned by the shared YouTube publisher; no file artifact is produced.
    isolation:
      mode: subprocess
    metadata:
      backend: banodoco-social
      callable_module: astrid.packs.youtube.actions.upload.src.social_publish
      callable_name: publish_youtube_video
      requires_reachable_video_url: true
      runtime_entrypoint: run
      runtime_file: actions/upload/run.py
      runtime_module: astrid.packs.youtube.actions.upload.run
    resources:
      - kind: implementation
        path: actions/upload/__init__.py
      - kind: implementation
        path: actions/upload/run.py
      - kind: implementation
        path: actions/upload/src/__init__.py
      - kind: implementation
        path: actions/upload/src/social_publish.py
      - kind: documentation
        path: actions/upload/STAGE.md
resources:
  - kind: documentation
    path: docs/SKILL.md
