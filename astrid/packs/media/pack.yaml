schema_version: 3
id: media
name: Media
version: 0.1.0
status: active
domain: media
stability: stable
support: core
permissions:
  - id: subprocess
    reason: Runs ffmpeg for video clip extraction and audio remuxing/normalization.
  - id: project_files
    reason: Reads source video files and writes output clips.
  - id: network
    reason: Optional speech repair executor calls fal.ai LavaSR; GIF search calls remote media APIs.
  - id: environment
    reason: Reads FAL_KEY for fal.ai speech repair and GIPHY_API_KEY for GIF search.
description: Media processing tools, including clip extraction, weak-mic speech repair, and remote GIF search.
keywords:
  - video
  - clip
  - ffmpeg
  - extract
  - trim
  - segment
  - lossless
  - audio
  - speech
  - lavasr
  - gif
  - sticker
  - giphy
capabilities:
  - extract_clip
  - trim_video
  - repair_speech
  - search_gifs
  - download_remote_media
documents:
  transcript:
    format_version: 1
    schema: schemas/transcript-v1.json
    runtime:
      kind: media.transcript/v1
      schema_id: media.transcript
      schema_version: 1
      identity: media-transcript-v1
      access:
        - read
        - list
        - write
documentation:
  kind: skill
  path: docs/SKILL.md
agent:
  purpose: "Use when you need to trim media segments, repair weak-mic speech in a video clip, or search/download GIF and sticker assets."
  do_not_use_for: "Not for building iteration videos from run history (use the iteration pack) or final timeline rendering (use the rendering pack)."
  normal_entrypoints:
    - media.clip_extract
    - media.speech_repair_lavasr
    - media.gif_search
    - media.transcript_publish
actions:
  transcript_publish:
    name: Publish Transcript
    version: "1.0"
    short_description: Publish an immutable transcript revision through the authenticated Astrid SDK.
    description: Publish the exact prepared transcript request through the built-in caller-bound Host document adapter. Direct pack-runner invocation is not permitted.
    keywords:
      - transcript
      - document
      - publish
    invocation:
      kind: python
      path: actions/transcript_publish/run.py
      function: run
    inputs: schemas/transcript-publication-request-v1.json
    outputs: schemas/transcript-publication-output-v1.json
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    resources:
      - kind: implementation
        path: actions/transcript_publish/run.py
      - kind: schema
        path: schemas/transcript-publication-request-v1.json
      - kind: schema
        path: schemas/transcript-publication-output-v1.json
    metadata:
      requires_caller_document_adapter: true
  clip_extract:
    name: Clip Extract
    version: "1.0"
    short_description: Extract a clip segment from a video using ffmpeg stream copy.
    description: Extract a clip segment from a source video using ffmpeg -ss (start time) and -t (duration) with stream copy (-c copy) for lossless, fast extraction.
    keywords:
      - video
      - clip
      - ffmpeg
      - extract
      - trim
      - segment
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - "astrid.packs.media.actions.clip_extract.run"
          - "--input"
          - "{input}"
          - "--start"
          - "{start}"
          - "--dur"
          - "{dur}"
          - "--output"
          - "{output}"
    inputs:
      - name: input
        type: file
        required: true
        description: Runtime-managed source video object reference; materialized as a file for the action.
      - name: start
        type: number
        required: true
        description: Start time in seconds.
      - name: dur
        type: number
        required: true
        description: Duration in seconds.
    outputs:
      - name: output
        type: file
        path_template: "{out}/clip.mp4"
        description: The clipped video file.
    resources:
      - kind: implementation
        path: actions/clip_extract/run.py
      - kind: documentation
        path: actions/clip_extract/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries:
        - ffmpeg
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/clip_extract/run.py
      runtime_module: astrid.packs.media.actions.clip_extract.run
      output_result_manifest: true
  gif_search:
    name: GIF Search
    version: "1.0"
    short_description: Search GIPHY for GIF or sticker assets and optionally download a selected rendition.
    description: Search GIPHY for GIFs or stickers, normalize the result metadata, write results.json and preview.html, and optionally download one selected rendition as MP4 or GIF for timeline use.
    keywords:
      - gif
      - gifs
      - sticker
      - stickers
      - giphy
      - search
      - download
      - asset
      - media
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - "astrid.packs.media.actions.gif_search.run"
          - "--query"
          - "{query}"
          - "--out"
          - "{out}"
        input_args:
          - input: provider
            flag: --provider
            optional: true
            repeatable: false
          - input: media_kind
            flag: --media-kind
            optional: true
            repeatable: false
          - input: limit
            flag: --limit
            optional: true
            repeatable: false
          - input: rating
            flag: --rating
            optional: true
            repeatable: false
          - input: env_file
            flag: --env-file
            optional: true
            repeatable: false
          - input: download_index
            flag: --download-index
            optional: true
            repeatable: false
          - input: download_id
            flag: --download-id
            optional: true
            repeatable: false
    inputs:
      - name: query
        type: string
        required: true
        description: Search query to send to the GIF provider.
      - name: provider
        type: string
        required: false
        description: Provider to use. Currently only 'giphy' is implemented.
      - name: media_kind
        type: string
        required: false
        description: "Asset kind to search: 'gif' or 'sticker'."
      - name: limit
        type: integer
        required: false
        description: Maximum number of results to return.
      - name: rating
        type: string
        required: false
        description: GIPHY rating filter, such as g, pg, pg-13, or r.
      - name: env_file
        type: file
        required: false
        description: Optional Runtime-managed .env object containing GIPHY_API_KEY.
      - name: download_index
        type: integer
        required: false
        description: Optional zero-based result index to download.
      - name: download_id
        type: string
        required: false
        description: Optional provider result id to download.
    outputs:
      - name: results
        type: file
        path_template: "{out}/results.json"
        description: Normalized search result metadata.
      - name: preview
        type: file
        path_template: "{out}/preview.html"
        description: Static preview page for browsing returned assets.
    resources:
      - kind: implementation
        path: actions/gif_search/run.py
      - kind: documentation
        path: actions/gif_search/STAGE.md
    scoped_configs:
      - credentials.giphy
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      secrets_required:
        - GIPHY_API_KEY
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/gif_search/run.py
      runtime_module: astrid.packs.media.actions.gif_search.run
      output_result_manifest: true
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - api.giphy.com:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
  speech_repair_lavasr:
    name: Speech Repair LavaSR
    version: "1.0"
    short_description: Repair weak-mic speech with hotter pre-lift, fal.ai LavaSR, optional DeepFilterNet3, and a final loudness pass.
    description: Extract a video section, aggressively pre-lift weak speech, run fal-ai/lava-sr, optionally run fal-ai/deepfilternet3, then remux and loudness-master the repaired audio onto the extracted video.
    keywords:
      - audio
      - speech
      - repair
      - lavasr
      - fal
      - ffmpeg
      - weak-mic
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - "astrid.packs.media.actions.speech_repair_lavasr.run"
          - "--input"
          - "{input}"
          - "--start"
          - "{start}"
          - "--dur"
          - "{dur}"
          - "--output"
          - "{output}"
        input_args:
          - input: env_file
            flag: --env-file
            optional: true
            repeatable: false
          - input: deepfilternet3
            flag: --deepfilternet3
            optional: true
            repeatable: false
    inputs:
      - name: input
        type: file
        required: true
        description: Runtime-managed source video object reference; materialized as a file for the action.
        artifact_type: audio
      - name: start
        type: number
        required: true
        description: Start time in seconds within the source video.
      - name: dur
        type: number
        required: true
        description: Duration in seconds to extract and repair.
      - name: env_file
        type: file
        required: false
        description: Optional Runtime-managed .env object containing FAL_KEY.
      - name: deepfilternet3
        type: boolean
        required: false
        description: Run fal-ai/deepfilternet3 after LavaSR before final loudness mastering.
    outputs:
      - name: output
        type: file
        path_template: "{out}/speech-repair-lavasr.mp4"
        description: The extracted clip with LavaSR-repaired, loudness-mastered audio.
        artifact_type: audio
    resources:
      - kind: implementation
        path: actions/speech_repair_lavasr/__init__.py
      - kind: implementation
        path: actions/speech_repair_lavasr/run.py
      - kind: documentation
        path: actions/speech_repair_lavasr/STAGE.md
    scoped_configs:
      - credentials.fal
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      binaries:
        - ffmpeg
        - ffprobe
      secrets_required:
        - FAL_KEY
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/speech_repair_lavasr/run.py
      runtime_module: astrid.packs.media.actions.speech_repair_lavasr.run
      output_result_manifest: true
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - queue.fal.run:443
          - fal.run:443
          - storage.fal.run:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
