schema_version: 3
id: stream_content
name: Astrid Stream Content
version: 1.0.0
status: active
domain: media
stability: experimental
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs ffmpeg, ffprobe, and optional tesseract OCR while analyzing and extracting stream media.
  - id: project_files
    reason: Reads source recordings and transcript artifacts, then writes segment maps, clips, candidates, and review pages.
description: Distill long event or stream recordings into labeled content segments, extracted segment files, and scored publishable clip candidates.
keywords: [stream, event, transcript, clips, segments, review, ocr, highlights]
capabilities: [map_stream_segments, score_clip_candidates, distill_stream_content]
agent:
  purpose: "Use to turn long event or stream recordings into reviewable content: identify holding/dead/content spans, extract main blocks, and rank clips worth publishing."
  do_not_use_for: "Do not use for short single-clip trimming without transcript analysis; call media.clip_extract directly."
  normal_entrypoints:
    - stream_content.distill
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        clip_candidates:
          reasons:
          - no-artifact
          note: Writes ranked clip-candidate JSON but does not yet emit a universal
            result manifest.
        segment_map:
          reasons:
          - no-artifact
          note: Writes segment-map JSON but does not yet emit a universal result manifest.
        distill:
          reasons:
          - no-artifact
          note: Writes segment-map, segments, candidates and a static review page but
            does not yet emit a universal result manifest.
actions:
  clip_candidates:
    name: Stream Clip Candidates
    version: "1.0"
    short_description: Score transcript windows as publishable stream clip candidates.
    description: Find 20-90 second clip windows from a transcript, scoring quotable lines, reactions, Q&A exchanges, and optional brief topic matches.
    keywords: [stream, clips, candidates, transcript, quotes, highlights]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.stream_content.actions.clip_candidates.run
          - "--transcript"
          - "{transcript}"
          - "--out"
          - "{out}/candidates.json"
        input_args:
          - input: segment_map
            flag: --segment-map
            optional: true
          - input: brief
            flag: --brief
            optional: true
    inputs:
      - name: transcript
        type: file
        required: true
        description: Whisper transcript.json.
      - name: segment_map
        type: file
        required: false
        description: Optional stream_content.segment_map output.
      - name: brief
        type: file
        required: false
        description: Optional freeform markdown topics or angles to boost.
    outputs:
      - name: candidates
        type: file
        path_template: "{out}/candidates.json"
        description: Ranked clip candidates.
    resources:
      - kind: implementation
        path: actions/clip_candidates/__init__.py
      - kind: implementation
        path: actions/clip_candidates/run.py
      - kind: implementation
        path: actions/clip_candidates/scoring.py
      - kind: documentation
        path: actions/clip_candidates/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/clip_candidates/run.py
      runtime_module: astrid.packs.stream_content.actions.clip_candidates.run
  segment_map:
    name: Stream Segment Map
    version: "1.0"
    short_description: Fuse OCR, transcript density, and scene cuts into a complete stream timeline.
    description: Map a long stream or event recording into holding, dead-air, content, and screening spans with labels and confidence.
    keywords: [stream, segments, timeline, ocr, transcript, scenes]
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.stream_content.actions.segment_map.run
          - "--video"
          - "{video}"
          - "--out"
          - "{out}/segment_map.json"
        input_args:
          - input: transcript
            flag: --transcript
            optional: true
          - input: scenes
            flag: --scenes
            optional: true
    inputs:
      - name: video
        type: file
        required: true
        description: Source stream recording.
      - name: transcript
        type: file
        required: false
        description: Whisper transcript.json from editorial.transcribe.
      - name: scenes
        type: file
        required: false
        description: Scene list JSON from editorial.scenes.
    outputs:
      - name: segment_map
        type: file
        path_template: "{out}/segment_map.json"
        description: Complete labeled timeline.
    resources:
      - kind: implementation
        path: actions/segment_map/__init__.py
      - kind: implementation
        path: actions/segment_map/core.py
      - kind: implementation
        path: actions/segment_map/run.py
      - kind: documentation
        path: actions/segment_map/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries: [ffmpeg, ffprobe, tesseract]
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/segment_map/run.py
      runtime_module: astrid.packs.stream_content.actions.segment_map.run
  distill:
    name: Stream Content Distill
    version: "1.0"
    short_description: Distill a long event stream into segments, extracted blocks, candidates, and a review page.
    description: Compose transcription, scene detection, segment mapping, content-segment extraction, clip-candidate scoring, and static HTML review for long stream recordings.
    keywords: [stream, event, review, clips, segments, orchestrator]
    inputs:
      - name: video
        type: file
        required: true
        description: Source stream recording.
        artifact_type: video/clip
      - name: transcript
        type: file
        required: false
        description: Existing transcript.json; skips transcription when present.
        artifact_type: transcript
      - name: brief
        type: file
        required: false
        description: Optional markdown brief for clip scoring.
      - name: dry_run
        type: boolean
        required: false
        default: false
        description: Emit plan.json without executing the distillation steps.
      - name: no_scenes
        type: boolean
        required: false
        default: false
        description: Skip scene detection during distillation.
    outputs:
      - name: segment_map
        type: file
        path_template: "{out}/segment_map.json"
      - name: segments_manifest
        type: file
        path_template: "{out}/segments/segments.json"
      - name: candidates
        type: file
        path_template: "{out}/candidates.json"
      - name: review
        type: file
        path_template: "{out}/review.html"
    graph:
      child_actions:
        - editorial.transcribe
        - editorial.scenes
        - stream_content.segment_map
        - media.clip_extract
        - stream_content.clip_candidates
      child_orchestrators: []
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.stream_content.actions.distill.run
          - "--video"
          - "{video}"
          - "--out"
          - "{out}"
        input_args:
          - input: transcript
            flag: --transcript
            optional: true
          - input: brief
            flag: --brief
            optional: true
          - input: dry_run
            flag: --dry-run
            optional: true
          - input: no_scenes
            flag: --no-scenes
            optional: true
    resources:
      - kind: implementation
        path: actions/distill/__init__.py
      - kind: implementation
        path: actions/distill/plan_template.py
      - kind: implementation
        path: actions/distill/run.py
      - kind: documentation
        path: actions/distill/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries: [ffmpeg, ffprobe, tesseract]
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/distill/run.py
      runtime_module: astrid.packs.stream_content.actions.distill.run
resources:
  - kind: documentation
    path: docs/SKILL.md
