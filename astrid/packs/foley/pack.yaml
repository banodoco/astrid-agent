schema_version: 3
id: foley
name: Astrid Foley
version: 1.0.0
status: active
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs ffmpeg for audio and video foley processing.
  - id: project_files
    reason: Reads source media files and writes foley-processed outputs.
description: Spatial Foley pipeline — tile a video, prompt a VLM for per-tile audio cues, score Foley per tile, and emit a position-mixed viewer.
keywords: [foley, audio, spatial, tile, video, viewer, vlm, soundscape]
capabilities: [tile_video, review_foley, build_spatial_viewer, orchestrate_spatial_foley]
agent:
  purpose: "Use to build a spatial soundscape for a video: it tiles the frame, asks a VLM for per-tile prompts, generates Foley per tile (via fal.fal_foley), and renders a viewer that mixes tracks by viewport position."
  do_not_use_for: "Generating Foley for a single whole clip (call fal.fal_foley directly) or transcript/cut editorial work (use the editorial pack)."
  normal_entrypoints: [foley.foley_map]
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        foley_map:
          reasons:
          - paid
          note: Orchestrates fal.fal_foley calls (paid fal.ai API key) per tile; writes
            its tiles manifest, prompts and review page but does not yet emit the universal
            result manifest.
actions:
  tile_video:
    name: Tile Video
    version: "1.0"
    short_description: Crop a video into an MxN grid of overlapping spatial tiles plus first-frame PNGs.
    description: Crop a video into an MxN grid of overlapping spatial tiles. Emits one tile clip and one first-frame PNG per tile, plus a tiles.json manifest with each tile's rect in original-video coords.
    keywords:
      - video
      - tile
      - ffmpeg
      - spatial
      - grid
      - frames
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.foley.actions.tile_video.run
          - --video
          - "{video}"
          - --out
          - "{out}"
        input_args:
          - input: grid
            flag: --grid
            optional: true
          - input: overlap
            flag: --overlap
            optional: true
          - input: trim
            flag: --trim
            optional: true
          - input: force
            flag: --force
            optional: true
          - input: dry_run
            flag: --dry-run
            optional: true
    inputs:
      - name: video
        type: file
        required: true
        artifact_type: video/clip
        description: Source video to tile.
      - name: grid
        type: string
        required: false
        default: 4x4
        description: Tile grid as COLSxROWS.
      - name: overlap
        type: number
        required: false
        description: Tile overlap fraction from zero through one (default 0.25).
      - name: trim
        type: number
        required: false
        description: Optional maximum tile duration in seconds.
      - name: force
        type: boolean
        required: false
        default: false
        description: Re-render tiles and frames even when outputs exist.
      - name: dry_run
        type: boolean
        required: false
        default: false
        description: Write the tile plan without running ffmpeg.
    outputs:
      - name: tiles_manifest
        type: file
        path_template: "{out}/tiles.json"
        mode: create_or_replace
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/tile_video/run.py
      runtime_module: astrid.packs.foley.actions.tile_video.run
    resources:
      - kind: implementation
        path: actions/tile_video/__init__.py
      - kind: implementation
        path: actions/tile_video/run.py
      - kind: documentation
        path: actions/tile_video/STAGE.md
  foley_review:
    name: Foley Review
    version: "1.0"
    short_description: Build a static review.html pairing each tile clip with its generated Foley audio for sense-checking.
    description: Build a static review.html that pairs each tile clip with its generated Foley audio for sense-checking. Reviewers can flag bad tiles; flags are written to a flagged.json sidecar.
    keywords:
      - foley
      - audio
      - review
      - video
      - html
      - tiles
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.foley.actions.foley_review.run
          - --manifest
          - "{manifest}"
          - --out
          - "{out}/review.html"
    inputs:
      - name: manifest
        type: file
        required: true
        description: tiles.json manifest with foley_audio paths added.
    outputs:
      - name: review_html
        type: file
        path_template: "{out}/review.html"
        mode: create_or_replace
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/foley_review/run.py
      runtime_module: astrid.packs.foley.actions.foley_review.run
    resources:
      - kind: implementation
        path: actions/foley_review/__init__.py
      - kind: implementation
        path: actions/foley_review/run.py
      - kind: documentation
        path: actions/foley_review/STAGE.md
  foley_map:
    name: Foley Map
    version: "0.1"
    short_description: "Spatial Foley pipeline: tile a video, prompt a VLM, and score Foley per tile."
    description: "Spatial Foley pipeline: tile a video, ask a VLM for a global scene description and per-tile prompts, and score each tile via fal Hunyuan-Foley."
    keywords:
      - foley
      - audio
      - video
      - spatial
      - tile
      - vlm
      - viewer
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.foley.actions.foley_map.run
          - --video
          - "{video}"
          - --out
          - "{out}"
        input_args:
          - input: grid
            flag: --grid
            optional: true
          - input: overlap
            flag: --overlap
            optional: true
          - input: trim
            flag: --trim
            optional: true
          - input: env_file
            flag: --env-file
            optional: true
          - input: vlm_concurrency
            flag: --vlm-concurrency
            optional: true
          - input: foley_concurrency
            flag: --foley-concurrency
            optional: true
          - input: retry_flagged
            flag: --retry-flagged
            optional: true
          - input: force_prompts
            flag: --force-prompts
            optional: true
          - input: force_foley
            flag: --force-foley
            optional: true
          - input: stop_after
            flag: --stop-after
            optional: true
          - input: dry_run
            flag: --dry-run
            optional: true
    inputs:
      - name: video
        type: file
        required: true
        artifact_type: video/clip
        description: Source video to turn into a spatial Foley soundscape.
      - name: grid
        type: string
        required: false
        default: 4x4
        description: Tile grid as COLSxROWS.
      - name: overlap
        type: number
        required: false
        description: Tile overlap fraction from zero through one (default 0.25).
      - name: trim
        type: number
        required: false
        description: Optional maximum tile duration in seconds.
      - name: env_file
        type: file
        required: false
        description: Optional environment file containing FAL_KEY and OPENAI_API_KEY.
      - name: vlm_concurrency
        type: integer
        required: false
        default: 4
        description: Maximum parallel VLM calls.
      - name: foley_concurrency
        type: integer
        required: false
        default: 4
        description: Maximum parallel Foley calls.
      - name: retry_flagged
        type: file
        required: false
        description: flagged.json path; only tiles flagged bad are rerun.
      - name: force_prompts
        type: boolean
        required: false
        default: false
        description: Re-run VLM prompts even when prompts.json exists.
      - name: force_foley
        type: boolean
        required: false
        default: false
        description: Re-run Foley calls even when audio files exist.
      - name: stop_after
        type: string
        required: false
        default: review
        description: Stop after tile, prompts, Foley, or review.
      - name: dry_run
        type: boolean
        required: false
        default: false
        description: Plan the workflow without provider submissions.
    outputs:
      - name: tiles_manifest
        type: file
        path_template: "{out}/tiles.json"
        mode: create_or_replace
        description: Final tile manifest with prompts and audio paths.
      - name: prompts
        type: file
        path_template: "{out}/prompts.json"
        mode: create_or_replace
        description: Global context and per-tile Foley prompts.
      - name: tiles
        type: directory
        path_template: "{out}/tiles"
        mode: create_or_replace
        description: Per-tile video clips.
      - name: frames
        type: directory
        path_template: "{out}/frames"
        mode: create_or_replace
        description: Per-tile and global first-frame PNGs.
      - name: audio
        type: directory
        path_template: "{out}/audio"
        mode: create_or_replace
        description: Per-tile Foley audio files.
      - name: review_html
        type: file
        path_template: "{out}/review.html"
        mode: create_or_replace
        description: Static review page for sense-checking generated tracks.
    graph:
      consumes: []
      depends_on:
        - foley.tile_video
        - understanding.visual_understand
        - fal.fal_foley
        - foley.foley_review
      provides:
        - spatial_foley_soundscape
        - tiles_manifest
        - review_html
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/foley_map/run.py
      runtime_module: astrid.packs.foley.actions.foley_map.run
    resources:
      - kind: implementation
        path: actions/foley_map/__init__.py
      - kind: implementation
        path: actions/foley_map/run.py
      - kind: documentation
        path: actions/foley_map/STAGE.md
