schema_version: 3
id: comfy_wrap
name: Comfy Workflow Wrapper
version: 0.1.0
status: active
domain: generation
stability: experimental
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs ComfyUI via vibecomfy for image generation.
  - id: network
    reason: May download models during ComfyUI execution.
  - id: project_files
    reason: Reads workflow JSON files and writes generated outputs.
  - id: accelerator
    reason: May use GPU for ComfyUI model inference.
description: Wrap a parameterized ComfyUI workflow JSON and generate images from a text prompt via vibecomfy.
keywords:
  - comfyui
  - vibecomfy
  - workflow
  - generate
  - image
  - prompt
capabilities:
  - run_workflow
agent:
  purpose: Choose this pack to generate an image from a text prompt using a pre-built ComfyUI workflow JSON template.
  do_not_use_for: Do not use for arbitrary model selection or multi-modal generation — use generation.generate_image for the standard happy path.
  normal_entrypoints:
    - comfy_wrap.run
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    output_result_exemptions:
      actions:
        run:
          reasons:
          - GPU
          - external-escape-hatch
          note: Runs ComfyUI workflows through external VibeComfy/ComfyUI tooling requiring
            GPU.
actions:
  run:
    name: Comfy Workflow Run
    version: 0.1.0
    short_description: Generate an image by injecting a prompt into a ComfyUI workflow JSON and running it via vibecomfy.
    description: Load a ComfyUI workflow JSON at runtime, inject a supplied prompt into its positive CLIPTextEncode node, execute through vibecomfy, and copy the first output image to the requested output.
    keywords:
      - comfyui
      - vibecomfy
      - workflow
      - generate
      - image
      - prompt
      - txt2img
      - sdxl
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - "astrid.packs.comfy_wrap.actions.run.run"
          - "--prompt"
          - "{prompt}"
          - "--out"
          - "{out}"
    inputs:
      - name: prompt
        type: string
        required: true
        description: Text prompt describing the desired image; injected into the positive CLIPTextEncode node.
    outputs:
      - name: generated_image
        type: file
        path_template: "{out}/output.png"
        description: The first generated image file.
    resources:
      - kind: implementation
        path: actions/run/__init__.py
      - kind: implementation
        path: actions/run/run.py
      - kind: documentation
        path: actions/run/STAGE.md
    cache:
      mode: none
    conditions:
      - input: prompt
        kind: requires_input
    graph:
      consumes:
        - prompt
      provides:
        - generated_image
    isolation:
      mode: subprocess
      network: true
      requirements:
        - vibecomfy
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/run/run.py
      runtime_module: astrid.packs.comfy_wrap.actions.run.run
      workflow_source: /tmp/example_comfy.json
      prompt_node_id: "6"
      prompt_node_field: text
      prompt_node_type: CLIPTextEncode
      output_result_manifest: true
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - 127.0.0.1:8188
        allow_redirects: false
