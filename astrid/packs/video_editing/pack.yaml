      path: actions/logo_ideas/__init__.py
    - kind: implementation
      path: actions/logo_ideas/run.py
    - kind: support
      path: shared/result_receipts.py
    - kind: documentation
      path: actions/logo_ideas/STAGE.md
    scoped_configs:
    - credentials.fal
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      binaries: []
    metadata:
      env:
      - FIREWORKS_API_KEY
      - FAL_KEY
      runtime_entrypoint: main
      runtime_file: actions/logo_ideas/run.py
      runtime_module: astrid.packs.video_editing.actions.logo_ideas.run
      output_result_manifest: true
      required_permissions:
      - network
      - environment
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - api.fireworks.ai:443
        - queue.fal.run:443
        - fal.run:443
        - storage.fal.run:443
        - fal.media:443
        - v3.fal.media:443
        - v3b.fal.media:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
