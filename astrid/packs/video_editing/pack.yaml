      type: string
      required: false
      default: png
      description: '"Output format: png, jpeg, jpg, or webp."'
    - name: env_file
      type: file
      required: false
      description: Optional Runtime-managed environment file with FIREWORKS_API_KEY
        and FAL_KEY.
