    - name: concepts
      type: file
      path_template: '{out}/concepts.json'
      mode: create_or_replace
      artifact_type: application/json
      description: Drafted concept prompts and metadata.
    - name: prompts
      type: file
      path_template: '{out}/prompts.json'
      mode: create_or_replace
      artifact_type: application/json
      description: Final prompts sent to the selected render provider.
    - name: manifest
      type: file
      path_template: '{out}/logo-manifest.json'
      mode: create_or_replace
      artifact_type: application/json
      description: Per-candidate generation record.
    - name: images
      type: directory
      path_template: '{out}/images'
      mode: create_or_replace
      artifact_type: image/candidates
      description: Individual candidate images when the provider returns them.
    resources:
