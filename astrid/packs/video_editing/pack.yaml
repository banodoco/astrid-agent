schema_version: 3
id: video_editing
name: Astrid Video Editing
version: 1.0.0
status: active
domain: media
stability: stable
support: core
visibility: visible
permissions:
- id: subprocess
  reason: Runs ffmpeg-based cut and foley executors plus orchestrator child processes.
- id: project_files
  reason: Reads and writes timelines, assets, and editorial artifacts.
description: End-to-end video production orchestrators (hype edits, talks, thumbnails,
  logos, image animation) draft narration synchronization, plus the timeline-cut executor.
keywords:
- video
- timeline
- edit
- hype
- thumbnail
- render
- animate
- grid
capabilities:
- run_hype_pipeline
- build_timeline
- assemble_event_talk
- make_thumbnails
- generate_logo_grid
- animate_image
- vary_image_grid
- render_iteration_video
- sync_draft_voiceover
agent:
  purpose: Choose this pack for video-production orchestrators and adjacent visual-generation
    workflows — hype, event, and iteration videos; thumbnails; logo grids; image animation;
    and grid variation.
  do_not_use_for: Do not use to merely understand/caption media (use understanding)
    or to run a raw ComfyUI generation graph (use vibecomfy); this pack owns the editorial
    assembly and render flow, distinct from the editorial pack's analysis stages it
    depends on.
  normal_entrypoints:
  - video_editing.hype
  - video_editing.event_talks
  - video_editing.thumbnail_maker
  - video_editing.sync_draft_voiceover
documentation:
  kind: skill
  path: docs/SKILL.md
extensions:
  astrid:
    skills:
      default: true
    generation_availability:
      actions:
        video_editing.thumbnail_maker:
          available: false
          error:
            code: generation_action_unavailable
            message: video_editing.thumbnail_maker generation is not implemented
        video_editing.animate_image:
          available: false
          error:
            code: generation_route_unqualified
            message: video_editing.animate_image is unavailable because this generation
              route has not been qualified
    output_result_exemptions:
      actions:
        event_talks:
          reasons:
          - no-artifact
          note: Emits only the event-talk workflow plan JSON; the render step is still
            a stub, so no media artifact is produced.
        sync_draft_voiceover:
          reasons:
          - paid
          note: Requests changed speech through generation.generate_speech (paid TTS
            provider) and publishes through the authoring client; returns a structured
            report and receipt rather than the universal result manifest.
        thumbnail_maker:
          reasons:
          - no-artifact
          note: Emits only the thumbnail workflow plan and source evidence; generate-thumbnails
            is still a stub, so no image artifact is produced.
actions:
  sync_draft_voiceover:
    name: Synchronize draft voiceover
    version: 1.0.0
    short_description: Reconcile temporary narration with pinned timeline scripts.
    description: Compare pinned scripts with draft audio, regenerate changed passages through generation.generate_speech, and publish one caller-authorized validated revision.
    keywords:
    - voiceover
    - narration
    - timeline
    - synchronization
    invocation:
      kind: python
      path: actions/sync_draft_voiceover/run.py
      function: run
    inputs:
    - name: project
      type: string
      required: true
      description: Runtime project id or immutable slug.
    - name: timeline_ref
      type: string
      required: true
      description: Runtime timeline id or immutable slug.
    - name: timing_policy
      type: string
      required: true
      description: Timing policy, such as preserve or ripple.
    - name: settings
      type: json
      required: false
      description: Exact speech settings passed to generation.generate_speech.
    - name: occurrence_ids
      type: json
      required: false
      description: Optional exact authored occurrence ids to reconcile.
    - name: adopt_clip_ids
      type: json
      required: false
      description: Optional draft clip ids explicitly authorized for adoption.
    - name: padding_seconds
      type: number
      required: false
      default: 0.15
      description: Padding applied by the canonical synchronization helper.
    - name: plan_only
      type: boolean
      required: false
      default: false
      description: Plan and report without publishing a revision.
    outputs:
    - name: report
      type: json
      description: Synchronization report and caller-bound publication result.
    - name: receipt
      type: json
      description: Caller-bound publication receipt returned by the synchronization helper.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
    metadata:
      runtime_entrypoint: run
      runtime_file: actions/sync_draft_voiceover/run.py
      runtime_module: astrid.packs.video_editing.actions.sync_draft_voiceover.run
      mutation_authority: workspace_runtime
    resources:
    - kind: implementation
      path: actions/sync_draft_voiceover/__init__.py
    - kind: implementation
      path: actions/sync_draft_voiceover/run.py
    - kind: implementation
      path: shared/draft_voiceover.py
    - kind: documentation
      path: actions/sync_draft_voiceover/STAGE.md
  cut:
    name: Cut
    version: 1.0.0
    short_description: Assemble an editorial arrangement into a timeline, asset registry,
      and metadata files.
    description: Build a standalone result-only Remotion timeline from an arrangement,
      merged pool, brief, and optional source, transcript, and theme files.
    keywords:
    - cut
    - timeline
    - video
    - edit
    - hype
    - assemble
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.video_editing.actions.cut.run
        - --out
        - '{out}'
        input_args:
        - input: scenes
          flag: --scenes
          optional: true
        - input: timeline
          flag: --timeline
          optional: true
        - input: assets
          flag: --assets
          optional: true
        - input: video
          flag: --video
          optional: true
        - input: audio
          flag: --audio
          optional: true
        - input: transcript
          flag: --transcript
          optional: true
        - input: shots
          flag: --shots
          optional: true
        - input: arrangement
          flag: --arrangement
          optional: true
        - input: pool
          flag: --pool
          optional: true
        - input: brief
          flag: --brief
          optional: false
        - input: theme
          flag: --theme
          optional: true
        - input: asset
          flag: --asset
          optional: true
          repeatable: true
        - input: verbose
          flag: --verbose
          optional: true
        - input: primary_asset
          flag: --primary-asset
          optional: true
        - input: renderer
          flag: --renderer
          optional: true
    inputs:
    - name: scenes
      type: file
      required: false
      description: Optional scene analysis JSON.
    - name: timeline
      type: file
      required: false
      description: Existing timeline JSON for resume mode.
    - name: assets
      type: file
      required: false
      description: Optional asset registry paired with a resume timeline.
    - name: video
      type: file
      required: false
      artifact_type: video
      description: Runtime-materialized source video; URLs are rejected.
    - name: audio
      type: file
      required: false
      artifact_type: audio
      description: Optional runtime-materialized source audio.
    - name: transcript
      type: file
      required: false
      description: Optional transcript JSON for arrangement metadata.
    - name: shots
      type: file
      required: false
      description: Optional shot analysis JSON.
    - name: arrangement
      type: file
      required: false
      artifact_type: editorial/arrangement
      description: Arrangement decisions to compile into the timeline.
    - name: pool
      type: file
      required: false
      artifact_type: editorial/pool
      description: Merged clip pool referenced by the arrangement.
    - name: brief
      type: file
      required: true
      description: Creative brief required by the public cut contract.
    - name: theme
      type: file
      required: false
      artifact_type: theme
      description: Optional absolute task-materialized theme JSON; required for generative
        visual effects.
    - name: asset
      type: string
      required: false
      description: Additional source asset mapping in KEY=PATH form.
    - name: verbose
      type: boolean
      required: false
      default: false
      description: Print ffprobe cache activity.
    - name: primary_asset
      type: string
      required: false
      description: Asset key described by the scenes, transcript, and shots inputs.
    - name: renderer
      type: string
      required: false
      default: rendering.remotion
      description: Qualified rendering backend ID.
    outputs:
    - name: edl
      type: file
      path_template: '{out}/hype.edl.csv'
      mode: create_or_replace
      description: Editorial decision list for the compiled arrangement.
    - name: timeline
      type: file
      path_template: '{out}/hype.timeline.json'
      mode: create_or_replace
      artifact_type: timeline
      description: Canonical Remotion timeline.
    - name: assets
      type: file
      path_template: '{out}/hype.assets.json'
      mode: create_or_replace
      artifact_type: timeline/assets
      description: Asset registry for the timeline.
    - name: metadata
      type: file
      path_template: '{out}/hype.metadata.json'
      mode: create_or_replace
      artifact_type: metadata
      description: Render metadata for the assembled timeline.
    resources:
    - kind: implementation
      path: actions/cut/__init__.py
    - kind: implementation
      path: actions/cut/run.py
    - kind: implementation
      path: actions/cut/attempt_assets.py
    - kind: implementation
      path: actions/cut/probe.py
    - kind: implementation
      path: actions/cut/resume.py
    - kind: implementation
      path: actions/cut/timeline_build.py
    - kind: documentation
      path: actions/cut/STAGE.md
    graph:
      depends_on:
      - editorial.transcribe
      - editorial.scenes
      - editorial.quality_zones
      - editorial.shots
      - editorial.triage
      - understanding.scene_describe
      - editorial.quote_scout
      - training.pool_build
      - training.pool_merge
      - editorial.arrange
      provides:
      - timeline
      - assets
      - metadata
    clip_kinds_supported:
    - video
    - image
    - audio
    - text
    - effect
    pipeline_requirements:
    - arrangement
    - pool
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries:
      - ffmpeg
      - ffprobe
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/cut/run.py
      runtime_module: astrid.packs.video_editing.actions.cut.run
      pipeline_step: cut
      pipeline_step_order: 10
      output_result_manifest: true
  animate_image:
    name: Animate Image
    version: 1.0.0
    short_description: Restyle a video opening frame and animate it using the reference
      video's motion.
    description: Use Fal GPT Image 2 edit to restyle the first frame from a driver
      video, then animate the styled image with Fal WAN Animate Move.
    keywords:
    - fal
    - wan
    - image
    - video
    - animate
    - gpt-image
    - generate
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.video_editing.actions.animate_image.run
        - --out
        - '{out}'
        input_args:
        - input: style_image
          flag: --style-image
          optional: false
        - input: ref_video
          flag: --ref-video
          optional: false
        - input: prompt
          flag: --prompt
          optional: true
        - input: replace_prompt
          flag: --replace-prompt
          optional: true
        - input: quality
          flag: --quality
          optional: true
        - input: output_format
          flag: --output-format
          optional: true
        - input: resolution
          flag: --resolution
          optional: true
        - input: num_inference_steps
          flag: --num-inference-steps
          optional: true
        - input: guidance_scale
          flag: --guidance-scale
          optional: true
        - input: shift
          flag: --shift
          optional: true
        - input: video_quality
          flag: --video-quality
          optional: true
        - input: use_turbo
          flag: --use-turbo
          optional: true
        - input: seed
          flag: --seed
          optional: true
        - input: env_file
          flag: --env-file
          optional: true
        - input: dry_run
          flag: --dry-run
          optional: true
        - input: skip_generate
          flag: --skip-generate
          optional: true
        - input: use_image
          flag: --use-image
          optional: true
        - input: skip_animate
          flag: --skip-animate
          optional: true
    inputs:
    - name: style_image
      type: file
      required: true
      artifact_type: image
      description: Runtime-materialized image whose visual style should be adopted.
    - name: ref_video
      type: file
      required: true
      artifact_type: video
      description: Runtime-materialized motion driver; its first frame supplies the
        composition target.
    - name: prompt
      type: string
      required: false
      description: Additional direction appended to the default style-transfer prompt.
    - name: replace_prompt
      type: string
      required: false
      description: Replace the default style-transfer prompt entirely.
    - name: quality
      type: string
      required: false
      default: high
      description: '"GPT Image quality: low, medium, high, or auto."'
    - name: output_format
      type: string
      required: false
      default: png
      description: '"Generated image format: png, jpeg, or webp."'
    - name: resolution
      type: string
      required: false
      default: 720p
      description: '"WAN Animate output resolution: 480p, 580p, or 720p."'
    - name: num_inference_steps
      type: integer
      required: false
      default: 20
      description: WAN inference steps.
    - name: guidance_scale
      type: number
      required: false
      description: WAN guidance scale (parser default 1.0).
    - name: shift
      type: number
      required: false
      description: WAN shift parameter (parser default 5.0).
    - name: video_quality
      type: string
      required: false
      default: high
      description: '"WAN video quality: low, medium, high, or maximum."'
    - name: use_turbo
      type: boolean
      required: false
      default: false
      description: Use the fast WAN path.
    - name: seed
      type: integer
      required: false
      description: Optional WAN animation seed.
    - name: env_file
      type: file
      required: false
      description: Optional Runtime-managed environment file with FAL_KEY.
    - name: dry_run
      type: boolean
      required: false
      default: false
      description: Extract and plan without calling provider APIs.
    - name: skip_generate
      type: boolean
      required: false
      default: false
      description: Skip image restyling and animate the supplied use_image file.
    - name: use_image
      type: file
      required: false
      artifact_type: image
      description: Supplied generated image used when skip_generate is true.
    - name: skip_animate
      type: boolean
      required: false
      default: false
      description: Skip the WAN animation stage.
    outputs:
    - name: plan
      type: file
      path_template: '{out}/plan.json'
      mode: create_or_replace
      artifact_type: application/json
      description: Animation plan and provider settings.
    - name: first_frame
      type: file
      path_template: '{out}/first_frame.png'
      mode: create_or_replace
      artifact_type: image
      description: First frame extracted from the reference video.
    - name: generated_image
      type: file
      path_template: '{out}/generated.{output_format}'
      mode: create_or_replace
      artifact_type: image
      description: Restyled image or supplied image copy.
    - name: animation
      type: file
      path_template: '{out}/animation.mp4'
      mode: create_or_replace
      artifact_type: video/clip
      description: WAN animation when the animation stage runs.
    resources:
    - kind: implementation
      path: actions/animate_image/__init__.py
    - kind: implementation
      path: actions/animate_image/run.py
    - kind: support
      path: shared/result_receipts.py
    - kind: documentation
      path: actions/animate_image/STAGE.md
    scoped_configs:
    - credentials.fal
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      binaries:
      - ffmpeg
      - ffprobe
    metadata:
      env:
      - FAL_KEY
      runtime_entrypoint: main
      runtime_file: actions/animate_image/run.py
      runtime_module: astrid.packs.video_editing.actions.animate_image.run
      output_result_manifest: true
      required_permissions:
      - network
      - environment
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - queue.fal.run:443
        - fal.run:443
        - storage.fal.run:443
        - fal.media:443
        - v3.fal.media:443
        - v3b.fal.media:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
  event_talks:
    name: Event Talks
    version: 1.0.0
    short_description: Plan event-talk work and run local template, transcript, and
      holding-screen steps.
    description: Plan the event-talk workflow from optional source and transcript
      files and prepare local template and evidence outputs; the render subcommand
      remains a stub.
    keywords:
    - event
    - talks
    - video
    - render
    - search
    - template
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.video_editing.actions.event_talks.run
        - --out
        - '{out}'
        input_args:
        - input: source
          flag: --source
          optional: true
        - input: transcript
          flag: --transcript
          optional: true
        - input: project
          flag: --project
          optional: true
        - input: python_exec
          flag: --python-exec
          optional: true
        - input: verbose
          flag: --verbose
          optional: true
        - input: dry_run
          flag: --dry-run
          optional: true
    inputs:
    - name: source
      type: file
      required: false
      artifact_type: video
      description: Optional runtime-materialized event recording.
    - name: transcript
      type: file
      required: false
      artifact_type: transcript
      description: Optional transcript JSON for speaker and title search.
    - name: project
      type: string
      required: false
      description: Optional project slug retained for plan metadata.
    - name: python_exec
      type: string
      required: false
      description: Optional child Python executable.
    - name: verbose
      type: boolean
      required: false
      default: false
      description: Stream local step output.
    - name: dry_run
      type: boolean
      required: false
      default: false
      description: Emit the plan without running local steps.
    outputs:
    - name: plan
      type: file
      path_template: '{out}/plan.json'
      mode: create_or_replace
      artifact_type: application/json
      description: Event-talk workflow plan.
    resources:
    - kind: implementation
      path: actions/event_talks/__init__.py
    - kind: implementation
      path: actions/event_talks/run.py
    - kind: implementation
      path: actions/event_talks/plan_template.py
    - kind: implementation
      path: actions/event_talks/workflow.py
    - kind: data
      path: actions/event_talks/data/ados_sunday_speakers.json
    - kind: documentation
      path: actions/event_talks/STAGE.md
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries:
      - ffmpeg
      - ffprobe
      - tesseract
    metadata:
      runtime_entrypoint: main
      runtime_file: actions/event_talks/run.py
      runtime_module: astrid.packs.video_editing.actions.event_talks.run
  hype:
    name: Hype Pipeline
    version: 1.0.0
    short_description: Run the cache-aware hype pipeline from source video and creative
      brief to a rendered edit.
    description: Orchestrate transcription, scene analysis, clip-pool construction,
      arrangement, cut, render, review, and validation for a hype video.
    keywords:
    - hype
    - pipeline
    - video
    - edit
    - render
    - transcribe
    - cut
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.video_editing.actions.hype.entrypoint
        - --out
        - '{out}'
        input_args:
        - input: video
          flag: --video
          optional: false
        - input: brief
          flag: --brief
          optional: false
        - input: project
          flag: --project
          optional: true
        - input: audio
          flag: --audio
          optional: true
        - input: target_duration
          flag: --target-duration
          optional: true
        - input: asset
          flag: --asset
          optional: true
          repeatable: true
        - input: primary_asset
          flag: --primary-asset
          optional: true
        - input: source_slug
          flag: --source-slug
          optional: true
        - input: brief_slug
          flag: --brief-slug
          optional: true
        - input: from_step
          flag: --from
          optional: true
        - input: skip
          flag: --skip
          optional: true
          repeatable: true
        - input: render
          flag: --render
          optional: true
        - input: theme
          flag: --theme
          optional: true
        - input: max_editor_passes
          flag: --max-editor-passes
          optional: true
        - input: config
          flag: --config
          optional: true
        - input: python_exec
          flag: --python
          optional: true
        - input: verbose
          flag: --verbose
          optional: true
        - input: env_file
          flag: --env-file
          optional: true
        - input: no_audit
          flag: --no-audit
          optional: true
        - input: allow_generative_effects
          flag: --allow-generative-effects
          optional: true
        - input: dry_run
          flag: --dry-run
          optional: true
    inputs:
    - name: video
      type: file
      required: true
      artifact_type: video
      description: Runtime-materialized source video; URLs are rejected.
    - name: brief
      type: file
      required: true
      artifact_type: brief
      description: Runtime-materialized editorial brief.
    - name: project
      type: string
      required: false
      description: Optional persistent project slug.
    - name: audio
      type: file
      required: false
      artifact_type: audio
      description: Optional runtime-materialized transcription source.
    - name: target_duration
      type: number
      required: false
      description: Target duration in seconds for an audio-only or generative run.
    - name: asset
      type: string
      required: false
      description: Additional source asset mapping in KEY=PATH form.
    - name: primary_asset
      type: string
      required: false
      description: Primary asset key for cut.
    - name: source_slug
      type: string
      required: false
      description: Source slug used in pool and arrangement metadata.
    - name: brief_slug
      type: string
      required: false
      description: Brief slug used under the output briefs directory.
    - name: from_step
      type: string
      required: false
      description: Force this pipeline step and all later steps to rerun.
    - name: skip
      type: string
      required: false
      description: Pipeline step to skip; may be repeated.
    - name: render
      type: boolean
      required: false
      default: false
      description: Run render, review, and validation steps after cut.
    - name: theme
      type: file
      required: false
      artifact_type: theme
      description: Explicit runtime-materialized theme JSON.
    - name: max_editor_passes
      type: integer
      required: false
      default: 2
      description: Maximum editor review passes, limited to one or two.
    - name: config
      type: file
      required: false
      description: Optional JSON or YAML pipeline configuration.
    - name: python_exec
      type: string
      required: false
      description: Python executable for child commands.
    - name: verbose
      type: boolean
      required: false
      default: false
      description: Stream child-process output.
    - name: env_file
      type: file
      required: false
      description: Optional Runtime-managed environment file for child provider credentials.
    - name: no_audit
      type: boolean
      required: false
      default: false
      description: Disable the run-local audit ledger.
    - name: allow_generative_effects
      type: boolean
      required: false
      default: false
      description: Allow generative visual-source pool entries in a mixed-mode run.
    - name: dry_run
      type: boolean
      required: false
      default: false
      description: Write the redacted plan without invoking child actions.
    outputs:
    - name: briefs
      type: directory
      path_template: '{out}/briefs'
      mode: create_or_replace
      artifact_type: video_editing/brief-results
      description: Per-brief pipeline outputs, including the rendered video when render
        is enabled.
    - name: plan
      type: file
      path_template: '{out}/hype.plan.json'
      mode: create_or_replace
      artifact_type: application/json
      description: Optional redacted dry-run plan.
    resources:
    - kind: implementation
      path: actions/hype/__init__.py
    - kind: implementation
      path: actions/hype/entrypoint.py
    - kind: implementation
      path: actions/hype/run.py
    - kind: implementation
      path: actions/hype/config.py
    - kind: implementation
      path: actions/hype/parser.py
    - kind: implementation
      path: actions/hype/plan_template.py
    - kind: implementation
      path: actions/hype/project_adapter.py
    - kind: implementation
      path: actions/hype/runner.py
    - kind: implementation
      path: actions/hype/step_worker.py
    - kind: implementation
