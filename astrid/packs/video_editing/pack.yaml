  iteration_video:
    name: Iteration Video
    version: 1.0.0
    short_description: Assemble one admitted historical iteration selection and render
      it through the public Rendering action.
    description: Consume the frozen iteration envelope and its exact admitted media
      file, assemble offline, invoke rendering.render, and preserve its video and
      provenance bytes.
    keywords:
    - iteration
    - video
    - render
    - runtime
    - pipeline
    - hype
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.video_editing.actions.iteration_video.run
        - --project-id
        - '{project_id}'
        - --target-run-id
        - '{target_run_id}'
        - --frozen-inputs
        - '{frozen_inputs}'
        - --media-dependency
        - '{media_dependency}'
        - --out
        - '{out}'
        input_args:
        - input: theme
          flag: --theme
          optional: true
        - input: force
          flag: --force
          optional: true
    inputs:
    - name: project_id
      type: string
      required: true
      description: Canonical project ID bound by the admitted envelope.
    - name: target_run_id
      type: string
      required: true
      description: Runtime-issued run ID selected by the trusted admission path.
    - name: frozen_inputs
      type: file
      required: true
      artifact_type: iteration/frozen-inputs
      description: Canonical frozen manifest, quality, and media-binding envelope.
    - name: media_dependency
      type: file
      required: true
      artifact_type: media
      description: Exact materialized bytes for the envelope's single required media
        binding.
    - name: theme
      type: file
      required: false
      artifact_type: theme
      description: Optional separately admitted theme JSON.
    - name: force
      type: boolean
      required: false
      default: false
      description: Preserve the iteration.assemble quality-floor override.
    outputs:
    - name: video
      type: file
      path_template: '{out}/hype.mp4'
      mode: create_or_replace
      artifact_type: video/clip
      description: Rendered iteration video bytes.
    - name: provenance
      type: file
      path_template: '{out}/hype.mp4.provenance.json'
      mode: create_or_replace
      artifact_type: metadata/provenance
      description: Rendering provenance bytes.
    resources:
    - kind: implementation
      path: actions/iteration_video/__init__.py
    - kind: implementation
      path: actions/iteration_video/run.py
    - kind: implementation
      path: actions/iteration_video/admission.py
    - kind: documentation
      path: actions/iteration_video/STAGE.md
    graph:
      depends_on:
      - iteration.assemble
      - rendering.render
      provides:
      - video
      - provenance
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: false
      binaries: []
    metadata:
      authority: runtime
      runtime_entrypoint: main
      runtime_file: actions/iteration_video/run.py
      runtime_module: astrid.packs.video_editing.actions.iteration_video.run
      output_result_manifest: true
  logo_ideas:
    name: Logo Ideas
    version: 1.0.0
    short_description: Draft distinct logo concepts and render them as a contact sheet
