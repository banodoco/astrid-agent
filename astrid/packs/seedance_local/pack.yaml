schema_version: 3
id: seedance_local
name: Personal Seedance fal.ai Adapter
version: 0.1.0
status: experimental
domain: integration
stability: experimental
support: project
extensions:
  astrid:
    project_scope: optional
visibility: visible
description: Personal, temporary Seedance 2.0 reference-video generation through fal.ai.
keywords:
  - seedance
  - fal
  - video
  - reference
  - experiment
capabilities:
  - generate_seedance_reference_video
permissions:
  - id: network
    reason: Uploads one reference clip to fal.ai and downloads the generated video.
  - id: subprocess
    reason: Uses ffprobe to validate the local reference clip.
  - id: project_files
    reason: Reads prompt/reference files and writes an experiment-ready run bundle.
  - id: environment
    reason: Resolves the scoped FAL_KEY credential without persisting it.
  - id: external_services
    reason: Submits a paid Seedance 2.0 generation to fal.ai.
agent:
  purpose: Use for one bounded personal Seedance 2.0 reference-to-video generation through fal.ai.
  do_not_use_for: Do not use for batch queues, unattended retries, or unrelated fal.ai models.
  normal_entrypoints:
    - seedance_local.reference_video
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  reference_video:
    name: Seedance 2.0 reference media via fal.ai
    version: 0.1.0
    short_description: Generate one Seedance 2.0 video from ordered local image references and/or a reference clip.
    description: Validates and stages up to nine ordered images and optionally one 2-15 second reference clip, submits them to fal.ai Seedance 2.0 reference-to-video, downloads the result, and emits an experiment-ready manifest.
    keywords:
      - seedance
      - fal
      - reference-video
      - video
      - experiment
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - "-m"
          - astrid.packs.seedance_local.actions.reference_video.run
          - "--out"
          - "{out}"
        input_args:
          - input: prompt_file
            flag: --prompt-file
            optional: false
          - input: video_ref
            flag: --video-ref
            optional: true
          - input: image_ref
            flag: --image-ref
            repeatable: true
            optional: true
          - input: resolution
            flag: --resolution
            optional: true
          - input: duration
            flag: --duration
            optional: true
          - input: aspect_ratio
            flag: --aspect-ratio
            optional: true
          - input: seed
            flag: --seed
            optional: true
          - input: generate_audio
            flag: --generate-audio
            optional: true
          - input: env_file
            flag: --env-file
            optional: true
          - input: timeout_seconds
            flag: --timeout-seconds
            optional: true
          - input: dry_run
            flag: --dry-run
            optional: true
    inputs:
      - name: prompt_file
        type: file
        required: true
        description: UTF-8 prompt file that explicitly refers to every supplied @ImageN and @Video1 reference.
      - name: video_ref
        type: file
        required: false
        description: Optional MP4 or MOV reference clip, 2-15 seconds and under 50 MB.
      - name: image_ref
        type: file
        required: false
        description: Ordered JPEG, PNG, or WebP reference under 30 MB. Repeat the input up to nine times.
      - name: resolution
        type: string
        required: false
        default: 720p
        description: "Requested Seedance output resolution: 720p or 1080p."
      - name: duration
        type: integer
        required: false
        default: 15
        description: Requested output duration, 4 through 15 seconds.
      - name: aspect_ratio
        type: string
        required: false
        default: "16:9"
        description: Requested Seedance output aspect ratio.
      - name: seed
        type: integer
        required: false
        description: Optional reproducibility seed.
      - name: generate_audio
        type: boolean
        required: false
        default: false
        description: Whether Seedance should synthesize audio.
      - name: env_file
        type: file
        required: false
        description: Optional env file containing FAL_KEY.
      - name: timeout_seconds
        type: integer
        required: false
        default: 3600
        description: Bounded fal.ai request timeout.
      - name: dry_run
        type: boolean
        required: false
        default: false
        description: Stage and validate the request without uploading or submitting it.
    outputs:
      - name: run_bundle
        type: directory
        path_template: "{out}"
        description: Manifest, exact prompt, staged ordered references, generated video, and sanitized request record.
        mode: create_or_replace
    resources:
      - kind: implementation
        path: actions/reference_video/__init__.py
      - kind: implementation
        path: actions/reference_video/run.py
      - kind: documentation
        path: actions/reference_video/STAGE.md
    cache:
      mode: none
    conditions:
      - kind: requires_input
        input: prompt_file
    graph:
      consumes:
        - prompt
        - appearance_reference
        - motion_reference
      depends_on: []
      provides:
        - generation_result_manifest
    isolation:
      mode: subprocess
      network: true
      secrets_required:
        - FAL_KEY
      binaries:
        - ffprobe
      requirements:
        - PyYAML>=6,<7
    scoped_configs:
      - credentials.fal
    metadata:
      output_result_manifest: true
      requires_timeline: false
      runtime_entrypoint: main
      runtime_file: actions/reference_video/run.py
      runtime_module: astrid.packs.seedance_local.actions.reference_video.run
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - queue.fal.run:443
        - rest.alpha.fal.ai:443
        - fal.media:443
        - v3.fal.media:443
        - v3b.fal.media:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
      fal_model_id: bytedance/seedance-2.0/reference-to-video
      pricing_note: At creation time, 720p is approximately $0.3024 per generated second without video input or $0.1814 with video input.
resources:
  - kind: documentation
    path: README.md
  - kind: agents
    path: AGENTS.md
