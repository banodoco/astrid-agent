schema_version: 3
id: generation
name: Astrid Generation
version: 1.0.0
status: active
domain: generation
stability: stable
support: core
visibility: visible
permissions:
- id: subprocess
  reason: Runs vibecomfy/ComfyUI plus Edge TTS, ffmpeg, and ffprobe generation tools.
- id: network
  reason: Calls cloud generation APIs, the Edge TTS speech service, and model downloads.
- id: project_files
  reason: Reads reference images and prompt files; writes generated outputs.
- id: environment
  reason: Reads FAL_KEY for cloud generation backends.
description: Text-to-image and text-to-video generation across local (vibecomfy/ComfyUI)
  and cloud (fal, OpenAI) backends, with t2i/i2i/edit and t2v/i2v/flf modes.
keywords:
- image
- video
- generate
- flux
- fal
- vibecomfy
- t2i
- t2v
capabilities:
- generate_image
- generate_image_cloud_i2i
- generate_image_edit
- generate_image_upscale
- generate_image_openai
- generate_video
- generate_audio
- generate_speech
agent:
  purpose: Use to synthesize images, video, music, or spoken text from prompts (optionally
    with reference images), choosing a model and a local or cloud execution backend.
  do_not_use_for: Editing/arranging existing footage (use video_editing for end-to-end
    assembly or editorial for analysis stages), Spatial Foley effects (use the foley
    or fal packs), or lossless clip trimming (use the media pack).
  normal_entrypoints:
  - generation.generate_image
  - generation.generate_image_upscale
  - generation.generate_video
  - generation.generate_image_openai
  - generation.generate_audio
  - generation.generate_speech
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  generate_audio:
    cache:
      mode: none
    conditions:
    - input: model
      kind: requires_input
    - input: mode
      kind: requires_input
    - input: execution
      kind: requires_input
    description: 'Generate audio from text prompts using local (vibecomfy) or cloud
      (fal) backends. v2: model→mode→backend taxonomy with required --mode. Modes:
      music (tts/sfx reserved for future sprints).'
    graph:
      consumes:
      - prompt_or_prompts_file
      provides:
      - generated_audio
      - audio_manifest
    inputs:
    - description: 'Generation mode: music (text-to-music). tts and sfx are not wired
        this sprint.'
      name: mode
      required: true
      type: string
    - default: ''
      description: Text prompt for audio generation (mutually exclusive with prompts_file).
      name: prompt
      required: false
      type: string
      artifact_type: prompt
    - default: ''
      description: JSON/JSONL file of prompts (mutually exclusive with prompt).
      name: prompts_file
      required: false
      type: file
      artifact_type: prompt
    - description: Model ID from the generation model registry (e.g. 'stable-audio-3-medium',
        'minimax-music-3', 'ace-step').
      name: model
      required: true
      type: string
    - description: 'Execution backend: ''local'' (vibecomfy) or ''cloud'' (fal).'
      name: execution
      required: true
      type: string
    - default: '1'
      description: Number of audio clips to generate (sequential N=1 loop).
      name: count
      required: false
      type: integer
    - default: ''
      description: Deterministic seed for reproducibility.
      name: seed
      required: false
      type: integer
    - default: ''
      description: Negative prompt describing what to avoid.
      name: negative_prompt
      required: false
      type: string
      artifact_type: prompt
    - default: ''
      description: Audio duration in seconds.
      name: duration
      required: false
      type: number
    - default: ''
      description: Classifier-free guidance scale.
      name: guidance_scale
      required: false
      type: number
    - default: ''
      description: Number of sampling steps.
      name: steps
      required: false
      type: integer
    - default: ''
      description: Lyrics prompt for models that support vocals (e.g. MiniMax).
      name: lyrics_prompt
      required: false
      type: string
      artifact_type: prompt
    - default: ''
      description: 'Request instrumental output: ''true'' or ''false''.'
      name: instrumental
      required: false
      type: string
    - default: ''
      description: Output audio format, e.g. 'mp3', 'wav', 'flac' (backend-dependent).
      name: output_format
      required: false
      type: string
    isolation:
      mode: subprocess
      network: true
    keywords:
    - audio
    - generate
    - music
    - fal
    - vibecomfy
    - stable-audio
    - minimax
    - ace-step
    metadata:
      generation_publication:
        modality: audio
        variant_of:
          type: object
          description: Existing generation_id and variant_id to append this output
            to.
        primary:
          type: string
          enum:
          - preserve
          - promote
          default: preserve
      output_result_manifest: true
      requires_timeline: false
      api_provider: multi
      env:
      - FAL_KEY
      - WAVESPEED_API_KEY
      runtime_entrypoint: run_sdk
      runtime_entrypoint_note: run_sdk is the in-process entrypoint returning a JSON-safe
        payload dict; subprocess / CLI compatibility remains via main() and the __main__
        guard at the bottom of run.py.
      runtime_file: actions/generate_audio/run.py
      runtime_module: astrid.packs.generation.actions.generate_audio.run
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - queue.fal.run:443
        - fal.run:443
        - storage.fal.run:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
    name: Generate Audio
    outputs:
    - description: Generated audio files identified by receipt entries.
      mode: create_or_replace
      name: generated_audio
      type: file
      artifact_type: audio
    - description: JSON manifest of the generation run with audio fields.
      mode: create_or_replace
      name: audio_manifest
      path_template: '{out}/manifest.json'
      type: file
    scoped_configs:
    - credentials.fal
    - credentials.wavespeed
    short_description: 'Generate audio from text prompts via local or cloud backends.
      v2: model→mode→backend with music mode.'
    version: '2.0'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.generation.actions.generate_audio.run
        - --model
        - '{model}'
        - --mode
        - '{mode}'
        - --execution
        - '{execution}'
        - --out
        - '{out}'
        input_args: []
    resources:
    - kind: documentation
      path: actions/generate_audio/STAGE.md
    - kind: implementation
      path: actions/generate_audio/__init__.py
    - kind: implementation
      path: actions/generate_audio/run.py
  generate_image:
    cache:
      mode: none
    conditions:
    - input: model
      kind: requires_input
    - input: mode
      kind: requires_input
    - input: execution
      kind: requires_input
    description: Generate up to four cloud text-to-image outputs through the model
      registry under an enforced whole-task storage envelope.
    graph:
      consumes:
      - prompt_or_prompts_file
      - image_ref
      provides:
      - generated_images
      - image_manifest
    inputs:
    - description: 'Generation mode: t2i (text-to-image), i2i (image-to-image), edit
        (instruction-guided edit). Required per SD-005.'
      name: mode
      required: true
      type: string
    - default: ''
      description: Text prompt for image generation (mutually exclusive with prompts_file).
      name: prompt
      required: false
      type: string
      artifact_type: prompt
    - default: ''
      description: JSON/JSONL file of prompts (mutually exclusive with prompt).
      name: prompts_file
      required: false
      type: file
      artifact_type: prompt
    - description: Model ID from the generation model registry (e.g. 'flux-dev', 'z-image').
      name: model
      required: true
      type: string
    - default: ''
      description: Reference image path or URL for i2i/edit modes.
      name: image_ref
      required: false
      type: string
      artifact_type: image
    - description: 'Execution backend: ''local'' (vibecomfy), ''cloud'' (fal), or
        ''codex'' (Codex image_generation).'
      name: execution
      required: true
      type: string
    - default: '1'
      description: Number of images to generate (sequential N=1 loop).
      name: count
      required: false
      type: integer
    - default: ''
      description: Deterministic seed for reproducibility.
      name: seed
      required: false
      type: integer
    - default: ''
      description: Negative prompt describing what to avoid.
      name: negative_prompt
      required: false
      type: string
      artifact_type: prompt
    - default: ''
      description: Output size (e.g. '1024x1024' or fal size preset).
      name: size
      required: false
      type: string
    - default: ''
      description: 'Codex quality hint folded into the natural-language prompt: low,
        medium, high, or auto.'
      name: quality
      required: false
      type: string
    - default: ''
      description: 'Codex background hint folded into the natural-language prompt:
        transparent, opaque, or auto.'
      name: background
      required: false
      type: string
    - default: '300'
      description: Codex per-image timeout in seconds.
      name: timeout
      required: false
      type: integer
    - default: ''
      description: Denoising strength for i2i mode (0.0-1.0).
      name: strength
      required: false
      type: number
    - default: ''
      description: Classifier-free guidance scale.
      name: guidance_scale
      required: false
      type: number
    - default: ''
      description: Number of sampling steps.
      name: steps
      required: false
      type: integer
    - default: ''
      description: 'Upscale mode: ''factor'' (multiply dimensions) or ''target'' (target
        resolution).'
      name: upscale_mode
      required: false
      type: string
    - default: ''
      description: Upscale factor (1-10) when upscale_mode is 'factor'.
      name: upscale_factor
      required: false
      type: number
    - default: ''
      description: 'Target resolution when upscale_mode is ''target'': 720p, 1080p,
        1440p, 2160p.'
      name: target_resolution
      required: false
      type: string
    - default: ''
      description: Noise scale (0-1) for the upscaler.
      name: noise_scale
      required: false
      type: number
    - default: ''
      description: Comma-separated LoRA registry ids and/or path@scale specs (e.g.
        'flux-realism,z-realgen-v2' or 'https://...@0.8').
      name: loras
      required: false
      type: string
    - default: null
      description: Closed shot-generation recipe preserving prompt bindings, ordered
        references, generator identity, and content hashes.
      name: shot_generation_recipe
      required: false
      type: json
    isolation:
      mode: subprocess
      network: true
    keywords:
    - image
    - generate
    - flux
    - fal
    - codex
    - gpt-image
    - vibecomfy
    - i2i
    - t2i
    - edit
    - z-image
    - qwen
    metadata:
      generation_publication:
        modality: image
        variant_of:
          type: object
          description: Existing generation_id and variant_id to append this output
            to.
        primary:
          type: string
          enum:
          - preserve
          - promote
          default: preserve
      output_result_manifest: true
      requires_timeline: false
      api_provider: fal
      env:
      - FAL_KEY
      secrets_required:
      - FAL_KEY
      runtime_entrypoint: run_sdk
      runtime_entrypoint_note: run_sdk is the in-process entrypoint returning a JSON-safe
        payload dict; subprocess / CLI compatibility remains via main() and the __main__
        guard at the bottom of run.py.
      storage_estimate_required: true
      storage_estimate_exact: true
      fixed_inputs:
        mode: t2i
        execution: cloud
      storage_policy_version: astrid.cloud-t2i.registry.v1
      storage_policy_limits:
        max_count: 4
        max_output_bytes_each: 67108864
        max_manifest_bytes: 1048576
        max_width: 2048
        max_height: 2048
      estimated_scratch_bytes: 69206016
      estimated_output_bytes: 269484032
      hc04_param_ports:
      - mode
      - prompt
      - model
      - execution
      - count
      - seed
      - negative_prompt
      - guidance_scale
      - steps
      - size
      - loras
      - shot_generation_recipe
      hc04_cas_param_ports: []
      runtime_file: actions/generate_image/run.py
      runtime_module: astrid.packs.generation.actions.generate_image.run
      network_policy:
        allowed_protocols:
        - dns
        - tcp
        allowed_destinations:
        - queue.fal.run:443
        - fal.run:443
        - fal.media:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: declared-http-routes
          wrapper: astrid-generic-host
    name: Generate Image
    outputs:
    - description: Generated image files identified by receipt entries.
      mode: create_or_replace
      name: generated_images
      type: file
      artifact_type: image
    - description: JSON manifest of the generation run.
      mode: create_or_replace
      name: image_manifest
      path_template: '{out}/manifest.json'
      type: file
    scoped_configs:
    - credentials.fal
    short_description: Bounded registry-backed cloud text-to-image generation.
    version: '2.1'
    invocation:
      kind: command
      command:
        argv:
        - '{python_exec}'
        - -m
        - astrid.packs.generation.actions.generate_image.run
        - --model
        - '{model}'
        - --mode
        - '{mode}'
        - --execution
        - '{execution}'
        - --storage-policy-version
        - astrid.cloud-t2i.registry.v1
        - --size
        - '{size}'
        - --out
        - '{out}'
        input_args: []
    resources:
