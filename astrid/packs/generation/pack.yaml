    - default: ''
      description: JSON/JSONL file of prompts (mutually exclusive with prompt).
      name: prompts_file
      required: false
      type: file
      artifact_type: prompt
    - description: Model ID from the generation model registry (e.g. 'wan-2.2', 'ltx-2.3').
      name: model
      required: true
      type: string
    - default: ''
      description: Reference image path or URL for i2v/flf modes.
      name: image_ref
      required: false
      type: string
      artifact_type: image
    - default: ''
      description: End-frame reference image path or URL for flf mode.
      name: image_end_ref
      required: false
      type: string
      artifact_type: image
    - default: ''
      description: Driving motion video path or URL for v2v mode.
      name: video_ref
      required: false
      type: string
      artifact_type: video
