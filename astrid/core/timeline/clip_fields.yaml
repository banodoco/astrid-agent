# The universal clip fields, declared once (X-32). DATA ONLY: no code here.
# Read by astrid/core/timeline/clip_fields.py (coerce, describe, read, write,
# render_status, FIELDS). Every `store` is a dotted path into the clip dict
# ("params.fadeIn" lives under clip["params"]).
#
# Stored units: opacity and crop are fractions 0..1; speed and volume are
# multipliers (volume is linear gain, 1.0 = unchanged); every animation or fade
# duration is SECONDS (a human "8f" is converted at the clip's fps); transition
# durations are integer durationFrames.
#
# render: one entry per clip kind the field applies to. Kinds: element (any am-*
# or other effect clip), media (visual media), audio (audio clip). A kind that is
# absent means the field does not apply to it (render_status -> "unknown").
# A clip type name (for example am-footage) may have its own entry; that exact
# entry is checked before its kind, so one element can differ from the others.
#   status: works    the renderer honours the field
#   status: ignored  the renderer never honours it (until the named ticket lands)
#   since: the first composition version that honours it (default 0.0.0)
version: 1
fields:
  keyframe_origin:
    type: number
    unit: seconds
    store: keyframeOrigin
    default: null
    applies: visual
    write: "0"
    notes: "Key-time zero relative to clip start; trim and speed do not affect it. Absent: App timeline-seconds, sprite local-frame legacy domains."
    schema: {type: number}
    render:
      element: {status: works}

  opacity:
    type: number
    unit: fraction
    store: opacity
    min: 0
    max: 1
    default: 1
    applies: visual
    write: "0.6"
    schema: {type: number, minimum: 0, maximum: 1}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works}

  entrance:
    type: animation
    unit: animation
    phase: entrance
    store: entrance
    default: null
    applies: visual
    values_from: animations
    write: "fade 8f"
    notes: "ease=E (linear, in, out, in-out, step; default linear) is stored as params.easing, linear is omitted; legacy inOut reads as in-out"
    schema:
      type: [object, "null"]
      required: [type]
      additionalProperties: false
      properties:
        type: {type: string}
        duration: {type: number, exclusiveMinimum: 0}
        intensity: {type: number}
        params: {type: object}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works, since: "0.0.7"}

  exit:
    type: animation
    unit: animation
    phase: exit
    store: exit
    default: null
    applies: visual
    values_from: animations
    write: "fade 8f"
    notes: "ease=E as on entrance (params.easing)"
    schema:
      type: [object, "null"]
      required: [type]
      additionalProperties: false
      properties:
        type: {type: string}
        duration: {type: number, exclusiveMinimum: 0}
        intensity: {type: number}
        params: {type: object}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works, since: "0.0.7"}

  # fade_in is the visual entrance fade (stored as the entrance) or the audio
  # fade-in (stored as params.fadeIn, seconds). A visual fade_in therefore shows
  # up as `entrance` in describe(); its render status follows the entrance's.
  fade_in:
    type: fade
    unit: seconds
    phase: entrance
    default: null
    applies: [visual, audio]
    write: "8f"
    visual: {store: entrance, value: fade}
    audio: {store: params.fadeIn}
    schema: {type: [number, "null"], exclusiveMinimum: 0}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works, since: "0.0.7"}
      audio: {status: works}

  fade_out:
    type: fade
    unit: seconds
    phase: exit
    default: null
    applies: [visual, audio]
    write: "8f"
    visual: {store: exit, value: fade}
    audio: {store: params.fadeOut}
    schema: {type: [number, "null"], exclusiveMinimum: 0}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works, since: "0.0.7"}
      audio: {status: works}

  crop_top:
    type: number
    unit: fraction
    store: cropTop
    min: 0
    max: 1
    default: 0
    applies: visual
    write: "0.1"
    schema: {type: number, minimum: 0, maximum: 1}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works}

  crop_right:
    type: number
    unit: fraction
    store: cropRight
    min: 0
    max: 1
    default: 0
    applies: visual
    write: "0.1"
    schema: {type: number, minimum: 0, maximum: 1}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works}

  crop_bottom:
    type: number
    unit: fraction
    store: cropBottom
    min: 0
    max: 1
    default: 0
    applies: visual
    write: "0.1"
    schema: {type: number, minimum: 0, maximum: 1}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works}

  crop_left:
    type: number
    unit: fraction
    store: cropLeft
    min: 0
    max: 1
    default: 0
    applies: visual
    write: "0.1"
    schema: {type: number, minimum: 0, maximum: 1}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works}

  speed:
    type: number
    unit: rate
    store: speed
    suffix: x
    exclusive_min: 0
    max: 10
    default: 1
    applies: [visual, audio]
    write: "0.5x"
    schema: {type: number, exclusiveMinimum: 0, maximum: 10}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works}
      audio: {status: works}
    notes: "element time is remapped (C3); audio playbackRate shifts pitch"

  volume:
    type: gain
    unit: gain
    store: volume
    min: 0
    max: 4
    default: 1
    applies: [audio, footage]
    write: "-3dB"
    schema: {type: number, minimum: 0, maximum: 4}
    render:
      media: {status: works}
      audio: {status: works}
      element: {status: ignored}
      am-footage: {status: works, since: "0.0.7"}
    notes: "am-footage plays clip.volume (params.volume is only a fallback) from 0.0.7; other elements ignore clip.volume"

  transition:
    type: transition
    unit: transition
    store: transition
    default: null
    applies: visual
    write: "crossfade 10f"
    values: {crossfade: cross-fade, dip: fade, cut: null}
    schema:
      type: [object, "null"]
      required: [id]
      properties:
        id: {type: string}
        durationFrames: {type: integer, exclusiveMinimum: 0}
    render:
      element: {status: works, since: "0.0.7"}
      media: {status: works, since: "0.0.7"}
    notes: "the cross-fade dips to the background (C2); until C2 transitions are broken"

# Names the clip owns at the top level. The element validator refuses these as
# element params. freeze, pan, rotate and mute are reserved but not declared yet.
reserved: [keyframe_origin, opacity, fade_in, fade_out, entrance, exit, crop_top, crop_right, crop_bottom, crop_left, speed, freeze, pan, rotate, volume, mute, transition]
