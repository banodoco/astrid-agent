repos:
  astrid-agent: ddd5d278796641901bd11508863a8ea21e6c9697
  astrid-runtime: 47e5949465cb6f3afdfd1cb8a0e90009fd9d4020
  astrid-app: 7f6f99208100e895efebf39c70bc30af6cee0884
  astrid-pinokio: 89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4
  VibeComfy: 2967033970cbb5884651c9565265778482d3b44e
  runpod-lifecycle: 96360a27a53c4608f780f7b370f747a2aa3c7ca8
gpu: false
cpu: {vcpu: 8}
image: default
max_minutes: 360
setup: []
run:
  - |
      set +e
      umask 077
      ROOT="$PWD/g01-r7"
      OUT="$PWD/runpod-out"
      INNER_OUT="/workspace/jobs/G-01-Q-RUNNER-R7/out"
      mkdir -p "$ROOT/package" "$OUT" "$INNER_OUT"
      exec >"$OUT/request-step.log" 2>&1
      printf '%s\n' 'G-01-Q-RUNNER-R7 broker payload' > "$OUT/request-identity.txt"
      printf '%s\n' 'agent=ddd5d278796641901bd11508863a8ea21e6c9697' 'runtime=47e5949465cb6f3afdfd1cb8a0e90009fd9d4020' 'app=7f6f99208100e895efebf39c70bc30af6cee0884' 'pinokio=89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4' 'vibecomfy=2967033970cbb5884651c9565265778482d3b44e' 'lifecycle=96360a27a53c4608f780f7b370f747a2aa3c7ca8' > "$OUT/published-inputs.txt"
      printf '%s\n' 'agent-focused' 'agent-generation-journey' 'agent-installed-h3-boundary' 'runtime-focused' 'runtime-typescript-client' 'vibecomfy-touched' > "$OUT/expected-six-suites.txt"
      printf '%s\n' 'lane/M-QUAL/G-01-Q-RUNNER-R7-runpod' > "$OUT/request-branch.txt"
      avail=$(df -Pk "$PWD" | awk 'NR==2 {print $4}')
      printf 'workspace_available_kib=%s\n' "$avail" > "$OUT/disk-before.txt"
      if [ -z "$avail" ] || [ "$avail" -lt 2097152 ]; then
        printf '%s\n' 'PREFLIGHT_DISK_FLOOR failed before package setup' > "$OUT/failure.log"
        printf '%s\n' 'runner_exit=73' > "$OUT/inner-exits.txt"
        exit 0
      fi
      PAYLOAD_B64=''
      python3 - "$PAYLOAD_B64" "$ROOT/package" <<'G01PY'
      import base64,gzip,json,sys
      from pathlib import Path
      payload=json.loads(base64.b64decode(sys.argv[1]))
      root=Path(sys.argv[2])
      for name,data in payload.items():
          (root/name).write_bytes(gzip.decompress(base64.b64decode(data)))
      G01PY
      unpack=$?
      if [ "$unpack" -ne 0 ]; then
        printf 'package_unpack_exit=%s\n' "$unpack" > "$OUT/inner-exits.txt"
        exit 0
      fi
      M02_POD_EXECUTION=1 bash "$ROOT/package/run.sh" --execute > "$OUT/runner-console.log" 2>&1
      runner_rc=$?
      printf 'runner_exit=%s\n' "$runner_rc" > "$OUT/inner-exits.txt"
      cp -a "$INNER_OUT/." "$OUT/" 2>/dev/null
      cp "$ROOT/package/artifact-manifest.json" "$OUT/bound-artifact-manifest.json"
      sha256sum "$ROOT/package/run.sh" "$ROOT/package/runner.py" "$ROOT/package/artifact-manifest.json" > "$OUT/bound-package.sha256"
      find "$OUT" -maxdepth 1 -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 -r sha256sum > "$OUT/hashes.sha256"
      exit 0
artifacts:
  - runpod-out/**
