repos:
  astrid-agent: 39086a8a1278639b72bdd9433d30dca809922ca4
  astrid-runtime: 1a275bb339ae897e52a5be5e1da99e846e402037
producer_authorities:
  vibecomfy: 3bebae39655eb4604548850404be3d4aefaf2ef31
  lifecycle: 96360a2
cpu:
  vcpu: 8
gpu: false
max_minutes: 120
setup:
  - |
    set -euo pipefail
    PROOF_ROOT=/workspace/I-AG-04-R1B-R3-proof
    mkdir -p "$PROOF_ROOT/tmp" "$PWD/runpod-evidence" /workspace/out
    export TMPDIR="$PROOF_ROOT/tmp"
    python3 -c 'import sys; assert sys.version_info >= (3, 11)'
    python3 -m venv "$PROOF_ROOT/venv"
    TASK_PYTHON="$PROOF_ROOT/venv/bin/python"
    "$TASK_PYTHON" -m pip install --disable-pip-version-check --require-hashes -r requirements/proof.lock -r requirements/build.lock
    "$TASK_PYTHON" -m pip install --disable-pip-version-check --no-deps --no-build-isolation . ../astrid-runtime ../astrid-runtime/packages/python
    "$TASK_PYTHON" -m pip install --disable-pip-version-check aiohttp==3.14.5
    "$TASK_PYTHON" -m pip freeze > runpod-evidence/environment.txt
    uname -a > runpod-evidence/platform.txt
run:
  - |
    set -euo pipefail
    PROOF_ROOT=/workspace/I-AG-04-R1B-R3-proof
    TASK_PYTHON="$PROOF_ROOT/venv/bin/python"
    mkdir -p "$PWD/runpod-evidence" /workspace/out
    finish_proof() {
      code=$?
      trap - EXIT
      printf '%s\n' "$code" > runpod-evidence/payload-exit.txt
      cp -a runpod-evidence/. /workspace/out/
      exit "$code"
    }
    trap finish_proof EXIT
    export TMPDIR="$PROOF_ROOT/tmp" PYTHONPATH="$PROOF_ROOT:$(realpath ../astrid-runtime)" PYTHONDONTWRITEBYTECODE=1
    export ASTRID_RUNTIME_CHECKOUT="$(realpath ../astrid-runtime)"
    unset RUNPOD_API_KEY
    EXPECTED_AGENT=39086a8a1278639b72bdd9433d30dca809922ca4
    EXPECTED_RUNTIME=1a275bb339ae897e52a5be5e1da99e846e402037
    REQUEST_BRANCH=lane/M-AG/I-AG-04-R1B-R3-runpod
    test "$(git rev-parse HEAD)" = "$EXPECTED_AGENT"
    test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD)" = "$EXPECTED_RUNTIME"
    test -z "$(git status --porcelain --untracked-files=no)"
    test -z "$(git -C "$ASTRID_RUNTIME_CHECKOUT" status --porcelain --untracked-files=no)"
    git rev-parse HEAD > runpod-evidence/agent-head.txt
    git show -s --format=%P HEAD > runpod-evidence/source-parents.txt
    git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD > runpod-evidence/runtime-head.txt
    git fetch origin "$REQUEST_BRANCH"
    git rev-parse FETCH_HEAD > runpod-evidence/request-head.txt
    git show FETCH_HEAD:runpod-job.yaml > runpod-evidence/request.yaml
    printf '%s\n' 'vibecomfy=3bebae39655eb4604548850404be3d4aefaf2ef31' 'lifecycle=96360a2' > runpod-evidence/producer-authorities.txt
    "$TASK_PYTHON" scripts/vendor_lock.py check runtime.lock.json --producer "$ASTRID_RUNTIME_CHECKOUT" > runpod-evidence/vendor-check.log 2>&1
    sha256sum runtime.lock.json astrid_runtime_client/*.py astrid/core/timeline/schema/timeline-config.schema.json artifacts.json > runpod-evidence/generated-SHA256SUMS
    SKILL_BIN="$PROOF_ROOT/skill-bin"
    mkdir -p "$SKILL_BIN"
    printf '#!/bin/sh\nexec "%s" "$@"\n' "$TASK_PYTHON" > "$SKILL_BIN/python3"
    chmod 755 "$SKILL_BIN/python3"
    PATH="$SKILL_BIN:$PATH" python3 -c 'import PIL; print(PIL.__version__)' > runpod-evidence/wrapper-import-pil.txt
    set +e
    "$TASK_PYTHON" -m pytest -o addopts= -q --collect-only \
      tests/v10/test_timelines_create.py::test_remote_create_empty_creates_shell_then_empty_head \
      tests/v10/test_domain_cli_projects_timelines.py::test_first_run_timeline_journey_uses_selection_recent_history_and_project_list \
      tests/test_skills.py::test_timeline_main_skill_code_blocks_run_with_scratch_runtime \
      tests/sdk/test_timeline_import_prepare.py::test_prepare_import_builds_fresh_children_and_target_transcript_ids \
      tests/v10/test_domain_cli_projects_timelines.py::test_timelines_visualize_routes_public_sdk_and_normalizes_formats \
      tests/v10/test_domain_cli_projects_timelines.py::test_timelines_visualize_forwards_filmstrip_options \
      tests/v10/test_domain_cli_projects_timelines.py::test_projects_list_default_matches_explicit_json \
      tests/sdk/test_timeline_restructure.py::test_split_stores_chapters_as_shots_and_music_and_crossers_on_the_film \
      tests/sdk/test_timeline_restructure.py::test_restructure_refuses_what_would_change_the_render \
      tests/sdk/test_timeline_restructure.py::test_split_routes_a_new_clip_by_placement_and_a_wall_crosser_to_the_film \
      tests/packs/timeline/test_verbs_working_copy.py::test_show_as_sheet_prints_the_working_copy_sheet_with_a_banner \
      tests/packs/timeline/test_verbs_working_copy.py::test_publish_conflict_names_the_writer_and_offers_discard_first \
      > runpod-evidence/correction-collection.txt 2>&1
    collect_code=$?
    "$TASK_PYTHON" -m pytest -o addopts= -q --junitxml=runpod-evidence/correction.xml \
      tests/v10/test_timelines_create.py::test_remote_create_empty_creates_shell_then_empty_head \
      tests/v10/test_domain_cli_projects_timelines.py::test_first_run_timeline_journey_uses_selection_recent_history_and_project_list \
      tests/test_skills.py::test_timeline_main_skill_code_blocks_run_with_scratch_runtime \
      tests/sdk/test_timeline_import_prepare.py::test_prepare_import_builds_fresh_children_and_target_transcript_ids \
      tests/v10/test_domain_cli_projects_timelines.py::test_timelines_visualize_routes_public_sdk_and_normalizes_formats \
      tests/v10/test_domain_cli_projects_timelines.py::test_timelines_visualize_forwards_filmstrip_options \
      tests/v10/test_domain_cli_projects_timelines.py::test_projects_list_default_matches_explicit_json \
      tests/sdk/test_timeline_restructure.py::test_split_stores_chapters_as_shots_and_music_and_crossers_on_the_film \
      tests/sdk/test_timeline_restructure.py::test_restructure_refuses_what_would_change_the_render \
      tests/sdk/test_timeline_restructure.py::test_split_routes_a_new_clip_by_placement_and_a_wall_crosser_to_the_film \
      tests/packs/timeline/test_verbs_working_copy.py::test_show_as_sheet_prints_the_working_copy_sheet_with_a_banner \
      tests/packs/timeline/test_verbs_working_copy.py::test_publish_conflict_names_the_writer_and_offers_discard_first \
      > runpod-evidence/correction.log 2>&1
    correction_code=$?
    set -e
    printf '%s\n' "$collect_code" > runpod-evidence/correction-collection.exit
    printf '%s\n' "$correction_code" > runpod-evidence/correction.exit
    "$TASK_PYTHON" scripts/vendor_lock.py check runtime.lock.json --producer "$ASTRID_RUNTIME_CHECKOUT" > runpod-evidence/final-vendor-check.log 2>&1
    git diff --exit-code
    git status --porcelain --untracked-files=no > runpod-evidence/final-status.txt
    sha256sum runpod-evidence/*.txt runpod-evidence/*.log runpod-evidence/*.xml > runpod-evidence/SHA256SUMS
    test "$collect_code" -eq 0
    exit "$correction_code"
artifacts:
  - runpod-evidence/agent-head.txt
  - runpod-evidence/source-parents.txt
  - runpod-evidence/runtime-head.txt
  - runpod-evidence/request-head.txt
  - runpod-evidence/request.yaml
  - runpod-evidence/payload-exit.txt
  - runpod-evidence/producer-authorities.txt
  - runpod-evidence/environment.txt
  - runpod-evidence/platform.txt
  - runpod-evidence/vendor-check.log
  - runpod-evidence/final-vendor-check.log
  - runpod-evidence/generated-SHA256SUMS
  - runpod-evidence/wrapper-import-pil.txt
  - runpod-evidence/correction-collection.txt
  - runpod-evidence/correction-collection.exit
  - runpod-evidence/correction.log
  - runpod-evidence/correction.exit
  - runpod-evidence/correction.xml
  - runpod-evidence/final-status.txt
  - runpod-evidence/SHA256SUMS
