    "set -eu\nmkdir -p /workspace/out/tests\ntest \"$(git -C /workspace/astrid-agent rev-parse HEAD)\" = fc70ccb0dd7c3076dde75ddeefdfa0f50d739019\ntest \"$(git -C /workspace/astrid-runtime rev-parse HEAD)\" = 1e6d899efa77a2d6ec247c38250f9748330bb587\npython -m pip install 'pytest==9.0.2' 'pytest-timeout>=2.4' 'setuptools==80.9.0' wheel pyyaml jsonschema filelock python-dotenv uv\npython -m pip install --no-deps /workspace/astrid-runtime\n"
