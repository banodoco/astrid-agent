repos:
  astrid-agent: dd1307d58cb7ee50ee1f50f390d6cecec2f11b9a
  astrid-runtime: 5453366458f7b4ee874c94d15ae7952e3e82d3c3
cpu:
  vcpu: 8
gpu: false
max_minutes: 60
setup:
- "set -euo pipefail\nmkdir -p /workspace/out \"$PWD/runpod-tmp\"\nexec > >(tee /workspace/out/setup.log) 2>&1\ntrap 'code=$?; printf \"%s\\n\" \"$code\" > /workspace/out/setup-exit.txt' EXIT\nprintf '%s' '' | base64 -d | gzip -d > /workspace/out/r14-job.log\nprintf 'exit=1\\n' > /workspace/out/r14-exit-codes.txt\nsha256sum /workspace/out/r14-job.log > /workspace/out/r14-job.sha256\nexport TMPDIR=\"$PWD/runpod-tmp\"\ndf -Pk \"$PWD\" | tee /workspace/out/disk-before.txt\ntest \"$(df -Pk \"$PWD\" | awk 'NR==2 {print $4}')\" -ge 2097152\npython3 -m venv \"$PWD/runpod-tmp/venv\"\nP=\"$PWD/runpod-tmp/venv/bin/python\"\n\"$P\" -m pip install --disable-pip-version-check --require-hashes -r requirements/proof.lock -r requirements/build.lock\n\"$P\" -m pip install --disable-pip-version-check --no-deps --no-build-isolation . ../astrid-runtime ../astrid-runtime/packages/python\n\"$P\" -m pip install --disable-pip-version-check --no-deps \"banodoco-timeline-schema @ git+https://github.com/banodoco/astrid-agent.git@242f9c4306bf3b501222cb041a9eb246ef47bc85#subdirectory=packages/timeline-schema/python\" \"git+https://github.com/peteromallet/VibeComfy.git@ac0ee1b80991f2414dae27d264af4b5e2890a7a6\" \"git+https://github.com/banodoco/runpod-lifecycle.git@96360a27a53c4608f780f7b370f747a2aa3c7ca8\"\ncurl --fail --location --silent --show-error https://nodejs.org/dist/v20.19.4/node-v20.19.4-linux-x64.tar.xz -o \"$TMPDIR/node.tar.xz\"\ntar --no-same-owner -xJf \"$TMPDIR/node.tar.xz\" -C \"$TMPDIR\"\nexport PATH=\"$TMPDIR/node-v20.19.4-linux-x64/bin:$PATH\"\nnpm --prefix remotion ci --ignore-scripts --no-audit --no-fund\n(cd remotion && npx remotion browser ensure)\nBROWSER=$(find \"$PWD/remotion/node_modules/.remotion\" -type f -name chrome-headless-shell -print -quit)\ntest -n \"$BROWSER\"\nldd \"$BROWSER\" | tee /workspace/out/browser-ldd-before.txt\nif grep -q 'not found' /workspace/out/browser-ldd-before.txt; then\n  apt-get update\n  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libxkbcommon0 libcups2 libpango-1.0-0 libcairo2 libatspi2.0-0\n  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libasound2t64 || DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libasound2\nfi\nldd \"$BROWSER\" | tee /workspace/out/browser-ldd-after.txt\n! grep -q 'not found' /workspace/out/browser-ldd-after.txt\n\"$BROWSER\" --version | tee /workspace/out/browser-version.txt\n\"$P\" -m pip freeze > /workspace/out/environment.txt\n"
run:
- 'set -euo pipefail

  mkdir -p /workspace/out "$PWD/runpod-tmp"

  exec > >(tee /workspace/out/run.log) 2>&1

  trap ''code=$?; printf "%s\n" "$code" > /workspace/out/run-exit.txt'' EXIT

  export TMPDIR="$PWD/runpod-tmp" PYTHONDONTWRITEBYTECODE=1

  export ASTRID_RUNTIME_CHECKOUT="$(realpath ../astrid-runtime)"

  export PYTHONPATH="$PWD:$ASTRID_RUNTIME_CHECKOUT:$ASTRID_RUNTIME_CHECKOUT/packages/python"

  export PATH="$TMPDIR/node-v20.19.4-linux-x64/bin:$PATH"

  P="$TMPDIR/venv/bin/python"

  test "$(git rev-parse HEAD)" = dd1307d58cb7ee50ee1f50f390d6cecec2f11b9a

  test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD)" = 5453366458f7b4ee874c94d15ae7952e3e82d3c3

  test "$(node --version)" = v20.19.4

  { git rev-parse HEAD; git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD; uname -a; "$P" --version; "$P" -m pytest --version; node --version; } > /workspace/out/identity.txt

  "$P" scripts/vendor_lock.py check runtime.lock.json --producer "$ASTRID_RUNTIME_CHECKOUT" 2>&1 | tee /workspace/out/vendor-lock.txt

  sha256sum runtime.lock.json artifacts.json astrid_runtime_client/generated.py astrid_runtime_client/contract_metadata.py astrid_runtime_client/__init__.py astrid/chat/service.mjs > /workspace/out/generated-and-lock.sha256

  selectors=(tests/integrations/test_execution_custody_runtime_i_ag_03b.py::test_native_render_uses_exact_verified_inputs_and_proves_cleanup tests/integrations/test_generic_host_remotion_render.py::test_generic_host_remotion_register_claim_execute_settle_and_cas tests/core/rendering/test_remotion_host_regressions.py::test_captured_orchestrator_uses_platform_descriptor_launch tests/core/rendering/test_remotion_host_regressions.py::test_native_platform_launch_inherits_source_descriptor tests/packs/rendering/test_verified_source.py tests/sdk/test_workspace_client_custody_composition_i_ag_03b.py::test_verified_media_and_filtered_object_operations_coexist tests/core/gateway/test_doctor_bundle.py::test_doctor_custody_union_handles_unavailable_runtime)

  printf ''%q '' "$P" -m pytest -p no:cacheprovider -o addopts= -q --basetemp="$TMPDIR/pytest-native" --junitxml=/workspace/out/native.xml "${selectors[@]}" > /workspace/out/command.txt

  printf ''\n'' >> /workspace/out/command.txt

  "$P" -m pytest -p no:cacheprovider -o addopts= -q --collect-only "${selectors[@]}" > /workspace/out/nodes.txt 2>&1

  set +e

  "$P" -m pytest -p no:cacheprovider -o addopts= -q --basetemp="$TMPDIR/pytest-native" --junitxml=/workspace/out/native.xml "${selectors[@]}" 2>&1 | tee /workspace/out/native.log

  status=${PIPESTATUS[0]}

  set -e

  printf ''%s\n'' "$status" > /workspace/out/pytest-exit.txt

  df -Pk "$PWD" > /workspace/out/disk-after.txt

  sha256sum /workspace/out/{identity.txt,command.txt,nodes.txt,native.log,native.xml,pytest-exit.txt,generated-and-lock.sha256,browser-ldd-before.txt,browser-ldd-after.txt,r14-job.log} > /workspace/out/SHA256SUMS

  exit "$status"

  '
artifacts:
- /workspace/out/**
