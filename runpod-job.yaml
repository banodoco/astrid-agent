    rc=${PIPESTATUS[0]}
    printf 'runpod_cp3=%s\n' "$rc" > /workspace/out/runpod-cp3.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/target-selection.xml tests/packs/runpod/test_target_selection.py 2>&1 | tee /workspace/out/target-selection.log
    rc=${PIPESTATUS[0]}
    printf 'target_selection=%s\n' "$rc" > /workspace/out/target-selection.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/graph-roots.xml tests/sdk/test_timeline_commit_graph_roots.py tests/editing_conformance/test_recorded_graph_roots.py 2>&1 | tee /workspace/out/graph-roots.log
    rc=${PIPESTATUS[0]}
