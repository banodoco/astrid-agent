repos:
  astrid-agent: eb6be2e6d872fb214136d456803b024cc623c10a
  astrid-runtime: 3b12fface79a3be029f3b6623765a7f3e1e5e24f
cpu:
  vcpu: 8
max_minutes: 30
setup:
- 'set -euo pipefail

  mkdir -p "$PWD/runpod-tmp" "$PWD/runpod-evidence"

  export TMPDIR="$PWD/runpod-tmp"

  python3 -m venv "$PWD/runpod-tmp/venv"

  CUSTODY_PYTHON="$PWD/runpod-tmp/venv/bin/python"

  "$CUSTODY_PYTHON" -m pip install --disable-pip-version-check --require-hashes -r
  requirements/proof.lock -r requirements/build.lock

  "$CUSTODY_PYTHON" -m pip install --disable-pip-version-check --no-deps --no-build-isolation
  . ../astrid-runtime ../astrid-runtime/packages/python

  "$CUSTODY_PYTHON" -m pip install --disable-pip-version-check --no-deps "banodoco-timeline-schema
  @ git+https://github.com/banodoco/astrid-agent.git@242f9c4306bf3b501222cb041a9eb246ef47bc85#subdirectory=packages/timeline-schema/python"

  "$CUSTODY_PYTHON" -m pip freeze > runpod-evidence/environment.txt

  '
run:
- 'set -euo pipefail

  mkdir -p "$PWD/runpod-evidence" "$PWD/runpod-tmp"

  trap ''code=$?; printf "%s\n" "$code" > runpod-evidence/exit-code.txt'' EXIT

  export TMPDIR="$PWD/runpod-tmp" PYTHONDONTWRITEBYTECODE=1

  export ASTRID_RUNTIME_CHECKOUT="$(realpath ../astrid-runtime)"

  CUSTODY_PYTHON="$PWD/runpod-tmp/venv/bin/python"


  test "$(git rev-parse HEAD)" = eb6be2e6d872fb214136d456803b024cc623c10a

  test "$(git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD)" = 3b12fface79a3be029f3b6623765a7f3e1e5e24f

  git rev-parse HEAD > runpod-evidence/agent-head.txt

  git -C "$ASTRID_RUNTIME_CHECKOUT" rev-parse HEAD > runpod-evidence/runtime-head.txt

  "$CUSTODY_PYTHON" --version > runpod-evidence/python.txt

  "$CUSTODY_PYTHON" -m pytest --version > runpod-evidence/pytest.txt

  uname -a > runpod-evidence/platform.txt

  "$CUSTODY_PYTHON" scripts/vendor_lock.py check runtime.lock.json --producer "$ASTRID_RUNTIME_CHECKOUT"
  2>&1 | tee runpod-evidence/vendor-check.txt

  sha256sum runtime.lock.json astrid_runtime_client/*.py astrid/core/timeline/schema/timeline-config.schema.json
  artifacts.json > runpod-evidence/generated-sha256.txt

  "$CUSTODY_PYTHON" -m pytest -p no:cacheprovider -o addopts= -q tests/core/execution/test_execution_custody_composition_i_ag_03b.py
  tests/test_generic_host_result_json.py tests/test_generic_host_child_output.py tests/core/test_orchestrator_runner_errors.py
  tests/core/execution/test_generic_host_handoff.py tests/core/execution/test_child_import_receipt.py
  tests/core/execution/test_remotion_host_session.py tests/sdk/test_invocation_custody_composition_i_ag_03b.py
  tests/sdk/test_workspace_client_custody_composition_i_ag_03b.py tests/sdk/test_child_bridge_d18.py
  tests/sdk/test_delegated_publication_policy_g31.py tests/core/gateway/test_doctor_bundle.py
  --junitxml=runpod-evidence/independent.xml 2>&1 | tee runpod-evidence/independent.txt

  "$CUSTODY_PYTHON" -m pytest -p no:cacheprovider -o addopts= -q tests/integrations/test_execution_custody_runtime_i_ag_03b.py
  tests/integrations/test_h3_delegated_child_claim_135.py --junitxml=runpod-evidence/runtime.xml
  2>&1 | tee runpod-evidence/runtime.txt

  "$CUSTODY_PYTHON" -m pytest -p no:cacheprovider -o addopts= -q tests/core/execution/test_fail_closed_g28.py::test_fault_reaches_terminal_state_and_receipt
  tests/core/execution/test_fail_closed_g28.py::test_hung_command_is_stopped_and_reaped_by_unchanged_absolute_deadline
  tests/test_generic_host.py::test_runtime_protocol_client_uses_a_fresh_idempotency_key_for_each_heartbeat
  tests/test_generic_host.py::test_cancellation_terminates_descendant_process_group
  tests/test_generic_host.py::test_cancellation_reaps_sigterm_resistant_descendant_after_leader_exit
  tests/test_generic_host.py::test_cancellation_reaps_descendant_spawned_by_sigterm_handler
  --junitxml=runpod-evidence/lifetime.xml 2>&1 | tee runpod-evidence/lifetime.txt

  "$CUSTODY_PYTHON" -m pytest -p no:cacheprovider -o addopts= --collect-only -q tests/test_generic_host_result_json.py
  tests/core/execution/test_child_import_receipt.py tests/core/execution/test_generic_host_child_bridge_d18.py
  tests/core/execution/test_delegated_publication_transport_g31.py tests/core/execution/test_child_bridge_target_transport_265.py
  tests/integrations/test_h3_delegated_child_claim_135.py tests/sdk/test_delegated_publication_policy_g31.py
  tests/test_generic_host.py tests/core/execution/test_generic_host_handoff.py tests/core/execution/test_remotion_host_session.py
  tests/sdk/test_child_bridge_d18.py tests/integrations/test_generic_host_remotion_render.py
  tests/core/gateway/test_doctor_bundle.py tests/core/execution/test_execution_custody_composition_i_ag_03b.py
  tests/sdk/test_invocation_custody_composition_i_ag_03b.py tests/sdk/test_workspace_client_custody_composition_i_ag_03b.py
  tests/integrations/test_execution_custody_runtime_i_ag_03b.py tests/core/execution/test_fail_closed_g28.py
  tests/test_generic_host_child_output.py tests/core/test_orchestrator_runner_errors.py
  2>&1 | tee runpod-evidence/coverage-nodes.txt

  '
artifacts:
- runpod-evidence/**
