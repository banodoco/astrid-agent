repos:
  astrid-agent: af5ae8afdb9829beb2bba4f811dbe97765bd72b2
  astrid-runtime: 47e5949465cb6f3afdfd1cb8a0e90009fd9d4020
  astrid-app: a55bec9ff384b5bbfee5535962880084ab2adb1b
  astrid-pinokio: 89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4
  VibeComfy: 2967033970cbb5884651c9565265778482d3b44e
  runpod-lifecycle: 96360a27a53c4608f780f7b370f747a2aa3c7ca8
gpu: false
cpu:
  vcpu: 8
image: default
max_minutes: 90
setup: []
run:
- "set +e\n(\numask 077\nROOT=\"$PWD/g01-r9\"\nOUT=\"/workspace/out/g01\"\nINNER=\"/workspace/jobs/G-01-Q-RUNNER-R9\"\nmkdir\
  \ -p \"$ROOT/package\" \"$OUT\" \"$INNER/out\"\nfinalize() {\n  printf 'finalized_at=%s\\n' \"$(date -u +%FT%TZ)\" >> \"\
  $OUT/stages.txt\"\n  cp -a \"$INNER/out/.\" \"$OUT/\" || printf 'copy_inner_failed=%s\\n' \"$?\" >> \"$OUT/finalization-errors.txt\"\
  \n  if [ -f \"$INNER/progress.log\" ]; then cp \"$INNER/progress.log\" \"$OUT/progress.log\" || echo progress_copy_failed\
  \ >> \"$OUT/finalization-errors.txt\"; else echo progress_not_created >> \"$OUT/finalization-errors.txt\"; fi\n  if [ -f\
  \ \"$ROOT/package/artifact-manifest.json\" ]; then cp \"$ROOT/package/artifact-manifest.json\" \"$OUT/bound-artifact-manifest.json\"\
  ; fi\n  (cd \"$OUT\" && find . -type f ! -name hashes.sha256 -print0 | sort -z | xargs -0 -r sha256sum > hashes.sha256)\
  \ || echo hashing_failed >> \"$OUT/finalization-errors.txt\"\n}\ntrap finalize EXIT\nprintf 'started_at=%s\\n' \"$(date\
  \ -u +%FT%TZ)\" > \"$OUT/stages.txt\"\nprintf '%s\\n' 'G-01-Q-RUNNER-R9' 'lane/M-QUAL/G-01-Q-RUNNER-R9-runpod' > \"$OUT/request-identity.txt\"\
  \nprintf '%s\\n' 'agent=af5ae8afdb9829beb2bba4f811dbe97765bd72b2' 'runtime=47e5949465cb6f3afdfd1cb8a0e90009fd9d4020' 'app=a55bec9ff384b5bbfee5535962880084ab2adb1b'\
  \ 'pinokio=89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4' 'vibecomfy=2967033970cbb5884651c9565265778482d3b44e' 'lifecycle=96360a27a53c4608f780f7b370f747a2aa3c7ca8'\
  \ 'manifest_sha256=ced136903a7319e78a0be7db0cc1709c0663eaf7d567c040fe1812a916693874' 'agent_requirements_runtime_lock_sha256=24d50415609ae656520e7bc0f87a73acc22ea1524c5f94c6dc19b9faa19cc3e2'\
  \ > \"$OUT/published-inputs.txt\"\nprintf '%s\\n' 'agent-focused' 'agent-generation-journey' 'agent-installed-h3-boundary'\
  \ 'runtime-focused' 'runtime-typescript-client' 'vibecomfy-touched' > \"$OUT/expected-six-suites.txt\"\npython3 - \"$OUT/suite-records.json\"\
  \ <<'SEEDPY'\nimport json,sys\nnames=['agent-focused','agent-generation-journey','agent-installed-h3-boundary','runtime-focused','runtime-typescript-client','vibecomfy-touched']\n\
  open(sys.argv[1],'w').write(json.dumps([{'suite':n,'status':'blocked','detail':'request setup or runner not started','collection_exit_code':None,'collection_count':None,'inner_exit_code':None,'counts':None}\
  \ for n in names],indent=2)+'\\n')\nSEEDPY\navail=$(df -Pk \"$PWD\" | awk 'NR==2 {print $4}')\nprintf 'workspace_available_kib=%s\\\
  n' \"$avail\" > \"$OUT/disk-before.txt\"\nif [ -z \"$avail\" ] || [ \"$avail\" -lt 2097152 ]; then echo 'stage=disk_preflight\
  \ exit=73' > \"$OUT/inner-exits.txt\"; exit 0; fi\nPAYLOAD_B64=''\n\
  python3 - \"$PAYLOAD_B64\" \"$ROOT/package\" > \"$OUT/unpack.log\" 2>&1 <<'G01PY'\nimport base64,gzip,json,sys\nfrom pathlib\
  \ import Path\npayload=json.loads(base64.b64decode(sys.argv[1]))\nroot=Path(sys.argv[2])\nfor name,data in payload.items():\n\
  \    (root/name).write_bytes(gzip.decompress(base64.b64decode(data)))\nG01PY\nunpack=$?\nprintf 'package_unpack_exit=%s\\\
  n' \"$unpack\" > \"$OUT/inner-exits.txt\"\nif [ \"$unpack\" -ne 0 ]; then exit 0; fi\nsha256sum \"$ROOT/package/run.sh\"\
  \ \"$ROOT/package/runner.py\" \"$ROOT/package/artifact-manifest.json\" > \"$OUT/bound-package.sha256\"\nprintf 'runner_started_at=%s\\\
  n' \"$(date -u +%FT%TZ)\" >> \"$OUT/stages.txt\"\nM02_POD_EXECUTION=1 bash \"$ROOT/package/run.sh\" --execute > \"$OUT/runner-console.log\"\
  \ 2>&1\nrunner_rc=$?\nprintf 'runner_exit=%s\\n' \"$runner_rc\" >> \"$OUT/inner-exits.txt\"\nprintf 'runner_ended_at=%s\\\
  n' \"$(date -u +%FT%TZ)\" >> \"$OUT/stages.txt\"\nexit 0\n)\n"
artifacts:
- /workspace/out/g01/**
