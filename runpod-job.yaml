repos:
  astrid-agent: af5ae8afdb9829beb2bba4f811dbe97765bd72b2
  astrid-runtime: 47e5949465cb6f3afdfd1cb8a0e90009fd9d4020
  astrid-app: a55bec9ff384b5bbfee5535962880084ab2adb1b
  astrid-pinokio: 89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4
  VibeComfy: 2967033970cbb5884651c9565265778482d3b44e
  runpod-lifecycle: 96360a27a53c4608f780f7b370f747a2aa3c7ca8
gpu: false
cpu:
  vcpu: 8
image: default
max_minutes: 90
setup: []
run:
- "set +e\numask 077\nROOT=\"$PWD/g01-r8-r3\"\nOUT=\"$PWD/runpod-out\"\nINNER_OUT=\"\
  /workspace/jobs/G-01-Q-RUNNER-R8-R3/out\"\nmkdir -p \"$ROOT/package\" \"$OUT\" \"\
  $INNER_OUT\"\nexec >\"$OUT/request-step.log\" 2>&1\nprintf '%s\\n' 'G-01-Q-RUNNER-R8-R3\
  \ broker payload' > \"$OUT/request-identity.txt\"\nprintf '%s\\n' 'agent=af5ae8afdb9829beb2bba4f811dbe97765bd72b2'\
  \ 'runtime=47e5949465cb6f3afdfd1cb8a0e90009fd9d4020' 'app=a55bec9ff384b5bbfee5535962880084ab2adb1b'\
  \ 'pinokio=89ed7aacae72bb48eb97ff9ff95c222bdd7e71e4' 'vibecomfy=2967033970cbb5884651c9565265778482d3b44e'\
  \ 'lifecycle=96360a27a53c4608f780f7b370f747a2aa3c7ca8' > \"$OUT/published-inputs.txt\"\
  \nprintf '%s\\n' 'agent-focused' 'agent-generation-journey' 'agent-installed-h3-boundary'\
  \ 'runtime-focused' 'runtime-typescript-client' 'vibecomfy-touched' > \"$OUT/expected-six-suites.txt\"\
  \nprintf '%s\\n' 'lane/M-QUAL/G-01-Q-RUNNER-R8-R3-runpod' > \"$OUT/request-branch.txt\"\
  \navail=$(df -Pk \"$PWD\" | awk 'NR==2 {print $4}')\nprintf 'workspace_available_kib=%s\\\
  n' \"$avail\" > \"$OUT/disk-before.txt\"\nif [ -z \"$avail\" ] || [ \"$avail\" -lt\
  \ 2097152 ]; then\n  printf '%s\\n' 'PREFLIGHT_DISK_FLOOR failed before package\
  \ setup' > \"$OUT/failure.log\"\n  printf '%s\\n' 'runner_exit=73' > \"$OUT/inner-exits.txt\"\
  \n  exit 0\nfi\nPAYLOAD_B64=''\n\
  python3 - \"$PAYLOAD_B64\" \"$ROOT/package\" <<'G01PY'\nimport base64,gzip,json,sys\n\
  from pathlib import Path\npayload=json.loads(base64.b64decode(sys.argv[1]))\nroot=Path(sys.argv[2])\n\
  for name,data in payload.items():\n    (root/name).write_bytes(gzip.decompress(base64.b64decode(data)))\n\
  G01PY\nunpack=$?\nif [ \"$unpack\" -ne 0 ]; then\n  printf 'package_unpack_exit=%s\\\
  n' \"$unpack\" > \"$OUT/inner-exits.txt\"\n  exit 0\nfi\nM02_POD_EXECUTION=1 bash\
  \ \"$ROOT/package/run.sh\" --execute > \"$OUT/runner-console.log\" 2>&1\nrunner_rc=$?\n\
  printf 'runner_exit=%s\\n' \"$runner_rc\" > \"$OUT/inner-exits.txt\"\ncp -a \"$INNER_OUT/.\"\
  \ \"$OUT/\" 2>/dev/null\ncp \"$ROOT/package/artifact-manifest.json\" \"$OUT/bound-artifact-manifest.json\"\
  \nsha256sum \"$ROOT/package/run.sh\" \"$ROOT/package/runner.py\" \"$ROOT/package/artifact-manifest.json\"\
  \ > \"$OUT/bound-package.sha256\"\nfind \"$OUT\" -maxdepth 1 -type f ! -name hashes.sha256\
  \ -print0 | sort -z | xargs -0 -r sha256sum > \"$OUT/hashes.sha256\"\nexit 0"
artifacts:
- runpod-out/**
