    cat /workspace/out/preflight-identity.exit /workspace/out/engine-mcp.exit /workspace/out/endpoint-handoff-integration.exit /workspace/out/runpod-cp3.exit /workspace/out/target-selection.exit /workspace/out/graph-roots.exit /workspace/out/correction.exit /workspace/out/installed-schema.exit /workspace/out/vendor-lock-runtime-identity.exit > /workspace/out/inner-exit-codes.txt
    if awk -F= '$2 != 0 {bad=1} END {exit bad}' /workspace/out/inner-exit-codes.txt; then
      printf 'VERDICT=ACCEPTED\n' > /workspace/out/SUMMARY.txt
      printf '0\n' > /workspace/out/payload-exit.txt
