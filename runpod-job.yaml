    "set +e\ncd /workspace/astrid-agent\n. /workspace/out/venv/bin/activate\nexport HOME=/workspace/out/home TMPDIR=/workspace/out/tmp ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_APP_CHECKOUT=/workspace/astrid-app ASTRID_T3_EVIDENCE_DIR=/workspace/out/agent/t3-evidence\nmkdir -p \"$ASTRID_T3_EVIDENCE_DIR\"\npytest -o addopts= --basetemp=/workspace/out/agent/pytest-tmp -vv tests/integrations/test_pinned_element_render_proof.py > /workspace/out/agent/t3-render-preview-export.log 2>&1\nrc=$?\nprintf '{\"test\":\"agent_t3_render_preview_export\",\"exit\":%s}\\n' \"$rc\" > /workspace/out/agent/t3-inner-exit.json\npython - <<'PY2'\nimport hashlib,json,pathlib\nout=pathlib.Path('/workspace/out')\nfiles=[out/'tuple.json',out/'app-npm-ci.log',out/'app-npm-ci-exit.json']+sorted(p for p in (out/'agent').rglob('*') if p.is_file() and not p.is_symlink())\nrows=[{'path':str(p.relative_to(out)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in files if p.is_file()]\n(out/'artifact-inventory.json').write_text(json.dumps(rows,indent=2)+'\\n')\nfiles.append(out/'artifact-inventory.json')\n(out/'SHA256SUMS').write_text(''.join(f\"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out)}\\n\" for p in files if p.is_file()))\nPY2\nexit \"$rc\""
