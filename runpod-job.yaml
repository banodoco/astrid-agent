    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/vendor-lock-runtime-identity.xml tests/test_vendor_lock.py tests/sdk/test_installed_runtime_source_identity.py tests/v10/test_runtime_lock_wheels.py 2>&1 | tee /workspace/out/vendor-lock-runtime-identity.log
