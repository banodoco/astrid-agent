# CP3 R8 affected-group reproof: bind CP2's authoritative RunPod-Python checkout
# and suppress setup bytecode compilation for the packaging fixture.
repos:
  astrid-agent: 352b8db6a48559b1142296ae9c7ad9388fb5db12
  astrid-runtime: 1e6d899efa77a2d6ec247c38250f9748330bb587
producer_authorities:
  vibecomfy: 2967033970cbb5884651c9565265778482d3b44e
  lifecycle: 96360a27a53c4608f780f7b370f747a2aa3c7ca8
  runpod_python: 0786b3d51855a66176fea1e7443b92e7ef2d01b5
cpu:
  vcpu: 8
gpu: false
fresh: true
max_minutes: 120
needs:
  python: '3.12'
setup:
  - |
    set -euo pipefail
    mkdir -p /workspace/out /workspace/tmp /workspace/cache/pip /workspace/producers
    export TMPDIR=/workspace/tmp PIP_CACHE_DIR=/workspace/cache/pip PYTHONDONTWRITEBYTECODE=1
    git clone --filter=blob:none --no-checkout https://github.com/banodoco/VibeComfy.git /workspace/producers/VibeComfy
    git -C /workspace/producers/VibeComfy fetch --no-tags origin 2967033970cbb5884651c9565265778482d3b44e
    git -C /workspace/producers/VibeComfy checkout --detach 2967033970cbb5884651c9565265778482d3b44e
    git clone --filter=blob:none --no-checkout https://github.com/banodoco/runpod-lifecycle.git /workspace/producers/runpod-lifecycle
    git -C /workspace/producers/runpod-lifecycle fetch --no-tags origin 96360a27a53c4608f780f7b370f747a2aa3c7ca8
    git -C /workspace/producers/runpod-lifecycle checkout --detach 96360a27a53c4608f780f7b370f747a2aa3c7ca8
    git clone --filter=blob:none --no-checkout https://github.com/runpod/runpod-python.git /workspace/producers/runpod-python
    git -C /workspace/producers/runpod-python fetch --no-tags origin 0786b3d51855a66176fea1e7443b92e7ef2d01b5
    git -C /workspace/producers/runpod-python checkout --detach 0786b3d51855a66176fea1e7443b92e7ef2d01b5
    python3 -m venv /workspace/venv
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-compile --require-hashes -r /workspace/astrid-agent/requirements/proof.lock -r /workspace/astrid-agent/requirements/build.lock
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-compile 'hatchling==1.27.0'
    /workspace/venv/bin/python -c 'from importlib.metadata import version; print("hatchling==" + version("hatchling"))' | tee /workspace/out/hatchling-version.txt
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-compile --no-deps --no-build-isolation /workspace/astrid-agent /workspace/astrid-runtime /workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-compile 'aiohttp==3.14.5'
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-compile --no-deps -e /workspace/producers/VibeComfy -e /workspace/producers/runpod-lifecycle
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-compile --no-deps 'banodoco-timeline-schema @ git+https://github.com/banodoco/astrid-agent.git@242f9c4306bf3b501222cb041a9eb246ef47bc85#subdirectory=packages/timeline-schema/python'
run:
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle ASTRID_RUNPOD_CHECKOUT=/workspace/producers/runpod-python PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    (
      set -euo pipefail
      echo "agent_head=$(git rev-parse HEAD)"
      echo "agent_parents=$(git show -s --format='%P' HEAD)"
      lock_sha=$(/workspace/venv/bin/python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')
      echo "runtime_lock_source_commit=$lock_sha"
      echo "runtime_checked_out_head=$(git -C /workspace/astrid-runtime rev-parse HEAD)"
      echo "vibecomfy_checked_out_head=$(git -C /workspace/producers/VibeComfy rev-parse HEAD)"
      echo "runpod_lifecycle_checked_out_head=$(git -C /workspace/producers/runpod-lifecycle rev-parse HEAD)"
      echo "runpod_python_checked_out_head=$(git -C /workspace/producers/runpod-python rev-parse HEAD)"
      test "$(git rev-parse HEAD)" = 352b8db6a48559b1142296ae9c7ad9388fb5db12
      test "$lock_sha" = 1e6d899efa77a2d6ec247c38250f9748330bb587
      test "$(git -C /workspace/astrid-runtime rev-parse HEAD)" = 1e6d899efa77a2d6ec247c38250f9748330bb587
      test "$(git -C /workspace/producers/VibeComfy rev-parse HEAD)" = 2967033970cbb5884651c9565265778482d3b44e
      test "$(git -C /workspace/producers/runpod-lifecycle rev-parse HEAD)" = 96360a27a53c4608f780f7b370f747a2aa3c7ca8
      test "$(git -C /workspace/producers/runpod-python rev-parse HEAD)" = 0786b3d51855a66176fea1e7443b92e7ef2d01b5
      git diff --check
      git -C /workspace/astrid-runtime diff --check
      /workspace/venv/bin/python scripts/vendor_lock.py check runtime.lock.json --producer /workspace/astrid-runtime
      /workspace/venv/bin/python -c 'import hashlib,json; from pathlib import Path; lock=json.loads(Path("runtime.lock.json").read_text()); paths=["runtime.lock.json","artifacts.json",*sorted(lock["files"])]; [print(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}") for path in paths]'
      find /workspace/venv -type f \( -name '*.pyc' -o -name '*.pyo' \) -print | sort > /workspace/out/venv-bytecode-files.txt
      sha256sum /workspace/out/venv-bytecode-files.txt | tee /workspace/out/venv-bytecode-files.sha256
      printf 'venv_bytecode_file_count=%s\n' "$(wc -l < /workspace/out/venv-bytecode-files.txt)"
    ) 2>&1 | tee /workspace/out/preflight-identity.txt
    rc=${PIPESTATUS[0]}
    printf 'preflight_identity=%s\n' "$rc" > /workspace/out/preflight-identity.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle ASTRID_RUNPOD_CHECKOUT=/workspace/producers/runpod-python PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/engine-mcp.xml \
      tests/core/generation/test_engine_readiness.py \
      tests/core/generation/test_engine_release.py \
      tests/core/generation/test_engine_endpoint_records.py \
      tests/core/generation/test_engine_endpoint_transport.py \
      tests/core/generation/test_engine_local_endpoint.py \
      tests/core/generation/test_engine_cli.py \
      tests/core/generation/test_engine_recipe.py \
      tests/core/generation/test_engine_runner.py \
      tests/core/execution/test_generic_host_handoff.py \
      tests/sdk/test_generation_target.py \
      tests/test_mcp_server.py \
      tests/test_mcp_generation_parity.py 2>&1 | tee /workspace/out/engine-mcp.log
    rc=${PIPESTATUS[0]}
    printf 'engine_mcp=%s\n' "$rc" > /workspace/out/engine-mcp.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle ASTRID_RUNPOD_CHECKOUT=/workspace/producers/runpod-python PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/runpod-cp3.xml \
      tests/test_runpod_managed_worker_session.py \
      tests/sdk/test_runpod_front_door.py \
      tests/packs/runpod/test_h3_release.py \
      tests/packs/runpod/test_https_transport.py \
      tests/packs/runpod/test_worker_release.py \
      tests/packs/runpod/test_worker_preparation.py \
      tests/packs/runpod/test_exact_release.py \
      tests/packs/runpod/test_generation_preparation.py \
      tests/packs/runpod/test_installed_preparation.py \
      tests/packs/runpod/test_original_supervisor_release.py \
      tests/packs/runpod/test_prepared_binding_contract.py \
      tests/packs/runpod/test_prepared_task.py \
      tests/packs/runpod/test_release_contract_cp3.py \
      tests/packs/runpod/test_remote_placement.py \
      tests/packs/runpod/test_warm_session.py \
      tests/packs/runpod/test_target_selection.py 2>&1 | tee /workspace/out/runpod-cp3.log
    rc=${PIPESTATUS[0]}
    printf 'runpod_cp3=%s\n' "$rc" > /workspace/out/runpod-cp3.exit
    exit 0
  - |
    set +e
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle ASTRID_RUNPOD_CHECKOUT=/workspace/producers/runpod-python PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    cat /workspace/out/preflight-identity.exit /workspace/out/engine-mcp.exit /workspace/out/runpod-cp3.exit > /workspace/out/inner-exit-codes.txt
    if awk -F= '$2 != 0 {bad=1} END {exit bad}' /workspace/out/inner-exit-codes.txt; then
      printf 'VERDICT=ACCEPTED\n' > /workspace/out/SUMMARY.txt
      printf '0\n' > /workspace/out/payload-exit.txt
    else
      printf 'VERDICT=FAILED\n' > /workspace/out/SUMMARY.txt
      printf '1\n' > /workspace/out/payload-exit.txt
    fi
    find /workspace/out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /workspace/out/SHA256SUMS
    exit 0
artifacts:
  - /workspace/out
