  "run": [
    "set +e\ncd /workspace/astrid-agent || exit 2\nexport PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python\nexport ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime PYTHONDONTWRITEBYTECODE=1\nmkdir -p /workspace/out/tests\nprintf '%s\\n' fc70ccb0dd7c3076dde75ddeefdfa0f50d739019 > /workspace/out/tests/agent-head.txt\nprintf '%s\\n' 1e6d899efa77a2d6ec247c38250f9748330bb587 > /workspace/out/tests/runtime-head.txt\npython -m pytest --collect-only -q tests/test_update_job_platform.py tests/test_installer_* tests/test_installer_pre_stop_recovery.py tests/test_installer_cli_recovery.py tests/test_installer_update_continuation.py tests/test_installer_update_reconcile.py tests/test_installer_update_job.py > /workspace/out/tests/collection.log 2>&1\nprintf 'collection=%s\\n' \"$?\" > /workspace/out/tests/inner-exit-codes.txt\npython -m pytest -q --timeout=60 tests/test_update_job_platform.py tests/test_installer_* tests/test_installer_pre_stop_recovery.py tests/test_installer_cli_recovery.py tests/test_installer_update_continuation.py tests/test_installer_update_reconcile.py tests/test_installer_update_job.py > /workspace/out/tests/focused.log 2>&1\nprintf 'focused=%s\\n' \"$?\" >> /workspace/out/tests/inner-exit-codes.txt\ncat /workspace/out/tests/inner-exit-codes.txt\nmkdir -p /workspace/out/artifacts\ncp -R /workspace/out/tests/. /workspace/out/artifacts/\nexit 0"
