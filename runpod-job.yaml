# CP3 R7 exact-head proof: repair MCP argv ordering and supply authoritative producer checkouts.
repos:
  astrid-agent: 352b8db6a48559b1142296ae9c7ad9388fb5db12
  astrid-runtime: 1e6d899efa77a2d6ec247c38250f9748330bb587
producer_authorities:
  vibecomfy: 2967033970cbb5884651c9565265778482d3b44e
  lifecycle: 96360a27a53c4608f780f7b370f747a2aa3c7ca8
cpu:
  vcpu: 8
gpu: false
fresh: true
max_minutes: 120
needs:
  python: '3.12'
setup:
  - |
    set -euo pipefail
    mkdir -p /workspace/out /workspace/tmp /workspace/cache/pip /workspace/producers
    export TMPDIR=/workspace/tmp PIP_CACHE_DIR=/workspace/cache/pip
    git clone https://github.com/banodoco/VibeComfy.git /workspace/producers/VibeComfy
    git -C /workspace/producers/VibeComfy checkout --detach 2967033970cbb5884651c9565265778482d3b44e
    git clone https://github.com/banodoco/runpod-lifecycle.git /workspace/producers/runpod-lifecycle
    git -C /workspace/producers/runpod-lifecycle checkout --detach 96360a27a53c4608f780f7b370f747a2aa3c7ca8
    python3 -m venv /workspace/venv
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r /workspace/astrid-agent/requirements/proof.lock -r /workspace/astrid-agent/requirements/build.lock
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation /workspace/astrid-agent /workspace/astrid-runtime /workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pip install --disable-pip-version-check 'aiohttp==3.14.5'
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e /workspace/producers/VibeComfy -e /workspace/producers/runpod-lifecycle
    /workspace/venv/bin/python -m pip install --disable-pip-version-check --no-deps 'banodoco-timeline-schema @ git+https://github.com/banodoco/astrid-agent.git@242f9c4306bf3b501222cb041a9eb246ef47bc85#subdirectory=packages/timeline-schema/python'
run:
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    (
      set -euo pipefail
      echo "agent_head=$(git rev-parse HEAD)"
      echo "agent_parents=$(git show -s --format='%P' HEAD)"
      lock_sha=$(/workspace/venv/bin/python -c 'import json; print(json.load(open("runtime.lock.json"))["source_commit"])')
      echo "runtime_lock_source_commit=$lock_sha"
      echo "runtime_checked_out_head=$(git -C /workspace/astrid-runtime rev-parse HEAD)"
      echo "vibecomfy_checked_out_head=$(git -C /workspace/producers/VibeComfy rev-parse HEAD)"
      echo "runpod_lifecycle_checked_out_head=$(git -C /workspace/producers/runpod-lifecycle rev-parse HEAD)"
      test "$(git rev-parse HEAD)" = 352b8db6a48559b1142296ae9c7ad9388fb5db12
      test "$lock_sha" = 1e6d899efa77a2d6ec247c38250f9748330bb587
      test "$(git -C /workspace/astrid-runtime rev-parse HEAD)" = 1e6d899efa77a2d6ec247c38250f9748330bb587
      test "$(git -C /workspace/producers/VibeComfy rev-parse HEAD)" = 2967033970cbb5884651c9565265778482d3b44e
      test "$(git -C /workspace/producers/runpod-lifecycle rev-parse HEAD)" = 96360a27a53c4608f780f7b370f747a2aa3c7ca8
      git diff --check
      git -C /workspace/astrid-runtime diff --check
      /workspace/venv/bin/python scripts/vendor_lock.py check runtime.lock.json --producer /workspace/astrid-runtime
      /workspace/venv/bin/python -c 'import hashlib,json; from pathlib import Path; lock=json.loads(Path("runtime.lock.json").read_text()); paths=["runtime.lock.json","artifacts.json",*sorted(lock["files"])]; [print(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}") for path in paths]'
    ) 2>&1 | tee /workspace/out/preflight-identity.txt
    rc=${PIPESTATUS[0]}
    printf 'preflight_identity=%s\n' "$rc" > /workspace/out/preflight-identity.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/engine-mcp.xml \
      tests/core/generation/test_engine_readiness.py \
      tests/core/generation/test_engine_release.py \
      tests/core/generation/test_engine_endpoint_records.py \
      tests/core/generation/test_engine_endpoint_transport.py \
      tests/core/generation/test_engine_local_endpoint.py \
      tests/core/generation/test_engine_cli.py \
      tests/core/generation/test_engine_recipe.py \
      tests/core/generation/test_engine_runner.py \
      tests/core/execution/test_generic_host_handoff.py \
      tests/sdk/test_generation_target.py \
      tests/test_mcp_server.py \
      tests/test_mcp_generation_parity.py 2>&1 | tee /workspace/out/engine-mcp.log
    rc=${PIPESTATUS[0]}
    printf 'engine_mcp=%s\n' "$rc" > /workspace/out/engine-mcp.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= -m integration --junitxml=/workspace/out/endpoint-handoff-integration.xml tests/core/execution/test_workflow_endpoint_handoff.py 2>&1 | tee /workspace/out/endpoint-handoff-integration.log
    rc=${PIPESTATUS[0]}
    printf 'endpoint_handoff_integration=%s\n' "$rc" > /workspace/out/endpoint-handoff-integration.exit
    exit 0
  - |
    set +e
    set -o pipefail
    cd /workspace/astrid-agent
    export TMPDIR=/workspace/tmp PYTHONDONTWRITEBYTECODE=1 ASTRID_RUNTIME_CHECKOUT=/workspace/astrid-runtime ASTRID_VIBECOMFY_CHECKOUT=/workspace/producers/VibeComfy ASTRID_RUNPOD_LIFECYCLE_CHECKOUT=/workspace/producers/runpod-lifecycle PYTHONPATH=/workspace/astrid-agent:/workspace/astrid-runtime:/workspace/astrid-runtime/packages/python
    /workspace/venv/bin/python -m pytest -q -o addopts= --junitxml=/workspace/out/runpod-cp3.xml \
